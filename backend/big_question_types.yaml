数列大题:
  求通项公式:
    - 数学归纳法求通项公式
    - 等差数列求通项公式
    - 等比数列求通项公式
    - 用 $a_n$ 与 $S_n$ 关系求通项公式
    - 已知 $a_{n+1} = a_n + f(n)$，用累加法求通项公式
    - 已知 $a_{n+1} = a_n \cdot f(n)$，用累乘法求通项公式
    - 已知 $a_{n+1} = p a_n + q$，用 $a_{n+1} + \lambda = p(a_n + \lambda)$ 求通项公式
    - 已知 $a_{n+1} = p a_n + f(n)$，用 $a_n + An + B = p\left[a_{n-1} + A(n-1) + B\right]$ 求通项公式
    - 已知 $a_{n+1} = p a_n + q^n$，用 $\dfrac{a_{n+1}}{q^{n+1}} = \dfrac{p}{q} \cdot \dfrac{a_n}{q^n} + \dfrac{1}{q}$ 求通项公式
    - 已知 $a_{n+2} = p a_{n+1} + q a_n$，用 $a_{n+2} - k a_{n+1} = h\left(a_{n+1} - k a_n\right)$ 求通项公式
    - 已知 $a_{n-1} - a_n = p a_{n-1} a_n$，用 $\dfrac{1}{a_n} - \dfrac{1}{a_{n-1}} = p$ 求通项公式
    - 已知 $a_{n+1} = \dfrac{m a_n}{p a_n + q}$，用 $\dfrac{1}{a_{n+1}} = \dfrac{m}{q} \cdot \dfrac{1}{a_n} + \dfrac{m}{p}$ 求通项公式
    - 已知 $a_{n+1} = p a_n^q \ (p>0,a_n>0)$，用 $\lg a_{n+1} = q \lg a_n + \lg p$ 求通项公式
    - 构造常数列求通项公式
    - 周期数列求通项公式
    - 已知 $a_{n+1}=\dfrac{xa_n+y}{ma_n+b}$，用不动点构造等比/等差数列求通项公式
    - 已知隔项递推 $a_{n+2}=pa_n+f(n)$，分奇偶子数列分别求通项公式
    - 已知二阶线性递推 $a_{n+2}=pa_{n+1}+qa_n$，用特征方程法求通项公式
    - 仅给出数列前若干项，用阶差（差分）法求多项式型通项公式
    - 递推含 $(-1)^n$ 正负交替项，分奇偶分段构造等差等比求通项公式
    - 已知 $a_{n+1}+a_n=p\cdot a_n a_{n+1}$，变形 $\dfrac{1}{a_n}+\dfrac{1}{a_{n+1}}=p$ 构造隔项等差求通项公式
