<svg width="1140" height="300" viewBox="0 0 1140 300" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1140" height="92" rx="8" fill="#0E2340" /><text x="570.0" y="40.0" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="600">原则一 · 显示覆盖范围</text><text x="570.0" y="66.0" font-size="15" fill="#C8DCF2" text-anchor="middle" font-weight="400">质量报告须显示数据覆盖范围、评价版本与未知部分</text><path d="M562 93 l8 8 l-8 8" fill="none" stroke="#00A9B5" stroke-width="2" /><rect x="0" y="104" width="1140" height="92" rx="8" fill="#1E7BE0" /><text x="570.0" y="144.0" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="600">原则二 · 不因数据少判低</text><text x="570.0" y="170.0" font-size="15" fill="#C8DCF2" text-anchor="middle" font-weight="400">接入不完整的班级不能只因数据少被判为质量低</text><path d="M562 197 l8 8 l-8 8" fill="none" stroke="#00A9B5" stroke-width="2" /><rect x="0" y="208" width="1140" height="92" rx="8" fill="#9FD0F5" /><text x="570.0" y="248.0" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="600">原则三 · 跨口径不可比</text><text x="570.0" y="274.0" font-size="15" fill="#C8DCF2" text-anchor="middle" font-weight="400">不同试卷、评分规则、帮助条件的结果未经校准不能直接比较</text></svg>