<svg width="1140" height="240" viewBox="0 0 1140 240" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="20" width="520" height="190" rx="8" fill="#F5F7FA" /><text x="260" y="52" font-size="20" fill="#0E2340" text-anchor="middle" font-weight="700">正向：生成试卷</text><text x="260" y="92" font-size="16" fill="#333A45" text-anchor="middle" font-weight="400">选模板、知识范围与命题要求</text><text x="260" y="124" font-size="16" fill="#333A45" text-anchor="middle" font-weight="400">调用选题、生成、逐题解答和整卷检查</text><text x="260" y="156" font-size="16" fill="#333A45" text-anchor="middle" font-weight="400">形成可复核的试卷，教师核对题目与评分标准</text><text x="260" y="190" font-size="15" fill="#1E7BE0" text-anchor="middle" font-weight="600">产出：学生用卷 + 参考答案与解析 + 模板符合情况</text><rect x="620" y="20" width="520" height="190" rx="8" fill="#EAF3FD" /><text x="880" y="52" font-size="20" fill="#0E2340" text-anchor="middle" font-weight="700">反向：评价已有试卷</text><text x="880" y="92" font-size="16" fill="#333A45" text-anchor="middle" font-weight="400">导入已有试卷</text><text x="880" y="124" font-size="16" fill="#333A45" text-anchor="middle" font-weight="400">评价知识点与套路覆盖、步骤难度及整卷分布</text><text x="880" y="156" font-size="16" fill="#333A45" text-anchor="middle" font-weight="400">不在教师端另设与试卷文档冲突的口径</text><text x="880" y="190" font-size="15" fill="#1E7BE0" text-anchor="middle" font-weight="600">阶段报告：未稳定的知识点与套路 / 覆盖范围 / 阶段变化 / 后续验证目标</text><path d="M520 115 L610 115" stroke="#00A9B5" stroke-width="2" stroke-dasharray="5 5" /><path d="M610 115 l-10 -6 l0 12 z" fill="#00A9B5" /></svg>