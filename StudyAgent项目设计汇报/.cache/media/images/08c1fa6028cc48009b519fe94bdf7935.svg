<svg width="1140" height="230" viewBox="0 0 1140 230" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="555" height="230" rx="8" fill="#F5F7FA" /><rect x="585" y="0" width="555" height="230" rx="8" fill="#EAF3FD" /><text x="277.5" y="34" font-size="20" fill="#0E2340" text-anchor="middle" font-weight="700">应优先观察</text><text x="862.5" y="34" font-size="20" fill="#1E7BE0" text-anchor="middle" font-weight="700">不能独立作为证据</text><circle cx="28" cy="68" r="4" fill="#0E2340" /><text x="44" y="74" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">无 AI 的新题与阶段测试</text><circle cx="28" cy="102" r="4" fill="#0E2340" /><text x="44" y="108" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">延迟保持</text><circle cx="28" cy="136" r="4" fill="#0E2340" /><text x="44" y="142" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">知识理解与迁移</text><circle cx="28" cy="170" r="4" fill="#0E2340" /><text x="44" y="176" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">学生负担、教师净工作量、不同起点学生的变化</text><circle cx="613" cy="68" r="4" fill="#1E7BE0" /><text x="629" y="74" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">工具使用次数</text><circle cx="613" cy="102" r="4" fill="#1E7BE0" /><text x="629" y="108" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">AI 帮助下的完成率</text><circle cx="613" cy="136" r="4" fill="#1E7BE0" /><text x="629" y="142" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">单次平均分上涨</text><circle cx="613" cy="170" r="4" fill="#1E7BE0" /><text x="629" y="176" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">把某一项工具的研究效果推广到整个系统</text></svg>