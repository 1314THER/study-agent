<svg width="1140" height="330" viewBox="0 0 1140 330" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1140" height="73" rx="8" fill="#0E2340" /><text x="570.0" y="30.5" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="600">公共知识库</text><text x="570.0" y="56.5" font-size="15" fill="#C8DCF2" text-anchor="middle" font-weight="400">核实的课程内容、常见错误、评分依据、教学案例、适用条件</text><path d="M562 74 l8 8 l-8 8" fill="none" stroke="#00A9B5" stroke-width="2" /><rect x="0" y="85" width="1140" height="73" rx="8" fill="#1B4E8C" /><text x="570.0" y="115.5" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="600">个人长期记忆</text><text x="570.0" y="141.5" font-size="15" fill="#C8DCF2" text-anchor="middle" font-weight="400">学生自己的目标、证据、经确认信息，按个人权限，不混入他人上下文</text><path d="M562 159 l8 8 l-8 8" fill="none" stroke="#00A9B5" stroke-width="2" /><rect x="0" y="170" width="1140" height="73" rx="8" fill="#1E7BE0" /><text x="570.0" y="200.5" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="600">应用缓存</text><text x="570.0" y="226.5" font-size="15" fill="#C8DCF2" text-anchor="middle" font-weight="400">复用相同内容、版本、适用范围下的已验证结果，原资料变化后更新或失效</text><path d="M562 244 l8 8 l-8 8" fill="none" stroke="#00A9B5" stroke-width="2" /><rect x="0" y="255" width="1140" height="73" rx="8" fill="#9FD0F5" /><text x="570.0" y="285.5" font-size="22" fill="#0E2340" text-anchor="middle" font-weight="600">模型上下文或服务缓存</text><text x="570.0" y="311.5" font-size="15" fill="#333A45" text-anchor="middle" font-weight="400">降低重复传入开销或延迟</text></svg>