<svg width="1140" height="250" viewBox="0 0 1140 250" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1140" height="75" rx="8" fill="#0E2340" /><text x="570.0" y="31.5" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="600">共同必做部分</text><text x="570.0" y="57.5" font-size="15" fill="#C8DCF2" text-anchor="middle" font-weight="400">全班一致的基础任务</text><path d="M562 76 l8 8 l-8 8" fill="none" stroke="#00A9B5" stroke-width="2" /><rect x="0" y="87" width="1140" height="75" rx="8" fill="#1E7BE0" /><text x="570.0" y="118.5" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="600">针对性练习</text><text x="570.0" y="144.5" font-size="15" fill="#C8DCF2" text-anchor="middle" font-weight="400">按前置知识与步骤熟练度差异安排</text><path d="M562 163 l8 8 l-8 8" fill="none" stroke="#00A9B5" stroke-width="2" /><rect x="0" y="174" width="1140" height="75" rx="8" fill="#9FD0F5" /><text x="570.0" y="205.5" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="600">复习内容</text><text x="570.0" y="231.5" font-size="15" fill="#C8DCF2" text-anchor="middle" font-weight="400">针对前面不稳定的知识点，并安排新题验证</text></svg>