<svg width="700" height="330" viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="700" height="73" rx="8" fill="#0E2340" /><text x="350.0" y="30.5" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="600">第一档 · 有套路提示能完成</text><text x="350.0" y="56.5" font-size="15" fill="#C8DCF2" text-anchor="middle" font-weight="400">给出套路名称或提示后可以完成</text><path d="M342 74 l8 8 l-8 8" fill="none" stroke="#00A9B5" stroke-width="2" /><rect x="0" y="85" width="700" height="73" rx="8" fill="#1B4E8C" /><text x="350.0" y="115.5" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="600">第二档 · 无套路提示能选对方法</text><text x="350.0" y="141.5" font-size="15" fill="#C8DCF2" text-anchor="middle" font-weight="400">题面不显示套路名与分类标签，学生自行判断</text><path d="M342 159 l8 8 l-8 8" fill="none" stroke="#00A9B5" stroke-width="2" /><rect x="0" y="170" width="700" height="73" rx="8" fill="#1E7BE0" /><text x="350.0" y="200.5" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="600">第三档 · 选对方法后能独立执行</text><text x="350.0" y="226.5" font-size="15" fill="#C8DCF2" text-anchor="middle" font-weight="400">在没有提示的条件下完整完成</text><path d="M342 244 l8 8 l-8 8" fill="none" stroke="#00A9B5" stroke-width="2" /><rect x="0" y="255" width="700" height="73" rx="8" fill="#9FD0F5" /><text x="350.0" y="285.5" font-size="22" fill="#0E2340" text-anchor="middle" font-weight="600">作答后复盘再展示对应关系</text><text x="350.0" y="311.5" font-size="15" fill="#333A45" text-anchor="middle" font-weight="400">教师与批改系统保留参考结构</text></svg>