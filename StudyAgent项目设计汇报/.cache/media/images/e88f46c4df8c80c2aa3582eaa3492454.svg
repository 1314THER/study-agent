<svg width="700" height="330" viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="345" height="36" fill="#0E2340" /><text x="172.5" y="24" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600">任务类型</text><rect x="345" y="0" width="345" height="36" fill="#0E2340" /><text x="517.5" y="24" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600">考查什么</text><rect x="0" y="36" width="345" height="58" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1" /><text x="172.5" y="70.0" font-size="17" fill="#0E2340" text-anchor="middle" font-weight="600">解释概念含义</text><rect x="345" y="36" width="345" height="58" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1" /><text x="517.5" y="70.0" font-size="17" fill="#333A45" text-anchor="middle" font-weight="400">用自己的话说出定义与意义</text><rect x="0" y="94" width="345" height="58" fill="#F5F7FA" stroke="#E3E8EF" stroke-width="1" /><text x="172.5" y="128.0" font-size="17" fill="#0E2340" text-anchor="middle" font-weight="600">判断公式 / 定理适用条件</text><rect x="345" y="94" width="345" height="58" fill="#F5F7FA" stroke="#E3E8EF" stroke-width="1" /><text x="517.5" y="128.0" font-size="17" fill="#333A45" text-anchor="middle" font-weight="400">识别何时可以用、何时不能用</text><rect x="0" y="152" width="345" height="58" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1" /><text x="172.5" y="186.0" font-size="17" fill="#0E2340" text-anchor="middle" font-weight="600">区分相近概念</text><rect x="345" y="152" width="345" height="58" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1" /><text x="517.5" y="186.0" font-size="17" fill="#333A45" text-anchor="middle" font-weight="400">辨析易混淆的边界</text><rect x="0" y="210" width="345" height="58" fill="#F5F7FA" stroke="#E3E8EF" stroke-width="1" /><text x="172.5" y="244.0" font-size="17" fill="#0E2340" text-anchor="middle" font-weight="600">寻找反例</text><rect x="345" y="210" width="345" height="58" fill="#F5F7FA" stroke="#E3E8EF" stroke-width="1" /><text x="517.5" y="244.0" font-size="17" fill="#3