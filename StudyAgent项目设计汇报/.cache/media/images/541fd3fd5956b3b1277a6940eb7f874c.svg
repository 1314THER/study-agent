idth="2" /><path d="M690 105 l-7 -5 l0 10 z" fill="#1E7BE0" /><rect x="693" y="30" width="213" height="150" rx="8" fill="#FFFFFF" stroke="#1E7BE0" stroke-width="1.5" /><rect x="693" y="30" width="213" height="6" rx="3" fill="#0E2340" /><circle cx="719" cy="66" r="16" fill="#1E7BE0" /><text x="719" y="72" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text><text x="799.5" y="116" font-size="18" fill="#0E2340" text-anchor="middle" font-weight="600">跟随教师 / 学校端扩大能力目录</text><text x="799.5" y="146" font-size="14" fill="#7A8699" text-anchor="middle" font-weight="400">不提前暴露空实现</text><path d="M907 105 l14 0" stroke="#1E7BE0" stroke-width="2" /><path d="M921 105 l-7 -5 l0 10 z" fill="#1E7BE0" /><rect x="924" y="30" width="213" height="150" rx="8" fill="#FFFFFF" stroke="#1E7BE0" stroke-width="1.5" /><rect x="924" y="30" width="213" height="6" rx="3" fill="#0E2340" /><circle cx="950" cy="66" r="16" fill="#1E7BE0" /><text x="950" y="72" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text><text x="1030.5" y="116" font-size="18" fill="#0E2340" text-anchor="middle" font-weight="600">研究可选交互界面和分发渠道</text><text x="1030.5" y="146" font-size="14" fill="#7A8699" text-anchor="middle" font-weight="400">最后一步</text><path d="M40 200 L1100 200" stroke="#00A9B5" stroke-width="2" stroke-dasharray="5 5" /><path d="M40 200 l10 -6 l0 12 z" fill="#00A9B5" /><text x="570.0" y="226" font-size="15" fill="#00A9B5" text-anchor="middle" font-weight="600">阶段之间可回退：变式暴露某步不会 → 返回该步训练</text></svg>