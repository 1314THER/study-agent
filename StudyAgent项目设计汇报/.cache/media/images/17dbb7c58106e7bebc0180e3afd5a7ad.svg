<svg width="1140" height="250" viewBox="0 0 1140 250" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="555" height="250" rx="8" fill="#F5F7FA" /><rect x="585" y="0" width="555" height="250" rx="8" fill="#EAF3FD" /><text x="277.5" y="34" font-size="20" fill="#0E2340" text-anchor="middle" font-weight="700">整体判断（旧）</text><text x="862.5" y="34" font-size="20" fill="#1E7BE0" text-anchor="middle" font-weight="700">逐步对照（新）</text><circle cx="28" cy="68" r="4" fill="#0E2340" /><text x="44" y="74" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">只知道最终答案错误</text><circle cx="28" cy="102" r="4" fill="#0E2340" /><text x="44" y="108" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">据此推断学生不理解列式所用知识</text><circle cx="28" cy="136" r="4" fill="#0E2340" /><text x="44" y="142" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">反馈笼统：这道题没掌握</text><circle cx="28" cy="170" r="4" fill="#0E2340" /><text x="44" y="176" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">无法定位到具体哪一步</text><circle cx="613" cy="68" r="4" fill="#1E7BE0" /><text x="629" y="74" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">逐段作答对应到参考步骤</text><circle cx="613" cy="102" r="4" fill="#1E7BE0" /><text x="629" y="108" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">识别：列式正确，化简出错</text><circle cx="613" cy="136" r="4" fill="#1E7BE0" /><text x="629" y="142" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">定位到化简步骤而非列式步骤</text><circle cx="613" cy="170" r="4" fill="#1E7BE0" /><text x="629" y="176" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">反馈具体：这一步的运算有问题</text></svg>