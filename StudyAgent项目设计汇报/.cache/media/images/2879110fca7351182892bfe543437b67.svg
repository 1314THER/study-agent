<svg width="1140" height="120" viewBox="0 0 1140 120" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="1140" height="96" rx="8" fill="#F5F7FA" /><text x="570" y="40" font-size="19" fill="#0E2340" text-anchor="middle" font-weight="700">箭头统一表示：左侧是右侧学习或掌握的前置</text><text x="570" y="74" font-size="16" fill="#333A45" text-anchor="middle" font-weight="400">这是一条概念上的前置链，不表示各层一一对应，也不表示学生必须重新学习已掌握的内容</text></svg>