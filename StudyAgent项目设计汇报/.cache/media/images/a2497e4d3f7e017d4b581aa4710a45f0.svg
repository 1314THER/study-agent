<svg width="700" height="330" viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg"><line x1="40" y1="70" x2="660" y2="70" stroke="#E3E8EF" stroke-width="3" /><text x="40" y="46" font-size="16" fill="#0E2340" text-anchor="start" font-weight="600">步骤 1：列式</text><rect x="60" y="60" width="90" height="20" rx="4" fill="#1E7BE0" /><rect x="300" y="60" width="70" height="20" rx="4" fill="#1E7BE0" /><text x="40" y="140" font-size="16" fill="#0E2340" text-anchor="start" font-weight="600">步骤 2：化简</text><rect x="190" y="130" width="120" height="20" rx="4" fill="#00A9B5" /><rect x="420" y="130" width="100" height="20" rx="4" fill="#00A9B5" /><text x="40" y="214" font-size="16" fill="#0E2340" text-anchor="start" font-weight="600">步骤 3：求解</text><rect x="380" y="204" width="140" height="20" rx="4" fill="#0E2340" /><rect x="560" y="262" width="90" height="20" rx="4" fill="#7A8699" opacity="0.45" /><text x="605" y="250" font-size="13" fill="#7A8699" text-anchor="middle" font-weight="600">待确认</text><text x="350" y="300" font-size="15" fill="#333A45" text-anchor="middle" font-weight="400">一步可以关联多个不连续时段；不同步骤的修改时段可能交错</text><text x="350" y="324" font-size="14" fill="#E8A33D" text-anchor="middle" font-weight="600">不能简单累加时间跨度作为整题用时</text></svg>