<svg width="1140" height="240" viewBox="0 0 1140 240" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="555" height="240" rx="8" fill="#F5F7FA" /><rect x="585" y="0" width="555" height="240" rx="8" fill="#EAF3FD" /><text x="277.5" y="34" font-size="20" fill="#0E2340" text-anchor="middle" font-weight="700">套路掌握</text><text x="862.5" y="34" font-size="20" fill="#1E7BE0" text-anchor="middle" font-weight="700">知识点掌握</text><circle cx="28" cy="68" r="4" fill="#0E2340" /><text x="44" y="74" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">能按固定路径求某类函数导数</text><circle cx="28" cy="102" r="4" fill="#0E2340" /><text x="44" y="108" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">回答：会不会做这一类题</text><circle cx="28" cy="136" r="4" fill="#0E2340" /><text x="44" y="142" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">证据：套路题的独立完成情况</text><circle cx="28" cy="170" r="4" fill="#0E2340" /><text x="44" y="176" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">不能换算成全部关联知识点满分</text><circle cx="613" cy="68" r="4" fill="#1E7BE0" /><text x="629" y="74" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">理解导数定义、几何意义与不同条件下的应用</text><circle cx="613" cy="102" r="4" fill="#1E7BE0" /><text x="629" y="108" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">回答：是否理解概念与适用条件</text><circle cx="613" cy="136" r="4" fill="#1E7BE0" /><text x="629" y="142" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">证据：概念辨析、变式、延迟保持</text><circle cx="613" cy="170" r="4" fill="#1E7BE0" /><text x="629" y="176" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">不能因整题错误判全部知识点未掌握</text></svg>