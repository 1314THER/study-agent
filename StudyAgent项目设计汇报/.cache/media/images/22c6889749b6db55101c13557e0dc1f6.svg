<svg width="1140" height="400" viewBox="0 0 1140 400" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="24" width="200" height="64" rx="8" fill="#0E2340" /><text x="100" y="62" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700">题目</text><line x1="200" y1="56" x2="262" y2="56" stroke="#1E7BE0" stroke-width="2" /><path d="M262 56 l10 -6 l0 12 z" fill="#1E7BE0" /><rect x="272" y="14" width="300" height="84" rx="8" fill="#FFFFFF" stroke="#1E7BE0" stroke-width="1.5" /><text x="422" y="46" font-size="19" fill="#0E2340" text-anchor="middle" font-weight="700">AI 解题流水线</text><text x="422" y="74" font-size="15" fill="#7A8699" text-anchor="middle" font-weight="400">Solver → Verifier → Formatter</text><line x1="572" y1="56" x2="634" y2="56" stroke="#1E7BE0" stroke-width="2" /><path d="M634 56 l10 -6 l0 12 z" fill="#1E7BE0" /><rect x="644" y="10" width="250" height="92" rx="8" fill="#0E2340" /><text x="769" y="46" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="700">结构化参考解析</text><text x="769" y="76" font-size="14" fill="#C8DCF2" text-anchor="middle" font-weight="400">步骤 · 知识点 · 难度</text><line x1="894" y1="56" x2="946" y2="56" stroke="#1E7BE0" stroke-width="2" /><path d="M946 56 l10 -6 l0 12 z" fill="#1E7BE0" /><rect x="956" y="0" width="184" height="52" rx="8" fill="#FFFFFF" stroke="#1E7BE0" stroke-width="1.5" /><text x="1048" y="32" font-size="17" fill="#0E2340" text-anchor="middle" font-weight="600">AI 改题</text><rect x="956" y="60" width="184" height="52" rx="8" fill="#FFFFFF" stroke="#1E7BE0" stroke-width="1.5" /><text x="1048" y="92" font-size="17" fill="#0E2340" text-anchor="middle" font-weight="600">手把手教学</text><rect x="956" y="120" width="184" height="52" rx="8" fill="#FFFFFF" stroke="#1E7BE0" stroke-width="1.5" /><text x="1048" y="152" font-size="17" fill="#0E2340" text-anchor="middle" font-weight="600">AI 出题</text><path d="M1048 172 q0 60 -120 78 L700 250" fill="none" stroke="#00A9B5" stroke-width="2" stroke-dasharray="6 5" /><text x="