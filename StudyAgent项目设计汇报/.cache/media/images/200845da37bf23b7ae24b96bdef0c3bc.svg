<svg width="1140" height="230" viewBox="0 0 1140 230" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="555" height="230" rx="8" fill="#F5F7FA" /><rect x="585" y="0" width="555" height="230" rx="8" fill="#EAF3FD" /><text x="277.5" y="34" font-size="20" fill="#0E2340" text-anchor="middle" font-weight="700">已有基础</text><text x="862.5" y="34" font-size="20" fill="#1E7BE0" text-anchor="middle" font-weight="700">尚缺部分</text><circle cx="28" cy="68" r="4" fill="#0E2340" /><text x="44" y="74" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">backend/agent_tools.py 六类内部工具：search_questions / solve_question / teach_question / grade_answer / plan_study / get_context</text><circle cx="28" cy="102" r="4" fill="#0E2340" /><text x="44" y="108" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">backend/api_v1.py 提供题目、练习、教学、进度与后台任务 API</text><circle cx="28" cy="136" r="4" fill="#0E2340" /><text x="44" y="142" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">backend/jobs.py 及存储层提供任务持久化</text><circle cx="613" cy="68" r="4" fill="#1E7BE0" /><text x="629" y="74" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">未发现已可直接供 DSH 或 WorkBuddy 使用的完整 StudyAgent MCP 服务及可安装适配包</text><circle cx="613" cy="102" r="4" fill="#1E7BE0" /><text x="629" y="108" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">内部工具的参数描述目前是字符串形式的示例，仍需转换和校验为真正的协议输入结构</text><circle cx="613" cy="136" r="4" fill="#1E7BE0" /><text x="629" y="142" font-size="16" fill="#333A45" text-anchor="start" font-weight="400">ROADMAP.md 仍将面向外部调用的 MCP 和专用 Agent 列为后续工作</text></svg>