<svg width="1140" height="110" viewBox="0 0 1140 110" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="10" width="1140" height="90" rx="8" fill="#F5F7FA" /><text x="570" y="42" font-size="17" fill="#0E2340" text-anchor="middle" font-weight="700">每次推荐应给出简明理由，例如“相关知识已有独立作答证据，但这个套路的变式尚未通过”</text><text x="570" y="76" font-size="15" fill="#333A45" text-anchor="middle" font-weight="400">不是永远挑正确率最高的题，也不是一味选最薄弱最难的内容；缺少记录 ≠ 不会</text></svg>