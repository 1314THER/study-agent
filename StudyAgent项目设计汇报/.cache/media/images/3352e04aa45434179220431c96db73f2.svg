<svg width="700" height="130" viewBox="0 0 700 130" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="10" width="700" height="104" rx="8" fill="#F5F7FA" /><text x="350" y="40" font-size="17" fill="#0E2340" text-anchor="middle" font-weight="700">三套编号体系互不等价：1019（目录）/ 29（正式训练）/ 288（课时库实体）</text><text x="350" y="74" font-size="15" fill="#333A45" text-anchor="middle" font-weight="400">引用数量时必须说明来自哪一套，避免把目录规模当成已开通的训练能力</text></svg>