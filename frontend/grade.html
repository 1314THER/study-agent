<script>
var _teacher = localStorage.getItem('teacher') || 'liangliang';
document.body.classList.remove('theme-liangliang', 'theme-xuefeng', 'theme-taotao', 'theme-ji');
document.body.classList.add('theme-' + _teacher);
var _gradeState = null;
var _patternMatch = null;
var _categories = [];
var _loadedQuestions = [];
var MISTAKE_TYPES = ['符号错误', '计算错误', '公式记错', '知识性错误', '审题错误', '思路错误', '其他'];

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function qs(name) {
    return new URLSearchParams(location.search).get(name);
}

function renderMath(el) {
    if (!el || !window.renderMathInElement) return;
    try {
        renderMathInElement(el, {delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
        ], ignoredTags: ['script', 'style']});
    } catch (e) {}
}

async function api(path, opts) {
    var r = await fetch('http://127.0.0.1:8000' + path, opts || {});
    return r.json();
}

async function uploadGradeHandwriting() {
    var input = document.getElementById('gradeOcrInput');
    if (!input || !input.files || !input.files.length) return;
    var btn = document.getElementById('gradeOcrBtn');
    var statusEl = document.getElementById('gradeOcrStatus');
    var oldText = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = '识别中…'; }
    if (statusEl) statusEl.textContent = '正在识别手写内容…';
    var fd = new FormData();
    fd.append('file', input.files[0]);
    try {
        var r = await fetch('http://127.0.0.1:8000/ocr/answer', { method: 'POST', body: fd });
        var d = await r.json();
        if (d.error) {
            if (statusEl) statusEl.textContent = '识别失败：' + (d.detail || d.error || '未知错误');
            return;
        }
        var ta = document.getElementById('answerInput');
        if (ta) {
            ta.value = d.text || '';
            ta.focus();
        }
        if (statusEl) statusEl.textContent = '已识别，可修改后判分。';
    } catch (e) {
        if (statusEl) statusEl.textContent = '识别失败，请确认后端已启动。';
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = oldText || '上传手写作答'; }
        input.value = '';
    }
}

async function loadQuestions() {
    try {
        var list = await api('/questions');
        _loadedQuestions = list;
        var sel = document.getElementById('qSelect');
        for (var i = 0; i < list.length; i++) {
            var q = list[i];
            var text = String(q.content || '').replace(/\s+/g, ' ').trim();
            if (text.length > 46) text = text.slice(0, 46) + '…';
            var opt = document.createElement('option');
            opt.value = q.id;
            opt.textContent = '#' + q.id + ' · ' + (q.question_type || '大题') + ' · ' + text;
            sel.appendChild(opt);
        }
        var preset = qs('question_id');
        if (preset) {
            sel.value = String(preset);
            var q = null;
            for (var j = 0; j < list.length; j++) {
                if (String(list[j].id) === String(preset)) { q = list[j]; break; }
            }
            if (q && q.question_type) {
                var typeSel = document.getElementById('qType');
                typeSel.value = q.question_type;
            }
            toggleQuestionMode();
        }
    } catch (e) {
        var sel = document.getElementById('qSelect');
        var opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '题库加载失败';
        sel.appendChild(opt);
    }
}

function toggleQuestionMode() {
    var manual = document.getElementById('manualQuestionField');
    var sel = document.getElementById('qSelect');
    manual.style.display = sel.value ? 'none' : 'block';
}

function statusLabel(s) {
    return {correct: '正确', partial: '部分正确', missing: '缺失', pending: '待标注', not_applicable: '不适用'}[s] || s || '未知';
}

function renderResult(d) {
    var box = document.getElementById('gradeResult');
    if (!d) {
        box.innerHTML = '';
        return;
    }
    if (d.error) {
        box.innerHTML = '<div class="grade-card"><div class="result-banner bad"><span>判分失败</span></div><p style="font-size:14px;color:#515154;">' + escapeHtml(d.detail || d.error) + '</p></div>';
        return;
    }
    _gradeState = d;
    var cls = d.is_correct ? 'ok' : 'bad';
    var label = d.is_correct ? '正确' : '错误';
    var scoreHtml = '';
    if (d.earned_score !== null && d.earned_score !== undefined && d.full_score !== null && d.full_score !== undefined) {
        scoreHtml = '<span class="result-score">' + d.earned_score + ' / ' + d.full_score + ' 分</span>';
    }
    var html = '<div class="grade-card">';
    html += '<div class="result-banner ' + cls + '"><span>' + label + '</span>' + scoreHtml + '</div>';
    html += '<div class="result-meta">';
    html += '<span class="tag tag-type">' + escapeHtml(d.question_type || '大题') + '</span>';
    html += '<span class="tag tag-type-simple">' + (d.mode === 'answer_match' ? '答案比对' : '步骤判分') + '</span>';
    if (d.anti_cheat) {
        if (d.anti_cheat.viewed_answer) html += '<span class="tag tag-type-special">看过答案</span>';
        if (d.anti_cheat.skipped) html += '<span class="tag tag-type-special">跳过</span>';
    }
    html += '</div>';
    if (d.feedback) html += '<div class="result-feedback">' + escapeHtml(d.feedback) + '</div>';
    if (d.suggested_approach) html += '<div class="suggest-approach">' + escapeHtml(d.suggested_approach) + '</div>';
    if (d.expected_answer) {
        html += '<div class="result-block"><h3>参考答案</h3><p>' + escapeHtml(d.expected_answer) + '</p></div>';
    }
    if (d.step_results && d.step_results.length) {
        html += '<div class="result-block"><h3>步骤判分</h3>';
        for (var i = 0; i < d.step_results.length; i++) {
            var s = d.step_results[i];
            html += '<div class="step-row">';
            html += '<span class="step-status ' + escapeHtml(s.status) + '">' + escapeHtml(statusLabel(s.status)) + '</span>';
            html += '<div class="step-comment"><strong>第 ' + s.step_number + ' 步</strong>（' + escapeHtml(s.id) + '）';
            if (s.comment) html += '<br>' + escapeHtml(s.comment);
            html += '</div></div>';
        }
        html += '</div>';
    }
    if (d.missing_steps && d.missing_steps.length) {
        html += '<div class="result-block"><h3>缺失步骤</h3><p>' + escapeHtml(d.missing_steps.join('、')) + '</p></div>';
    }
    if (d.not_rigorous_steps && d.not_rigorous_steps.length) {
        html += '<div class="result-block"><h3>不够严谨</h3><p>' + escapeHtml(d.not_rigorous_steps.join('、')) + '</p></div>';
    }
    if (d.student_answer) {
        html += '<div class="result-block"><h3>学生作答</h3><div class="question-preview">' + escapeHtml(d.student_answer) + '</div></div>';
    }
    if (!d.is_correct && d.question_id && (d.mode === 'answer_match' || d.mode === 'step_ai')) {
        html += '<div class="grade-actions"><button class="grade-btn" onclick="openErrorModal()">' + (d.mode === 'step_ai' ? '编辑错因' : '标记错因') + '</button></div>';
    }
    html += '</div>';
    box.innerHTML = html;
    renderMath(box);
}

function buildErrorSteps(d, existing) {
    if (d.mode === 'answer_match') {
        var stdSteps = d.standard_steps || [];
        if (stdSteps.length) {
            return stdSteps.map(function(s) {
                var tags = (existing || []).filter(function(e) {
                    return e.chunk_id === s.chunk_id && e.step_number === s.step_number;
                }).map(function(e) {
                    return {mistake_type: e.mistake_type, mistake_detail: e.mistake_detail};
                });
                if (!tags.length) tags = [{mistake_type: '', mistake_detail: ''}];
                return {
                    chunk_id: s.chunk_id,
                    step_number: s.step_number,
                    title: '第 ' + s.step_number + ' 步 · ' + (s.title || '步骤'),
                    status: 'pending',
                    standard_writing: s.standard_writing || '',
                    tags: tags
                };
            });
        }
        var tags = (existing || []).filter(function(e) {
            return e.chunk_id === 1 && e.step_number === 1;
        }).map(function(e) {
            return {mistake_type: e.mistake_type, mistake_detail: e.mistake_detail};
        });
        if (!tags.length) tags = [{mistake_type: '', mistake_detail: ''}];
        return [{
            chunk_id: 1,
            step_number: 1,
            title: '整题（无过程）',
            status: 'pending',
            standard_writing: '',
            tags: tags
        }];
    }
    var out = [];
    var notRigorous = {};
    (d.not_rigorous_steps || []).forEach(function(id) { notRigorous[id] = true; });
    (d.step_results || []).forEach(function(s) {
        var status = s.status;
        if (notRigorous[s.id] && status === 'correct') status = 'partial';
        if (status !== 'partial' && status !== 'missing') return;
        var tags = (existing || []).filter(function(e) {
            return e.chunk_id === s.chunk_id && e.step_number === s.step_number;
        }).map(function(e) {
            return {mistake_type: e.mistake_type, mistake_detail: e.mistake_detail};
        });
        if (!tags.length) {
            tags = (s.error_types || []).map(function(t) {
                return {mistake_type: t, mistake_detail: s.error_detail || ''};
            });
            if (!tags.length) tags = [{mistake_type: '', mistake_detail: ''}];
        }
        out.push({
            chunk_id: s.chunk_id,
            step_number: s.step_number,
            title: '第 ' + s.step_number + ' 步 · ' + (s.title || '步骤'),
            status: status,
            standard_writing: s.standard_writing || '',
            tags: tags
        });
    });
    return out;
}

function errorRowHtml(chunk, step, tag) {
    var options = '<option value="">选择错因</option>';
    for (var i = 0; i < MISTAKE_TYPES.length; i++) {
        var t = MISTAKE_TYPES[i];
        options += '<option value="' + t + '"' + (tag && tag.mistake_type === t ? ' selected' : '') + '>' + t + '</option>';
    }
    return '<div class="err-row" data-chunk="' + chunk + '" data-step="' + step + '">' +
        '<select class="err-type">' + options + '</select>' +
        '<input class="err-detail" placeholder="具体错误说明（可选）" value="' + escapeHtml((tag && tag.mistake_detail) || '') + '">' +
        '<button class="err-remove" onclick="removeErrorRow(this)" title="删除">×</button></div>';
}

function renderErrorRows(steps) {
    var html = '';
    for (var i = 0; i < steps.length; i++) {
        var st = steps[i];
        html += '<div class="err-step" data-chunk="' + st.chunk_id + '" data-step="' + st.step_number + '">';
        html += '<div class="err-step-head">' + escapeHtml(st.title) + '<span class="err-status ' + escapeHtml(st.status) + '">' + escapeHtml(statusLabel(st.status)) + '</span></div>';
        if (st.standard_writing) html += '<div class="err-step-body">' + escapeHtml(st.standard_writing) + '</div>';
        html += '<div class="err-rows">';
        for (var j = 0; j < st.tags.length; j++) {
            html += errorRowHtml(st.chunk_id, st.step_number, st.tags[j]);
        }
        html += '</div>';
        html += '<button class="grade-btn small secondary" onclick="addErrorRow(' + st.chunk_id + ',' + st.step_number + ')">添加一条</button>';
        html += '</div>';
    }
    return html;
}

function addErrorRow(chunk, step) {
    var stepEl = document.querySelector('.err-step[data-chunk="' + chunk + '"][data-step="' + step + '"]');
    if (!stepEl) return;
    stepEl.querySelector('.err-rows').insertAdjacentHTML('beforeend', errorRowHtml(chunk, step, {mistake_type: '', mistake_detail: ''}));
}

function removeErrorRow(btn) {
    var row = btn.closest('.err-row');
    if (row) row.remove();
}

function closeErrorModal() {
    document.getElementById('errorModal').style.display = 'none';
}

async function openErrorModal() {
    if (!_gradeState || !_gradeState.question_id) return;
    var qid = _gradeState.question_id;
    var existing = [];
    try {
        var q = await api('/questions/' + qid);
        existing = q.step_errors || [];
    } catch (e) {}
    var body = document.getElementById('errorModalBody');
    body.innerHTML = renderErrorRows(buildErrorSteps(_gradeState, existing));
    renderMath(body);
    document.getElementById('errorModal').style.display = 'flex';
}

async function confirmErrorTags() {
    if (!_gradeState || !_gradeState.question_id) return;
    var tags = [];
    document.querySelectorAll('#errorModalBody .err-step').forEach(function(stepEl) {
        var chunk = parseInt(stepEl.getAttribute('data-chunk'), 10);
        var step = parseInt(stepEl.getAttribute('data-step'), 10);
        stepEl.querySelectorAll('.err-row').forEach(function(row) {
            var type = row.querySelector('.err-type').value.trim();
            var detail = row.querySelector('.err-detail').value.trim();
            tags.push({step_number: step, chunk_id: chunk, mistake_type: type, mistake_detail: detail, student_input: ''});
        });
    });
    var qid = _gradeState.question_id;
    var statusEl = document.getElementById('gradeStatus');
    try {
        var d = await api('/questions/' + qid + '/step-errors/batch', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({tags: tags})
        });
        if (d.error) throw new Error(d.detail || d.error);
        closeErrorModal();
        if (statusEl) statusEl.innerHTML = '<span style="color:#166534;">错因已保存，正在匹配套路...</span>';
        await openPatternMatch(qid);
    } catch (e) {
        if (statusEl) statusEl.innerHTML = '<span style="color:#c62828;">保存错因失败：' + escapeHtml(e.message || '请求失败') + '</span>';
    }
}

function patternStateLabel(s) {
    return {never: '未挑战', first_pass: '第一次会', second_pass: '第二次会', third_pass: '已通关', again_wrong: '再次出错'}[s] || s || '未挑战';
}

function difficultySelectHtml(selected) {
    var v = String(selected == null ? 1 : selected);
    var opts = [['0', '0 · 送分'], ['1', '1 · 常规'], ['2', '2 · 难题'], ['3', '3 · 压轴']];
    return opts.map(function(o) {
        return '<option value="' + o[0] + '"' + (v === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('');
}

function togglePatternForm() {
    var box = document.getElementById('newPatternBox');
    if (!box) return;
    var sel = document.querySelector('input[name="patternChoice"]:checked');
    box.style.display = sel && sel.value === 'new' ? 'block' : 'none';
}

async function loadPatternCategories(prefill) {
    try {
        var data = await api('/categories');
        _categories = (data || []).map(function(x) { return x.level1; });
    } catch (e) {
        _categories = [];
    }
    var sel = document.getElementById('newPatternCategory');
    if (!sel) return;
    var html = '<option value="">请选择板块</option>';
    for (var i = 0; i < _categories.length; i++) {
        html += '<option value="' + escapeHtml(_categories[i]) + '">' + escapeHtml(_categories[i]) + '</option>';
    }
    sel.innerHTML = html;
    if (prefill && _categories.indexOf(prefill) >= 0) sel.value = prefill;
}

function renderPatternModal(data) {
    var html = '';
    var matches = data.matches || [];
    if (matches.length) {
        html += '<div class="pattern-note">自动匹配到 ' + matches.length + ' 个套路，选择要把这道错题关联到哪个套路：</div>';
        for (var i = 0; i < matches.length; i++) {
            var m = matches[i];
            html += '<label class="pattern-choice"><input type="radio" name="patternChoice" value="' + m.pattern_id + '"' + (i === 0 ? ' checked' : '') + '><span><div class="pattern-choice-name">' + escapeHtml(m.name) + '</div><div class="pattern-choice-meta">' + escapeHtml(m.category) + ' · ' + patternStateLabel(m.state) + ' · ' + escapeHtml(m.reason) + '</div></span><span class="pattern-score">' + m.score + ' 分</span></label>';
        }
    } else {
        html += '<div class="pattern-note">题库里还没有匹配到现有套路，可以新建一个套路，把这道错题作为母题。</div>';
    }
    html += '<label class="pattern-choice"><input type="radio" name="patternChoice" value="new"' + (matches.length ? '' : ' checked') + '><span><div class="pattern-choice-name">新建套路</div><div class="pattern-choice-meta">以这道错题为母题，逻辑与母题看板的“新建套路”一致</div></span></label>';
    html += '<div class="new-pattern-box" id="newPatternBox" style="display:' + (matches.length ? 'none' : 'block') + ';">';
    html += '<label>所属板块</label><select id="newPatternCategory"></select>';
    html += '<label>套路名</label><input id="newPatternName" placeholder="如：直线与圆锥曲线联立">';
    html += '<label>套路难度</label><select id="newPatternDifficulty">' + difficultySelectHtml(1) + '</select>';
    html += '<label>套路说明</label><textarea id="newPatternDesc" placeholder="这个套路考什么、怎么破题"></textarea>';
    html += '</div>';
    html += '<label class="pattern-choice"><input type="radio" name="patternChoice" value="none"><span><div class="pattern-choice-name">暂不关联</div><div class="pattern-choice-meta">保留错题标签，稍后再到母题看板处理</div></span></label>';
    document.getElementById('patternModalBody').innerHTML = html;
    document.querySelectorAll('input[name="patternChoice"]').forEach(function(r) { r.addEventListener('change', togglePatternForm); });
    loadPatternCategories(data.question && data.question.category);
}

async function openPatternMatch(qid) {
    try {
        var d = await api('/patterns/match-wrong', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({question_id: qid})
        });
        if (d.error) throw new Error(d.detail || d.error);
        _patternMatch = d;
        renderPatternModal(d);
        document.getElementById('patternModal').style.display = 'flex';
    } catch (e) {
        var statusEl = document.getElementById('gradeStatus');
        if (statusEl) statusEl.innerHTML = '<span style="color:#c62828;">套路匹配失败：' + escapeHtml(e.message || '请求失败') + '</span>';
    }
}

function closePatternModal() {
    document.getElementById('patternModal').style.display = 'none';
}

async function confirmPatternMatch() {
    var sel = document.querySelector('input[name="patternChoice"]:checked');
    var statusEl = document.getElementById('gradeStatus');
    if (!sel) return;
    if (sel.value === 'none') {
        closePatternModal();
        if (statusEl) statusEl.innerHTML = '<span style="color:#166534;">错因已保存，暂未关联套路。</span>';
        return;
    }
    try {
        if (sel.value === 'new') {
            var name = document.getElementById('newPatternName').value.trim();
            var category = document.getElementById('newPatternCategory').value;
            var desc = document.getElementById('newPatternDesc').value.trim();
            var difficulty = parseInt(document.getElementById('newPatternDifficulty').value) || 1;
            if (!category || !name) {
                if (statusEl) statusEl.innerHTML = '<span style="color:#c62828;">请选择板块并填写套路名。</span>';
                return;
            }
            var d = await api('/patterns/mother', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question_id: _patternMatch.question_id, category: category, name: name, description: desc, difficulty: difficulty})
            });
            if (d.error) throw new Error(d.detail || d.error);
            await api('/patterns/' + d.pattern_id + '/wrong', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question_id: _patternMatch.question_id})
            });
            closePatternModal();
            if (statusEl) statusEl.innerHTML = '<span style="color:#166534;">已新建套路「' + escapeHtml(name) + '」并加入巩固日历。</span>';
        } else {
            var pid = parseInt(sel.value, 10);
            var d2 = await api('/patterns/' + pid + '/wrong', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question_id: _patternMatch.question_id})
            });
            if (d2.error) throw new Error(d2.detail || d2.error);
            closePatternModal();
            if (statusEl) statusEl.innerHTML = '<span style="color:#166534;">已关联套路并加入巩固日历。</span>';
        }
    } catch (e) {
        if (statusEl) statusEl.innerHTML = '<span style="color:#c62828;">关联套路失败：' + escapeHtml(e.message || '请求失败') + '</span>';
    }
}

async function doGrade() {
    var btn = document.getElementById('gradeBtn');
    var statusEl = document.getElementById('gradeStatus');
    var sel = document.getElementById('qSelect');
    var qid = sel.value ? parseInt(sel.value) : null;
    var question = document.getElementById('questionInput').value.trim();
    var answer = document.getElementById('answerInput').value.trim();
    if (!qid && !question) {
        statusEl.innerHTML = '<span style="color:#c62828;">请选择题目或输入题干。</span>';
        return;
    }
    if (!answer) {
        statusEl.innerHTML = '<span style="color:#c62828;">请填写学生作答。</span>';
        return;
    }
    var fullScore = document.getElementById('fullScore').value;
    var duration = document.getElementById('duration').value;
    var payload = {
        question_id: qid,
        question: qid ? null : question,
        student_answer: answer,
        question_type: document.getElementById('qType').value || null,
        full_score: fullScore === '' ? null : parseFloat(fullScore),
        teacher: document.getElementById('teacher').value,
        source: document.getElementById('source').value,
        duration_seconds: duration === '' ? null : parseInt(duration),
        viewed_answer: document.getElementById('viewedAnswer').checked,
        skipped: document.getElementById('skipped').checked
    };
    statusEl.innerHTML = 'AI 正在判分，请稍候...';
    btn.disabled = true;
    try {
        var d = await api('/grade', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        renderResult(d);
        if (!d.error && d.is_correct === false && d.question_id && d.mode === 'step_ai') {
            setTimeout(openErrorModal, 250);
        }
        if (d.error) {
            statusEl.innerHTML = '<span style="color:#c62828;">' + escapeHtml(d.detail || d.error) + '</span>';
        } else {
            statusEl.innerHTML = '';
        }
    } catch (e) {
        statusEl.innerHTML = '<span style="color:#c62828;">请求失败：' + escapeHtml(e.message || '无法连接后端') + '</span>';
    } finally {
        btn.disabled = false;
    }
}

document.addEventListener('DOMContentLoaded', function() {
    loadQuestions();
    var teacherSel = document.getElementById('teacher');
    if (teacherSel) teacherSel.value = _teacher;
    toggleQuestionMode();
});
</script>
