    .grade-btn.secondary { background: #f5f5f7; color: #515154; }
    .grade-btn:disabled { opacity: 0.5; cursor: default; }
    .grade-status { margin-top: 10px; font-size: 14px; color: #86868b; min-height: 20px; line-height: 1.6; }

    .result-banner.bad { background: #fff5f5; border: 1px solid #ffcdd2; color: #991b1b; }
    .result-score { margin-left: auto; font-size: 18px; }
    .result-feedback { background: #fafafa; border: 1px solid #eeeef0; border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.8; color: #1d1d1f; white-space: pre-wrap; margin-bottom: 12px; }
    .step-row { display: grid; grid-template-columns: 86px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; align-items: start; }
    .step-row:last-child { border-bottom: none; }
    .step-status { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; text-align: center; white-space: nowrap; }
    .step-status.correct { background: #e8f5e9; color: #2e7d32; }
    .step-status.partial { background: #fff8e1; color: #b45309; }
    .step-status.missing { background: #fff5f5; color: #c62828; }
    .step-status.not_applicable { background: #f0f0f0; color: #86868b; }
    .step-comment { font-size: 13px; line-height: 1.7; color: #515154; }
    .result-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .result-meta .tag { font-size: 12px; }
    .result-block { margin-bottom: 12px; }
    .result-block h3 { font-size: 13px; font-weight: 600; color: #1d1d1f; margin-bottom: 6px; }
    .result-block p { font-size: 13px; line-height: 1.7; color: #515154; }
    .suggest-approach { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.8; color: #1e3a8a; margin-top: 12px; }
    .question-preview { background: #fafafa; border: 1px solid #eeeef0; border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.8; color: #1d1d1f; white-space: pre-line; margin-top: 12px; }

<script>
var _teacher = localStorage.getItem('teacher') || 'liangliang';
document.body.classList.remove('theme-liangliang', 'theme-xuefeng', 'theme-taotao', 'theme-ji');
document.body.classList.add('theme-' + _teacher);

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderMath(el) {
    if (!el || !window.renderMathInElement) return;
    try {
        renderMathInElement(el, {delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
        ], ignoredTags: ['script', 'style']});
    } catch (e) {}
}

async function api(path, opts) {
    var r = await fetch('http://127.0.0.1:8000' + path, opts || {});
    return r.json();
}

async function loadQuestions() {
    try {
        var list = await api('/questions');
        var sel = document.getElementById('qSelect');
        for (var i = 0; i < list.length; i++) {
            var q = list[i];
            var text = String(q.content || '').replace(/\s+/g, ' ').trim();
            if (text.length > 46) text = text.slice(0, 46) + '…';
            var opt = document.createElement('option');
            opt.value = q.id;
            opt.textContent = '#' + q.id + ' · ' + (q.question_type || '大题') + ' · ' + text;
            sel.appendChild(opt);
        }
    } catch (e) {
        var sel = document.getElementById('qSelect');
        var opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '题库加载失败';
        sel.appendChild(opt);
    }
}

function toggleQuestionMode() {
    var manual = document.getElementById('manualQuestionField');
    var sel = document.getElementById('qSelect');
    manual.style.display = sel.value ? 'none' : 'block';
}

function statusLabel(s) {
    return {correct: '正确', partial: '部分正确', missing: '缺失', not_applicable: '不适用'}[s] || s || '未知';
}

function renderResult(d) {
    var box = document.getElementById('gradeResult');
    if (!d) {
        box.innerHTML = '';
        return;
    }
    if (d.error) {
        box.innerHTML = '<div class="grade-card"><div class="result-banner bad"><span>判分失败</span></div><p style="font-size:14px;color:#515154;">' + escapeHtml(d.detail || d.error) + '</p></div>';
        return;
    }
    var cls = d.is_correct ? 'ok' : 'bad';
    var label = d.is_correct ? '正确' : '错误';
    var scoreHtml = '';
    if (d.earned_score !== null && d.earned_score !== undefined && d.full_score !== null && d.full_score !== undefined) {
        scoreHtml = '<span class="result-score">' + d.earned_score + ' / ' + d.full_score + ' 分</span>';
    }
    var html = '<div class="grade-card">';
    html += '<div class="result-banner ' + cls + '"><span>' + label + '</span>' + scoreHtml + '</div>';
    html += '<div class="result-meta">';
    html += '<span class="tag tag-type">' + escapeHtml(d.question_type || '大题') + '</span>';
    html += '<span class="tag tag-type-simple">' + (d.mode === 'answer_match' ? '答案比对' : '步骤判分') + '</span>';
    if (d.anti_cheat) {
        if (d.anti_cheat.viewed_answer) html += '<span class="tag tag-type-special">看过答案</span>';
        if (d.anti_cheat.skipped) html += '<span class="tag tag-type-special">跳过</span>';
    }
    html += '</div>';
    if (d.feedback) html += '<div class="result-feedback">' + escapeHtml(d.feedback) + '</div>';
    if (d.suggested_approach) html += '<div class="suggest-approach">' + escapeHtml(d.suggested_approach) + '</div>';
    if (d.expected_answer) {
        html += '<div class="result-block"><h3>参考答案</h3><p>' + escapeHtml(d.expected_answer) + '</p></div>';
    }
    if (d.step_results && d.step_results.length) {
        html += '<div class="result-block"><h3>步骤判分</h3>';
        for (var i = 0; i < d.step_results.length; i++) {
            var s = d.step_results[i];
            html += '<div class="step-row">';
            html += '<span class="step-status ' + escapeHtml(s.status) + '">' + escapeHtml(statusLabel(s.status)) + '</span>';
            html += '<div class="step-comment"><strong>第 ' + s.step_number + ' 步</strong>（' + escapeHtml(s.id) + '）';
            if (s.comment) html += '<br>' + escapeHtml(s.comment);
            html += '</div></div>';
        }
        html += '</div>';
    }
    if (d.missing_steps && d.missing_steps.length) {
        html += '<div class="result-block"><h3>缺失步骤</h3><p>' + escapeHtml(d.missing_steps.join('、')) + '</p></div>';
    }
    if (d.not_rigorous_steps && d.not_rigorous_steps.length) {
        html += '<div class="result-block"><h3>不够严谨</h3><p>' + escapeHtml(d.not_rigorous_steps.join('、')) + '</p></div>';
    }
    if (d.student_answer) {
        html += '<div class="result-block"><h3>学生作答</h3><div class="question-preview">' + escapeHtml(d.student_answer) + '</div></div>';
    }
    html += '</div>';
    box.innerHTML = html;
    renderMath(box);
}

async function doGrade() {
    var btn = document.getElementById('gradeBtn');
    var statusEl = document.getElementById('gradeStatus');
    var sel = document.getElementById('qSelect');
    var qid = sel.value ? parseInt(sel.value) : null;
    var question = document.getElementById('questionInput').value.trim();
    var answer = document.getElementById('answerInput').value.trim();
    if (!qid && !question) {
        statusEl.innerHTML = '<span style="color:#c62828;">请选择题目或输入题干。</span>';
        return;
    }
    if (!answer) {
        statusEl.innerHTML = '<span style="color:#c62828;">请填写学生作答。</span>';
        return;
    }
    var fullScore = document.getElementById('fullScore').value;
    var duration = document.getElementById('duration').value;
    var payload = {
        question_id: qid,
        question: qid ? null : question,
        student_answer: answer,
        question_type: document.getElementById('qType').value || null,
        full_score: fullScore === '' ? null : parseFloat(fullScore),
        teacher: document.getElementById('teacher').value,
        source: document.getElementById('source').value,
        duration_seconds: duration === '' ? null : parseInt(duration),
        viewed_answer: document.getElementById('viewedAnswer').checked,
        skipped: document.getElementById('skipped').checked
    };
    statusEl.innerHTML = 'AI 正在判分，请稍候...';
    btn.disabled = true;
    try {
        var d = await api('/grade', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        renderResult(d);
        if (d.error) {
            statusEl.innerHTML = '<span style="color:#c62828;">' + escapeHtml(d.detail || d.error) + '</span>';
        } else {
            statusEl.innerHTML = '';
        }
    } catch (e) {
        statusEl.innerHTML = '<span style="color:#c62828;">请求失败：' + escapeHtml(e.message || '无法连接后端') + '</span>';
    } finally {
        btn.disabled = false;
    }
}

document.addEventListener('DOMContentLoaded', function() {
    loadQuestions();
    var teacherSel = document.getElementById('teacher');
    if (teacherSel) teacherSel.value = _teacher;
    toggleQuestionMode();
});
</script>
