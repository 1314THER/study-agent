<text x="60" y="1940.7" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="23" fill="#b8b8b8">时序是可解释的示例；两路检索可并行。关键产物与正式事件入库，等待学生时保存状态，后台更新可异步恢复。</text>
<text x="60" y="1990.7" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="23" fill="#b8b8b8">每次模型调用只带当前角色需要的证据；以实际输入输出和最终状态验收，不以模型自称完成为准。</text>
