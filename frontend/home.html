    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var dateEl = document.getElementById('homeDate');
            if (dateEl) {
                try {
                    dateEl.textContent = new Date().toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
                } catch (e) {}
            }

            fetch('/agent/context')
                .then(function (r) { return r.json(); })
                .then(function (ctx) {
                    var statIds = ['statQuestions', 'statWrong', 'statDue'];
                    var keys = ['total_questions', 'wrong_questions', 'due_reviews'];
                    for (var i = 0; i < statIds.length; i++) {
                        var el = document.getElementById(statIds[i]);
                        if (el && ctx[keys[i]] !== undefined) el.textContent = ctx[keys[i]];
                    }
                    var masteredEl = document.getElementById('statMastered');
                    if (masteredEl && ctx.patterns_mastered !== undefined) {
                        masteredEl.textContent = ctx.patterns_mastered + ' / ' + (ctx.patterns_total || 0);
                    }
                    var cartEl = document.getElementById('statCart');
                    if (cartEl) {
                        try { cartEl.textContent = JSON.parse(localStorage.getItem('exam_cart') || '[]').length; } catch (e) { cartEl.textContent = 0; }
                    }
                })
                .catch(function () {});

            fetch('/patterns/calendar')
                .then(function (r) { return r.json(); })
                .then(function (cal) {
                    var items = (cal && cal.today_items) || [];
                    renderTodo(items);
                })
                .catch(function () {
                    var el = document.getElementById('homeTodo');
                    if (el) el.innerHTML = '<div class="todo-empty">后端未启动，暂时无法加载今日待办</div>';
                });
        });

        function renderTodo(items) {
            var countEl = document.getElementById('todoCount');
            if (countEl) countEl.textContent = items.length;
            var el = document.getElementById('homeTodo');
            if (!el) return;
            if (!items.length) {
                el.innerHTML = '<div class="todo-empty">今天没有到期待办，去巩固日历看看</div>';
                return;
            }
            var html = '';
            items.forEach(function (item) {
                html += '<a class="todo-item" href="loop.html?v=20260807&pattern_id=' + item.pattern_id + '">' +
                    '<span class="todo-cat">' + escapeHtml(String(item.category || '套路')) + '</span>' +
                    '<span class="todo-name">' + escapeHtml(String(item.name || '待复习套路')) + '</span>' +
                    '<span class="todo-due">今天</span>' +
                    '</a>';
            });
            el.innerHTML = html;
        }

        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
    </script>
