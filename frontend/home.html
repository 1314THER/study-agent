    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var dateEl = document.getElementById('homeDate');
            if (dateEl) {
                try {
                    dateEl.textContent = new Date().toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
                } catch (e) {}
            }
            fetch('/agent/context')
                .then(function (r) { return r.json(); })
                .then(function (ctx) {
                    var statIds = ['statQuestions', 'statWrong', 'statDue'];
                    var keys = ['total_questions', 'wrong_questions', 'due_reviews'];
                    for (var i = 0; i < statIds.length; i++) {
                        var el = document.getElementById(statIds[i]);
                        if (el && ctx[keys[i]] !== undefined) el.textContent = ctx[keys[i]];
                    }
                    var masteredEl = document.getElementById('statMastered');
                    if (masteredEl && ctx.patterns_mastered !== undefined) {
                        masteredEl.textContent = ctx.patterns_mastered + ' / ' + (ctx.patterns_total || 0);
                    }
                    var cartEl = document.getElementById('statCart');
                    if (cartEl) {
                        try { cartEl.textContent = JSON.parse(localStorage.getItem('exam_cart') || '[]').length; } catch (e) { cartEl.textContent = 0; }
                    }
                    var recentEl = document.getElementById('homeRecent');
                    if (recentEl) {
                        if (ctx.recent_wrong && ctx.recent_wrong.length && window.AgentGlobal) {
                            recentEl.innerHTML = '';
                            window.AgentGlobal.renderQuestions(ctx.recent_wrong, recentEl);
                        } else {
                            recentEl.innerHTML = '<div class="home-recent-empty">还没有带错因标记的题目</div>';
                        }
                    }
                })
                .catch(function () {
                    var recentEl = document.getElementById('homeRecent');
                    if (recentEl) recentEl.innerHTML = '<div class="home-recent-empty">后端未启动，暂时无法加载学情</div>';
                });
        });
    </script>
