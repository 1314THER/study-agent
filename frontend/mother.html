<script>
var _patterns = [];
var _categories = [];
var _selectedPatternId = null;

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function stateLabel(s) {
    return {never: '从来都不会', first_pass: '第一次会', second_pass: '第二次会', third_pass: '第三次会', again_wrong: '再次出错'}[s] || s;
}

function stateClass(s) { return 'state-' + (s || 'never'); }

function isDue(p) {
    var m = p.mastery || {};
    return m.need_check && m.next_check_at && new Date(m.next_check_at.replace(' ', 'T')) <= new Date();
}

function difficultyLabel(d) {
    return {'0': '0 · 送分', '1': '1 · 常规', '2': '2 · 难题', '3': '3 · 压轴'}[String(d)] || '1 · 常规';
}

function difficultyOptions(selected) {
    var v = String(selected == null ? 1 : selected);
    var opts = [['0', '0 · 送分'], ['1', '1 · 常规'], ['2', '2 · 难题'], ['3', '3 · 压轴']];
    return opts.map(function(o) {
        return '<option value="' + o[0] + '"' + (v === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('');
}

function apiGet(url) {
    return fetch('http://127.0.0.1:8000' + url, {headers: {'Content-Type': 'application/json'}}).then(function(r) {
        return r.json();
    }).then(function(d) {
        if (d && d.error) throw new Error(d.detail || d.error || '请求失败');
        return d;
    });
}

function renderMath(el) {
    if (!el || !window.renderMathInElement) return;
    try {
        renderMathInElement(el, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '\\[', right: '\\]', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false}
            ],
            ignoredTags: ['script', 'style', 'textarea']
        });
    } catch (e) {}
}

function checkReminders() {
    var due = _patterns.filter(isDue);
    var el = document.getElementById('motherReminder');
    if (!el) return;
    if (due.length) {
        el.style.display = 'block';
        el.textContent = '有 ' + due.length + ' 个套路需要复查：' + due.map(function(p) { return p.name; }).join('、');
    } else {
        el.style.display = 'none';
    }
}

async function loadCategories() {
    try {
        var r = await fetch('http://127.0.0.1:8000/categories');
        var data = await r.json();
        _categories = (data || []).map(function(x) { return x.level1; });
    } catch (e) {
        _categories = [];
    }
    var sel = document.getElementById('patternCategory');
    if (sel) fillCategorySelect(sel);
    if (_patterns.length) renderTree();
}

function fillCategorySelect(sel) {
    var cur = sel.value;
    var html = '<option value="">请选择板块</option>';
    for (var i = 0; i < _categories.length; i++) {
        html += '<option value="' + escapeHtml(_categories[i]) + '">' + escapeHtml(_categories[i]) + '</option>';
    }
    sel.innerHTML = html;
    if (cur) sel.value = cur;
}

async function loadPatterns() {
    try {
        var r = await fetch('http://127.0.0.1:8000/patterns');
        _patterns = await r.json();
    } catch (e) {
        _patterns = [];
        document.getElementById('motherTree').innerHTML = '<div class="mother-empty">加载失败</div>';
    }
    renderTree();
    checkReminders();
    if (_selectedPatternId) {
        var p = _patterns.find(function(x) { return x.id === _selectedPatternId; });
        if (p) selectPattern(p.id);
        else _selectedPatternId = null;
    }
}

async function syncPatterns() {
    setStatus('正在同步题库母题...');
    try {
        var r = await fetch('http://127.0.0.1:8000/patterns/sync', {method: 'POST'});
        var d = await r.json();
        if (d.error) throw new Error(d.detail || d.error);
        setStatus('已同步 ' + (d.synced || 0) + ' 道精选母题');
    } catch (e) {
        setStatus('同步失败：' + e.message, true);
    }
    await loadPatterns();
    checkReminders();
}

function renderTree() {
    var tree = document.getElementById('motherTree');
    var byCat = {};
    for (var i = 0; i < _patterns.length; i++) {
        var p = _patterns[i];
        (byCat[p.category] = byCat[p.category] || []).push(p);
    }
    var cats = Object.keys(byCat).sort();
    if (!cats.length) {
        tree.innerHTML = '<div class="mother-empty">还没有母题套路，点击“新增套路”开始</div>';
        return;
    }
    var warning = '';
    if (_categories.length) {
        var bad = cats.filter(function(c) { return _categories.indexOf(c) < 0; });
        if (bad.length) {
            warning = '<div style="margin-bottom:12px;padding:10px 14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;color:#9a3412;font-size:14px;">板块与栏目不一致：' + escapeHtml(bad.join('、')) + '，请先修正后重试 <button class="mother-btn secondary" style="margin-left:8px;" onclick="syncPatterns()">重试</button></div>';
        }
    }
    var html = '';
    for (var ci = 0; ci < cats.length; ci++) {
        var cat = cats[ci];
        var list = byCat[cat];
        var mastered = list.filter(function(x) { return x.mastery && x.mastery.state === 'third_pass'; }).length;
        var percent = list.length ? Math.round(mastered / list.length * 100) : 0;
        html += '<div class="mm-category"><div class="mm-category-head"><span>📘 ' + escapeHtml(cat) + '</span><span class="mm-category-percent">掌握 ' + percent + '%</span></div>';
        html += '<ul class="mm-pattern-list">';
        for (var pi = 0; pi < list.length; pi++) {
            var p = list[pi];
            var state = p.mastery ? p.mastery.state : 'never';
            html += '<li class="mm-pattern' + (p.id === _selectedPatternId ? ' active' : '') + '" onclick="selectPattern(' + p.id + ')">';
            html += '<div class="mm-pattern-name">' + escapeHtml(p.name) + '<span class="state-badge ' + stateClass(state) + '">' + escapeHtml(stateLabel(state)) + '</span>';
            if (isDue(p)) html += '<span class="state-badge" style="background:#fee2e2;color:#b91c1c;">待复查</span>';
            html += '</div>';
            html += '<div class="mm-pattern-meta">母题 #' + (p.mother_id || '无') + (p.variant_ids.length ? ' · 变式 ' + p.variant_ids.length + ' 道' : '') + ' · 难度 ' + difficultyLabel(p.difficulty) + '</div>';
            html += '</li>';
        }
        html += '</ul></div>';
    }
    tree.innerHTML = warning + html;
}

function selectPattern(id) {
    _selectedPatternId = id;
    var p = _patterns.find(function(x) { return x.id === id; });
    renderTree();
    if (!p) return;
    var form = document.getElementById('motherEditForm');
    var html = '<div class="form-row"><div><label>套路 ID</label><input id="patternId" value="' + p.id + '" readonly></div>';
    html += '<div><label>稳定编号 key</label><input id="patternKey" value="' + escapeHtml(p.yaml_key || '') + '"></div></div>';
    html += '<div class="form-row"><div><label>所属板块</label><select id="patternCategory" onchange="fillCategorySelect(this)"></select></div>';
    html += '<div><label>套路名</label><input id="patternName" value="' + escapeHtml(p.name || '') + '"></div></div>';
    html += '<div class="form-row"><div><label>单题限时（秒）</label><input id="patternMaxTime" type="number" min="10" value="' + (p.max_time_seconds || 120) + '"></div><div></div></div>';
    html += '<div class="form-row one"><label>套路难度</label><select id="patternDifficulty">' + difficultyOptions(p.difficulty) + '</select></div>';
    html += '<div class="form-row one"><label>套路说明</label><textarea id="patternDesc">' + escapeHtml(p.description || '') + '</textarea></div>';
    html += '<div class="form-row one"><label>对应题目</label><div id="questionLinks"></div>';
    html += '<div class="add-question-row"><div class="question-search-wrap" style="flex:1;"><input id="newQuestionIdSearch" type="text" class="question-search-input" data-target-id="newQuestionId" data-results-id="newQuestionIdResults" placeholder="搜索并选择题目..." autocomplete="off"><input type="hidden" id="newQuestionId"><div id="newQuestionIdResults" class="question-search-results"></div></div>';
    html += '<select id="newQuestionRole"><option value="mother">母题</option><option value="variant1">变式1</option><option value="variant2">变式2</option><option value="variant3">变式3</option></select>';
    html += '<button class="mother-btn" onclick="linkQuestion(' + p.id + ')">挂载</button></div></div>';
    html += '<div class="form-actions">';
    html += '<button class="mother-btn" onclick="savePattern()">保存修改</button>';
    html += '<button class="mother-btn danger" onclick="deletePattern(' + p.id + ')">删除套路</button>';
    html += '</div>';
    form.innerHTML = html;
    var sel = document.getElementById('patternCategory');
    fillCategorySelect(sel);
    sel.value = p.category || '';
    renderQuestionLinks(p);
}

function renderQuestionLinks(p) {
    var box = document.getElementById('questionLinks');
    if (!box) return;
    var items = [];
    if (p.mother_id) items.push({role: 'mother', label: '母题', qid: p.mother_id});
    for (var i = 0; i < (p.variant_ids || []).length; i++) {
        items.push({role: 'variant' + (i + 1), label: '变式' + (i + 1), qid: p.variant_ids[i]});
    }
    if (!items.length) {
        box.innerHTML = '<div class="mother-empty" style="padding:6px;">暂无题目关联</div>';
        return;
    }
    box.innerHTML = items.map(function(it) {
        return '<div class="question-card" id="qcard-' + it.qid + '">' +
            '<div class="question-card-head"><span class="q-role">' + escapeHtml(it.label) + '</span>' +
            '<span class="qid">#' + it.qid + '</span>' +
            '<span class="q-meta question-card-loading">加载中...</span></div>' +
            '<div class="question-card-body">加载中...</div></div>';
    }).join('');
    items.forEach(function(it) {
        apiGet('/questions/' + it.qid).then(function(q) {
            var card = document.getElementById('qcard-' + it.qid);
            if (!card) return;
            if (!q || q.error) {
                card.innerHTML = '<div class="question-card-head"><span class="q-role">' + escapeHtml(it.label) + '</span><span class="qid">#' + it.qid + '</span><span class="q-meta" style="color:#c62828;">题目不存在</span></div>';
                return;
            }
            var meta = [];
            if (q.question_type) meta.push(q.question_type);
            if (q.category_level1) meta.push(q.category_level1);
            if (q.category_level2) meta.push(q.category_level2);
            if (q.difficulty_level) meta.push(q.difficulty_level);
            var aj = q.answer_json || {};
            var finalAnswer = aj.final_answer ? String(aj.final_answer) : '';
            if (!finalAnswer) {
                var crs = aj.chunk_results || [];
                var ans = [];
                for (var i = 0; i < crs.length; i++) {
                    if (crs[i] && crs[i].final_answer) ans.push(String(crs[i].final_answer));
                }
                finalAnswer = ans.join(' | ');
            }
            var html = '<div class="question-card-head"><span class="q-role">' + escapeHtml(it.label) + '</span>' +
                '<span class="qid">#' + it.qid + '</span>' +
                (meta.length ? '<span class="q-meta">' + escapeHtml(meta.join(' · ')) + '</span>' : '') +
                '<button class="q-remove" onclick="unlinkQuestion(' + p.id + ',' + it.qid + ',\'' + it.role + '\')">移除</button></div>' +
                '<div class="question-card-body">' + escapeHtml(q.content || '') + '</div>';
            if (finalAnswer) html += '<div class="question-card-ans"><span class="q-ans-label">答案</span>' + escapeHtml(finalAnswer) + '</div>';
            card.innerHTML = html;
            renderMath(card);
        }).catch(function(e) {
            var card = document.getElementById('qcard-' + it.qid);
            if (card) {
                card.innerHTML = '<div class="question-card-head"><span class="q-role">' + escapeHtml(it.label) + '</span><span class="qid">#' + it.qid + '</span><span class="q-meta" style="color:#c62828;">加载失败</span></div>';
            }
        });
    });
}

function newPattern() {
    _selectedPatternId = null;
    renderTree();
    var form = document.getElementById('motherEditForm');
    var html = '<div class="form-row"><div><label>母题（可选，之后可在关卡编辑添加）</label><div class="question-search-wrap"><input id="newMotherQuestionSearch" type="text" class="question-search-input" data-target-id="newMotherQuestionId" data-results-id="newMotherQuestionResults" placeholder="留空即可创建空套路，也可先搜索题目..." autocomplete="off"><input type="hidden" id="newMotherQuestionId"><div id="newMotherQuestionResults" class="question-search-results"></div></div></div>';
    html += '<div><label>稳定编号 key</label><input id="patternKey" placeholder="留空自动生成"></div></div>';
    html += '<div class="form-row"><div><label>所属板块</label><select id="patternCategory"></select></div>';
    html += '<div><label>套路名</label><input id="patternName" placeholder="如：直线与圆锥曲线联立"></div></div>';
    html += '<div class="form-row one"><label>套路难度</label><select id="patternDifficulty">' + difficultyOptions(1) + '</select></div>';
    html += '<div class="form-row one"><label>套路说明</label><textarea id="patternDesc" placeholder="这个套路考什么、怎么破题"></textarea></div>';
    html += '<div class="form-actions"><button class="mother-btn" onclick="createPattern()">创建套路</button></div>';
    form.innerHTML = html;
    fillCategorySelect(document.getElementById('patternCategory'));
    if (!_categories.length) loadCategories();
}

async function savePattern() {
    var id = parseInt(document.getElementById('patternId').value);
    var payload = {
        category: document.getElementById('patternCategory').value,
        name: document.getElementById('patternName').value.trim(),
        description: document.getElementById('patternDesc').value,
        key: document.getElementById('patternKey').value.trim() || null,
        max_time_seconds: parseInt(document.getElementById('patternMaxTime').value) || 120,
        difficulty: parseInt(document.getElementById('patternDifficulty').value) || 1
    };
    if (!payload.category || !payload.name) { setStatus('板块和套路名不能为空', true); return; }
    try {
        var r = await fetch('http://127.0.0.1:8000/patterns/' + id, {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
        var d = await r.json();
        if (d.error) throw new Error(d.detail || d.error);
        setStatus('已保存');
        await loadPatterns();
    } catch (e) { setStatus('保存失败：' + e.message, true); }
}

async function createPattern() {
    var qid = parseInt(document.getElementById('newMotherQuestionId').value) || null;
    var payload = {
        question_id: qid,
        category: document.getElementById('patternCategory').value,
        name: document.getElementById('patternName').value.trim(),
        key: document.getElementById('patternKey').value.trim() || null,
        description: document.getElementById('patternDesc').value,
        difficulty: parseInt(document.getElementById('patternDifficulty').value) || 1
    };
    if (!payload.category || !payload.name) { setStatus('板块和套路名不能为空', true); return; }
    try {
        var r = await fetch('http://127.0.0.1:8000/patterns/mother', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
        var d = await r.json();
        if (d.error) throw new Error(d.detail || d.error);
        setStatus('套路已创建');
        await loadPatterns();
        selectPattern(d.pattern_id);
    } catch (e) { setStatus('创建失败：' + e.message, true); }
}

async function linkQuestion(patternId) {
    var qid = parseInt(document.getElementById('newQuestionId').value);
    var role = document.getElementById('newQuestionRole').value;
    if (!qid) { setStatus('请搜索并选择题目', true); return; }
    try {
        var r = await fetch('http://127.0.0.1:8000/patterns/' + patternId + '/questions', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({question_id: qid, role: role})});
        var d = await r.json();
        if (d.error) throw new Error(d.detail || d.error);
        setStatus('题目已挂载');
        await loadPatterns();
        selectPattern(patternId);
    } catch (e) { setStatus('挂载失败：' + e.message, true); }
}

async function unlinkQuestion(patternId, questionId, role) {
    try {
        var url = 'http://127.0.0.1:8000/patterns/' + patternId + '/questions/' + questionId;
        if (role) url += '?role=' + encodeURIComponent(role);
        var r = await fetch(url, {method: 'DELETE'});
        if (!r.ok) throw new Error('移除失败');
        setStatus('已移除题目');
        await loadPatterns();
        selectPattern(patternId);
    } catch (e) { setStatus(e.message, true); }
}

async function deletePattern(patternId) {
    if (!confirm('确定删除这个套路吗？')) return;
    try {
        var r = await fetch('http://127.0.0.1:8000/patterns/' + patternId, {method: 'DELETE'});
        if (!r.ok) throw new Error('删除失败');
        _selectedPatternId = null;
        setStatus('套路已删除');
        await loadPatterns();
    } catch (e) { setStatus(e.message, true); }
}

async function exportYaml() {
    try {
        var r = await fetch('http://127.0.0.1:8000/patterns/export-yaml', {method: 'POST'});
        var d = await r.json();
        if (!d.exported) throw new Error(d.detail || '导出失败');
        setStatus('已定型导出到 patterns.yaml');
    } catch (e) { setStatus(e.message, true); }
}

function setStatus(msg, isError) {
    var el = document.getElementById('motherStatus');
    if (el) { el.textContent = msg; el.style.color = isError ? '#c62828' : '#2e7d32'; }
}

document.addEventListener('DOMContentLoaded', async function() {
    await loadCategories();
    await syncPatterns();
});
</script>
</body>
</html>
