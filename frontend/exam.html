    <script>
        var _examCartKey = 'exam_cart';
        var examState = {
            title: '试卷',
            subtitle: '',
            mode: 'student',
            optimizeBreaks: true,
            questions: []
        };

        // ---- Cart ----
        function getExamCart() {
            try {
                var raw = localStorage.getItem(_examCartKey);
                return raw ? JSON.parse(raw) : [];
            } catch(e) { return []; }
        }

        // ---- Load ----
        function loadExam() {
            var cart = getExamCart();
            if (cart.length === 0) {
                document.getElementById('examPreview').innerHTML =
                    '<div style="text-align:center;padding:80px 20px;color:#86868b;font-size:16px;">' +
                    '还没有加入题目<br><br>' +
                    '<a href="history.html" style="color:#0071e3;text-decoration:none;">→ 去个人题库选题</a></div>';
                document.getElementById('examQlist').innerHTML =
                    '<div style="text-align:center;padding:40px;color:#86868b;font-size:14px;">暂无题目</div>';
                return;
            }

            document.getElementById('examQlist').innerHTML =
                '<div style="text-align:center;padding:40px;color:#86868b;font-size:14px;">正在加载题目详情...</div>';

            var promises = cart.map(function(item) {
                return fetch('http://127.0.0.1:8000/questions/' + item.id)
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.error) return null;
                        return {
                            id: data.id,
                            content: data.content || '',
                            answer_json: data.answer_json || null,
                            category: data.category_level1 || '',
                            difficulty: data.difficulty_level || '',
                            source: data.source_type || '',
                            question_type: data.question_type || '',
                            settings: item.settings || {
                                blankHeight: 120,
                                showDifficulty: false,
                                showDetailedProcess: false,
                                showKnowledgePoints: true
                            }
                        };
                    })
                    .catch(function() { return null; });
            });

            Promise.all(promises).then(function(results) {
                examState.questions = results.filter(function(q) { return q !== null; });
                var loadedIds = {};
                examState.questions.forEach(function(q) { loadedIds[q.id] = true; });
                var cleanCart = getExamCart().filter(function(item) { return loadedIds[item.id]; });
                localStorage.setItem(_examCartKey, JSON.stringify(cleanCart));
                renderQuestionList();
                renderPreview();
            }).catch(function(err) {
                console.error('[exam] load failed:', err);
                document.getElementById('examQlist').innerHTML = '<div style="text-align:center;padding:40px;color:#c62828;font-size:14px;">加载失败，请确认后端已启动 (端口8000)</div>';
            });
        }

        // ---- Render Question List ----
        function renderQuestionList() {
            var container = document.getElementById('examQlist');
            var html = '';
            for (var i = 0; i < examState.questions.length; i++) {
                var q = examState.questions[i];
                var s = q.settings;
                // show raw content with KaTeX
                html += '<div class="exam-qitem" data-idx="' + i + '" draggable="true" ondragstart="onDragStart(event)" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragend="this.classList.remove(\'dragging\')">';
                html += '<div class="exam-qitem-header" onclick="toggleQItem(this)">';
                html += '<span class="exam-qitem-arrow">▶</span>';
                html += '<span class="exam-qitem-num">' + (i + 1) + '</span>';
                html += '<span class="exam-qitem-preview">' + formatChoiceQuestion(q.content || '') + '</span>';
                html += '<button class="exam-move-btn" onclick="event.stopPropagation();moveQuestion(' + i + ', -1)" title="上移">↑</button>';
                html += '<button class="exam-move-btn" onclick="event.stopPropagation();moveQuestion(' + i + ', 1)" title="下移">↓</button>';
                html += '<button class="exam-qitem-remove" onclick="event.stopPropagation();removeQ(' + i + ')" title="移除">✕</button>';
                html += '</div>';
                // Metadata tags
                var tags = [];
                if (q.question_type) tags.push('<span class="tag tag-type">' + escapeHtml(q.question_type) + '</span>');
                if (q.difficulty) tags.push('<span class="tag tag-' + (q.difficulty === '容易' ? 'easy' : q.difficulty === '中等' ? 'medium' : q.difficulty === '困难' ? 'hard' : 'extreme') + '">' + escapeHtml(q.difficulty) + '</span>');
                if (q.category) tags.push('<span class="tag tag-category">' + escapeHtml(q.category) + '</span>');
                if (q.source) {
                    var srcCls = 'tag-source';
                    if (q.source === 'ai生成') srcCls += ' tag-source-ai';
                    else if (q.source === '高考题') srcCls += ' tag-source-gaokao';
                    else if (q.source === '模拟题') srcCls += ' tag-source-monikao';
                    else if (q.source === '精选母题') srcCls += ' tag-source-muti';
                    tags.push('<span class="' + srcCls + '">' + escapeHtml(q.source) + '</span>');
                }
                if (tags.length > 0) {
                    html += '<div class="exam-qitem-meta" style="display:flex;gap:4px;flex-wrap:wrap;padding:2px 14px 6px;">' + tags.join('') + '</div>';
                }
                html += '<div class="exam-qitem-settings" style="display:none;">';
                html += '<div class="setting-row">';
                html += '<span class="setting-label">空白高度</span>';
                html += '<input type="range" class="setting-slider" min="10" max="1000" value="' + s.blankHeight + '" onchange="updateSetting(' + i + ',\'blankHeight\',this.value)">';
                html += '<input type="number" class="setting-input" min="10" max="1000" value="' + s.blankHeight + '" style="width:70px;padding:2px 6px;border:1px solid #c7c7cc;border-radius:6px;font-size:13px;text-align:center;" oninput="var r=this.parentNode;r.querySelector(\'.setting-slider\').value=this.value;" onchange="updateSetting(' + i + ',\'blankHeight\',this.value)">';
                html += '</div>';
                html += '<div class="setting-row">';
                html += '<span class="setting-label">难度标签</span>';
                html += '<input type="checkbox" class="setting-checkbox" ' + (s.showDifficulty ? 'checked' : '') + ' onchange="updateSetting(' + i + ',\'showDifficulty\',this.checked)">';
                html += '</div>';
                html += '<div class="setting-row">';
                html += '<span class="setting-label">详细过程</span>';
                html += '<input type="checkbox" class="setting-checkbox" ' + (s.showDetailedProcess ? 'checked' : '') + ' onchange="updateSetting(' + i + ',\'showDetailedProcess\',this.checked)">';
                html += '</div>';
                html += '<div class="setting-row">';
                html += '<span class="setting-label">知识点</span>';
                html += '<input type="checkbox" class="setting-checkbox" ' + (s.showKnowledgePoints ? 'checked' : '') + ' onchange="updateSetting(' + i + ',\'showKnowledgePoints\',this.checked)">';
                html += '</div>';
                html += '<div class="setting-row">';
                html += '<span class="setting-label">答题卡框</span>';
                html += '<input type="checkbox" class="setting-checkbox" ' + (s.showAnswerBox ? 'checked' : '') + ' onchange="updateSetting(' + i + ',\'showAnswerBox\',this.checked)">';
                html += '</div>';
                html += '</div></div>';
            }
            container.innerHTML = html;
            try { renderMathInElement(container, { delimiters: [{left: '$$', right: '$$', display: true},{left: '$', right: '$', display: false}], ignoredTags: [] }); } catch(e) {}
        }

        function toggleQItem(header) {
            var parent = header.parentElement;
            var settings = parent.querySelector('.exam-qitem-settings');
            if (!settings) return;
            var isOpen = settings.style.display !== 'none';
            settings.style.display = isOpen ? 'none' : 'block';
            var arrow = header.querySelector('.exam-qitem-arrow');
            if (arrow) arrow.classList.toggle('open', !isOpen);
        }

        function updateSetting(idx, key, value) {
            if (key === 'blankHeight') {
                examState.questions[idx].settings.blankHeight = parseInt(value);
                // Update the display value
                var input = document.querySelector('.exam-qitem[data-idx="' + idx + '"] .setting-input');
                if (input) input.value = value;
                var slider = document.querySelector('.exam-qitem[data-idx="' + idx + '"] .setting-slider-value');
                if (slider) slider.textContent = value + 'px';
            } else if (key === 'showDifficulty' || key === 'showDetailedProcess' || key === 'showKnowledgePoints' || key === 'showAnswerBox') {
                examState.questions[idx].settings[key] = value;
            }
            saveSettingsToCart();
            renderPreview();
        }

        function saveSettingsToCart() {
            var cart = getExamCart();
            for (var i = 0; i < cart.length; i++) {
                var q = examState.questions.find(function(qq) { return qq.id === cart[i].id; });
                if (q) {
                    cart[i].settings = q.settings;
                }
            }
            localStorage.setItem(_examCartKey, JSON.stringify(cart));
        }

        function removeQ(idx) {
            var q = examState.questions[idx];
            examState.questions.splice(idx, 1);
            // Also remove from cart
            var cart = getExamCart();
            cart = cart.filter(function(item) { return item.id !== q.id; });
            localStorage.setItem(_examCartKey, JSON.stringify(cart));
            renderQuestionList();
            if (examState.questions.length === 0) {
                document.getElementById('examPreview').innerHTML =
                    '<div style="text-align:center;padding:80px 20px;color:#86868b;font-size:16px;">' +
                    '还没有加入题目<br><br>' +
                    '<a href="history.html" style="color:#0071e3;text-decoration:none;">→ 去个人题库选题</a></div>';
            } else {
                renderPreview();
            }
        }

        function clearAll() {
            examState.questions = [];
            localStorage.setItem(_examCartKey, '[]');
            renderQuestionList();
            document.getElementById('examPreview').innerHTML =
                '<div style="text-align:center;padding:80px 20px;color:#86868b;font-size:16px;">' +
                '还没有加入题目<br><br>' +
                '<a href="history.html" style="color:#0071e3;text-decoration:none;">→ 去个人题库选题</a></div>';
        }

        // ---- Mode ----
        function setMode(mode) {
            examState.mode = mode;
            document.querySelectorAll('.exam-mode-btn').forEach(function(b) {
                b.classList.toggle('active', b.dataset.mode === mode);
            });
            renderPreview();
        }

        // ---- Settings Change ----
        function onSettingsChange() {
            examState.title = document.getElementById('examTitle').value || '试卷';
            examState.subtitle = document.getElementById('examSubtitle').value || '';
            renderPreview();
        }

                // ---- Render Preview ----
function renderPreview() {
            try {
            console.log('[exam] renderPreview called, qs:', examState.questions.length);
            var qs = examState.questions;
            if (qs.length === 0) return;
            var mode = examState.mode;
            var opt = examState.optimizeBreaks;
            
            var el = document.getElementById('examPreview');
            el.className = 'exam-preview mode-' + (mode || 'student');
            if (opt) {
                el.classList.add('frequent-breaks');
                el.classList.remove('no-breaks');
            } else {
                el.classList.remove('frequent-breaks');
                el.classList.add('no-breaks');
            }
            el.classList.add('paginated');
            el.innerHTML = '';
            
            // Inner wrapper so zoom scale does not shrink the scroll viewport
            var innerWrapper = document.createElement('div');
            innerWrapper.id = 'examPreviewInner';
            el.appendChild(innerWrapper);
            
            // ---- Page management ----
            var curPage = null;
            var nextMustNewPage = false;
            var PH = 1123;  // A4 height in px
            
            function newPage() {
                var p = document.createElement('div');
                p.className = 'a4-page';
                p.style.overflow = 'visible';
                innerWrapper.appendChild(p);
                return p;
            }
            curPage = newPage();
            
            // ---- Append content with real DOM measurement ----
            function appendHtml(html) {
                var tmp = document.createElement('div');
                tmp.innerHTML = html;
                var children = Array.from(tmp.children);
                if (children.length === 0) {
                    curPage.innerHTML += html;
                    // Measure the added text
                    var pRect = curPage.getBoundingClientRect();
                    var added = curPage.lastChild;
                    if (added) {
                        var aRect = added.getBoundingClientRect();
                        if (aRect.bottom > pRect.top + PH) {
                            nextMustNewPage = true;
                        } else if (pRect.top + PH - aRect.bottom < 3) {
                            nextMustNewPage = true;
                        }
                    }
                    return;
                }
                for (var ci = 0; ci < children.length; ci++) {
                    if (nextMustNewPage) {
                        curPage = newPage();
                        nextMustNewPage = false;
                    }
                    curPage.appendChild(children[ci]);
                    var pRect = curPage.getBoundingClientRect();
                    var cRect = children[ci].getBoundingClientRect();
                    // Overflow check
                    if (cRect.bottom > pRect.top + PH) {
                        curPage.removeChild(children[ci]);
                        curPage = newPage();
                        curPage.appendChild(children[ci]);
                        pRect = curPage.getBoundingClientRect();
                        cRect = children[ci].getBoundingClientRect();
                    }
                    // 3px rule
                    var remaining = (pRect.top + PH) - cRect.bottom;
                    if (remaining < 30) {
                        nextMustNewPage = true;
                    }
                }
            }
            
            
            // ---- Title ----
            var title = examState.title || '试卷', subtitle = examState.subtitle || '';
            appendHtml(
                '<div class="preview-header"><div class="preview-title">' + escapeHtml(title) +
                '</div>' + (subtitle ? '<div class="preview-subtitle">' + escapeHtml(subtitle) + '</div>' : '') +
                '</div><hr class="preview-divider">'
            );
            
            // ---- Questions ----
            for (var i = 0; i < qs.length; i++) {
                var q = qs[i], s = q.settings, cr = q.answer_json && q.answer_json.chunk_results;
                
                // Question number + content
                appendHtml(
                    '<div style="font-weight:600;margin-bottom:6px;white-space:pre-line;">' + (i + 1) + '. ' + formatChoiceQuestion(q.content || '') + '</div>'
                );
                
                if (mode === 'teacher' && cr) {
                    // Teacher: each step individually with real measurement
                    for (var ci = 0; ci < cr.length; ci++) {
                        var ch = cr[ci], st = ch.steps || [];
                        for (var si = 0; si < st.length; si++) {
                            var sw = st[si].standard_writing || '';
                            var stepHtml = '<div class="teacher-process"><div>' + sw + '</div></div>';
                            if (st[si].knowledge_point && s.showKnowledgePoints) {
                                stepHtml += '<div class="teacher-kp">知识点：' + escapeHtml(st[si].knowledge_point) + '</div>';
                            }
                            appendHtml(stepHtml);
                        }
                        if (s.showDifficulty && ch.difficulty) {
                            appendHtml('<div class="teacher-difficulty">难度：' + ch.difficulty.level + '</div>');
                        }
                        if (ch.final_answer) {
                            appendHtml('<div style="margin-top:6px;">答案：' + ch.final_answer + '</div>');
                        }
                    }
                } else {
                    // Student: blank area
                    var bh = Math.max(s.blankHeight || 200, 10);
                    if (s.showAnswerBox) {
                        var boxMargin = opt ? 80 : 40;
                        var pRect = curPage.getBoundingClientRect();
                        var lastChild = curPage.lastElementChild;
                        var remain;
                        if (lastChild) {
                            var lRect = lastChild.getBoundingClientRect();
                            remain = (pRect.top + PH) - lRect.bottom;
                        } else {
                            remain = PH;
                        }
                        var labelHtml = '<div style="position:absolute;bottom:0;left:0;right:0;text-align:center;font-weight:700;font-size:6pt;font-family:SimHei;">超出答题区域的答案无效</div>';
                        if (bh + boxMargin > remain) {
                            var box1 = Math.max(remain - boxMargin, 10);
                            var box2 = Math.max(bh - box1, 10);
                            appendHtml("<div class=\"answer-box-container\"><div class=\"answer-box\" style=\"height:" + box1 + "px;position:relative;\">" + labelHtml + "</div></div>");
                            nextMustNewPage = true;
                            appendHtml("<div class=\"answer-box-container\"><div class=\"answer-box\" style=\"height:" + box2 + "px;position:relative;\">" + labelHtml + "</div></div>");
                        } else {
                            appendHtml("<div class=\"answer-box-container\"><div class=\"answer-box\" style=\"height:" + bh + "px;position:relative;\">" + labelHtml + "</div></div>");
                        }
                    } else {
                        appendHtml(
                            '<div class="student-blank" style="min-height:' + bh + 'px;"></div>'
                        );
                    }
                }
                
                // 150px rule (student + opt, after question completes)
                if (mode === 'student' && opt) {
                    var lastCh = curPage.lastElementChild;
                    if (lastCh) {
                        var pR = curPage.getBoundingClientRect();
                        var lR = lastCh.getBoundingClientRect();
                        var remain = (pR.top + PH) - lR.bottom;
                        if (remain < 300) {
                            curPage = newPage();
                        }
                    }
                }
                
            }
            
            // ---- Answers section (student mode) ----
            // Set overflow hidden after all content is placed
            var allPages = el.querySelectorAll('.a4-page');
            for (var pi = 0; pi < allPages.length; pi++) {
                allPages[pi].style.overflow = 'hidden';
            }
            
            // KaTeX rendering
            try { renderMathInElement(el, { delimiters: [{left: '$$', right: '$$', display: true},{left: '$', right: '$', display: false}], ignoredTags: [] }); } catch(e) {}
            // Re-apply zoom to fit current width
            zoomReset();
        } catch(e) {
            console.error("[exam] renderPreview error:", e);
        }
        }
        function showExportOverlay(text) {
            document.getElementById('exportOverlay').style.display = 'flex';
            document.getElementById('exportText').textContent = text || '请稍候';
            document.getElementById('exportSpinner').style.display = 'block';
        }

        function hideExportOverlay() {
            document.getElementById('exportOverlay').style.display = 'none';

        }
        function checkHtml2Pdf() {
            if (typeof html2pdf === "undefined") {
                return false;
            }
            return true;
        }

        async function exportStudentPDF() {
            setMode('student');
            await new Promise(function(r) { setTimeout(r, 600); });
            await exportPDF('学生版');
        }
        async function exportTeacherPDF() {
            setMode('teacher');
            await new Promise(function(r) { setTimeout(r, 600); });
            await exportPDF('教师版');
        }
        async function exportPDF(modeLabel) {
            var qs = examState.questions;
            if (!checkHtml2Pdf()) { alert("PDF库加载失败，请刷新页面重试"); return; }
            if (qs.length === 0) { alert('请先加入题目'); return; }

            showExportOverlay('正在生成PDF，请稍候...');

            // Wait a moment for KaTeX to finish rendering
            await new Promise(function(resolve) { setTimeout(resolve, 500); });

            var element = document.querySelector('.exam-preview');
            if (!element) {
                hideExportOverlay();
                alert('生成失败，请重试');
                return;
            }

            var titleBase = (examState.title || "试卷").replace(/[\/\\?%*:|"<>]/g, "_");
            var title = titleBase + (modeLabel ? "_" + modeLabel : "");

            var opt = {
                margin: 0,
                filename: title + '.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    letterRendering: true,
                    width: 794
                },
                jsPDF: {
                    unit: 'px',
                    format: [794, 1123],
                    orientation: 'portrait'
                },
                pagebreak: {
                    mode: ['avoid-all', 'css', 'legacy'],
                    before: '.answer-page-title'
                }
            };

            try {
                document.getElementById('exportTitle').textContent = '正在生成PDF...';
                // Toggle overflow for full capture
                var a4p = element.querySelectorAll('.a4-page');
                for (var ip = 0; ip < a4p.length; ip++) {
                    a4p[ip].style.overflow = 'visible';
                    a4p[ip].style.height = 'auto';
                    a4p[ip].style.border = "none"; a4p[ip].style.boxShadow = "none"; a4p[ip].style.marginBottom = "0";
                }
                await html2pdf().set(opt).from(element).save();
                // Restore
                for (var ip = 0; ip < a4p.length; ip++) {
                    a4p[ip].style.overflow = 'hidden';
                    a4p[ip].style.border = ""; a4p[ip].style.boxShadow = ""; a4p[ip].style.marginBottom = "";
                    a4p[ip].style.height = '';
                }
                document.getElementById('exportTitle').textContent = '导出成功';
                document.getElementById('exportText').textContent = '文件已下载';

            } catch (err) {
                // Restore on error too
                var a4p2 = element.querySelectorAll('.a4-page');
                for (var ip = 0; ip < a4p2.length; ip++) {
                    a4p2[ip].style.border = ""; a4p2[ip].style.boxShadow = ""; a4p2[ip].style.marginBottom = "";
                    a4p2[ip].style.overflow = 'hidden';
                    a4p2[ip].style.height = '';
                }
                console.error('PDF export error:', err);

                document.getElementById('exportTitle').textContent = '导出失败，尝试打印方式...';
                document.getElementById('exportText').textContent = err.message || '未知错误';
                // Fallback: window.print
                await new Promise(function(resolve) { setTimeout(resolve, 1000); });
                try { window.print(); } catch(e2) {}
            }
            hideExportOverlay();
        }



        // ---- Zoom ----
        var _zoomLevel = 1.0;
        function zoomIn() { _zoomLevel = Math.min(_zoomLevel + 0.1, 2.0); applyZoom(); }
        function zoomOut() { _zoomLevel = Math.max(_zoomLevel - 0.1, 0.3); applyZoom(); }
        function zoomReset() { 
            var mw = document.querySelector('.exam-main')?.clientWidth;
            if (!mw) return;
            var aw = mw - 80;
            _zoomLevel = Math.min(aw / 794, 2.0);
            applyZoom();
        }
        function applyZoom() {
            var label = document.getElementById('zoomLabel');
            var el = document.getElementById('examPreviewInner');
            if (!el) return;
            el.style.transformOrigin = 'top center';
            el.style.transform = 'scale(' + _zoomLevel + ')';
            if (label) label.textContent = Math.round(_zoomLevel * 100) + '%';
        }

        // ---- Utils ----
        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function formatChoiceQuestion(text) {
            if (!text) return '';
            var s = String(text).replace(/\r\n/g, '\n');
            s = s.replace(/(?<![A-Za-z0-9$])([A-H])\s*[.．、)]\s*/g, '\n$1. ');
            var lines = s.split('\n');
            var out = [];
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) continue;
                out.push(line);
            }
            return out.join('\n');
        }

        // ---- Init ----
        var _dragSrcIdx = -1;
        var _lastHoverIdx = -1;
        function onDragStart(e) {
            _dragSrcIdx = parseInt(e.currentTarget.dataset.idx);
            _lastHoverIdx = _dragSrcIdx;
            e.dataTransfer.effectAllowed = "move";
            e.currentTarget.classList.add("dragging");
        }
        function onDragOver(e) {
            e.preventDefault();
            if (_dragSrcIdx < 0) return;
            var targetEl = e.currentTarget;
            var tIdx = parseInt(targetEl.dataset.idx);
            if (tIdx === _lastHoverIdx) return;
            _lastHoverIdx = tIdx;
            var srcEl = document.querySelector(".exam-qitem.dragging");
            if (!srcEl) return;
            var sIdx = parseInt(srcEl.dataset.idx);
            var tmp = examState.questions[sIdx];
            examState.questions[sIdx] = examState.questions[tIdx];
            examState.questions[tIdx] = tmp;
            var parent = srcEl.parentNode;
            if (tIdx > sIdx) {
                parent.insertBefore(srcEl, targetEl.nextSibling);
            } else {
                parent.insertBefore(srcEl, targetEl);
            }
            var items = parent.querySelectorAll(".exam-qitem");
            for (var ii = 0; ii < items.length; ii++) {
                items[ii].dataset.idx = ii;
            }
            _dragSrcIdx = tIdx;
        }
        function onDrop(e) {
            e.preventDefault();
            _dragSrcIdx = -1; _lastHoverIdx = -1;
            document.querySelectorAll(".exam-qitem.dragging").forEach(function(el) { el.classList.remove("dragging"); });
            var cart = getExamCart();
            var newCart = [];
            for (var ci = 0; ci < examState.questions.length; ci++) {
                var found = cart.find(function(c) { return c.id === examState.questions[ci].id; });
                if (found) newCart.push(found);
            }
            localStorage.setItem(_examCartKey, JSON.stringify(newCart));
            renderQuestionList();
            renderPreview();
            zoomReset();
        }        function moveQuestion(idx, direction) {
            var newIdx = idx + direction;
            if (newIdx < 0 || newIdx >= examState.questions.length) return;
            var tmp = examState.questions[idx];
            examState.questions[idx] = examState.questions[newIdx];
            examState.questions[newIdx] = tmp;
            var cart = getExamCart();
            var newCart = [];
            for (var i = 0; i < examState.questions.length; i++) {
                var existing = cart.find(function(c) { return c.id === examState.questions[i].id; });
                if (existing) newCart.push(existing);
            }
            localStorage.setItem(_examCartKey, JSON.stringify(newCart));
            renderQuestionList();
            renderPreview();
            zoomReset();
        }

window.addEventListener("resize", function() { zoomReset(); });
        document.addEventListener('DOMContentLoaded', function() {
            // Safari: prevent page-level scrolling by targeting the root element
            document.documentElement.style.overflow = 'hidden';
            document.documentElement.style.height = '100%';
            loadExam();
        });

    if(Array.isArray(kps)) return kps;
    try{var p=JSON.parse(kps);return Array.isArray(p)?p:[];}catch(e){return [];}
}
