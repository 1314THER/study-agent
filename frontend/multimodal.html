<script>
var _questions = [];
var _sessions = {};
var _selectedIdx = -1;
var _errorDialogState = {};
var MAX_CONCURRENT = 7;
var _sessionTimers = {};

async function applyLimits() {
    try {
        var r = await fetch('http://127.0.0.1:8000/settings');
        var d = await r.json();
        var lim = (d && d.limits) || {};
        if (lim.multimodal_concurrency) {
            var n = parseInt(lim.multimodal_concurrency, 10);
            if (!isNaN(n)) MAX_CONCURRENT = Math.max(1, Math.min(20, n));
        }
    } catch (e) {}
}

var _teacherGradients = {
    liangliang:'linear-gradient(90deg,#ca8a04,#fbbf24)',
    taotao:'linear-gradient(90deg,#db2777,#f472b6)',
    xuefeng:'linear-gradient(90deg,#7c3aed,#a78bfa)',
    ji:'linear-gradient(90deg,#16a34a,#4ade80)'
};
var _pendingFiles = [];
var _filePreviewUrls = [];
var teacherNames = {liangliang:'梁梁',taotao:'韬韬',xuefeng:'雪峰',ji:'鸡'};
var STORAGE_KEY = 'multimodal_state';

function safeParseMeta(m){
    if(m && typeof m === 'object') return m;
    if(!m) return {};
    try{var p=JSON.parse(m);return (p && typeof p === 'object') ? p : {};}catch(e){return {};}
}
function sourceMetaText(sourceType, sourceMeta){
    var m = safeParseMeta(sourceMeta);
    if(sourceType === '模拟题' || sourceType === '高考题'){
        var no = m.question_no ? '第' + m.question_no + '题' : '';
        if(m.paper && no) return m.paper + '·' + no;
        return m.paper || no;
    }
    if(sourceType === 'ai生成') return m.reference_id ? '参考题 #' + m.reference_id : '';
    if(sourceType === '精选母题'){
        var owner = m.owner || 'sqz';
        var txt = owner;
        if (m.pattern) txt += '·' + m.pattern;
        if (m.category) txt += ' · ' + m.category;
        if (m.mother_id) txt += ' · 母题 #' + m.mother_id;
        return txt;
    }
    return '';
}
function getRememberedSource(){
    try{var raw = localStorage.getItem('remembered_question_source'); return raw ? JSON.parse(raw) : null;}catch(e){return null;}
}
function saveRememberedSource(data){ localStorage.setItem('remembered_question_source', JSON.stringify(data)); }
function clearRememberedSource(){ localStorage.removeItem('remembered_question_source'); }

function sourceFieldsHtml(sourceType, sourceMeta, prefix){
    var m = safeParseMeta(sourceMeta) || {};
    var html = '<div class="source-meta-fields" id="' + prefix + '_fields">';
    if (sourceType === '模拟题' || sourceType === '高考题') {
        html += '<div class="source-meta-field"><label>卷子名字</label>';
        html += '<input type="text" id="' + prefix + '_paper" placeholder="如：' + (sourceType === '高考题' ? '2025一卷' : '巴蜀中学2026.12月考') + '" maxlength="60" value="' + escapeHtml(m.paper || '') + '"></div>';
        html += '<div class="source-meta-field"><label>题号</label>';
        html += '<input type="text" id="' + prefix + '_no" placeholder="如：7" maxlength="20" value="' + escapeHtml(m.question_no || '') + '"></div>';
    } else if (sourceType === 'ai生成') {
        html += '<div class="source-meta-field"><label>参考题目ID</label>';
        html += '<input type="text" id="' + prefix + '_ref" placeholder="参考题目ID" maxlength="30" value="' + escapeHtml(m.reference_id || '') + '"></div>';
    } else if (sourceType === '精选母题') {
        html += '<div class="source-meta-field"><label>所属板块</label>';
        html += '<select id="' + prefix + '_category" class="mother-category-select"><option value="">加载中...</option></select></div>';
        html += '<div class="source-meta-field"><label>套路名</label>';
        html += '<input type="text" id="' + prefix + '_pattern" placeholder="如：直线与圆锥曲线联立" maxlength="50" value="' + escapeHtml(m.pattern || '') + '"></div>';
        html += '<div class="source-meta-field"><label>来源署名</label>';
        html += '<input type="text" id="' + prefix + '_owner" placeholder="sqz" maxlength="30" value="' + escapeHtml(m.owner || 'sqz') + '"></div>';
        html += '<div class="source-meta-field"><label>母题ID</label>';
        html += '<input type="text" id="' + prefix + '_mid" placeholder="母题ID" maxlength="30" value="' + escapeHtml(m.mother_id || '') + '"></div>';
    } else {
        html += '<p class="source-meta-hint">选择来源后填写二级标签</p>';
    }
    html += '</div>';
    return html;
}
function collectSourceFields(sourceType, prefix){
    var m = {};
    if (sourceType === '模拟题' || sourceType === '高考题') {
        var paper = document.getElementById(prefix + '_paper');
        var no = document.getElementById(prefix + '_no');
        if (paper && paper.value.trim()) m.paper = paper.value.trim();
        if (no && no.value.trim()) m.question_no = no.value.trim();
    } else if (sourceType === 'ai生成') {
        var ref = document.getElementById(prefix + '_ref');
        if (ref && ref.value.trim()) m.reference_id = ref.value.trim();

function onTextPaste(e){
    var cd=e.clipboardData||window.clipboardData;
    if(!cd||!cd.items)return;
    var files=[];
    for(var i=0;i<cd.items.length;i++){
        var it=cd.items[i];
        if(it.kind==='file'){
            var f=it.getAsFile();
            if(f)files.push(f);
        }
    }
    if(files.length===0)return;
    e.preventDefault();
    addPendingFiles(files);
}
function getSupportedExts(){return ['.pdf','.jpg','.jpeg','.png','.docx','.txt'];}
function addPendingFiles(files){
    var exts=getSupportedExts();
    var added=0;
    for(var i=0;i<files.length;i++){
        var f=files[i];
        var name=f.name||('粘贴文件 '+(i+1));
        var dot=name.lastIndexOf('.');
        var ext=dot>=0?name.substring(dot).toLowerCase():'';
        if(exts.indexOf(ext)<0){showToast('不支持的文件格式：'+name,'info');continue;}
        var dup=_pendingFiles.some(function(x){return x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified;});
        if(dup)continue;
        _pendingFiles.push(f);added++;
    }
    if(added>0){renderFilePreview();showToast('已添加 '+added+' 个文件，可继续添加或点击"开始解析"','success');}
}
function removePendingFile(idx){
    if(idx>=0&&idx<_pendingFiles.length)_pendingFiles.splice(idx,1);
    renderFilePreview();
    if(_pendingFiles.length===0)showToast('已移除全部文件','info');
}
function renderFilePreview(){
    var preview=document.getElementById('filePreview');
    var list=document.getElementById('fileList');
    if(!preview||!list)return;
    for(var i=0;i<_filePreviewUrls.length;i++){try{URL.revokeObjectURL(_filePreviewUrls[i]);}catch(e){}}
    _filePreviewUrls=[];
    if(_pendingFiles.length===0){preview.style.display='none';return;}
    list.innerHTML='';
    for(var j=0;j<_pendingFiles.length;j++){
        (function(f,idx){
            var item=document.createElement('div');
            item.style.cssText='position:relative;width:84px;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:6px;text-align:center;';
            var bodyHtml;
            if(f.type&&f.type.indexOf('image/')===0){
                var url=URL.createObjectURL(f);_filePreviewUrls.push(url);
                bodyHtml='<img src="'+url+'" alt="" style="width:70px;height:52px;object-fit:cover;border-radius:6px;background:#f5f5f7;">';
            }else{
                bodyHtml='<div style="width:70px;height:52px;display:flex;align-items:center;justify-content:center;background:#f0f7ff;border-radius:6px;font-size:24px;">📄</div>';
            }
            item.innerHTML='<div style="position:absolute;top:2px;right:2px;"><button onclick="removePendingFile('+idx+')" title="移除" style="width:20px;height:20px;border:none;border-radius:50%;background:#c62828;color:#fff;font-size:11px;cursor:pointer;line-height:1;">✕</button></div>'+
                bodyHtml+
                '<div title="'+escapeHtml(f.name)+'" style="font-size:11px;color:#515154;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px;">'+escapeHtml(f.name)+'</div>';
            list.appendChild(item);
        })(_pendingFiles[j],j);
    }
    preview.style.display='block';

function onDropZoneDragOver(e){

}
function onDropZoneDrop(e){

// ---- Timer ----
function startTimer(idx) {
    var start = Date.now();
    if (_sessionTimers[idx]) clearInterval(_sessionTimers[idx]);
    var added = false;
    _sessionTimers[idx] = setInterval(function(){
        var elapsed = Math.floor((Date.now() - start) / 1000);
        var body = document.getElementById('session_body_'+idx);
        if (!body) { clearInterval(_sessionTimers[idx]); return; }
        var tEl = body.querySelector('.mm-progress-timer');
        if (!tEl) return;
        if (elapsed > 180) {
            tEl.textContent = '已思考 ' + elapsed + 's';
            if (!added) {
                added = true;
                var txt = body.querySelector('.mm-progress-text');
                if (txt) txt.innerHTML += '<br>你做不过我你信吗';
            }
        } else {
            tEl.textContent = '已思考 ' + elapsed + 's / 180s';
        }
    }, 1000);
}
function stopTimer(idx) {
    if (_sessionTimers[idx]) { clearInterval(_sessionTimers[idx]); delete _sessionTimers[idx]; }
}

function showToast(msg, type) {

    var t = document.createElement('div');

    t.textContent = msg;

    requestAnimationFrame(function() { t.classList.add('show'); });
    setTimeout(function() { t.classList.remove('show'); setTimeout(function(){t.remove();}, 300); }, 2000);
}

async function uploadFiles(files){
    if(!files||files.length===0)return;
    document.getElementById('mmLoading').style.display='block';
    document.querySelector('.mm-upload-zone').style.display='none';
    var allQuestions=[];
    var loadingText=document.querySelector('#mmLoading div:last-child');
    for(var i=0;i<files.length;i++){
        var f=files[i];
        if(loadingText)loadingText.textContent=files.length>1?'正在解析 ('+(i+1)+'/'+files.length+') '+f.name+'...':'正在解析 '+f.name+'，请稍候...';
        try{
            var fd=new FormData();fd.append('file',f);
            var r=await fetch('http://127.0.0.1:8000/multimodal/parse',{method:'POST',body:fd});
            var data=await r.json();
            if(data.error){alert('文件 "'+f.name+'" 解析失败: '+data.error);continue;}
            allQuestions=allQuestions.concat(data.questions||[]);
        }catch(err){alert('文件 "'+f.name+'" 上传失败: '+err.message);}
    }
    document.getElementById('mmLoading').style.display='none';
    if(loadingText)loadingText.textContent='正在解析题目，请稍候...';
    _pendingFiles=[];renderFilePreview();
    allQuestions=allQuestions.map(function(q,qi){if(typeof q.latex!=='string')q.latex='';q.index=qi+1;return q;});
    if(allQuestions.length===0){resetUpload();return;}
    _questions=allQuestions;_sessions={};_selectedIdx=-1;
    document.getElementById('mmUploadArea').style.display='none';
    document.getElementById('mmSolveArea').style.display='block';
    document.documentElement.style.overflow='hidden';
    document.getElementById('mmTitle').textContent='共 '+_questions.length+' 道题';

// ---- Persistence ----
function saveState(){
    var s = {questions:_questions,selectedIdx:_selectedIdx};
    s.sessions={};
    for(var k in _sessions){
        var ss=_sessions[k];
        s.sessions[k]={latex:ss.latex,done:ss.done,data:ss.data,solving:ss.solving,autoSave:ss.autoSave};
    }
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s));}catch(e){}
}

function restoreState(){
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return false;
    try{
        var s=JSON.parse(raw);
        if(!s.questions||s.questions.length===0)return false;
        _questions=s.questions; _sessions=s.sessions||{}; _selectedIdx=-1;
        document.getElementById('mmUploadArea').style.display='none';
        document.getElementById('mmSolveArea').style.display='block';
        document.getElementById('mmTitle').textContent='共 '+_questions.length+' 道题';
        renderQuestionList();
        // Restore sessions
        for(var k in _sessions){
                var si=parseInt(k);
                if(_sessions[si]){
                    if(!_sessions[si].done){
                        _sessions[si].solving=false;
                        _sessions[si].collapsed=false;
                    }else{
                        _sessions[si].collapsed=true;
                    }
                    createSessionEl(si);
                }
            }
        return true;
    }catch(e){return false;}
}

function createSessionEl(idx){
    if(!document.getElementById('session_'+idx)){
        var q=_questions[idx];if(!q)return;
        var sessionsEl=document.getElementById('mmSessions');
        var empty=sessionsEl.querySelector('.mm-empty');if(empty)empty.style.display='none';
        var div=document.createElement('div');div.className='mm-session';div.id='session_'+idx;
        _sessions[idx]=_sessions[idx]||{};

div.innerHTML='<div class="mm-session-header" onclick="toggleSessionCollapse('+idx+')"><span class="mm-collapse-arrow">\u25bc</span><span>题'+(idx+1)+'</span></div><div class="mm-session-body" id="session_body_'+idx+'"></div><div class="mm-compact-view" id="compact_'+idx+'" style="display:none"></div>';
        // Insert in numeric order
        var insertBefore=null;
        for(var ni=0;ni<_questions.length;ni++){
            var nx=document.getElementById('session_'+ni);
            if(nx&&ni>idx){insertBefore=nx;break;}
        }
        if(insertBefore)sessionsEl.insertBefore(div,insertBefore);
        else sessionsEl.appendChild(div);
    }
    _sessions[idx]=_sessions[idx]||{latex:_questions[idx]?._latex,autoSave:true,solving:false,done:false,data:null};
    renderPreview(idx);
    // Already-done sessions: collapse
    if(_sessions[idx]&&_sessions[idx].done){
        var bodyEl=document.getElementById('session_body_'+idx);
        var compEl=document.getElementById('compact_'+idx);
        var arrowEl=document.querySelector('#session_'+idx+' .mm-collapse-arrow');
        if(bodyEl)bodyEl.style.display='none';
        if(compEl)compEl.style.display='block';
        if(arrowEl)arrowEl.textContent='\u25b6';
    }
}

function renderPreview(idx){
    var q=_questions[idx];if(!q)return;
    var s=_sessions[idx]={...(_sessions[idx]||{}),latex:q.latex,autoSave:_sessions[idx]?.autoSave!==false};
    var ss=s.solving;var done=s.done;
    if(done){renderSessionResult(idx,s.data);return;}
    if(ss){/* show progress only */return;}

    var html='<div class="mm-preview-section">';
    html+='<div class="mm-preview-rendered" id="preview_'+idx+'">'+escapedLatex(q.latex)+'</div>';
    html+='<div class="mm-edit-area"><textarea id="edit_'+idx+'" oninput="onEditLatex('+idx+')">'+escapeHtml(q.latex)+'</textarea></div>';
    html+='</div>';
    html+='<div class="mm-actions">';
    html+='<span style="font-size:13px;color:#86868b;">老师：</span><select id="teacher_'+idx+'" onchange="changeTeacher('+idx+',this.value)">';
    var ts=['liangliang','taotao','xuefeng','ji'];var tn={liangliang:'梁梁',taotao:'韬韬',xuefeng:'雪峰',ji:'鸡'};

// ---- Solve Pipeline ----
async function startSingleSolve(idx){
    var q=_questions[idx];if(!q)return;
    createSessionEl(idx);
    _sessions[idx]=_sessions[idx]||{};
    _sessions[idx].solving=true;_sessions[idx].done=false;_sessions[idx].data=null;saveState();
    renderProgress(idx,0,'准备中...');
    var teacher=q.recommended_teacher||'liangliang';
    var autoSave=document.getElementById('autoSave_'+idx)?.checked!==false;
    var question=q.latex;

    try{
        _sessions[idx].saved=false;startTimer(idx);
        // Step 1
        renderProgress(idx,13,'\u6b65\u9aa4 1/3: \u6b63\u5728\u601d\u8003...',0);
        var r1=await fetch('http://127.0.0.1:8000/solve/step1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,question_type:'',teacher})});
        var d1=await r1.json();
        if(d1.error)throw new Error(d1.detail||d1.status||'无法解答');

        // Step 2
        renderProgress(idx,78,'\u6b65\u9aa4 2/3: \u6b63\u5728\u5206\u7c7b\u77e5\u8bc6\u70b9...',d1.token_usage?.total_tokens);
        var r2=await fetch('http://127.0.0.1:8000/solve/step2',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,content:d1.content,category:d1.category||null,question_type:'',teacher})});
        var d2=await r2.json();
        if(d2.error)throw new Error('无法分类');

        // Step 3
        renderProgress(idx,91,'\u6b65\u9aa4 3/3: \u6b63\u5728\u68c0\u67e5...',d2.token_usage?.total_tokens);
        var r3=await fetch('http://127.0.0.1:8000/solve/step3',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,chunk_results:JSON.stringify(d2.chunk_results),teacher,save:false,content:d1.content,category:d1.category||null,question_type:''})});
        var d3=await r3.json();
        if(d3.error&&!d3.chunk_results)throw new Error('无法完成');

        renderProgress(idx,100,'\u5b8c\u6210');
        _sessions[idx].solving=false;_sessions[idx].done=true;_sessions[idx].data=d3;
        // If user selected a type that differs from result, save override
        var userType=document.getElementById('type_'+idx)?.value;
        if(userType&&autoSave){
            var overrideData=JSON.parse(JSON.stringify(d3));
            overrideData.question_type=userType;
            if(overrideData.chunk_results&&overrideData.chunk_results[0])overrideData.chunk_results[0].chunk_type=userType;
            try{
                var overridePayload={question:_questions[idx].latex,answer_json:overrideData};
                if(_questions[idx].source_type)overridePayload.source_type=_questions[idx].source_type;
                if(_questions[idx].source_meta)overridePayload.source_meta=_questions[idx].source_meta;
                var saveResp=await fetch('http://127.0.0.1:8000/questions/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(overridePayload)});
                var saveData=await saveResp.json();
                if(saveData.id){_sessions[idx].saved=true;_sessions[idx].data.saved_question_id=saveData.id;}
            }catch(e){}
        }
        // 维持第一次的题型判断，不覆盖
        var userType=document.getElementById('type_'+idx)?.value;
        if (!_questions[idx].question_type && userType) {
            _questions[idx].question_type = userType;
        }
        saveState();
        renderSessionResult(idx,d3,autoSave);
        renderQuestionList();
    }catch(err){
        _sessions[idx].solving=false;saveState();
        updateSessionBody(idx,'<div class="mm-session-error" style="color:#c62828;padding:16px;">解题失败: '+escapeHtml(err.message||'未知错误')+'</div>');
    }
}

function renderProgress(idx,pct,msg,tokens){
    var body=document.getElementById('session_body_'+idx);if(!body)return;
    var q=_questions[idx];
    var teacher=q&&q.recommended_teacher;
    var tn=teacherNames[teacher]||'';
    var grad=_teacherGradients[teacher]||'linear-gradient(90deg,#0071e3,#00a2ff)';
    var tcolor={'liangliang':'#ca8a04','taotao':'#db2777','xuefeng':'#7c3aed','ji':'#16a34a'}[teacher]||'#0071e3';
    var h='<div class="mm-preview-rendered" style="margin-bottom:8px;background:#fff;border:1px solid #e0e0e0;border-radius:10px;">'+escapedLatex(q?q.latex:'')+'</div>';
    h+='<div class="mm-progress-area"><div class="mm-progress-bar"><div class="mm-progress-fill" style="width:'+pct+'%;background:'+grad+'"></div></div>';
    h+='<div class="mm-progress-pct" style="color:'+tcolor+'">'+Math.round(pct)+'%</div>';
    h+='<div class="mm-progress-text">'+tn+' '+escapeHtml(msg)+'</div>';
    h+='<div class="mm-progress-timer" style="color:'+tcolor+'">\u5df2\u601d\u8003 0s / 180s</div>';
    if(tokens!==undefined)h+='<div class="mm-progress-token" style="color:#86868b;">\u6d88\u8017 '+tokens+' tokens</div>';
    h+='</div>';body.innerHTML=h;
    try{renderMathInElement(body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],ignoredTags:[]});}catch(e){}
    // Also update compact view if collapsed
    var s=_sessions[idx];if(s&&s.collapsed&&msg.indexOf('\u5b8c\u6210')>=0){
        var q=_questions[idx];var compact=document.getElementById('compact_'+idx);
        if(compact&&q){compact.innerHTML='<div class="compact-question">'+escapedLatex(q.latex)+'</div>';compact.style.display='block';}
    }
}

        var srcMetaText=sourceMetaText(q.source_type,q.source_meta);

        for(var ci=0;ci<data.chunk_results.length;ci++){

            if(diff.level)html+='<span class="chunk-diff tag-'+(diff.level==='容易'?'easy':diff.level==='中等'?'medium':diff.level==='困难'?'hard':diff.level==='未知'?'unknown':'extreme')+'">'+escapeHtml(diff.level)+'</span>';
            html+='</div>';
            if(cr.steps&&cr.steps.length>0){

                for(var si=0;si<cr.steps.length;si++){

                    html+='<div class="step" data-step-number="'+step.step_number+'" data-chunk-id="'+cid+'">';
                    html+='<div class="step-header"><span class="step-number">步骤'+step.step_number+'：'+escapeHtml(step.title||'')+'</span>';
                    if(step.step_difficulty)html+='<span class="step-diff-tag">'+escapeHtml(step.step_difficulty.level)+' ('+step.step_difficulty.score+'分)</span>';

                }

            }

            html+='</div>';
        }
    }
    var isSaved=_sessions[idx]&&_sessions[idx].saved;

    html+='<button class="mm-solve-btn" onclick="startSingleSolve('+idx+')" style="background:#515154;">↻ 重新解答</button>';
    html+='<button class="mm-solve-btn" onclick="teachOpenMulti(this)" data-question="' + (_questions[idx] ? _questions[idx].latex.replace(/"/g, '&quot;') : '') + '" style="background:#ca8a04;">📖 教学</button>';
    if(isSaved){html+='<span class="tag" style="background:#e8f5e9;color:#2e7d32;">✅ 已加入题库</span>';}
    else{html+='<button class="mm-solve-btn" onclick="saveToBank('+idx+')" style="background:#2e7d32;">📋 加入题库</button>';}
    html+='</div>';
    updateSessionBody(idx,html);

    // Auto-collapse: populate compact view with question + answer + buttons
    var compact=document.getElementById('compact_'+idx);
    if(compact){
        var isSaved=_sessions[idx]&&_sessions[idx].saved;
        var compactHtml='<div class="compact-question">'+escapedLatex(q?q.latex:'')+'</div>';
        // Collect answers

        if(data.chunk_results)for(var cai=0;cai<data.chunk_results.length;cai++){var fa=data.chunk_results[cai].final_answer;if(fa)allAns.push(fa);}
        if(allAns.length>0)compactHtml+='<div style="padding:4px 0;font-size:14px;">答案：'+escapeHtml(allAns.join(' | '))+'</div>';

        var od=data.overall_difficulty;
        if(od&&od.level){
            var lc=od.level==='容易'?'tag-easy':od.level==='中等'?'tag-medium':od.level==='困难'?'tag-hard':od.level==='未知'?'tag-unknown':'tag-extreme';
            compactHtml+='<span class="tag '+lc+'">'+od.level+'</span>';
        }
        if(data.knowledge_points)safeParseKps(data.knowledge_points).slice(0,3).forEach(function(kp){

            compactHtml+='<span class="tag tag-source">'+escapeHtml(q.source_type)+'</span>';

        compactHtml+='<button class="mm-qbtn" onclick="event.stopPropagation();addSingleToExam('+idx+')" style="font-size:12px;padding:4px 10px;">📋 组卷</button>';
        compactHtml+='<button class="mm-qbtn" onclick="event.stopPropagation();teachOpenMulti(this)" data-question="' + (_questions[idx] ? _questions[idx].latex.replace(/"/g, '&quot;') : '') + '" style="font-size:12px;padding:4px 10px;background:#ca8a04;color:white;border:none;border-radius:8px;cursor:pointer;">📖 教学</button>';
        compactHtml+='</div></div>';
        compact.innerHTML=compactHtml;compact.style.display='block';
        try{renderMathInElement(compact,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],ignoredTags:[]});}catch(e){}
    }
    // KaTeX
    try{renderMathInElement(document.getElementById('session_body_'+idx),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],ignoredTags:[]});}catch(e){}

    document.querySelectorAll('#session_body_'+idx+' .step-content, #session_body_'+idx+' .detail-content').forEach(function(el){
        try{renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],ignoredTags:[]});}catch(e){}
    });
    // 保存入库后保持展开，方便看到已入库与来源标签；解题完成后默认折叠
    _sessions[idx].collapsed=!keepOpen;

    c.classList.toggle('show');el.textContent=o?'收起详细过程 ▾':'展开详细过程 ▸';

}

// ---- Save to Bank ----
var _mmSingleIdx = -1;
var _mmBatchIndices = [];
var _mmBatchMode = 'unified';

function saveToBank(idx){
    openSingleSaveDialog(idx);
}

async function performSaveToBank(idx, sourceType, sourceMeta){
    var q=_questions[idx];var data=_sessions[idx]?.data;if(!q||!data)return false;
    try{
        var payload={question:q.latex,answer_json:data};
        if(sourceType){payload.source_type=sourceType;payload.source_meta=sourceMeta||{};}
        var r=await fetch('http://127.0.0.1:8000/questions/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        var d=await r.json();
        if(d.id){
            var s=_sessions[idx];s.saved=true;s.data.saved_question_id=d.id;
            _questions[idx].source_type=sourceType||'';
            _questions[idx].source_meta=sourceType?(sourceMeta||{}):null;
            saveState();
            var wasCollapsed=!!s.collapsed;
            renderSessionResult(idx,s.data,true,!wasCollapsed);
            renderQuestionList();
            return true;
        }
    }catch(e){console.error('save failed',idx,e);}
    return false;
}

function closeImportDialog(){
    var el=document.querySelector('.mm-import-overlay');
    if(el)el.remove();
    _mmSingleIdx=-1;_mmBatchIndices=[];
}

function openSingleSaveDialog(idx){
    var q=_questions[idx];if(!q||!_sessions[idx]?.data)return;
    _mmSingleIdx=idx;
    var remembered=getRememberedSource();
    var type=q.source_type||(remembered&&remembered.source_type)||'';
    var meta=safeParseMeta(q.source_meta||(remembered&&remembered.source_meta))||{};
    var html='<div class="mm-import-overlay"><div class="mm-import-dialog">';
    html+='<h3>加入题库</h3>';
    html+=sourceChipsHtml(type,'sgl');
    html+=sourceFieldsHtml(type,meta,'sgl');
    html+='<label class="remember-source-row"><input type="checkbox" id="sglRemember"'+(remembered?' checked':'')+'><span>记住来源</span></label>';
    html+='<div class="mm-import-actions"><button class="mm-import-cancel" onclick="closeImportDialog()">取消</button>';
    html+='<button class="mm-import-confirm" onclick="confirmSingleImport()">确认入库</button></div>';
    html+='</div></div>';
    var overlay=document.createElement('div');overlay.innerHTML=html;
    var overlayEl=overlay.firstChild;
    document.body.appendChild(overlayEl);
    populateMotherCategoryOptions();
    overlayEl.addEventListener('click',function(e){if(e.target===overlayEl)closeImportDialog();});
}

async function confirmSingleImport(){
    var type='';
    var active=document.querySelector('.mm-import-dialog .source-type-option.active');
    if(active)type=active.dataset.value;
    var meta=collectSourceFields(type,'sgl');
    if(type==='精选母题'&&(!meta.category||!meta.pattern)){showToast('请选择所属板块并填写套路名','info');return;}
    var remember=document.getElementById('sglRemember');
    if(remember&&remember.checked&&type)saveRememberedSource({source_type:type,source_meta:meta});
    else if(remember&&!remember.checked)clearRememberedSource();
    var idx=_mmSingleIdx;closeImportDialog();
    if(idx<0)return;
    var ok=await performSaveToBank(idx,type,meta);
    if(ok&&type==='精选母题'&&_sessions[idx]&&_sessions[idx].data&&_sessions[idx].data.saved_question_id){
        await registerMotherQuestion(_sessions[idx].data.saved_question_id,meta);
    }
    showToast(ok?(type?'已加入题库，来源：'+type:'已加入个人题库'):'保存失败', ok?'success':'error');
}

function getSelectedSolvedIndices(){
    var cbs=document.querySelectorAll('#mmQuestionList .hc-checkbox:checked');
    var indices=[];
    for(var i=0;i<cbs.length;i++){
        var idx=parseInt(cbs[i].dataset.idx);
        if(_sessions[idx]&&_sessions[idx].done&&_sessions[idx].data)indices.push(idx);
    }
    return indices.sort(function(a,b){return a-b;});
}

function openBatchImportDialog(){
    var indices=getSelectedSolvedIndices();
    if(indices.length===0){showToast('请先勾选已解答的题目','info');return;}
    _mmBatchIndices=indices;_mmBatchMode='unified';
    var html='<div class="mm-import-overlay"><div class="mm-import-dialog mm-import-batch">';
    html+='<h3>批量入库 · 共 '+indices.length+' 道</h3>';
    html+='<div class="mm-import-modes">';
    html+='<button class="mm-import-mode active" id="mmModeUnified" onclick="switchBatchImportMode(\'unified\')">统一填写 + 自动题号</button>';
    html+='<button class="mm-import-mode" id="mmModePer" onclick="switchBatchImportMode(\'per\')">逐题填写</button>';
    html+='</div>';
    html+='<div id="mmImportBody"></div>';
    html+='<div class="mm-import-actions"><button class="mm-import-cancel" onclick="closeImportDialog()">取消</button>';
    html+='<button class="mm-import-confirm" onclick="confirmBatchImport()">确认批量入库</button></div>';
    html+='</div></div>';
    var overlay=document.createElement('div');overlay.innerHTML=html;
    var overlayEl=overlay.firstChild;
    document.body.appendChild(overlayEl);
    overlayEl.addEventListener('click',function(e){if(e.target===overlayEl)closeImportDialog();});
    renderBatchImportBody();
}

function switchBatchImportMode(mode){
    _mmBatchMode=mode;
    var u=document.getElementById('mmModeUnified');
    var p=document.getElementById('mmModePer');
    if(u)u.classList.toggle('active',mode==='unified');
    if(p)p.classList.toggle('active',mode==='per');
    renderBatchImportBody();
}

function renderBatchImportBody(){
    var body=document.getElementById('mmImportBody');if(!body)return;
    if(_mmBatchMode==='unified')body.innerHTML=renderUnifiedBatchForm();
    else body.innerHTML=renderPerQuestionBatchForm();
    populateMotherCategoryOptions();
    if(_mmBatchMode==='unified')setTimeout(toggleUnifiedAutoNo,0);
}

function renderUnifiedBatchForm(){
    var remembered=getRememberedSource();
    var type=(remembered&&remembered.source_type)||'';
    var meta=safeParseMeta(remembered&&remembered.source_meta)||{};
    var html=sourceChipsHtml(type,'bdu');
    html+=sourceFieldsHtml(type,meta,'bdu');
    if(type==='模拟题'||type==='高考题'){
        html+='<div class="source-meta-field auto-row"><label>自动题号</label>';
        html+='<input type="checkbox" id="bduAutoNo" checked onchange="toggleUnifiedAutoNo()"><span>从</span>';
        html+='<input type="text" id="bduStartNo" value="1" style="width:64px;padding:6px 8px;border:1px solid #c7c7cc;border-radius:8px;">';
        html+='<span>开始，按勾选顺序递增</span></div>';
    }
    html+='<label class="remember-source-row"><input type="checkbox" id="bduRemember"'+(remembered?' checked':'')+'><span>记住来源</span></label>';
    return html;
}

function renderPerQuestionBatchForm(){
    var remembered=getRememberedSource();
    var html='<div class="mm-import-rows">';
    for(var i=0;i<_mmBatchIndices.length;i++){
        var idx=_mmBatchIndices[i];var q=_questions[idx];
        var type=q&&q.source_type?q.source_type:(remembered&&remembered.source_type)||'';
        var meta=q&&q.source_meta?safeParseMeta(q.source_meta):safeParseMeta(remembered&&remembered.source_meta)||{};
        var types=['','ai生成','高考题','模拟题','精选母题'];
        html+='<div class="mm-import-row"><div class="mm-import-row-head">题'+(idx+1)+'</div>';
        html+='<select id="pq_src_'+idx+'" class="mm-source-select" onchange="selectPerQuestionSource('+idx+')">';
        for(var ti=0;ti<types.length;ti++){
            var label=types[ti]===''?'选择来源':types[ti]==='ai生成'?'AI生成':types[ti];
            html+='<option value="'+types[ti]+'"'+(types[ti]===type?' selected':'')+'>'+label+'</option>';
        }
        html+='</select>';
        html+='<div id="pq_fields_'+idx+'">'+sourceFieldsHtml(type,meta,'pq_'+idx)+'</div>';
        html+='</div>';
    }
    html+='</div>';
    return html;
}

function selectPerQuestionSource(idx){
    var sel=document.getElementById('pq_src_'+idx);
    var box=document.getElementById('pq_fields_'+idx);
    if(sel&&box)box.innerHTML=sourceFieldsHtml(sel.value,{},'pq_'+idx);
}

async function confirmBatchImport(){
    var mode=_mmBatchMode;
    var ok=false;
    if(mode==='unified')ok=await saveBatchUnified();
    else ok=await saveBatchPerQuestion();
    if(ok)closeImportDialog();
}

async function saveBatchUnified(){
    var type='';
    var active=document.querySelector('.mm-import-dialog .source-type-option.active');
    if(active)type=active.dataset.value;
    if(!type){showToast('请先选择来源','info');return false;}
    var baseMeta=collectSourceFields(type,'bdu');
    if(type==='ai生成'&&!baseMeta.reference_id){showToast('请填写参考题目ID','info');return false;}
    if(type==='精选母题'&&!baseMeta.mother_id){showToast('请填写母题ID','info');return false;}
    var auto=document.getElementById('bduAutoNo')&&document.getElementById('bduAutoNo').checked;
    var startNo=parseInt((document.getElementById('bduStartNo')||{}).value)||1;
    var remember=document.getElementById('bduRemember');
    if(remember&&remember.checked)saveRememberedSource({source_type:type,source_meta:baseMeta});
    else if(remember&&!remember.checked)clearRememberedSource();
    var done=0,skip=0;
    for(var i=0;i<_mmBatchIndices.length;i++){
        var idx=_mmBatchIndices[i];
        if(!_sessions[idx]||!_sessions[idx].done){skip++;continue;}
        var meta=Object.assign({},baseMeta);
        if((type==='模拟题'||type==='高考题')){
            if(!meta.paper){showToast('请填写卷子名字','info');return false;}
            meta.question_no=auto?String(startNo+i):(meta.question_no||String(startNo+i));
        }
        var ok=await performSaveToBank(idx,type,meta);
        if(ok)done++;
    }
    showToast('已完成 '+done+' 道题入库'+(skip>0?'，跳过 '+skip+' 道未解答':'')+(type?'，来源：'+type:''),'success');
    return true;
}

async function saveBatchPerQuestion(){
    var done=0,skip=0,noSource=0;
    for(var i=0;i<_mmBatchIndices.length;i++){
        var idx=_mmBatchIndices[i];
        if(!_sessions[idx]||!_sessions[idx].done){skip++;continue;}
        var sel=document.getElementById('pq_src_'+idx);
        var type=sel?sel.value:'';
        if(!type){noSource++;continue;}
        var meta=collectSourceFields(type,'pq_'+idx);
        var ok=await performSaveToBank(idx,type,meta);
        if(ok)done++;
    }
    var extra=[];
    if(skip>0)extra.push('跳过 '+skip+' 道未解答');
    if(noSource>0)extra.push(noSource+' 道未选来源');
    showToast('已完成 '+done+' 道题入库'+(extra.length?'，'+extra.join('，'):''),'success');
    return true;
}

// ---- Error Dialog ----
async function showErrorDialog(idx,stepNumber,chunkId){
    var qid=_sessions[idx]?.data?.saved_question_id;
    if(!qid&&_sessions[idx]?.done&&_questions[idx]){
        try{
        var errSavePayload={question:_questions[idx].latex,answer_json:_sessions[idx].data};
        if(_questions[idx].source_type)errSavePayload.source_type=_questions[idx].source_type;
        if(_questions[idx].source_meta)errSavePayload.source_meta=_questions[idx].source_meta;
        var r=await fetch('http://127.0.0.1:8000/questions/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(errSavePayload)});
        var d=await r.json();if(d.id){qid=d.id;_sessions[idx].saved=true;_sessions[idx].data.saved_question_id=d.id;renderQuestionList();}}catch(e){alert('保存失败，无法添加错因');return;}
    }
    if(!qid){alert('请先解答题目再添加错因');return;}
    _errorDialogState={questionId:qid,stepNumber,chunkId,idx};
    document.getElementById('errorDialogType').value='符号错误';
    document.getElementById('errorDialogDetail').value='';
    document.getElementById('errorDialogOverlay').style.display='flex';
}
function closeErrorDialog(){document.getElementById('errorDialogOverlay').style.display='none';}
function confirmAddError(){
    var s=_errorDialogState;var type=document.getElementById('errorDialogType').value;
    var detail=document.getElementById('errorDialogDetail').value.trim();
    if(!type){alert('请选择一级错因');return;}
    fetch('http://127.0.0.1:8000/questions/'+s.questionId+'/step-error',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({step_number:s.stepNumber,chunk_id:s.chunkId,mistake_type:type,mistake_detail:detail})})
    .then(function(r){return r.json()})
    .then(function(){closeErrorDialog();refreshErrors(s.questionId,s.idx);})
    .catch(function(err){alert('添加失败: '+err.message);});
}
function deleteStepError(qid,eid,idx){
    if(!confirm('确定删除这条错因吗？'))return;
    fetch('http://127.0.0.1:8000/questions/'+qid+'/step-error/'+eid,{method:'DELETE'})
    .then(function(r){return r.json()})
    .then(function(data){if(data.deleted)refreshErrors(qid,idx);});
}
function refreshErrors(qid,idx){
    fetch('http://127.0.0.1:8000/questions/'+qid).then(function(r){return r.json()}).then(function(data){
        if(data.error)return;
        var errors=data.step_errors||[];
        var steps=document.querySelectorAll('#session_'+idx+' .step[data-step-number]');
        steps.forEach(function(el){
            var sn=parseInt(el.dataset.stepNumber);var cid=parseInt(el.dataset.chunkId);
            var es=errors.filter(function(e){return e.step_number===sn&&e.chunk_id===cid;});
            el.classList.toggle('has-error',es.length>0);
            var btn=el.querySelector('.step-error-btn');if(btn){btn.textContent=es.length>0?'编辑错因':'添加错因';btn.classList.toggle('has-error',es.length>0);}
            var elist=el.querySelector('.step-errors');if(elist){
                if(es.length>0){var h='';for(var ei=0;ei<es.length;ei++){var err=es[ei];var ts=formatUTCDate(err.created_at);
                h+='<div class="step-error-item"><span class="error-type-badge">'+escapeHtml(err.mistake_type)+'</span><span class="error-detail">'+escapeHtml(err.mistake_detail||'')+'</span><span class="error-time">'+ts+'</span><button class="error-delete-btn" onclick="event.stopPropagation();deleteStepError('+qid+','+err.id+','+idx+')">✕</button></div>';}
                elist.innerHTML=h;}else elist.innerHTML='';}
        });
    });
}
function formatUTCDate(s){
    if(!s)return '';
    var d=new Date(s.replace(' ','T')+'Z');var offset=8*60;var local=new Date(d.getTime()+offset*60000);
    return local.getUTCFullYear()+'-'+String(local.getUTCMonth()+1).padStart(2,'0')+'-'+String(local.getUTCDate()).padStart(2,'0')+' '+String(local.getUTCHours()).padStart(2,'0')+':'+String(local.getUTCMinutes()).padStart(2,'0');
}

// ---- Batch Solve ----
async function batchSolve(){
    var cbs=document.querySelectorAll('#mmQuestionList .hc-checkbox:checked');
    var indices=[];for(var i=0;i<cbs.length;i++)indices.push(parseInt(cbs[i].dataset.idx));
    indices.sort(function(a,b){return a-b;});
    if(indices.length===0){alert('请先勾选题目');return;}
    document.getElementById('mmBatchSolveBtn').disabled=true;document.getElementById('mmBatchSolveBtn').textContent='解题中 '+indices.length+' 道...';
    for(var i=0;i<indices.length;i++)createSessionEl(indices[i]);
    var queue=indices.slice();
    var workers=[];
    for(var i=0;i<Math.min(MAX_CONCURRENT,indices.length);i++){
        workers.push((async function(){while(queue.length>0){var qid=queue.shift();await startSingleSolve(qid);}})());
    }
    await Promise.all(workers);
    document.getElementById('mmBatchSolveBtn').disabled=false;document.getElementById('mmBatchSolveBtn').textContent='批量解题';
}

    applyLimits();

function teachOpenMulti(btn) {
    var q = btn.getAttribute('data-question');
    if (q) { localStorage.setItem('_teach_question', q); window.open('teach.html?standalone=1', '_blank'); }
}

function safeParseKps(kps){
    if(Array.isArray(kps)) return kps;
    try{var p=JSON.parse(kps);return Array.isArray(p)?p:[];}catch(e){return [];}
}

async function batchAddSelectedToExam(){
    var cbs=document.querySelectorAll('#mmQuestionList .hc-checkbox:checked');
    var done=0,skip=0;
    var cart=getExamCart();
    for(var i=0;i<cbs.length;i++){
        var idx=parseInt(cbs[i].dataset.idx);
        if(!_sessions[idx]||!_sessions[idx].done){skip++;continue;}
        var q=_questions[idx];var s=_sessions[idx];
        if(!s.data||cart.find(function(x){return x.content===q.latex;}))continue;
        cart.push({id:Date.now()+Math.random(),content:q.latex,answer_json:s.data,
            category:q.category_level1||(s.data.category_level1)||'',
            difficulty:q.difficulty||(s.data.overall_difficulty&&s.data.overall_difficulty.level)||'',
            question_type:q.question_type||'',
            settings:{blankHeight:120,showDifficulty:false,showDetailedProcess:false,showKnowledgePoints:true,showAnswerBox:true,questionSpacing:20}});
        done++;
    }
    saveCart(cart);
    if(skip>0)alert('有 '+skip+' 道题未解答，已跳过');
    showToast('已将 '+done+' 道题加入组卷','success');
}
