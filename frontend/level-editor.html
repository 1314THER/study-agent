    .tool-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #86868b; font-size: 12px; }

        .edit-wrap { height: auto; min-height: 100vh; overflow: visible; }

<script>
var boards = [], patterns = [], currentBoard = null, selectedLevelSeq = 0, scrollMemory = null;
var ROOT_WIDTH = 150, LEVEL_WIDTH = 185, PATTERN_WIDTH = 172;
var COL_ROOT_X = 24, COL_LEVEL_X = 208, COL_PATTERN_X = 424;
var PATTERN_STEP = 62, GROUP_GAP = 30;

function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function api(path, opts) { return fetch('' + path, opts || {}).then(function(r) { return r.json().then(function(d) { if (!r.ok || (d && d.error)) throw new Error((d && (d.detail || d.error)) || '请求失败'); return d; }); }); }
function setStatus(msg, error) { var el = document.getElementById('editStatus'); el.textContent = msg || ''; el.style.color = error ? '#c62828' : '#2e7d32'; }
function stateLabel(s) { return {never:'未挑战', first_pass:'第一次会', second_pass:'第二次会', third_pass:'已通关', again_wrong:'再次出错'}[s] || '未挑战'; }
function rootStorageKey() { return 'mindmap-root2-' + (currentBoard ? currentBoard.id : 'none'); }
function getRootPosition() { try { return JSON.parse(localStorage.getItem(rootStorageKey())) || {x:COL_ROOT_X,y:200}; } catch (e) { return {x:COL_ROOT_X,y:200}; } }
function setRootPosition(x, y) { localStorage.setItem(rootStorageKey(), JSON.stringify({x:x,y:y})); }

function getLevels() {
    if (!currentBoard) return [];
    var byIndex = {};
    (currentBoard.nodes || []).forEach(function(n) { var i = Math.max(0, Math.round(n.x || 0)); (byIndex[i] = byIndex[i] || []).push(n); });
    (currentBoard.levels || []).forEach(function(l) { var i = Number(l.level_index); if (!byIndex[i]) byIndex[i] = []; });
    return Object.keys(byIndex).map(Number).sort(function(a,b) { return a-b; }).map(function(index) {
        var meta = (currentBoard.levels || []).find(function(l) { return Number(l.level_index) === index; }) || {};
        return {index:index, name:meta.name || '', description:meta.description || '', layout_x:meta.layout_x, layout_y:meta.layout_y, meta:meta, patterns:(byIndex[index] || []).slice().sort(function(a,b) { return (a.y || 0) - (b.y || 0); })};
    });
}

function autoArrange(force) {
    var levels = getLevels(), cursor = 28;
    levels.forEach(function(level) {
        var groupHeight = Math.max(72, level.patterns.length * PATTERN_STEP);
        if (force || level.meta.layout_x == null || level.meta.layout_y == null) {
            level.meta.layout_x = COL_LEVEL_X;
            level.meta.layout_y = cursor + Math.max(0, (groupHeight - 62) / 2);
        }
        level.patterns.forEach(function(node, i) {
            if (force || node.layout_x == null || node.layout_y == null) {
                node.layout_x = COL_PATTERN_X;
                node.layout_y = cursor + i * PATTERN_STEP + Math.max(0, (groupHeight - level.patterns.length * PATTERN_STEP) / 2);
            }
        });
        cursor += groupHeight + GROUP_GAP;
    });
    if (force || !localStorage.getItem(rootStorageKey())) setRootPosition(COL_ROOT_X, 28);
}

function mapSize(levels) {
    var maxX = 620, maxY = 420;
    var root = getRootPosition(); maxX = Math.max(maxX, root.x + ROOT_WIDTH + 60); maxY = Math.max(maxY, root.y + 100);
    levels.forEach(function(level) {
        maxX = Math.max(maxX, Number(level.meta.layout_x || 0) + LEVEL_WIDTH + 70);
        maxY = Math.max(maxY, Number(level.meta.layout_y || 0) + 110);
        level.patterns.forEach(function(node) { maxX = Math.max(maxX, Number(node.layout_x || 0) + PATTERN_WIDTH + 70); maxY = Math.max(maxY, Number(node.layout_y || 0) + 95); });
    });
    return {width:maxX, height:maxY};
}

// 旧版编辑器的自动排布坐标更稀疏，首次进入新版时重排一次
async function maybeMigrate() {
    if (!currentBoard) return;
    var migKey = 'mindmap-migrated-' + currentBoard.id;
    if (localStorage.getItem(migKey)) return;
    localStorage.setItem(migKey, '1');
    var levels = getLevels();
    var stale = levels.length
        && levels.every(function(l) { return Number(l.meta.layout_x) === 305; })
        && (currentBoard.nodes || []).every(function(n) { return Number(n.layout_x) === 650; });
    if (!stale) return;
    localStorage.removeItem(rootStorageKey());
    autoArrange(true);
    await saveBoard();
    setStatus('');
}

function loadAll() {
    Promise.all([api('/boards'), api('/patterns')]).then(async function(data) {
        boards = data[0] || []; patterns = data[1] || [];
        var oldId = currentBoard && currentBoard.id;
        currentBoard = boards.find(function(b) { return b.id === oldId; }) || boards[0] || null;
        if (currentBoard) selectedLevelSeq = Math.min(selectedLevelSeq, Math.max(0, getLevels().length - 1));
        await maybeMigrate();
        renderBoardChoice(); renderEditor(); setStatus('');
    }).catch(function(e) { document.getElementById('editorMain').innerHTML = '<div class="editor-empty" style="margin:auto;color:#c62828;">加载失败：' + escapeHtml(e.message) + '</div>'; });
}

function renderBoardChoice() {
    var el = document.getElementById('boardChoice');
    el.innerHTML = boards.map(function(b) { return '<button class="' + (currentBoard && b.id === currentBoard.id ? 'active' : '') + '" onclick="selectBoard(' + b.id + ')">' + escapeHtml(b.category) + '</button>'; }).join('') || '<div class="editor-empty">暂无板块</div>';
}
async function selectBoard(id) { currentBoard = boards.find(function(b) { return b.id === id; }) || null; selectedLevelSeq = 0; scrollMemory = {x:0, y:0}; await maybeMigrate(); renderBoardChoice(); renderEditor(); }

function renderLevelNode(level, seq) {
    var selected = seq === selectedLevelSeq;
    var html = '<div class="map-node level-node' + (selected ? ' selected' : '') + '" id="levelNode_' + seq + '" data-node-type="level" data-node-key="' + seq + '" style="left:' + level.meta.layout_x + 'px;top:' + level.meta.layout_y + 'px" onclick="selectLevel(' + seq + ')"><div class="level-node-head"><span class="level-node-index">L' + String(seq + 1).padStart(2, '0') + '</span><span class="level-node-name">' + escapeHtml(level.name || ('第 ' + (seq + 1) + ' 关')) + '</span><span class="level-node-tools">';
    html += '<button class="icon-btn" title="前移" onclick="event.stopPropagation();moveLevel(' + seq + ',-1)"' + (seq === 0 ? ' disabled' : '') + '>↑</button><button class="icon-btn" title="后移" onclick="event.stopPropagation();moveLevel(' + seq + ',1)"' + (seq === getLevels().length - 1 ? ' disabled' : '') + '>↓</button><button class="icon-btn danger" title="删除" onclick="event.stopPropagation();removeLevel(' + seq + ')">×</button></span></div>';
    if (level.description) html += '<div class="level-node-desc">' + escapeHtml(level.description) + '</div>';
    html += '<div class="level-node-count">' + level.patterns.length + ' 个套路</div></div>';
    return html;
}

function renderPatternNode(node, levelSeq) {
    return '<div class="map-node pattern-node state-' + escapeHtml(node.state || 'never') + '" id="patternNode_' + node.pattern_id + '" data-node-type="pattern" data-node-key="' + node.pattern_id + '" data-level-seq="' + levelSeq + '" style="left:' + node.layout_x + 'px;top:' + node.layout_y + 'px" onclick="selectLevel(' + levelSeq + ')"><div class="pattern-node-title">' + escapeHtml(node.name || ('套路 #' + node.pattern_id)) + '</div><div class="pattern-node-meta"><span>' + stateLabel(node.state) + '</span><span>' + (node.question_id ? '已绑定题目' : '空套路') + '</span></div></div>';
}

function renderEditor() {
    var mainEl = document.getElementById('editorMain'), toolsEl = document.getElementById('editorTools');
    if (!currentBoard) { mainEl.innerHTML = '<div class="editor-empty" style="margin:auto;">暂无板块</div>'; toolsEl.innerHTML = '<div class="tool-empty">暂无可编辑的关卡</div>'; return; }
    autoArrange(false);
    var levels = getLevels(), size = mapSize(levels), root = getRootPosition();
    var prev = document.getElementById('canvasScroll');
    var target = scrollMemory || (prev ? {x:prev.scrollLeft, y:prev.scrollTop} : {x:0, y:0});
    scrollMemory = null;
    var html = '<div class="canvas-head"><span class="editor-board-name">' + escapeHtml(currentBoard.name || currentBoard.category) + '</span><span class="editor-board-count">' + levels.length + ' 个关卡 · ' + (currentBoard.nodes || []).length + ' 个套路</span><span class="canvas-hint">拖节点排版 · 拖空白平移 · 滚轮滚动</span><button class="edit-btn" onclick="newLevel()">＋ 新建关卡</button></div>';
    html += '<div class="canvas-wrap"><div class="mindmap-scroll" id="canvasScroll"><div id="mindmapCanvas" class="mindmap-canvas" style="width:' + size.width + 'px;height:' + size.height + 'px"><svg id="mindmapLines" class="mindmap-lines" width="' + size.width + '" height="' + size.height + '"></svg>';
    html += '<div class="map-node root-node" id="rootNode" data-node-type="root" data-node-key="root" style="left:' + root.x + 'px;top:' + root.y + 'px"><small>知识板块</small><strong>' + escapeHtml(currentBoard.name || currentBoard.category) + '</strong></div>';
    levels.forEach(function(level, seq) { html += renderLevelNode(level, seq); level.patterns.forEach(function(node) { html += renderPatternNode(node, seq); }); });
    html += '</div></div></div>';
    mainEl.innerHTML = html;
    var seq = levels.length ? Math.min(selectedLevelSeq, levels.length - 1) : -1;
    toolsEl.innerHTML = seq >= 0 ? renderTools(levels[seq], seq) : '<div class="tool-empty"><span>还没有关卡</span><button class="edit-btn" onclick="newLevel()">＋ 新建第一关</button></div>';
    requestAnimationFrame(function() {
        var wrap = document.getElementById('canvasScroll');
        if (wrap) { wrap.scrollLeft = target.x; wrap.scrollTop = target.y; }
        bindMindmapDrag(); drawConnections();
    });
}

function renderTools(level, seq) {
    var inBoard = (currentBoard.nodes || []).map(function(n) { return n.pattern_id; });
    var available = patterns.filter(function(p) { return p.category === currentBoard.category && inBoard.indexOf(p.id) < 0; });
    var html = '<div class="panel-head"><span class="panel-title">编辑 · 第 ' + (seq + 1) + ' 关</span><span class="panel-sub">点击画布节点可切换</span></div>';
    html += '<div class="tool-section"><h3>关卡信息</h3><input id="levelNameInput" value="' + escapeHtml(level.name || '') + '" placeholder="关卡名称，例如：集合基础任务"><textarea id="levelDescInput" placeholder="这一关的知识点或通关目标（可选）">' + escapeHtml(level.description || '') + '</textarea><button class="tool-btn" style="margin-top:7px;" onclick="saveLevelMeta(' + seq + ')">保存关卡信息</button></div>';
    html += '<div class="tool-section"><h3>本关套路 · ' + level.patterns.length + '</h3><div class="pattern-list">' + (level.patterns.map(function(n, i) { return renderPatternRow(n, i, level.patterns.length); }).join('') || '<div class="editor-empty" style="padding:12px 4px;">本关暂无套路</div>') + '</div>';
    html += '<label>添加已有套路</label><div class="tool-row"><select id="availablePatternSelect"><option value="">选择套路...</option>' + available.map(function(p) { return '<option value="' + p.id + '">' + escapeHtml(p.name) + '</option>'; }).join('') + '</select><button class="tool-btn" onclick="addExistingPattern(' + seq + ')">添加</button></div>';
    html += '<button class="tool-btn secondary" style="margin-top:8px;" onclick="toggleNewPatternBox()">＋ 新建套路</button><div id="newPatternBox" class="new-pattern-box"><input id="newPatternName" placeholder="套路名称"><div class="question-search-wrap"><input id="newPatternSearch" class="question-search-input" data-target-id="newPatternQid" data-results-id="newPatternResults" placeholder="可选：搜索并绑定第一道题"><input type="hidden" id="newPatternQid"><div id="newPatternResults" class="question-search-results"></div></div><button class="tool-btn" style="margin-top:6px;" onclick="createPattern(' + seq + ')">创建并加入本关</button></div></div>';
    return html;
}

function renderPatternRow(n, index, total) {
    var html = '<div class="pattern-row"><div class="pattern-row-head"><span class="pattern-row-name">' + escapeHtml(n.name || ('套路 #' + n.pattern_id)) + '</span><span class="pattern-row-meta">' + (n.question_id ? '已绑定' : '空套路') + '</span><span class="pattern-row-tools"><button class="icon-btn" onclick="movePattern(' + n.pattern_id + ',-1)"' + (index === 0 ? ' disabled' : '') + '>↑</button><button class="icon-btn" onclick="movePattern(' + n.pattern_id + ',1)"' + (index === total - 1 ? ' disabled' : '') + '>↓</button><button class="icon-btn danger" onclick="removePattern(' + n.pattern_id + ')">移出</button></span></div>';
    if (!n.question_id) html += '<div class="pattern-question-box" id="patternQuestionBox_' + n.pattern_id + '"><div class="question-search-wrap"><input id="patternQuestionSearch_' + n.pattern_id + '" class="question-search-input" data-target-id="patternQuestionId_' + n.pattern_id + '" data-results-id="patternQuestionResults_' + n.pattern_id + '" placeholder="搜索并选择第一道题"><input type="hidden" id="patternQuestionId_' + n.pattern_id + '"><div id="patternQuestionResults_' + n.pattern_id + '" class="question-search-results"></div></div><button onclick="addQuestionToPattern(' + n.pattern_id + ')">挂载母题</button></div><button class="icon-btn" style="margin-top:5px;" onclick="toggleQuestionBox(' + n.pattern_id + ')">＋ 添加第一道题</button>';
    html += '</div>';
    return html;
}

function drawConnections() {
    var canvas = document.getElementById('mindmapCanvas'), svg = document.getElementById('mindmapLines'), root = document.getElementById('rootNode');
    if (!canvas || !svg || !root) return;
    var canvasRect = canvas.getBoundingClientRect(), paths = [];
    function connect(from, to) {
        if (!from || !to) return;
        var a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
        var x1 = a.right - canvasRect.left, y1 = a.top - canvasRect.top + a.height / 2;
        var x2 = b.left - canvasRect.left, y2 = b.top - canvasRect.top + b.height / 2;
        if (x2 < x1) { x1 = a.left - canvasRect.left; x2 = b.right - canvasRect.left; }
        var bend = Math.max(36, Math.abs(x2 - x1) * .45);
        paths.push('<path d="M ' + x1 + ' ' + y1 + ' C ' + (x1 + (x2 >= x1 ? bend : -bend)) + ' ' + y1 + ', ' + (x2 - (x2 >= x1 ? bend : -bend)) + ' ' + y2 + ', ' + x2 + ' ' + y2 + '"></path>');
    }
    getLevels().forEach(function(level, seq) {
        var levelEl = document.getElementById('levelNode_' + seq);
        connect(root, levelEl);
        level.patterns.forEach(function(node) { connect(levelEl, document.getElementById('patternNode_' + node.pattern_id)); });
    });
    svg.innerHTML = paths.join('');
}

function updateNodePosition(type, key, x, y) {
    if (type === 'root') { setRootPosition(x, y); return; }
    if (type === 'level') {
        var level = getLevels()[Number(key)];
        if (level) { level.meta.layout_x = x; level.meta.layout_y = y; }
        return;
    }
    var node = (currentBoard.nodes || []).find(function(n) { return Number(n.pattern_id) === Number(key); });
    if (node) { node.layout_x = x; node.layout_y = y; }
}

function bindMindmapDrag() {
    var wrap = document.getElementById('canvasScroll'), canvas = document.getElementById('mindmapCanvas');
    if (!wrap || !canvas) return;
    // 拖画布空白处平移
    var pan = null;
    canvas.addEventListener('pointerdown', function(e) {
        if (e.button !== 0 || e.target.closest('.map-node')) return;
        pan = {x:e.clientX, y:e.clientY, sl:wrap.scrollLeft, st:wrap.scrollTop};
        canvas.classList.add('panning');
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    });
    canvas.addEventListener('pointermove', function(e) {
        if (!pan) return;
        wrap.scrollLeft = Math.max(0, pan.sl - (e.clientX - pan.x));
        wrap.scrollTop = Math.max(0, pan.st - (e.clientY - pan.y));
    });
    function panEnd() { if (!pan) return; pan = null; canvas.classList.remove('panning'); }
    canvas.addEventListener('pointerup', panEnd);
    canvas.addEventListener('pointercancel', panEnd);
    // 拖节点排版：位置由指针内容坐标决定，靠近边缘自动滚动，超出时画布自动变大
    canvas.querySelectorAll('.map-node').forEach(function(node) {
        node.addEventListener('click', function(e) { if (node._dragMoved) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);
        node.addEventListener('pointerdown', function(e) {
            if (e.button !== 0 || e.target.closest('button,input,textarea,select')) return;
            e.preventDefault();
            var rect = node.getBoundingClientRect();
            var grabX = e.clientX - rect.left, grabY = e.clientY - rect.top;
            node._dragMoved = false; node.classList.add('dragging');
            try { node.setPointerCapture(e.pointerId); } catch (err) {}
            var last = e, raf = 0;
            function place(ev) {
                var wr = wrap.getBoundingClientRect();
                var left = Math.max(4, Math.round(ev.clientX - wr.left + wrap.scrollLeft - grabX));
                var top = Math.max(4, Math.round(ev.clientY - wr.top + wrap.scrollTop - grabY));
                node.style.left = left + 'px'; node.style.top = top + 'px';
                var needW = left + node.offsetWidth + 36, needH = top + node.offsetHeight + 28;
                if (needW > (parseFloat(canvas.style.width) || 0)) canvas.style.width = needW + 'px';
                if (needH > (parseFloat(canvas.style.height) || 0)) canvas.style.height = needH + 'px';
                drawConnections();
            }
            function edge() {
                if (!raf) return;
                var wr = wrap.getBoundingClientRect(), m = 30, sp = 14, x = last.clientX, y = last.clientY, vx = 0, vy = 0;
                if (y - wr.top < m) vy = -sp; else if (wr.bottom - y < m) vy = sp;
                if (x - wr.left < m) vx = -sp; else if (wr.right - x < m) vx = sp;
                if (vx || vy) {
                    wrap.scrollLeft = Math.max(0, Math.min(wrap.scrollWidth - wrap.clientWidth, wrap.scrollLeft + vx));
                    wrap.scrollTop = Math.max(0, Math.min(wrap.scrollHeight - wrap.clientHeight, wrap.scrollTop + vy));
                    place(last);
                }
                raf = requestAnimationFrame(edge);
            }
            function move(ev) {
                last = ev;
                if (Math.abs(ev.clientX - e.clientX) + Math.abs(ev.clientY - e.clientY) > 4) node._dragMoved = true;
                place(ev);
            }
            function end(ev) {
                cancelAnimationFrame(raf); raf = 0;
                node.classList.remove('dragging');
                try { node.releasePointerCapture(ev.pointerId); } catch (err) {}
                node.removeEventListener('pointermove', move); node.removeEventListener('pointerup', end); node.removeEventListener('pointercancel', end);
                if (node._dragMoved) {
                    updateNodePosition(node.dataset.nodeType, node.dataset.nodeKey, parseFloat(node.style.left), parseFloat(node.style.top));
                    setStatus('位置已调整，点击右上角“保存布局”即可保存');
                    setTimeout(function() { node._dragMoved = false; }, 0);
                }
            }
            node.addEventListener('pointermove', move); node.addEventListener('pointerup', end); node.addEventListener('pointercancel', end);
            raf = requestAnimationFrame(edge);
        });
    });
}

function resetLayout() { autoArrange(true); scrollMemory = {x:0, y:0}; renderEditor(); setStatus('已自动整理，点击右上角“保存布局”即可保存'); }
function selectLevel(seq) { selectedLevelSeq = seq; renderEditor(); }
function toggleNewPatternBox() { var el = document.getElementById('newPatternBox'); if (el) el.classList.toggle('show'); }

async function newLevel() {
    if (!currentBoard) return;
    var levels = getLevels();
    var next = levels.length ? Math.max.apply(null, levels.map(function(l) { return l.index; })) + 1 : 0;
    currentBoard.levels = currentBoard.levels || [];
    currentBoard.levels.push({level_index:next, name:'', description:'', knowledge_points:[], layout_x:COL_LEVEL_X, layout_y:28 + levels.length * 108});
    selectedLevelSeq = levels.length;
    await saveBoard();
}

async function removeLevel(seq) {
    var levels = getLevels();
    if (!levels[seq] || !confirm('删除这一关及其中的套路吗？')) return;
    var index = levels[seq].index;
    currentBoard.nodes = (currentBoard.nodes || []).filter(function(n) { return Math.round(n.x || 0) !== index; });
    currentBoard.levels = (currentBoard.levels || []).filter(function(l) { return Number(l.level_index) !== index; });
    renumberLevels(); selectedLevelSeq = Math.max(0, Math.min(seq, getLevels().length - 1)); await saveBoard();
}

async function moveLevel(seq, dir) {
    var levels = getLevels(), target = seq + dir;
    if (target < 0 || target >= levels.length) return;
    var tmp = levels[seq]; levels[seq] = levels[target]; levels[target] = tmp;
    levels.forEach(function(level, i) { level.patterns.forEach(function(n, y) { n.x = i; n.y = y; }); });
    currentBoard.nodes = levels.reduce(function(all, l) { return all.concat(l.patterns); }, []);
    currentBoard.levels = levels.map(function(l, i) { return {level_index:i, name:l.name, description:l.description, knowledge_points:[], layout_x:l.meta.layout_x, layout_y:l.meta.layout_y}; });
    selectedLevelSeq = target; await saveBoard();
}

function renumberLevels() {
    var levels = getLevels();
    levels.forEach(function(level, i) { level.patterns.forEach(function(n, y) { n.x = i; n.y = y; }); });
    currentBoard.nodes = levels.reduce(function(all, l) { return all.concat(l.patterns); }, []);
    currentBoard.levels = levels.map(function(l, i) { return {level_index:i, name:l.name, description:l.description, knowledge_points:[], layout_x:l.meta.layout_x, layout_y:l.meta.layout_y}; });
}

async function saveLevelMeta(seq) {
    var levels = getLevels(), level = levels[seq];
    if (!level) return;
    level.name = (document.getElementById('levelNameInput').value || '').trim();
    level.description = document.getElementById('levelDescInput').value || '';
    currentBoard.levels = levels.map(function(l) { return {level_index:l.index, name:l.name, description:l.description, knowledge_points:[], layout_x:l.meta.layout_x, layout_y:l.meta.layout_y}; });
    await saveBoard();
}

async function addExistingPattern(seq) {
    var id = parseInt(document.getElementById('availablePatternSelect').value) || 0;
    var p = patterns.find(function(x) { return x.id === id; });
    if (!p) { setStatus('请选择套路', true); return; }
    var levels = getLevels(), level = levels[seq];
    if (!level) return;
    currentBoard.nodes.push({pattern_id:p.id, question_id:p.mother_id || null, x:level.index, y:level.patterns.length, layout_x:Number(level.meta.layout_x || COL_LEVEL_X) + 216, layout_y:Number(level.meta.layout_y || 28) + level.patterns.length * PATTERN_STEP, name:p.name, state:(p.mastery || {}).state || 'never', question_type:''});
    await saveBoard();
}

async function createPattern(seq) {
    var name = (document.getElementById('newPatternName').value || '').trim();
    var qid = parseInt(document.getElementById('newPatternQid').value) || null;
    if (!name) { setStatus('请填写套路名称', true); return; }
    try {
        var p = await api('/patterns/mother', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question_id:qid, category:currentBoard.category, name:name})});
        var levels = getLevels(), level = levels[seq];
        currentBoard.nodes.push({pattern_id:p.pattern_id, question_id:p.mother_id || null, x:level.index, y:level.patterns.length, layout_x:Number(level.meta.layout_x || COL_LEVEL_X) + 216, layout_y:Number(level.meta.layout_y || 28) + level.patterns.length * PATTERN_STEP, name:p.name, state:'never', question_type:''});
        await saveBoard();
    } catch (e) { setStatus('创建失败：' + e.message, true); }
}

async function movePattern(pid, dir) {
    var levels = getLevels(), level = levels[selectedLevelSeq];
    if (!level) return;
    var i = level.patterns.findIndex(function(n) { return n.pattern_id === pid; }), j = i + dir;
    if (i < 0 || j < 0 || j >= level.patterns.length) return;
    var tmp = level.patterns[i]; level.patterns[i] = level.patterns[j]; level.patterns[j] = tmp;
    level.patterns.forEach(function(n, y) { n.x = level.index; n.y = y; });
    currentBoard.nodes = levels.reduce(function(all, l) { return all.concat(l.patterns); }, []);
    await saveBoard();
}

async function removePattern(pid) {
    if (!confirm('将这个套路移出当前关卡吗？')) return;
    currentBoard.nodes = (currentBoard.nodes || []).filter(function(n) { return n.pattern_id !== pid; });
    await saveBoard();
}

function toggleQuestionBox(pid) { var el = document.getElementById('patternQuestionBox_' + pid); if (el) el.classList.toggle('show'); }
async function addQuestionToPattern(pid) {
    var qid = parseInt(document.getElementById('patternQuestionId_' + pid).value) || 0;
    if (!qid) { setStatus('请先搜索并选择题目', true); return; }
    try { await api('/patterns/' + pid + '/questions', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question_id:qid, role:'mother'})}); await loadAll(); setStatus('第一道题已添加'); } catch (e) { setStatus('添加失败：' + e.message, true); }
}

async function saveBoard() {
    if (!currentBoard) return;
    var payload = {nodes:(currentBoard.nodes || []).map(function(n) { return {question_id:n.question_id || null, pattern_id:n.pattern_id || null, x:Math.round(n.x || 0), y:Math.round(n.y || 0), layout_x:n.layout_x == null ? null : Math.round(n.layout_x), layout_y:n.layout_y == null ? null : Math.round(n.layout_y)}; }), edges:[], levels:(currentBoard.levels || []).map(function(l) { return {level_index:l.level_index, name:l.name || '', description:l.description || '', layout_x:l.layout_x == null ? null : Math.round(l.layout_x), layout_y:l.layout_y == null ? null : Math.round(l.layout_y)}; })};
    try {
        var d = await api('/boards/' + currentBoard.id, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
        if (!d || !d.id) throw new Error('保存失败');
        var keep = selectedLevelSeq; boards = boards.map(function(b) { return b.id === d.id ? d : b; }); currentBoard = d; selectedLevelSeq = Math.min(keep, Math.max(0, getLevels().length - 1)); renderBoardChoice(); renderEditor(); setStatus('已保存');
    } catch (e) { setStatus('保存失败：' + e.message, true); }
}

document.addEventListener('DOMContentLoaded', loadAll);
</script>
</body>
</html>
