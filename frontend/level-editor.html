<style>
    body { background: #f5f5f7; }
    .edit-wrap { min-height: 100vh; padding: 20px 24px 42px; box-sizing: border-box; }
    .edit-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    .edit-title { margin: 0; color: #1d1d1f; font-size: 25px; }
    .edit-subtitle { margin: 6px 0 0; color: #86868b; font-size: 13px; }
    .edit-actions { display: flex; gap: 8px; }
    .edit-btn { border: 0; border-radius: 9px; padding: 9px 15px; background: #0071e3; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
    .edit-btn.secondary { background: #fff; color: #515154; border: 1px solid #e5e5e7; }
    .edit-btn.danger { background: #fff0f0; color: #c62828; }
    .edit-status { min-height: 18px; color: #2e7d32; font-size: 12px; }
    .edit-layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 16px; align-items: start; }
    .edit-side, .edit-main { background: #fff; border: 1px solid #e5e5e7; border-radius: 15px; }
    .edit-side { padding: 13px; position: sticky; top: 16px; }
    .edit-side h2 { margin: 3px 4px 12px; color: #1d1d1f; font-size: 14px; }
    .board-choice { display: flex; flex-direction: column; gap: 5px; }
    .board-choice button { border: 0; border-radius: 8px; padding: 9px 10px; background: transparent; color: #515154; text-align: left; font: inherit; font-size: 13px; cursor: pointer; }
    .board-choice button:hover { background: #f5f9ff; }
    .board-choice button.active { background: #e8f4ff; color: #0071e3; font-weight: 700; }
    .edit-side-note { margin: 16px 4px 4px; color: #86868b; font-size: 12px; line-height: 1.7; }
    .edit-main { min-width: 0; padding: 18px 20px 26px; overflow: hidden; }
    .editor-board-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .editor-board-name { color: #1d1d1f; font-size: 19px; font-weight: 700; }
    .editor-board-count { color: #86868b; font-size: 12px; }
    .mindmap-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0 8px; color: #86868b; font-size: 12px; }
    .mindmap-scroll { margin: 0 -20px; padding: 0 20px 16px; overflow: auto; overscroll-behavior: contain; }
    .mindmap-canvas { position: relative; min-width: 1120px; min-height: 620px; border: 1px solid #e5e5e7; border-radius: 16px; overflow: hidden; background-color: #fbfcff; background-image: radial-gradient(#cbd8e8 1px, transparent 1px); background-size: 22px 22px; }
    .mindmap-lines { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: visible; }
    .mindmap-lines path { fill: none; stroke: #b7c9df; stroke-width: 2.5; stroke-linecap: round; }
    .map-node { position: absolute; z-index: 2; box-sizing: border-box; touch-action: none; user-select: none; cursor: grab; box-shadow: 0 7px 22px rgba(35,57,83,.10); transition: box-shadow .15s, border-color .15s; }
    .map-node:hover { box-shadow: 0 10px 28px rgba(35,57,83,.16); }
    .map-node.dragging { z-index: 5; cursor: grabbing; box-shadow: 0 14px 34px rgba(0,113,227,.22); }
    .root-node { width: 190px; min-height: 82px; display: flex; flex-direction: column; justify-content: center; padding: 14px 16px; border: 1px solid #086ac4; border-radius: 20px; color: #fff; background: linear-gradient(145deg, #1684eb, #0066c7); }
    .root-node small { opacity: .78; font-size: 10px; letter-spacing: .12em; }
    .root-node strong { margin-top: 5px; font-size: 17px; line-height: 1.35; }
    .level-node { width: 220px; min-height: 88px; padding: 12px 13px; border: 2px solid #bad9f7; border-radius: 15px; background: #fff; }
    .level-node.selected { border-color: #0071e3; box-shadow: 0 0 0 3px #e8f4ff, 0 9px 24px rgba(0,113,227,.14); }
    .level-node-head { display: flex; align-items: flex-start; gap: 7px; }
    .level-node-index { flex: 0 0 auto; color: #0071e3; font-size: 11px; font-weight: 800; letter-spacing: .05em; }
    .level-node-name { flex: 1; min-width: 0; color: #1d1d1f; font-size: 14px; font-weight: 700; line-height: 1.4; word-break: break-word; }
    .level-node-tools { display: flex; gap: 3px; }
    .level-node-desc { margin: 7px 0 0; color: #86868b; font-size: 11px; line-height: 1.45; max-height: 32px; overflow: hidden; }
    .level-node-count { margin-top: 7px; color: #0071e3; font-size: 11px; }
    .pattern-node { width: 210px; min-height: 66px; padding: 11px 13px; border: 1px solid #d7e1ed; border-left: 5px solid #80bfff; border-radius: 13px; background: #fff; }
    .pattern-node.state-third_pass { border-left-color: #36a269; }
    .pattern-node.state-again_wrong { border-left-color: #e05a5a; }
    .pattern-node-title { color: #1d1d1f; font-size: 13px; font-weight: 700; line-height: 1.4; word-break: break-word; }
    .pattern-node-meta { display: flex; gap: 8px; margin-top: 6px; color: #86868b; font-size: 10px; }
    .icon-btn { border: 0; border-radius: 5px; padding: 2px 5px; background: #f3f4f6; color: #515154; cursor: pointer; font-size: 11px; }
    .icon-btn:hover { background: #e8f4ff; color: #0071e3; }
    .icon-btn.danger:hover { background: #fff0f0; color: #c62828; }
    .editor-tools { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-top: 6px; }
    .tool-card { padding: 14px; border: 1px solid #e5e5e7; border-radius: 12px; background: #fafafa; }
    .tool-card h3 { margin: 0 0 10px; color: #1d1d1f; font-size: 14px; }
    .tool-card label { display: block; margin: 8px 0 4px; color: #86868b; font-size: 11px; }
    .tool-card input, .tool-card select, .tool-card textarea { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #c7c7cc; border-radius: 7px; background: #fff; font: inherit; font-size: 13px; }
    .tool-card textarea { min-height: 64px; resize: vertical; }
    .tool-row { display: flex; align-items: end; gap: 7px; flex-wrap: wrap; }
    .tool-row > * { flex: 1; min-width: 130px; }
    .tool-btn { border: 0; border-radius: 7px; padding: 8px 11px; background: #0071e3; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
    .tool-btn.secondary { background: #e8e8ed; color: #515154; }
    .pattern-list { display: flex; flex-direction: column; gap: 6px; margin-top: 9px; }
    .pattern-row { padding: 8px 9px; border: 1px solid #e5e5e7; border-radius: 8px; background: #fff; }
    .pattern-row-head { display: flex; align-items: center; gap: 6px; }
    .pattern-row-name { flex: 1; min-width: 0; color: #1d1d1f; font-size: 12px; font-weight: 600; word-break: break-word; }
    .pattern-row-meta { color: #86868b; font-size: 11px; }
    .pattern-row-tools { display: flex; gap: 4px; }
    .pattern-question-box { display: none; margin-top: 7px; }
    .pattern-question-box.show { display: block; }
    .pattern-question-box .question-search-wrap { display: block; }
    .pattern-question-box .question-search-input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #c7c7cc; border-radius: 6px; font-size: 12px; }
    .pattern-question-box button { margin-top: 6px; border: 0; border-radius: 6px; padding: 5px 9px; background: #0071e3; color: #fff; font-size: 11px; cursor: pointer; }
    .new-pattern-box { display: none; margin-top: 9px; padding-top: 9px; border-top: 1px dashed #d9d9dc; }
    .new-pattern-box.show { display: block; }
    .new-pattern-box .question-search-wrap { display: block; margin-top: 7px; }
    .new-pattern-box .question-search-input { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #c7c7cc; border-radius: 7px; font-size: 12px; }
    .no-level { padding: 60px 20px; color: #86868b; text-align: center; }
    .editor-empty { padding: 60px 20px; color: #86868b; text-align: center; }
    @media (max-width: 900px) { .edit-layout { grid-template-columns: 1fr; } .edit-side { position: static; } .board-choice { flex-direction: row; overflow-x: auto; } .board-choice button { flex: 0 0 auto; } }
    @media (max-width: 700px) { .edit-wrap { padding: 16px 12px 32px; } .edit-main { padding: 15px 13px 24px; } .mindmap-scroll { margin-left: -13px; margin-right: -13px; padding-left: 13px; padding-right: 13px; } .editor-tools { grid-template-columns: 1fr; } }
</style>

<script>
var boards = [], patterns = [], currentBoard = null, selectedLevelSeq = 0;
var ROOT_WIDTH = 190, LEVEL_WIDTH = 220, PATTERN_WIDTH = 210;

function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function api(path, opts) { return fetch('http://127.0.0.1:8000' + path, opts || {}).then(function(r) { return r.json().then(function(d) { if (!r.ok || (d && d.error)) throw new Error((d && (d.detail || d.error)) || '请求失败'); return d; }); }); }
function setStatus(msg, error) { var el = document.getElementById('editStatus'); el.textContent = msg || ''; el.style.color = error ? '#c62828' : '#2e7d32'; }
function stateLabel(s) { return {never:'未挑战', first_pass:'第一次会', second_pass:'第二次会', third_pass:'已通关', again_wrong:'再次出错'}[s] || '未挑战'; }
function rootStorageKey() { return 'mindmap-root-' + (currentBoard ? currentBoard.id : 'none'); }
function getRootPosition() { try { return JSON.parse(localStorage.getItem(rootStorageKey())) || {x:38,y:260}; } catch (e) { return {x:38,y:260}; } }
function setRootPosition(x, y) { localStorage.setItem(rootStorageKey(), JSON.stringify({x:x,y:y})); }

function getLevels() {
    if (!currentBoard) return [];
    var byIndex = {};
    (currentBoard.nodes || []).forEach(function(n) { var i = Math.max(0, Math.round(n.x || 0)); (byIndex[i] = byIndex[i] || []).push(n); });
    (currentBoard.levels || []).forEach(function(l) { var i = Number(l.level_index); if (!byIndex[i]) byIndex[i] = []; });
    return Object.keys(byIndex).map(Number).sort(function(a,b) { return a-b; }).map(function(index) {
        var meta = (currentBoard.levels || []).find(function(l) { return Number(l.level_index) === index; }) || {};
        return {index:index, name:meta.name || '', description:meta.description || '', layout_x:meta.layout_x, layout_y:meta.layout_y, meta:meta, patterns:(byIndex[index] || []).slice().sort(function(a,b) { return (a.y || 0) - (b.y || 0); })};
    });
}

function autoArrange(force) {
    var levels = getLevels(), cursor = 42;
    levels.forEach(function(level) {
        var groupHeight = Math.max(112, level.patterns.length * 88);
        if (force || level.meta.layout_x == null || level.meta.layout_y == null) {
            level.meta.layout_x = 305;
            level.meta.layout_y = cursor + Math.max(0, (groupHeight - 88) / 2);
        }
        level.patterns.forEach(function(node, i) {
            if (force || node.layout_x == null || node.layout_y == null) {
                node.layout_x = 650;
                node.layout_y = cursor + i * 88 + Math.max(0, (groupHeight - level.patterns.length * 88) / 2);
            }
        });
        cursor += groupHeight + 42;
    });
    if (force || !localStorage.getItem(rootStorageKey())) setRootPosition(44, Math.max(42, cursor / 2 - 62));
}

function mapSize(levels) {
    var maxX = 1040, maxY = 600;
    var root = getRootPosition(); maxX = Math.max(maxX, root.x + ROOT_WIDTH + 80); maxY = Math.max(maxY, root.y + 130);
    levels.forEach(function(level) {
        maxX = Math.max(maxX, Number(level.meta.layout_x || 0) + LEVEL_WIDTH + 100);
        maxY = Math.max(maxY, Number(level.meta.layout_y || 0) + 150);
        level.patterns.forEach(function(node) { maxX = Math.max(maxX, Number(node.layout_x || 0) + PATTERN_WIDTH + 100); maxY = Math.max(maxY, Number(node.layout_y || 0) + 120); });
    });
    return {width:maxX, height:maxY};
}

function loadAll() {
    Promise.all([api('/boards'), api('/patterns')]).then(function(data) {
        boards = data[0] || []; patterns = data[1] || [];
        var oldId = currentBoard && currentBoard.id;
        currentBoard = boards.find(function(b) { return b.id === oldId; }) || boards[0] || null;
        if (currentBoard) selectedLevelSeq = Math.min(selectedLevelSeq, Math.max(0, getLevels().length - 1));
        renderBoardChoice(); renderEditor(); setStatus('');
    }).catch(function(e) { document.getElementById('editorContent').innerHTML = '<div class="editor-empty" style="color:#c62828;">加载失败：' + escapeHtml(e.message) + '</div>'; });
}

function renderBoardChoice() {
    var el = document.getElementById('boardChoice');
    el.innerHTML = boards.map(function(b) { return '<button class="' + (currentBoard && b.id === currentBoard.id ? 'active' : '') + '" onclick="selectBoard(' + b.id + ')">' + escapeHtml(b.category) + '</button>'; }).join('') || '<div class="editor-empty">暂无板块</div>';
}
function selectBoard(id) { currentBoard = boards.find(function(b) { return b.id === id; }) || null; selectedLevelSeq = 0; renderBoardChoice(); renderEditor(); }

function renderLevelNode(level, seq) {
    var selected = seq === selectedLevelSeq;
    var html = '<div class="map-node level-node' + (selected ? ' selected' : '') + '" id="levelNode_' + seq + '" data-node-type="level" data-node-key="' + seq + '" style="left:' + level.meta.layout_x + 'px;top:' + level.meta.layout_y + 'px" onclick="selectLevel(' + seq + ')"><div class="level-node-head"><span class="level-node-index">L' + String(seq + 1).padStart(2, '0') + '</span><span class="level-node-name">' + escapeHtml(level.name || ('第 ' + (seq + 1) + ' 关')) + '</span><span class="level-node-tools">';
    html += '<button class="icon-btn" title="前移" onclick="event.stopPropagation();moveLevel(' + seq + ',-1)"' + (seq === 0 ? ' disabled' : '') + '>↑</button><button class="icon-btn" title="后移" onclick="event.stopPropagation();moveLevel(' + seq + ',1)"' + (seq === getLevels().length - 1 ? ' disabled' : '') + '>↓</button><button class="icon-btn danger" title="删除" onclick="event.stopPropagation();removeLevel(' + seq + ')">×</button></span></div>';
    if (level.description) html += '<div class="level-node-desc">' + escapeHtml(level.description) + '</div>';
    html += '<div class="level-node-count">' + level.patterns.length + ' 个套路</div></div>';
    return html;
}

function renderPatternNode(node, levelSeq) {
    return '<div class="map-node pattern-node state-' + escapeHtml(node.state || 'never') + '" id="patternNode_' + node.pattern_id + '" data-node-type="pattern" data-node-key="' + node.pattern_id + '" data-level-seq="' + levelSeq + '" style="left:' + node.layout_x + 'px;top:' + node.layout_y + 'px" onclick="selectLevel(' + levelSeq + ')"><div class="pattern-node-title">' + escapeHtml(node.name || ('套路 #' + node.pattern_id)) + '</div><div class="pattern-node-meta"><span>' + stateLabel(node.state) + '</span><span>' + (node.question_id ? '已绑定题目' : '空套路') + '</span></div></div>';
}

function renderEditor() {
    var el = document.getElementById('editorContent');
    if (!currentBoard) { el.innerHTML = '<div class="editor-empty">暂无板块</div>'; return; }
    autoArrange(false);
    var levels = getLevels(), size = mapSize(levels), root = getRootPosition();
    var html = '<div class="editor-board-head"><div class="editor-board-name">' + escapeHtml(currentBoard.name || currentBoard.category) + '</div><div class="editor-board-count">' + levels.length + ' 个关卡 · ' + (currentBoard.nodes || []).length + ' 个套路</div></div>';
    html += '<div class="mindmap-toolbar"><span>拖动任意节点自由排版，点击关卡或套路编辑内容</span><button class="edit-btn secondary" onclick="resetLayout()">自动整理</button></div>';
    html += '<div class="mindmap-scroll"><div id="mindmapCanvas" class="mindmap-canvas" style="width:' + size.width + 'px;height:' + size.height + 'px"><svg id="mindmapLines" class="mindmap-lines" width="' + size.width + '" height="' + size.height + '"></svg>';
    html += '<div class="map-node root-node" id="rootNode" data-node-type="root" data-node-key="root" style="left:' + root.x + 'px;top:' + root.y + 'px"><small>知识板块</small><strong>' + escapeHtml(currentBoard.name || currentBoard.category) + '</strong></div>';
    levels.forEach(function(level, seq) { html += renderLevelNode(level, seq); level.patterns.forEach(function(node) { html += renderPatternNode(node, seq); }); });
    html += '</div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;"><button class="edit-btn" onclick="newLevel()">＋ 新建关卡</button>';
    if (levels.length) html += '<button class="edit-btn secondary" onclick="selectLevel(' + selectedLevelSeq + ')">编辑当前关卡</button>';
    html += '</div>';
    if (levels.length) html += renderTools(levels[Math.min(selectedLevelSeq, levels.length - 1)], Math.min(selectedLevelSeq, levels.length - 1));
    el.innerHTML = html;
    requestAnimationFrame(function() { bindMindmapDrag(); drawConnections(); });
}

function renderTools(level, seq) {
    var inBoard = (currentBoard.nodes || []).map(function(n) { return n.pattern_id; });
    var available = patterns.filter(function(p) { return p.category === currentBoard.category && inBoard.indexOf(p.id) < 0; });
    var html = '<div class="editor-tools"><div class="tool-card"><h3>编辑关卡 · 第 ' + (seq + 1) + ' 关</h3><label>关卡名称</label><input id="levelNameInput" value="' + escapeHtml(level.name || '') + '" placeholder="例如：集合基础任务"><label>关卡说明</label><textarea id="levelDescInput" placeholder="记录这一关的知识点或通关目标">' + escapeHtml(level.description || '') + '</textarea><div style="margin-top:9px;"><button class="tool-btn" onclick="saveLevelMeta(' + seq + ')">保存关卡信息</button></div></div>';
    html += '<div class="tool-card"><h3>本关套路 · ' + level.patterns.length + '</h3><div class="pattern-list">' + (level.patterns.map(function(n, i) { return renderPatternRow(n, i, level.patterns.length); }).join('') || '<div class="editor-empty" style="padding:15px 4px;">本关暂无套路</div>') + '</div>';
    html += '<label>添加已有套路</label><div class="tool-row"><select id="availablePatternSelect"><option value="">选择套路...</option>' + available.map(function(p) { return '<option value="' + p.id + '">' + escapeHtml(p.name) + '</option>'; }).join('') + '</select><button class="tool-btn" onclick="addExistingPattern(' + seq + ')">添加</button></div>';
    html += '<button class="tool-btn secondary" style="margin-top:9px;" onclick="toggleNewPatternBox()">＋ 新建套路</button><div id="newPatternBox" class="new-pattern-box"><input id="newPatternName" placeholder="套路名称"><div class="question-search-wrap"><input id="newPatternSearch" class="question-search-input" data-target-id="newPatternQid" data-results-id="newPatternResults" placeholder="可选：搜索并绑定第一道题"><input type="hidden" id="newPatternQid"><div id="newPatternResults" class="question-search-results"></div></div><button class="tool-btn" style="margin-top:7px;" onclick="createPattern(' + seq + ')">创建并加入本关</button></div></div></div>';
    return html;
}

function renderPatternRow(n, index, total) {
    var html = '<div class="pattern-row"><div class="pattern-row-head"><span class="pattern-row-name">' + escapeHtml(n.name || ('套路 #' + n.pattern_id)) + '</span><span class="pattern-row-meta">' + (n.question_id ? '已绑定' : '空套路') + '</span><span class="pattern-row-tools"><button class="icon-btn" onclick="movePattern(' + n.pattern_id + ',-1)"' + (index === 0 ? ' disabled' : '') + '>↑</button><button class="icon-btn" onclick="movePattern(' + n.pattern_id + ',1)"' + (index === total - 1 ? ' disabled' : '') + '>↓</button><button class="icon-btn danger" onclick="removePattern(' + n.pattern_id + ')">移出</button></span></div>';
    if (!n.question_id) html += '<div class="pattern-question-box" id="patternQuestionBox_' + n.pattern_id + '"><div class="question-search-wrap"><input id="patternQuestionSearch_' + n.pattern_id + '" class="question-search-input" data-target-id="patternQuestionId_' + n.pattern_id + '" data-results-id="patternQuestionResults_' + n.pattern_id + '" placeholder="搜索并选择第一道题"><input type="hidden" id="patternQuestionId_' + n.pattern_id + '"><div id="patternQuestionResults_' + n.pattern_id + '" class="question-search-results"></div></div><button onclick="addQuestionToPattern(' + n.pattern_id + ')">挂载母题</button></div><button class="icon-btn" style="margin-top:6px;" onclick="toggleQuestionBox(' + n.pattern_id + ')">＋ 添加第一道题</button>';
    html += '</div>';
    return html;
}

function drawConnections() {
    var canvas = document.getElementById('mindmapCanvas'), svg = document.getElementById('mindmapLines'), root = document.getElementById('rootNode');
    if (!canvas || !svg || !root) return;
    var canvasRect = canvas.getBoundingClientRect(), paths = [];
    function connect(from, to) {
        if (!from || !to) return;
        var a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
        var x1 = a.right - canvasRect.left, y1 = a.top - canvasRect.top + a.height / 2;
        var x2 = b.left - canvasRect.left, y2 = b.top - canvasRect.top + b.height / 2;
        if (x2 < x1) { x1 = a.left - canvasRect.left; x2 = b.right - canvasRect.left; }
        var bend = Math.max(45, Math.abs(x2 - x1) * .45);
        paths.push('<path d="M ' + x1 + ' ' + y1 + ' C ' + (x1 + (x2 >= x1 ? bend : -bend)) + ' ' + y1 + ', ' + (x2 - (x2 >= x1 ? bend : -bend)) + ' ' + y2 + ', ' + x2 + ' ' + y2 + '"></path>');
    }
    getLevels().forEach(function(level, seq) {
        var levelEl = document.getElementById('levelNode_' + seq);
        connect(root, levelEl);
        level.patterns.forEach(function(node) { connect(levelEl, document.getElementById('patternNode_' + node.pattern_id)); });
    });
    svg.innerHTML = paths.join('');
}

function updateNodePosition(type, key, x, y) {
    if (type === 'root') { setRootPosition(x, y); return; }
    if (type === 'level') {
        var level = getLevels()[Number(key)];
        if (level) { level.meta.layout_x = x; level.meta.layout_y = y; }
        return;
    }
    var node = (currentBoard.nodes || []).find(function(n) { return Number(n.pattern_id) === Number(key); });
    if (node) { node.layout_x = x; node.layout_y = y; }
}

function bindMindmapDrag() {
    var canvas = document.getElementById('mindmapCanvas');
    if (!canvas) return;
    canvas.querySelectorAll('.map-node').forEach(function(node) {
        node.addEventListener('click', function(e) { if (node._dragMoved) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);
        node.addEventListener('pointerdown', function(e) {
            if (e.button !== 0 || e.target.closest('button,input,textarea,select')) return;
            e.preventDefault();
            var startLeft = parseFloat(node.style.left) || 0, startTop = parseFloat(node.style.top) || 0;
            var startX = e.clientX, startY = e.clientY;
            node._dragMoved = false; node.classList.add('dragging'); node.setPointerCapture(e.pointerId);
            function move(ev) {
                var dx = ev.clientX - startX, dy = ev.clientY - startY;
                if (Math.abs(dx) + Math.abs(dy) > 4) node._dragMoved = true;
                var left = Math.max(8, Math.min(canvas.clientWidth - node.offsetWidth - 8, startLeft + dx));
                var top = Math.max(8, Math.min(canvas.clientHeight - node.offsetHeight - 8, startTop + dy));
                node.style.left = Math.round(left) + 'px'; node.style.top = Math.round(top) + 'px'; drawConnections();
            }
            function end(ev) {
                node.classList.remove('dragging'); node.releasePointerCapture(ev.pointerId);
                node.removeEventListener('pointermove', move); node.removeEventListener('pointerup', end); node.removeEventListener('pointercancel', end);
                if (node._dragMoved) {
                    updateNodePosition(node.dataset.nodeType, node.dataset.nodeKey, parseFloat(node.style.left), parseFloat(node.style.top));
                    setStatus('位置已调整，点击右上角“保存布局”即可保存');
                    setTimeout(function() { node._dragMoved = false; }, 0);
                }
            }
            node.addEventListener('pointermove', move); node.addEventListener('pointerup', end); node.addEventListener('pointercancel', end);
        });
    });
}

function resetLayout() { autoArrange(true); renderEditor(); setStatus('已自动整理，点击右上角“保存布局”即可保存'); }
function selectLevel(seq) { selectedLevelSeq = seq; renderEditor(); }
function toggleNewPatternBox() { var el = document.getElementById('newPatternBox'); if (el) el.classList.toggle('show'); }

async function newLevel() {
    if (!currentBoard) return;
    var levels = getLevels();
    var next = levels.length ? Math.max.apply(null, levels.map(function(l) { return l.index; })) + 1 : 0;
    currentBoard.levels = currentBoard.levels || [];
    currentBoard.levels.push({level_index:next, name:'', description:'', knowledge_points:[], layout_x:305, layout_y:50 + levels.length * 150});
    selectedLevelSeq = levels.length;
    await saveBoard();
}

async function removeLevel(seq) {
    var levels = getLevels();
    if (!levels[seq] || !confirm('删除这一关及其中的套路吗？')) return;
    var index = levels[seq].index;
    currentBoard.nodes = (currentBoard.nodes || []).filter(function(n) { return Math.round(n.x || 0) !== index; });
    currentBoard.levels = (currentBoard.levels || []).filter(function(l) { return Number(l.level_index) !== index; });
    renumberLevels(); selectedLevelSeq = Math.max(0, Math.min(seq, getLevels().length - 1)); await saveBoard();
}

async function moveLevel(seq, dir) {
    var levels = getLevels(), target = seq + dir;
    if (target < 0 || target >= levels.length) return;
    var tmp = levels[seq]; levels[seq] = levels[target]; levels[target] = tmp;
    levels.forEach(function(level, i) { level.patterns.forEach(function(n, y) { n.x = i; n.y = y; }); });
    currentBoard.nodes = levels.reduce(function(all, l) { return all.concat(l.patterns); }, []);
    currentBoard.levels = levels.map(function(l, i) { return {level_index:i, name:l.name, description:l.description, knowledge_points:[], layout_x:l.meta.layout_x, layout_y:l.meta.layout_y}; });
    selectedLevelSeq = target; await saveBoard();
}

function renumberLevels() {
    var levels = getLevels();
    levels.forEach(function(level, i) { level.patterns.forEach(function(n, y) { n.x = i; n.y = y; }); });
    currentBoard.nodes = levels.reduce(function(all, l) { return all.concat(l.patterns); }, []);
    currentBoard.levels = levels.map(function(l, i) { return {level_index:i, name:l.name, description:l.description, knowledge_points:[], layout_x:l.meta.layout_x, layout_y:l.meta.layout_y}; });
}

async function saveLevelMeta(seq) {
    var levels = getLevels(), level = levels[seq];
    if (!level) return;
    level.name = (document.getElementById('levelNameInput').value || '').trim();
    level.description = document.getElementById('levelDescInput').value || '';
    currentBoard.levels = levels.map(function(l) { return {level_index:l.index, name:l.name, description:l.description, knowledge_points:[], layout_x:l.meta.layout_x, layout_y:l.meta.layout_y}; });
    await saveBoard();
}

async function addExistingPattern(seq) {
    var id = parseInt(document.getElementById('availablePatternSelect').value) || 0;
    var p = patterns.find(function(x) { return x.id === id; });
    if (!p) { setStatus('请选择套路', true); return; }
    var levels = getLevels(), level = levels[seq];
    if (!level) return;
    currentBoard.nodes.push({pattern_id:p.id, question_id:p.mother_id || null, x:level.index, y:level.patterns.length, layout_x:Number(level.meta.layout_x || 305) + 345, layout_y:Number(level.meta.layout_y || 50) + level.patterns.length * 78, name:p.name, state:(p.mastery || {}).state || 'never', question_type:''});
    await saveBoard();
}

async function createPattern(seq) {
    var name = (document.getElementById('newPatternName').value || '').trim();
    var qid = parseInt(document.getElementById('newPatternQid').value) || null;
    if (!name) { setStatus('请填写套路名称', true); return; }
    try {
        var p = await api('/patterns/mother', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question_id:qid, category:currentBoard.category, name:name})});
        var levels = getLevels(), level = levels[seq];
        currentBoard.nodes.push({pattern_id:p.pattern_id, question_id:p.mother_id || null, x:level.index, y:level.patterns.length, layout_x:Number(level.meta.layout_x || 305) + 345, layout_y:Number(level.meta.layout_y || 50) + level.patterns.length * 78, name:p.name, state:'never', question_type:''});
        await saveBoard();
    } catch (e) { setStatus('创建失败：' + e.message, true); }
}

async function movePattern(pid, dir) {
    var levels = getLevels(), level = levels[selectedLevelSeq];
    if (!level) return;
    var i = level.patterns.findIndex(function(n) { return n.pattern_id === pid; }), j = i + dir;
    if (i < 0 || j < 0 || j >= level.patterns.length) return;
    var tmp = level.patterns[i]; level.patterns[i] = level.patterns[j]; level.patterns[j] = tmp;
    level.patterns.forEach(function(n, y) { n.x = level.index; n.y = y; });
    currentBoard.nodes = levels.reduce(function(all, l) { return all.concat(l.patterns); }, []);
    await saveBoard();
}

async function removePattern(pid) {
    if (!confirm('将这个套路移出当前关卡吗？')) return;
    currentBoard.nodes = (currentBoard.nodes || []).filter(function(n) { return n.pattern_id !== pid; });
    await saveBoard();
}

function toggleQuestionBox(pid) { var el = document.getElementById('patternQuestionBox_' + pid); if (el) el.classList.toggle('show'); }
async function addQuestionToPattern(pid) {
    var qid = parseInt(document.getElementById('patternQuestionId_' + pid).value) || 0;
    if (!qid) { setStatus('请先搜索并选择题目', true); return; }
    try { await api('/patterns/' + pid + '/questions', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question_id:qid, role:'mother'})}); await loadAll(); setStatus('第一道题已添加'); } catch (e) { setStatus('添加失败：' + e.message, true); }
}

async function saveBoard() {
    if (!currentBoard) return;
    var payload = {nodes:(currentBoard.nodes || []).map(function(n) { return {question_id:n.question_id || null, pattern_id:n.pattern_id || null, x:Math.round(n.x || 0), y:Math.round(n.y || 0), layout_x:n.layout_x == null ? null : Math.round(n.layout_x), layout_y:n.layout_y == null ? null : Math.round(n.layout_y)}; }), edges:[], levels:(currentBoard.levels || []).map(function(l) { return {level_index:l.level_index, name:l.name || '', description:l.description || '', layout_x:l.layout_x == null ? null : Math.round(l.layout_x), layout_y:l.layout_y == null ? null : Math.round(l.layout_y)}; })};
    try {
        var d = await api('/boards/' + currentBoard.id, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
        if (!d || !d.id) throw new Error('保存失败');
        var keep = selectedLevelSeq; boards = boards.map(function(b) { return b.id === d.id ? d : b; }); currentBoard = d; selectedLevelSeq = Math.min(keep, Math.max(0, getLevels().length - 1)); renderBoardChoice(); renderEditor(); setStatus('已保存');
    } catch (e) { setStatus('保存失败：' + e.message, true); }
}

document.addEventListener('DOMContentLoaded', loadAll);
</script>
