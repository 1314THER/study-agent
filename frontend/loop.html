<script>
var state = {
    patternId: null,
    data: null,
    queue: [],
    queueIdx: 0,
    currentQuestion: null,
    timerStart: null,
    timerElapsed: 0,
    timerHandle: null,
    questionAttempts: 0,
    sessionFailed: false,
    motherOnlyMode: false,
    allQuestionsPassed: false,
    viewMode: 'question',
    failMessage: '',
    restoring: false
};

function saveDraft() {
    try {
        localStorage.setItem('loop_draft', JSON.stringify({
            patternId: state.patternId,
            queue: state.queue.map(function(q) { return q.role; }),
            queueIdx: state.queueIdx,
            questionAttempts: state.questionAttempts,
            sessionFailed: state.sessionFailed,
            motherOnlyMode: state.motherOnlyMode,
            allQuestionsPassed: state.allQuestionsPassed,
            viewMode: state.viewMode,
            failMessage: state.failMessage,
            timerStart: state.timerStart,
            timerElapsed: state.timerElapsed,
            currentRole: state.currentQuestion ? state.currentQuestion.role : null
        }));
    } catch (e) {}
}

function cancelLoop() {
    clearInterval(state.timerHandle);
    closeAiGenModal();
    clearDraft();
    window.location.href = 'index.html';
}

function clearDraft() {
    try { localStorage.removeItem('loop_draft'); } catch (e) {}
}

function qs(name) {
    return new URLSearchParams(location.search).get(name);
}

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function formatChoiceQuestion(text) {
    if (!text) return '';
    var s = String(text).replace(/\r\n/g, '\n');
    var parts = s.split(/(\$\$[^$]*\$\$|\$[^$\n]*\$)/g);
    for (var i = 0; i < parts.length; i++) {
        if (parts[i].charAt(0) === '$') continue;
        parts[i] = parts[i].replace(/(?<![A-Za-z0-9$\\])([A-H])\s*[.．、)]\s*/g, '\n$1. ');
    }
    s = parts.join('');
    var lines = s.split('\n');
    var out = [];
    for (var j = 0; j < lines.length; j++) {
        var line = lines[j].trim();
        if (line) out.push(line);
    }
    return out.join('\n');
}

function renderMath(el) {
    try {
        renderMathInElement(el, {delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
        ], ignoredTags: []});
    } catch (e) {}
}

async function api(path, opts) {
    var r = await fetch('http://127.0.0.1:8000' + path, opts || {});
    return r.json();
}

function stateLabel(s) {
    return {never: '从来都不会', first_pass: '第一次会', second_pass: '第二次会', third_pass: '第三次会', again_wrong: '再次出错'}[s] || s || '从未挑战';
}

function stateClass(s) {
    return s === 'third_pass' ? 'state-third_pass' : (s === 'never' ? 'state-never' : 'state-first_pass');
}

async function pickPattern() {
    var patterns = await api('/patterns');
    var html = '<div class="loop-card"><h2>选择套路</h2>';
    html += '<div style="display:flex;flex-direction:column;gap:8px;">';
    for (var i = 0; i < patterns.length; i++) {
        var p = patterns[i];
        html += '<button class="loop-btn secondary" style="text-align:left;" onclick="startPattern(' + p.id + ')">';
        html += escapeHtml(p.category) + ' · ' + escapeHtml(p.name);
        html += ' <span class="state-badge ' + stateClass(p.mastery && p.mastery.state) + '">' + escapeHtml(stateLabel(p.mastery && p.mastery.state)) + '</span>';
        html += '</button>';
    }
    html += '</div></div>';
    document.getElementById('loopBody').innerHTML = html;
}

function startPattern(id) {
    history.replaceState(null, '', '?pattern_id=' + id);
    clearDraft();
    state.patternId = id;
    loadLoop();
}

async function loadLoop() {
    if (!state.patternId) {
        document.getElementById('loopTitle').textContent = '套路循环';
        await pickPattern();
        return;
    }
    state.motherOnlyMode = false;
    var d = await api('/patterns/' + state.patternId + '/loop');
    if (d.error) {
        document.getElementById('loopBody').innerHTML = '<div class="loop-card">加载失败：' + escapeHtml(d.detail || d.error) + '</div>';
        return;
    }
    state.data = d;
    renderHeader();
    if (state.restoring) {
        restoreDraftState();
    } else {
        buildQueue();
    }
}

function restoreDraftState() {
    var draft = null;
    try { draft = JSON.parse(localStorage.getItem('loop_draft') || 'null'); } catch (e) {}
    if (!draft || draft.patternId !== state.patternId) {
        state.restoring = false;
        buildQueue();
        return;
    }
    state.sessionFailed = draft.sessionFailed || false;
    state.motherOnlyMode = draft.motherOnlyMode || false;
    state.allQuestionsPassed = draft.allQuestionsPassed || false;
    state.queue = (draft.queue || []).map(function(role) {
        return state.data.questions.find(function(q) { return q.role === role; });
    }).filter(Boolean);
    state.queueIdx = Math.min(draft.queueIdx || 0, Math.max(state.queue.length - 1, 0));
    state.currentQuestion = state.queue[state.queueIdx] || null;
    state.questionAttempts = draft.questionAttempts || 0;
    state.viewMode = draft.viewMode || 'question';
    state.failMessage = draft.failMessage || '';
    state.timerStart = draft.timerStart || null;
    state.timerElapsed = draft.timerElapsed || 0;
    state.restoring = false;
    if (!state.currentQuestion) {
        startQuestion();
        return;
    }
    renderQuestion();
    if (state.viewMode === 'fail') {
        renderFailActions(state.failMessage || '');
        var timerEl = document.getElementById('loopTimer');
        if (timerEl) {
            timerEl.textContent = state.timerElapsed.toFixed(1) + 's';
            timerEl.classList.toggle('over', state.timerElapsed > (state.data.pattern.max_time_seconds || 120));
        }
    } else {
        startTimer();
        saveDraft();
    }
}

function renderHeader() {
    var p = state.data.pattern;
    var m = p.mastery || {};
    var due = m.need_check && m.next_check_at && new Date(m.next_check_at.replace(' ', 'T')) <= new Date();
    var html = '<div class="loop-card">';
    html += '<div class="loop-meta">';
    html += '<span class="tag tag-category">' + escapeHtml(p.category) + '</span>';
    html += '<span class="tag ' + stateClass(m.state) + '">' + escapeHtml(stateLabel(m.state)) + '</span>';
    html += '<span class="tag tag-id">套路 #' + p.id + '</span>';
    html += '</div>';
    html += '<div style="font-size:18px;font-weight:600;margin-top:10px;">' + escapeHtml(p.name) + '</div>';
    html += '<div class="loop-time-box"><label>单题限时（秒）</label><input id="maxTimeInput" type="number" min="10" value="' + (p.max_time_seconds || 120) + '">';
    html += '<button class="loop-btn secondary" onclick="saveMaxTime()">保存限时</button></div>';
    if (due) html += '<div class="loop-banner">该套路已到复查时间，进入后开始复查。</div>';
    html += '</div>';
    document.getElementById('loopTitle').textContent = p.name;
    document.getElementById('loopBody').innerHTML = html;
}

async function saveMaxTime() {
    var v = parseInt(document.getElementById('maxTimeInput').value);
    if (!v || v < 10) return;
    await api('/patterns/' + state.patternId, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({max_time_seconds: v})
    });
    loadLoop();
}

function buildQueue() {
    var p = state.data.pattern;
    var m = p.mastery || {};
    var never = m.state === 'never';
    var questions = state.data.questions || [];
    var mother = questions.find(function(q) { return q.role === 'mother'; });
    var variants = questions.filter(function(q) { return q.role !== 'mother' && q.question_id; });
    var needVariants = never || state.sessionFailed;
    if (needVariants && variants.length < 3) {
        renderGenerateButton();
        return;
    }
    state.queue = [mother];
    if (needVariants) state.queue = state.queue.concat(variants);
    state.queueIdx = 0;
    state.allQuestionsPassed = false;
    startQuestion();
}

function renderGenerateButton() {
    var html = '<div class="loop-card"><h2>还需要 3 道变式题</h2>';
    html += '<p style="color:#515154;font-size:14px;line-height:1.7;">当前套路还没有足够的变式题。先挑战母题，之后用变式题巩固。';
    html += '点击生成会调用 AI 并自动保存为变式 1/2/3，可能需要一些时间。</p>';
    html += '<div class="loop-actions"><button class="loop-btn" onclick="generateVariants()">AI 生成 3 道变式</button>';
    html += '<button class="loop-btn secondary" onclick="startMotherOnly()">先只挑战母题</button></div></div>';
    document.getElementById('loopBody').innerHTML += html;
    state.queue = [state.data.questions.find(function(q) { return q.role === 'mother'; })];
    state.queueIdx = 0;
    state.motherOnlyMode = true;
    saveDraft();
}

var _aiGenTimers = [];

function _clearAiGenTimers() {
    for (var i = 0; i < _aiGenTimers.length; i++) clearTimeout(_aiGenTimers[i]);
    _aiGenTimers = [];
}

function closeAiGenModal() {
    _clearAiGenTimers();
    var ov = document.getElementById('aiGenOverlay');
    if (ov) ov.style.display = 'none';
}

function aiGenProgressHtml(pct, stage, detail) {
    var stages = ['AI出题', 'Solver', 'Verifier', 'Formatter'];
    var idx = {generating: 0, solver: 1, verifier: 2, formatter: 3, done: 3}[stage] || 0;
    var html = '<div class="ai-gen-progress">';
    html += '<div class="ai-gen-progress-stages">';
    for (var i = 0; i < stages.length; i++) {
        var cls = i < idx ? 'completed' : (i === idx ? 'active' : '');
        html += '<div class="ai-gen-progress-stage ' + cls + '">' +
            '<span class="ai-gen-progress-dot"></span><span>' + stages[i] + '</span></div>';
    }
    html += '</div>';
    html += '<div class="ai-gen-progress-bar"><div class="ai-gen-progress-fill" style="width:' + pct + '%"></div></div>';
    html += '<div class="ai-gen-progress-pct">' + pct + '%</div>';
    html += '<div class="ai-gen-progress-text">' + escapeHtml(detail || '') + '</div>';
    html += '</div>';
    return html;
}

function aiGenErrorHtml(msg) {
    return '<div class="ai-gen-status" style="color:#b3261e;">' + escapeHtml(msg || '生成失败') + '</div>';
}

function aiGenDifficultyText(c) {
    if (!c || !c.difficulty) return '';
    var lv = c.difficulty.level || '';
    var sc = c.difficulty.total_score;
    return lv + (sc !== undefined && sc !== null ? ' · ' + sc + '分' : '');
}

function escJsStr(s) {
    return escapeHtml(String(s)).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, '\\n');
}

function aiTeachNewQuestion(q) {
    localStorage.setItem('_teach_question', q);
    window.open('teach.html?standalone=1', '_blank');
}

function aiGenUpdateProgress(pct, stage, detail) {
    var ct = document.getElementById('aiGenContent');
    if (!ct) return;
    var wrap = document.getElementById('aiGenProgressWrap');
    var html = '<div id="aiGenProgressWrap">' + aiGenProgressHtml(pct, stage, detail) + '</div>';
    if (wrap) {
        wrap.outerHTML = html;
    } else {
        ct.insertAdjacentHTML('beforeend', html);
    }
}

function renderAiGenResult(d) {
    var ct = document.getElementById('aiGenContent');
    if (!ct) return;
    if (!d || d.error) {
        ct.innerHTML = '<div class="ai-gen-status" style="color:#b3261e;">' + escapeHtml((d && (d.detail || d.message)) || '生成失败') + '</div>';
        return;
    }
    var list = d.candidates || [];
    var html = '<div class="ai-gen-status">生成 ' + list.length + ' 道，通过 ' + (d.accepted || 0) + ' 道，淘汰 ' + (d.rejected || 0) + ' 道。通过的题目已保存为套路变式。</div>';
    if (!list.length) {
        html += '<div class="ai-gen-status">没有通过校验的题目，稍后再试一次。</div>';
        html += '<div class="ai-gen-actions"><button class="ai-gen-action ai-gen-action-primary" onclick="closeAiGenModal();loadLoop()">完成并刷新套路循环</button></div>';
        ct.insertAdjacentHTML('beforeend', html);
        return;
    }
    for (var i = 0; i < list.length; i++) {
        var c = list[i];
        var ok = c.status === 'accepted';
        var cls = ok ? 'ai-gen-accepted' : 'ai-gen-rejected';
        html += '<div class="ai-gen-card ' + cls + '">';
        html += '<div class="ai-gen-q">' + escapeHtml(c.question || '') + '</div>';
        html += '<div class="ai-gen-tags">';
        if (ok) {
            html += '<span class="ai-gen-tag ai-gen-tag-ok">通过 · 贴合度 ' + escapeHtml(String(c.fit_score || 0)) + '</span>';
            var dt = aiGenDifficultyText(c);
            if (dt) html += '<span class="ai-gen-tag">' + escapeHtml(dt) + '</span>';
        } else {
            html += '<span class="ai-gen-tag ai-gen-tag-bad">未通过</span>';
        }
        if (c.design_focus) html += '<span class="ai-gen-tag">' + escapeHtml(c.design_focus) + '</span>';
        html += '</div>';
        if (ok) {
            html += '<div class="ai-gen-actions">' +
                '<button class="ai-gen-action ai-gen-action-primary" onclick="aiTeachNewQuestion(\'' + escJsStr(c.question) + '\')">📖 手把手教学</button>';
            if (c.question_id) {
                html += '<button class="ai-gen-action ai-gen-action-plain" onclick="localStorage.setItem(\'_open_question_id\', ' + c.question_id + ');window.open(\'history.html\', \'_blank\')">查看解析</button>';
            }
            html += '</div>';
        } else if (c.rejected_reason) {
            html += '<div class="ai-gen-note">淘汰原因：' + escapeHtml(c.rejected_reason) + '</div>';
        }
        html += '</div>';
    }
    html += '<div class="ai-gen-actions"><button class="ai-gen-action ai-gen-action-primary" onclick="closeAiGenModal();loadLoop()">完成并刷新套路循环</button></div>';
    ct.insertAdjacentHTML('beforeend', html);
    if (window.renderMathInElement) {
        try { renderMathInElement(ct, {delimiters: [{left: '$$', right: '$$', display: true},{left: '$', right: '$', display: false}], ignoredTags: ['script', 'style'] }); } catch (e) {}
    }
}

async function generateVariants() {
    var ov = document.getElementById('aiGenOverlay');
    var ct = document.getElementById('aiGenContent');
    if (!ov || !ct) return;
    _clearAiGenTimers();
    ov.style.display = 'flex';
    ct.innerHTML = '';
    var pct = 4;
    aiGenUpdateProgress(pct, 'generating', '正在启动变式生成...');
    var timer = setInterval(function() {
        pct = Math.min(90, pct + 1);
        var stage, detail;
        if (pct < 25) {
            stage = 'generating';
            detail = '正在准备 AI 出题...';
        } else if (pct < 55) {
            stage = 'solver';
            detail = 'AI 正在出题并解题...';
        } else if (pct < 78) {
            stage = 'verifier';
            detail = '正在校验步骤...';
        } else {
            stage = 'formatter';
            detail = '正在整理入库...';
        }
        aiGenUpdateProgress(pct, stage, detail);
    }, 500);
    _aiGenTimers.push(timer);
    try {
        var d = await api('/patterns/' + state.patternId + '/ensure-variants', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({})
        });
        _clearAiGenTimers();
        if (d.error) {
            aiGenUpdateProgress(90, 'formatter', '生成失败');
            ct.insertAdjacentHTML('beforeend', aiGenErrorHtml(d.detail || d.error || '生成失败'));
            return;
        }
        aiGenUpdateProgress(100, 'done', '生成完成');
        renderAiGenResult(d.result || {candidates: [], accepted: 0, rejected: 0});
    } catch (e) {
        _clearAiGenTimers();
        aiGenUpdateProgress(90, 'formatter', '生成失败');
        ct.insertAdjacentHTML('beforeend', aiGenErrorHtml('请求失败：' + (e.message || '无法连接后端')));
    }
}

function startMotherOnly() {
    var questions = state.data.questions || [];
    state.queue = [questions.find(function(q) { return q.role === 'mother'; })];
    state.queueIdx = 0;
    state.motherOnlyMode = true;
    startQuestion();
}

function startQuestion() {
    if (state.queueIdx >= state.queue.length) {
        finishAllPassed();
        return;
    }
    state.currentQuestion = state.queue[state.queueIdx];
    state.questionAttempts = 0;
    state.timerStart = null;
    state.timerElapsed = 0;
    state.viewMode = 'question';
    state.failMessage = '';
    renderQuestion();
    startTimer();
    saveDraft();
}

function renderQuestion() {
    var q = state.currentQuestion;
    var idx = state.queueIdx + 1;
    var total = state.queue.length;
    var roleLabel = {mother: '母题', variant1: '变式 1', variant2: '变式 2', variant3: '变式 3'}[q.role] || q.role;
    var html = '<div class="loop-card">';
    html += '<div class="loop-meta"><span class="tag tag-category">' + escapeHtml(roleLabel) + '</span>';
    html += '<span class="loop-progress">第 ' + idx + ' / ' + total + ' 关</span></div>';
    if (q.formatter_fallback) {
        html += '<div class="loop-banner" style="margin-bottom:12px;">可能有错误：该题经过 Verifier 兜底，未经完整校验。</div>';
    }
    html += '<div class="loop-question" id="loopQuestion">' + formatChoiceQuestion(q.content || '') + '</div>';
    html += '<div class="loop-time-box"><span style="color:#86868b;font-size:13px;">用时</span><span class="loop-timer" id="loopTimer">0.0s</span></div>';
    html += '<div class="loop-answer-box">';
    html += '<label for="userAnswerInput" style="display:block;font-size:13px;color:#515154;margin-bottom:6px;font-weight:600;">你的答案</label>';
    html += '<textarea id="userAnswerInput" placeholder="写出你的最终答案，例如：选 A、$x = 2$、单调递增区间为..."></textarea>';
    html += '<div class="loop-check-status" id="checkStatus"></div>';
    html += '<div class="loop-actions" id="loopActions">';
    html += '<button class="loop-btn" id="doneBtn" onclick="submitAnswer()">提交答案</button>';
    html += '</div></div>';
    document.getElementById('loopBody').innerHTML = html;
    renderMath(document.getElementById('loopQuestion'));
}

function startTimer() {
    clearInterval(state.timerHandle);
    if (!state.timerStart) {
        state.timerStart = Date.now();
        state.timerElapsed = 0;
    } else {
        state.timerElapsed = (Date.now() - state.timerStart) / 1000;
    }
    var timerEl = document.getElementById('loopTimer');
    state.timerHandle = setInterval(function() {
        if (!timerEl) return;
        state.timerElapsed = (Date.now() - state.timerStart) / 1000;
        timerEl.textContent = state.timerElapsed.toFixed(1) + 's';
        var maxT = state.data.pattern.max_time_seconds || 120;
        timerEl.classList.toggle('over', state.timerElapsed > maxT);
    }, 100);
}

function stopTimer() {
    clearInterval(state.timerHandle);
    if (state.timerStart) state.timerElapsed = (Date.now() - state.timerStart) / 1000;
}

async function recordAttempt(correct) {
    var q = state.currentQuestion;
    await api('/patterns/' + state.patternId + '/attempt', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            question_id: q.question_id,
            role: q.role,
            correct: correct,
            is_first_try: state.questionAttempts === 1,
            duration_seconds: Math.round(state.timerElapsed)
        })
    });
}

async function markPatternWrong() {
    try {
        await api('/patterns/' + state.patternId + '/complete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({passed: false})
        });
    } catch (e) {}
}

async function submitAnswer() {
    var q = state.currentQuestion;
    if (!q) return;
    var input = document.getElementById('userAnswerInput');
    var statusEl = document.getElementById('checkStatus');
    var doneBtn = document.getElementById('doneBtn');
    var userAnswer = input ? input.value.trim() : '';
    if (!userAnswer) {
        if (statusEl) statusEl.innerHTML = '<span style="color:#c62828;">请先输入你的答案。</span>';
        return;
    }
    stopTimer();
    state.questionAttempts++;
    if (statusEl) statusEl.innerHTML = 'AI 正在判分，请稍候...';
    if (doneBtn) doneBtn.disabled = true;
    var maxT = state.data.pattern.max_time_seconds || 120;
    if (state.timerElapsed > maxT) {
        await recordAttempt(false);
        await markPatternWrong();
        renderFailActions('超时：用时 ' + state.timerElapsed.toFixed(1) + 's，超过了限时 ' + maxT + 's。');
        return;
    }
    try {
        var d = await api('/grade', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                question_id: q.question_id,
                student_answer: userAnswer,
                question_type: q.question_type || null,
                teacher: localStorage.getItem('teacher') || 'liangliang',
                source: state.questionAttempts === 1 ? '首次作答' : '重做',
                duration_seconds: Math.round(state.timerElapsed),
                viewed_answer: false,
                skipped: false
            })
        });
        if (d.error) {
            if (statusEl) statusEl.innerHTML = '<span style="color:#c62828;">判分失败：' + escapeHtml(d.detail || d.error) + '</span>';
            if (doneBtn) doneBtn.disabled = false;
            startTimer();
            return;
        }
        if (d.is_correct) {
            await recordAttempt(true);
            onQuestionPassed();
            return;
        }
        state.sessionFailed = true;
        await recordAttempt(false);
        await markPatternWrong();
        var msg = d.feedback || '答案不对，再试一次。';
        var hasPartial = (d.step_results || []).some(function(s) { return s.status === 'partial'; });
        if (hasPartial) msg = '答案还不完整：' + msg;
        renderFailActions(msg);
    } catch (e) {
        if (statusEl) statusEl.innerHTML = '<span style="color:#c62828;">请求失败：' + escapeHtml(e.message || '无法连接后端') + '</span>';
        if (doneBtn) doneBtn.disabled = false;
        startTimer();
    }
}

function renderFailActions(msg) {
    state.viewMode = 'fail';
    state.failMessage = msg;
    var html = '<div class="loop-banner" style="margin-top:10px;">' + escapeHtml(msg) + '</div>';
    html += '<div class="loop-actions">';
    html += '<button class="loop-btn" onclick="retryQuestion()">重新挑战</button>';
    html += '<button class="loop-btn secondary" onclick="openTeach()">手把手教学</button>';
    html += '</div>';
    document.getElementById('loopActions').innerHTML = html;
    saveDraft();
}

function onQuestionPassed() {
    state.queueIdx++;
    if (state.queueIdx >= state.queue.length) {
        var m = (state.data.pattern.mastery || {});
        var never = m.state === 'never';
        if (state.motherOnlyMode && (never || state.sessionFailed)) {
            renderGenerateButton();
        } else {
            finishAllPassed();
        }
    } else {
        startQuestion();
    }
}

function retryQuestion() {
    state.viewMode = 'question';
    state.failMessage = '';
    startQuestion();
}

function openTeach() {
    var q = state.currentQuestion;
    try { localStorage.setItem('_teach_question', q.content || ''); } catch (e) {}
    document.getElementById('teachFrame').src = 'teach.html?standalone=1';
    document.getElementById('teachModal').style.display = 'block';
}

function closeTeach() {
    document.getElementById('teachModal').style.display = 'none';
    document.getElementById('teachFrame').src = 'about:blank';
    retryQuestion();
}

async function finishAllPassed() {
    if (state.allQuestionsPassed) return;
    state.allQuestionsPassed = true;
    clearDraft();
    var d = null;
    try {
        d = await api('/patterns/' + state.patternId + '/complete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({passed: true})
        });
    } catch (e) {}
    var m = (d && d.state) ? d : (state.data.pattern.mastery || {});
    var isOnePass = !state.sessionFailed && state.queue.length <= 1;
    var html = '<div class="loop-card"><h2>' + (isOnePass ? '一遍过，直接通过' : '全部题目做对，套路通过') + '</h2>';
    html += '<p style="color:#515154;margin-top:8px;">当前掌握状态：<span class="state-badge ' + stateClass(m.state) + '">' + escapeHtml(stateLabel(m.state)) + '</span></p>';
    if (m.next_check_at) html += '<p style="color:#515154;margin-top:6px;">巩固时间：' + escapeHtml(m.next_check_at) + '</p>';
    html += '<div class="loop-actions"><button class="loop-btn" onclick="loadLoop()">再来一轮</button>';
    html += '<button class="loop-btn secondary" onclick="pickPattern()">换一个套路</button>';
    html += '<button class="loop-btn secondary" onclick="window.open(\'board.html?v=20260807\', \'_blank\')">返回闯关地图</button></div></div>';
    document.getElementById('loopBody').innerHTML = html;
}

document.addEventListener('DOMContentLoaded', function() {
    var id = qs('pattern_id');
    var draft = null;
    try { draft = JSON.parse(localStorage.getItem('loop_draft') || 'null'); } catch (e) {}
    if (id) {
        state.patternId = parseInt(id);
        state.restoring = !!(draft && draft.patternId === state.patternId);
        loadLoop();
    } else if (draft && draft.patternId) {
        state.patternId = draft.patternId;
        state.restoring = true;
        loadLoop();
    } else {
        pickPattern();
    }
});
</script>
