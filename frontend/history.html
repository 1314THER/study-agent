<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人题库 - 数学最强大脑</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <a href="/" class="sidebar-logo">成为<br>数学高手</a>
            <nav>
                <a href="index.html" class="nav-item" data-page="solve">
                    <span class="nav-icon">🔍</span>
                    <span class="nav-label">单题解答</span>
                </a>
                <a href="teach.html" class="nav-item" data-page="teach">
                    <span class="nav-icon">📖</span>
                    <span class="nav-label">老师手把手<br>教你做题</span>
                    <span class="nav-badge">预留</span>
                </a>
                <a href="exam.html" class="nav-item" data-page="exam">
                    <span class="nav-icon">📝</span>
                    <span class="nav-label">组卷</span>
                    
                </a>
                <a href="history.html" class="nav-item active" data-page="history">
                    <span class="nav-icon">📋</span>
                    <span class="nav-label">个人题库</span>
                </a>



                            <a href="multimodal.html" class="nav-item" data-page="multimodal">
                    <span class="nav-icon">📎</span>
                    <span class="nav-label">多模态解答</span>
                </a>
            </nav>
        </aside>
        <main class="main-content">
            <div class="container">
                <h1>个人题库</h1>
                <p class="subtitle" id="historyCount">个人题库 · 加载中...</p>
 
                <!-- Search + Filter Bar -->

                <div class="filter-row-2">
                    <div class="filter-search" style="flex:2;">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" placeholder="搜索关键词（支持空格分隔多个）" oninput="onFilterChange()">
                    </div>
                    <select class="filter-select filter-error-select" id="filterErrorType" onchange="onErrorTypeChange()">
                        <option value="">全部题目</option>
                        <option value="errors">全部错题</option>
                        <option value="none">非错题</option>
                    </select>
                    <select class="filter-select" id="filterMistakeType" style="display:none" onchange="onFilterChange()">
                        <option value="">全部错因</option>
                        <option value="符号错误">符号错误</option>
                        <option value="计算错误">计算错误</option>
                        <option value="公式记错">公式记错</option>
                        <option value="知识性错误">知识性错误</option>
                        <option value="审题错误">审题错误</option>
                        <option value="思路错误">思路错误</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="filter-bar">
                    <select class="filter-select" id="filterCategory" onchange="onFilterChange()">
                        <option value="">全部板块</option>
                    </select>
                    <select class="filter-select" id="filterType" onchange="onFilterChange()">
                        <option value="">全部题型</option>
                        <option value="选择题">选择题</option>
                        <option value="填空题">填空题</option>
                        <option value="大题">大题</option>
                        <option value="非常规压轴题">非常规压轴题</option>
                    </select>
                    <select class="filter-select" id="filterDifficulty" onchange="onFilterChange()">
                        <option value="">全部难度</option>
                        <option value="容易">容易</option>
                        <option value="中等">中等</option>
                        <option value="困难">困难</option>
                        <option value="极难">极难</option>
                    </select>
                    <div class="mode-toggle">
                        <button class="mode-btn active" data-mode="content" onclick="setSearchMode(this,'content')">题目搜索</button>
                        <button class="mode-btn" data-mode="global" onclick="setSearchMode(this,'global')">全局搜索</button>
                    </div>
                    <button class="filter-reset" onclick="resetFilters()">重置</button>
                    <div class="filter-batch">
                        <a href="exam.html" class="go-exam-btn" id="goExamBtn">
                            📋 前往组卷
                            <span class="go-exam-badge" id="goExamBadge">0</span>
                        </a>
                        <button class="batch-btn" id="batchToggle" onclick="toggleBatch()">✓ 批量组卷</button>
                    </div>
                </div>
                <div class="batch-action-bar" id="batchActionBar">
                    <span class="bar-count" id="batchCount">已选 0 题</span>
                    <button class="bar-btn bar-select-all" onclick="selectAllInView()">全选</button>
                    <button class="bar-btn bar-add-exam" onclick="addBatchToExam()">📋 加入组卷</button>
                </div>

 
                <!-- List View -->
                <div id="listView">
                    <div id="skeletonArea">
                        <div class="skeleton-card"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
                        <div class="skeleton-card"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
                        <div class="skeleton-card"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
                    </div>
                    <div id="historyCards"></div>
                    <div id="emptyState" class="empty-state" style="display:none">
                        <div class="empty-icon">📋</div>
                        <p>还没有搜过题</p>
                        <p class="empty-desc">去搜题做题页搜索题目，结果会自动保存在这里</p>
                        <a href="index.html" class="empty-link">去搜题 →</a>
                    </div>
                </div>
                <div class="pagination-bar" id="paginationBar">
                    <div class="page-size-selector">
                        <span>每页</span>
                        <select id="pageSizeSelect" onchange="onPageSizeChange()">
                            <option value="5">5</option>
                            <option value="10">10</option>
                            <option value="all">全部</option>
                        </select>
                    </div>
                    <div class="page-nav">
                        <button class="page-btn" id="prevPageBtn" onclick="goToPage(_currentPage - 1)">上一页</button>
                        <span class="page-info" id="pageInfo">第 1 页 / 共 1 页</span>
                        <button class="page-btn" id="nextPageBtn" onclick="goToPage(_currentPage + 1)">下一页</button>
                    </div>
                </div>

                <!-- Detail View -->
                <div id="detailView" style="display:none">
                    <button class="back-btn" onclick="backToList()">← 返回列表</button>
                    <div id="detailQuestion"></div>
                    <div id="detailResult"></div>
                </div>

            </div>
        </main>
    </div>

        <script>
        var _selectedTeacher = localStorage.getItem('teacher') || 'liangliang';

        // ---- State ----
        var allQuestions = [];
        var _deleteTargetId = null;
        var _currentPage = 1;
        var _detailQuestionId = null;
        var _stepErrors = [];
        var _errorDialogState = { questionId: null, stepNumber: null, chunkId: null };
        var _searchMode = 'content';

        // ---- Init: load categories into filter ----
        function initFilters() {
            fetch('http://127.0.0.1:8000/categories')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var sel = document.getElementById('filterCategory');
                    for (var i = 0; i < data.length; i++) {
                        var opt = document.createElement('option');
                        opt.value = data[i].level1;
                        opt.textContent = data[i].level1;
                        sel.appendChild(opt);
                    }
                })
                .catch(function(err) { console.error('Load categories failed:', err); });
        }

        // ---- Search + Filter ----
        function onFilterChange() {
            doSearch();
        }

        function setSearchMode(btn, mode) {
            document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            _searchMode = mode;
            doSearch();
        }

        function onErrorTypeChange() {
            var val = document.getElementById('filterErrorType').value;
            var mtEl = document.getElementById('filterMistakeType');
            if (val === 'errors') {
                mtEl.style.display = 'inline-block';
            } else {
                mtEl.style.display = 'none';
                mtEl.value = '';
            }
            doSearch();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterCategory').value = '';
            document.getElementById('filterType').value = '';
            document.getElementById('filterDifficulty').value = '';
            document.getElementById('filterErrorType').value = '';
            document.getElementById('filterMistakeType').value = '';
            document.getElementById('filterMistakeType').style.display = 'none';
            _currentPage = 1;
            doSearch();
        }

        function doSearch() {
            var q = document.getElementById('searchInput').value.trim();
            var cat = document.getElementById('filterCategory').value;
            var type = document.getElementById('filterType').value;
            var diff = document.getElementById('filterDifficulty').value;
            var errorType = document.getElementById('filterErrorType').value;
            var mistakeType = document.getElementById('filterMistakeType').value;
            var pageSizeSelect = document.getElementById('pageSizeSelect');
            var pageSize = pageSizeSelect ? pageSizeSelect.value : '5';

            var params = [];
            if (q) params.push('q=' + encodeURIComponent(q));
            if (cat) params.push('category=' + encodeURIComponent(cat));
            if (type) params.push('question_type=' + encodeURIComponent(type));
            if (diff) params.push('difficulty=' + encodeURIComponent(diff));
            if (errorType) {
                if (errorType === 'errors' && mistakeType) {
                    params.push('error_type=' + encodeURIComponent(mistakeType));
                } else {
                    params.push('error_type=' + encodeURIComponent(errorType));
                }
            }
            params.push('mode=' + _searchMode);
            params.push('page=' + _currentPage);
            if (pageSize !== 'all') params.push('page_size=' + pageSize);

            var skeletonEl = document.getElementById('skeletonArea');
            var listEl = document.getElementById('historyCards');
            var emptyEl = document.getElementById('emptyState');
            var countEl = document.getElementById('historyCount');

            skeletonEl.style.display = 'block';
            listEl.innerHTML = '';

            var url = 'http://127.0.0.1:8000/questions/search' + (params.length ? '?' + params.join('&') : '');
            fetch(url)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    skeletonEl.style.display = 'none';
                    // Handle paginated vs flat response
                    var questions, total;
                    if (data && data.data !== undefined) {
                        questions = data.data;
                        total = data.total;
                    } else {
                        questions = data;
                        total = data ? data.length : 0;
                    }
                    localStorage.setItem('questions_cache', JSON.stringify(questions));
                    renderList(questions, total, _currentPage, pageSize);
                })
                .catch(function(err) {
                    console.error('Search failed:', err);
                    skeletonEl.style.display = 'none';
                    if (q || cat || type || diff || errorType) {
                        countEl.textContent = '搜索失败';
                    } else {
                        emptyEl.style.display = 'block';
                        countEl.textContent = '加载失败';
                    }
                });
        }

        function loadQuestions() {
            initFilters();
            // Restore saved page size
            var savedPageSize = localStorage.getItem('history_page_size');
            if (savedPageSize) {
                var sel = document.getElementById('pageSizeSelect');
                if (sel) sel.value = savedPageSize;
            }
            // Try cache first
            var cached = localStorage.getItem('questions_cache');
            if (cached) {
                try {
                    var cachedData = JSON.parse(cached);
                    if (cachedData.length > 0) {
                        renderList(cachedData);
                    }
                } catch(e) {}
            }
            doSearch();
        }

        // ---- Render ----
        function renderList(data, total, page, pageSize) {
            var listEl = document.getElementById('historyCards');
            var emptyEl = document.getElementById('emptyState');
            var skeletonEl = document.getElementById('skeletonArea');
            var countEl = document.getElementById('historyCount');

            skeletonEl.style.display = 'none';
            allQuestions = data;

            if (!data || data.length === 0) {
                emptyEl.style.display = 'block';
                listEl.innerHTML = '';
                countEl.textContent = '暂无记录';
                return;
            }

            emptyEl.style.display = 'none';
            var displayTotal = total !== undefined ? total : data.length;
            countEl.textContent = '共 ' + displayTotal + ' 道题';

            var html = '';
            for (var i = 0; i < data.length; i++) {
                var q = data[i];
                var preview = truncatePreview(q.content || '', 150);

                var diffClass = 'tag-easy';
                if (q.difficulty_level === '\u4e2d\u7b49') diffClass = 'tag-medium';
                else if (q.difficulty_level === '\u56f0\u96be') diffClass = 'tag-hard';
                else if (q.difficulty_level === '\u6781\u96be') diffClass = 'tag-extreme';

                // Question type tag
                var typeTag = '';
                if (q.question_type) {
                    var tc = 'tag-type';
                    if (q.question_type === '\u9009\u62e9\u9898') tc += ' tag-type-choice';
                    else if (q.question_type === '\u586b\u7a7a\u9898') tc += ' tag-type-blank';
                    else if (q.question_type === '\u5927\u9898') tc += ' tag-type-long';
                    else tc += ' tag-type-special';
                    typeTag = '<span class="tag ' + tc + '">' + escapeHtml(q.question_type) + '</span>';
                }

                var catTag = '';
                if (q.category_level1) {
                    catTag = '<span class="tag tag-category">' + escapeHtml(q.category_level1) + '</span>';
                }
                // Check for error status from display (backend step_errors count would need a separate query)
                // We'll skip error tags in list for now since the search may not return step_errors
                // The error count will be visible when user filters by error_type


                var timeHtml = getTimeDisplay(q);
                dateStr = timeHtml;

                var score = q.difficulty_score !== null ? '(' + q.difficulty_score + '\u5206)' : '';

                html += '<div class="history-card" data-id="' + q.id + '">';
                html += '<input type="checkbox" class="hc-checkbox" data-id="' + q.id + '" onchange="updateBatchCount()">';
html += '<div class="hc-preview" onclick="showDetail(' + q.id + ')">' + escapeHtml(preview) + '</div>';
                html += '<div class="hc-meta">';
                html += typeTag;
                html += catTag;
                if (q.difficulty_level) {
                    html += '<span class="tag ' + diffClass + '">' + escapeHtml(q.difficulty_level) + ' ' + score + '</span>';
                }
                html += '<span class="hc-date">' + dateStr + '</span>';
                html += '<button class="delete-btn" onclick="event.stopPropagation();confirmDelete(' + q.id + ')" title="\u5220\u9664\u6b64\u9898">\ud83d\uddd1</button>';
                html += '<button class="exam-add-btn" onclick="event.stopPropagation();addToExam(' + q.id + ')" title="\u52a0\u5165\u7ec4\u5377">\ud83d\udccb</button>';
                html += '</div></div>';
            }
            listEl.innerHTML = html;
            try { renderMathInElement(listEl, { delimiters: [{left: '$$', right: '$$', display: true},{left: '$', right: '$', display: false},{left: '\\(', right: '\\)', display: false},{left: '\\[', right: '\\]', display: true}], ignoredTags: ['script', 'style'] }); } catch(e) {}
            updatePagination(page, pageSize, total);
        }

        // ---- Delete ----
        function confirmDelete(id) {
            _deleteTargetId = id;
            var overlay = document.createElement('div');
            overlay.className = 'confirm-overlay';
            overlay.id = 'confirmOverlay';
            overlay.innerHTML = '<div class="confirm-dialog">' +
                '<p>\u786e\u5b9a\u8981\u5220\u9664\u8fd9\u9053\u9898\u5417\uff1f\u5220\u9664\u540e\u4e0d\u53ef\u6062\u590d\u3002</p>' +
                '<div class="confirm-actions">' +
                '<button class="confirm-cancel" onclick="closeConfirm()">\u53d6\u6d88</button>' +
                '<button class="confirm-delete" onclick="doDelete()">\u5220\u9664</button>' +
                '</div></div>';
            document.body.appendChild(overlay);
        }

        function closeConfirm() {
            var el = document.getElementById('confirmOverlay');
            if (el) el.remove();
            _deleteTargetId = null;
        }

        function doDelete() {
            var id = _deleteTargetId;
            if (!id) return;
            closeConfirm();
            var url = 'http://127.0.0.1:8000/questions/' + id;
            fetch(url, { method: 'DELETE' })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.deleted) {
                        doSearch();
                    } else {
                        alert('\u5220\u9664\u5931\u8d25\uff1a' + (data.message || '\u672a\u77e5\u9519\u8bef'));
                    }
                })
                .catch(function(err) {
                    alert('\u5220\u9664\u5931\u8d25\uff1a' + err.message);
                });
        }

        // ---- Detail View ----
        function showDetail(id) {
            // Hide search/filter/pagination areas
            var fb = document.querySelector('.filter-bar');
            var fr = document.querySelector('.filter-row-2');
            if (fb) fb.style.display = 'none';
            if (fr) fr.style.display = 'none';
            var bab = document.getElementById('batchActionBar');
            if (bab) bab.style.display = 'none';
            var pb = document.getElementById('paginationBar');
            if (pb) pb.style.display = 'none';
            document.getElementById('listView').style.display = 'none';
            document.getElementById('detailView').style.display = 'block';
            document.getElementById('historyCount').style.display = 'none';
            var resultEl = document.getElementById('detailResult');
            resultEl.innerHTML = '<p style="text-align:center;color:#86868b;padding:40px;">\u52a0\u8f7d\u4e2d...</p>';

            // Detail page delete button
            var backBtn = document.querySelector('.back-btn');
            // Remove old delete button if exists
            var oldDel = document.getElementById('detailDeleteBtn');
            if (oldDel) oldDel.remove();

            var delBtn = document.createElement('button');
            delBtn.id = 'detailDeleteBtn';
            delBtn.className = 'delete-btn-large';
            delBtn.innerHTML = '\ud83d\uddd1 \u5220\u9664\u6b64\u9898';
            delBtn.onclick = function() { confirmDelete(id); };
            backBtn.parentNode.insertBefore(delBtn, backBtn.nextSibling);

            fetch('http://127.0.0.1:8000/questions/' + id)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.error) {
                        var errMsg = data.message || data.reason || data.error;
                        resultEl.innerHTML = '<p style="color:red;text-align:center;padding:40px;">\u52a0\u8f7d\u5931\u8d25: ' + escapeHtml(errMsg) + '</p>';
                        return;
                    }
                    var qHtml = '<div class="detail-question"><h3>\u9898\u76ee</h3><div class="question-text">' + escapeHtml(data.content || '') + '</div></div>';
                    document.getElementById('detailQuestion').innerHTML = qHtml;
                    try { renderMathInElement(document.getElementById('detailQuestion'), { delimiters: [{left: '$$', right: '$$', display: true},{left: '$', right: '$', display: false}], ignoredTags: [] }); } catch(e) {}
                    var answerData = data.answer_json;
                    if (!answerData) {
                        resultEl.innerHTML = '<p style="color:#86868b;text-align:center;padding:40px;">\u8be5\u9898\u6682\u65e0\u89e3\u6790</p>';
                        return;
                    }
                    _detailQuestionId = data.id;
                    _stepErrors = data.step_errors || [];
                    displayDetailResult(answerData);
                    refreshStepErrors();
                })
                .catch(function(err) {
                    var msg = err && err.message ? err.message : '\u65e0\u6cd5\u8fde\u63a5\u5230\u670d\u52a1\u5668\uff0c\u8bf7\u786e\u8ba4\u540e\u7aef\u5df2\u542f\u52a8';
                    resultEl.innerHTML = '<p style="color:red;text-align:center;padding:40px;">\u52a0\u8f7d\u5931\u8d25: ' + msg + '</p>';
                });
        }

        function backToList() {
            document.getElementById('detailView').style.display = 'none';
            document.getElementById('listView').style.display = 'block';
            document.getElementById('historyCount').style.display = 'block';
            // Show search/filter/pagination areas (reset to CSS defaults)
            var fb = document.querySelector('.filter-bar');
            var fr = document.querySelector('.filter-row-2');
            if (fb) fb.style.display = '';
            if (fr) fr.style.display = '';
            // Restore pagination visibility (updatePagination will correct it)
            var pb = document.getElementById('paginationBar');
            if (pb) pb.style.display = '';
            // Restore batch bar (will be hidden unless batch mode was active)
            var bab = document.getElementById('batchActionBar');
            if (bab) bab.style.display = '';
            document.getElementById('detailQuestion').innerHTML = '';
            var oldDel = document.getElementById('detailDeleteBtn');
            if (oldDel) oldDel.remove();
        }

        // ---- Display Result (from index.html) ----
        function displayDetailResult(data) {
            var result = document.getElementById('detailResult');
            var html = '<div class="meta-bar">';
            if (data.knowledge_points && data.knowledge_points.length > 0) {
                html += '<span class="tag tag-category">' + data.knowledge_points.slice(0,3).join(' / ') + '</span>';
            }
            var od = data.overall_difficulty;
            if (od && od.total_score !== undefined) {
                html += '<span class="tag" style="background:#e8f0fe;color:#1565c0;">\u96ea\u5cf0\u96be\u5ea6\u7cfb\u6570\uff1a' + od.total_score + '/15</span>';
            }
            if (data.step_difficulty_sum !== undefined) {
                html += '<span class="tag" style="background:#fce4ec;color:#c62828;">\u6b66\u4eae\u96be\u5ea6\u7cfb\u6570\uff1a' + data.step_difficulty_sum + '</span>';
            }
            html += '</div>';

            html += '<div id="detailRadarChart" style="display:flex;justify-content:center;margin-bottom:16px;"></div>';

            if (data.chunk_results && data.chunk_results.length > 0) {
                for (var ci = 0; ci < data.chunk_results.length; ci++) {
                    var cr = data.chunk_results[ci];
                    var chunkId = cr.chunk_id || (ci + 1);
                    var cat = cr.category || {};
                    var diff = cr.difficulty || {};
                    html += '<div class="chunk-card">';
                    html += '<div class="chunk-header">';
                    html += '<span class="chunk-label">\u5757' + chunkId + '</span>';
                    if (cr.chunk_type) {
                        var tc = 'tag-type';
                        if (cr.chunk_type === '\u9009\u62e9\u9898' || cr.chunk_type === '\u586b\u7a7a\u9898') tc += ' tag-type-simple';
                        else if (cr.chunk_type === '\u975e\u5e38\u89c4\u538b\u8f74\u9898') tc += ' tag-type-special';
                        html += '<span class="tag ' + tc + '">' + escapeHtml(cr.chunk_type) + '</span>';
                    }
                    if (cat.level1) html += '<span class="chunk-cat">' + escapeHtml(cat.level1) + '</span>';
                    if (diff.level) html += '<span class="chunk-diff ' + levelClass(diff.level) + '">' + escapeHtml(diff.level) + '</span>';
                    html += '</div>';

                    if (cr.steps && cr.steps.length > 0) {
                        html += '<div class="chunk-steps">';
                        for (var si = 0; si < cr.steps.length; si++) {
                            var step = cr.steps[si];
                            html += '<div class="step" data-step-number="' + step.step_number + '" data-chunk-id="' + chunkId + '">';
                            html += '<div class="step-header">';
                            html += '<span class="step-number">\u6b65\u9aa4' + step.step_number + '\uff1a' + escapeHtml(step.title || '') + '</span>';
                            if (step.step_level1) {
                                html += '<span class="step-level1-tag">' + escapeHtml(step.step_level1) + '</span>';
                            }
                            if (step.step_difficulty) {
                                html += '<span class="step-diff-tag">' + escapeHtml(step.step_difficulty.level) + ' (' + step.step_difficulty.score + '\u5206)</span>';
                            }
                            html += '</div>';
                            html += '<div class="step-content">' + escapeHtml(step.standard_writing || '') + '</div>';
                            if (step.detailed_writing) {
                                html += '<div class="detail-toggle" onclick="toggleDetail(this)">\u5c55\u5f00\u8be6\u7ec6\u8fc7\u7a0b \u25b8</div>';
                                html += '<div class="detail-content">' + escapeHtml(step.detailed_writing) + '</div>';
                            }
                            if (step.knowledge_point) {
                                html += '<div class="step-kp">' + escapeHtml(step.knowledge_point) + '</div>';
                            }
                            html += '<div class="step-errors"></div>';
                            html += '<button class="step-error-btn" onclick="showErrorDialog(_detailQuestionId,' + step.step_number + ',' + chunkId + ')">\u6dfb\u52a0\u9519\u56e0</button>';
                            html += '</div>';
                        }
                        html += '</div>';
                    }
                    if (cr.final_answer) {
                        html += '<div class="final-answer">\u7b54\u6848\uff1a' + cr.final_answer + '</div>';
                    }
                    html += '</div>';
                }
            }

            result.innerHTML = html;

            try {
                renderMathInElement(result, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '$', right: '$', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    ignoredTags: []
                });
            } catch(e) { console.log('KaTeX error:', e); }

            // Radar chart
            var dims = od && od.dimensions;
            if (dims && Object.keys(dims).length >= 5) {
                var dpr = window.devicePixelRatio || 1;
                var canvas = document.createElement('canvas');
                var cssW = 400, cssH = 360;
                canvas.width = cssW * dpr;
                canvas.height = cssH * dpr;
                canvas.style.width = cssW + 'px';
                canvas.style.height = cssH + 'px';
                canvas.style.maxWidth = '100%';
                document.getElementById('detailRadarChart').appendChild(canvas);
                var ctx = canvas.getContext('2d');
                ctx.scale(dpr, dpr);
                var cx = 200, cy = 185, radius = 100;
                var labels = Object.keys(dims);
                var values = labels.map(function(k) { return dims[k]; });
                var n = labels.length;
                var gridColors = ['#f0f0f0', '#e5e5e7', '#d8d8dc'];
                for (var ri = 1; ri <= 3; ri++) {
                    var r = radius * ri / 3;
                    ctx.beginPath();
                    for (var i = 0; i <= n; i++) {
                        var angle = (i % n) * 2 * Math.PI / n - Math.PI / 2;
                        var x = cx + r * Math.cos(angle);
                        var y = cy + r * Math.sin(angle);
                        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.strokeStyle = gridColors[ri - 1];
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
                for (var i = 0; i < n; i++) {
                    var angle = i * 2 * Math.PI / n - Math.PI / 2;
                    ctx.beginPath(); ctx.moveTo(cx, cy);
                    ctx.lineTo(cx + radius * Math.cos(angle), cy + radius * Math.sin(angle));
                    ctx.strokeStyle = '#ececee';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    var label = labels[i] + ' ' + values[i];
                    ctx.font = '13px -apple-system, sans-serif';
                    ctx.fillStyle = '#1d1d1f';
                    var lr = radius + 16;
                    var nx = cx + lr * Math.cos(angle);
                    var ny = cy + lr * Math.sin(angle);
                    var deg = ((i / n) * 360) % 360;
                    if (deg < 18 || deg >= 342) { ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; }
                    else if (deg >= 18 && deg < 72) { ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; }
                    else if (deg >= 72 && deg < 108) { ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; }
                    else if (deg >= 108 && deg < 162) { ctx.textAlign = 'center'; ctx.textBaseline = 'top'; }
                    else if (deg >= 162 && deg < 198) { ctx.textAlign = 'center'; ctx.textBaseline = 'top'; }
                    else if (deg >= 198 && deg < 252) { ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; }
                    else if (deg >= 252 && deg < 288) { ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; }
                    else { ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; }
                    ctx.fillText(label, nx, ny);
                }
                ctx.beginPath();
                for (var i = 0; i <= n; i++) {
                    var angle = (i % n) * 2 * Math.PI / n - Math.PI / 2;
                    var val = Math.min(values[i % n] / 3, 1);
                    var x = cx + radius * val * Math.cos(angle);
                    var y = cy + radius * val * Math.sin(angle);
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.closePath();
                var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                grad.addColorStop(0, 'rgba(0, 113, 227, 0.25)');
                grad.addColorStop(1, 'rgba(0, 113, 227, 0.06)');
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = '#0071e3';
                ctx.lineWidth = 2;
                ctx.stroke();
                for (var i = 0; i < n; i++) {
                    var angle = i * 2 * Math.PI / n - Math.PI / 2;
                    var val = Math.min(values[i] / 3, 1);
                    var x = cx + radius * val * Math.cos(angle);
                    var y = cy + radius * val * Math.sin(angle);
                    ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 2 * Math.PI);
                    ctx.fillStyle = '#0071e3';
                    ctx.fill();
                    ctx.beginPath(); ctx.arc(x, y, 2, 0, 2 * Math.PI);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                }
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.font = '13px -apple-system, sans-serif';
                ctx.fillStyle = '#86868b';
                ctx.fillText('\u4e94\u7ef4\u96be\u5ea6\u5206\u5e03', cx, cssH - 10);
            }
        }

        // ---- Utility Functions ----
        // ---- Preview Truncation ----
        function truncatePreview(text, maxLen) {
            if (!text) return '';
            /* Truncate to max length first (happens most of the time) */
            var processed = text;
            var wasTruncated = false;
            if (processed.length > maxLen) {
                processed = processed.substring(0, maxLen - 3) + '...';
                wasTruncated = true;
            }
            /* Protect display math markers */
            processed = processed.replace(/\$\$/g, '<<DL>>');
            /* Check for unclosed single $: remove it and everything after */
            var matches = processed.match(/\$/g);
            var dollarCount = matches ? matches.length : 0;
            if (dollarCount % 2 !== 0) {
                var lastDollar = processed.lastIndexOf('$');
                processed = processed.substring(0, lastDollar);
                if (wasTruncated) processed += '...';
            }
            /* Restore display math */
            processed = processed.replace(/<<DL>>/g, '$$');
            return processed;
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function toggleDetail(el) {
            var content = el.nextElementSibling;
            var isOpen = !content.classList.contains('show');
            content.classList.toggle('show');
            el.textContent = isOpen ? '\u6536\u8d77\u8be6\u7ec6\u8fc7\u7a0b \u25be' : '\u5c55\u5f00\u8be6\u7ec6\u8fc7\u7a0b \u25b8';
            if (isOpen && window.renderMathInElement) {
                try { renderMathInElement(content, { delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ], ignoredTags: [] }); } catch(e) { console.log('KaTeX error:', e); }
            }
        }

        function levelClass(level) {
            var map = { '\u5bb9\u6613': 'tag-easy', '\u4e2d\u7b49': 'tag-medium', '\u56f0\u96be': 'tag-hard', '\u6781\u96be': 'tag-extreme' };
            return map[level] || 'tag-easy';
        }

        // ---- Step Error Functions ----
        function refreshStepErrors() {
            if (!_detailQuestionId) return;
            fetch('http://127.0.0.1:8000/questions/' + _detailQuestionId)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.error) return;
                    _stepErrors = data.step_errors || [];
                    renderStepErrors();
                });
        }

        function renderStepErrors() {
            var steps = document.querySelectorAll('#detailResult .step[data-step-number]');
            steps.forEach(function(stepEl) {
                var stepNum = parseInt(stepEl.dataset.stepNumber);
                var chunkId = parseInt(stepEl.dataset.chunkId);
                var errors = _stepErrors.filter(function(e) {
                    return e.step_number === stepNum && e.chunk_id === chunkId;
                });
                
                stepEl.classList.toggle('has-error', errors.length > 0);
                
                var btn = stepEl.querySelector('.step-error-btn');
                if (btn) {
                    btn.textContent = errors.length > 0 ? '编辑错因' : '添加错因';
                    btn.classList.toggle('has-error', errors.length > 0);
                }
                
                var errorsList = stepEl.querySelector('.step-errors');
                if (errorsList) {
                    if (errors.length > 0) {
                        var html = '';
                        for (var ei = 0; ei < errors.length; ei++) {
                            var err = errors[ei];
                            var timeStr = '';
                            if (err.created_at) {
                                var d = new Date(err.created_at.replace(' ', 'T') + 'Z');
                                var offset = 8 * 60;
                                var local = new Date(d.getTime() + offset * 60000);
                                timeStr = local.getUTCFullYear() + '-' + 
                                    String(local.getUTCMonth()+1).padStart(2,'0') + '-' +
                                    String(local.getUTCDate()).padStart(2,'0') + ' ' +
                                    String(local.getUTCHours()).padStart(2,'0') + ':' +
                                    String(local.getUTCMinutes()).padStart(2,'0');
                            }
                            html += '<div class="step-error-item">';
                            html += '<span class="error-type-badge">' + escapeHtml(err.mistake_type) + '</span>';
                            html += '<span class="error-detail">' + escapeHtml(err.mistake_detail || '') + '</span>';
                            html += '<span class="error-time">' + timeStr + '</span>';
                            html += '<button class="error-delete-btn" onclick="event.stopPropagation();deleteStepError(' + _detailQuestionId + ',' + err.id + ')">✕</button>';
                            html += '</div>';
                        }
                        errorsList.innerHTML = html;
                    } else {
                        errorsList.innerHTML = '';
                    }
                }
            });
        }

        function showErrorDialog(questionId, stepNumber, chunkId) {
            _errorDialogState = { questionId: questionId, stepNumber: stepNumber, chunkId: chunkId };
            document.getElementById('errorDialogType').value = '符号错误';
            document.getElementById('errorDialogDetail').value = '';
            document.getElementById('errorDialogOverlay').style.display = 'flex';
        }

        function closeErrorDialog() {
            document.getElementById('errorDialogOverlay').style.display = 'none';
        }

        function confirmAddError() {
            var state = _errorDialogState;
            var type = document.getElementById('errorDialogType').value;
            var detail = document.getElementById('errorDialogDetail').value.trim();
            if (!type) { alert('请选择一级错因'); return; }
            
            fetch('http://127.0.0.1:8000/questions/' + state.questionId + '/step-error', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    step_number: state.stepNumber,
                    chunk_id: state.chunkId,
                    mistake_type: type,
                    mistake_detail: detail
                })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                closeErrorDialog();
                refreshStepErrors();
            })
            .catch(function(err) {
                alert('添加失败: ' + err.message);
            });
        }

        function deleteStepError(qid, eid) {
            if (!confirm('确定删除这条错因吗？')) return;
            fetch('http://127.0.0.1:8000/questions/' + qid + '/step-error/' + eid, {
                method: 'DELETE'
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.deleted) {
                    refreshStepErrors();
                }
            })
            .catch(function(err) {
                alert('删除失败: ' + err.message);
            });
        }

        // ---- Time Display ----
        function getTimeDisplay(q) {
            var allTimes = [];
            if (q.created_at) allTimes.push({label: '加入题库', time: q.created_at, priority: 0});
            if (q.last_viewed_at) allTimes.push({label: '最近查看', time: q.last_viewed_at, priority: 1});
            if (q.last_exam_at) allTimes.push({label: '最近组卷', time: q.last_exam_at, priority: 2});
            if (q.last_edited_at) allTimes.push({label: '最近编辑', time: q.last_edited_at, priority: 3});
            
            // Sort by priority desc to find the most recent action
            allTimes.sort(function(a, b) { return b.priority - a.priority; });
            var main = allTimes.length > 0 ? allTimes[0] : {label: '加入题库', time: q.created_at || ''};
            var mainTime = formatUTCDate(main.time);
            
            var html = '<span class="hc-time-wrapper" onclick="event.stopPropagation();toggleTimePopup(this)">';
            html += '<span class="hc-time-main">' + main.label + ' ' + mainTime + '</span>';
            html += '<span class="hc-time-arrow">\u25be</span>';
            html += '<div class="hc-time-popup">';
            for (var ti = 0; ti < allTimes.length; ti++) {
                var t = allTimes[ti];
                if (t.time) {
                    html += '<div class="hc-time-popup-item"><span class="ttp-label">' + t.label + '</span> ' + formatUTCDate(t.time) + '</div>';
                }
            }
            html += '</div></span>';
            return html;
        }
        
        function formatUTCDate(timeStr) {
            if (!timeStr) return '';
            var d = new Date(timeStr.replace(' ', 'T') + 'Z');
            var offset = 8 * 60;
            var local = new Date(d.getTime() + offset * 60000);
            return local.getUTCFullYear() + '-' + 
                String(local.getUTCMonth() + 1).padStart(2, '0') + '-' +
                String(local.getUTCDate()).padStart(2, '0') + ' ' +
                String(local.getUTCHours()).padStart(2, '0') + ':' +
                String(local.getUTCMinutes()).padStart(2, '0');
        }
        
        function toggleTimePopup(el) {
            var popup = el.querySelector('.hc-time-popup');
            if (popup) {
                var isOpen = popup.classList.toggle('show');
                el.querySelector('.hc-time-arrow').classList.toggle('open', isOpen);
            }
        }
        
        // ---- Pagination ----
        function updatePagination(page, pageSize, total) {
            if (!page || pageSize === 'all' || !total) {
                document.getElementById('paginationBar').style.display = 'none';
                return;
            }
            document.getElementById('paginationBar').style.display = 'flex';
            var totalPages = Math.ceil(total / parseInt(pageSize));
            document.getElementById('pageInfo').textContent = '第 ' + page + ' 页 / 共 ' + totalPages + ' 页';
            document.getElementById('prevPageBtn').disabled = page <= 1;
            document.getElementById('nextPageBtn').disabled = page >= totalPages;
        }
        
        function goToPage(page) {
            _currentPage = page;
            doSearch();
        }
        
        function onPageSizeChange() {
            var sel = document.getElementById('pageSizeSelect');
            localStorage.setItem('history_page_size', sel.value);
            _currentPage = 1;
            doSearch();
        }
        
        // ---- Init ----
        document.addEventListener('DOMContentLoaded', loadQuestions);
    
        // ---- Exam Cart Functions ----
        var _examCartKey = 'exam_cart';
        
        function getExamCart() {
            var raw = localStorage.getItem(_examCartKey);
            return raw ? JSON.parse(raw) : [];
        }
        
        function saveExamCart(items) {
            localStorage.setItem(_examCartKey, JSON.stringify(items));
            updateCartBadge();
        }
        
        function addToExam(qid) {
            // Track exam time
            fetch('http://127.0.0.1:8000/questions/' + qid + '/exam-touch', { method: 'POST' }).catch(function() {});
            
            var questions = getExamCart();
            if (questions.find(function(q) { return q.id === qid; })) {
                showToast('该题已在组卷篮子中', 'info');
                return;  // already in cart
            }
            // Check if historyCards exists
            var listEl = document.getElementById('historyCards');
            if (!listEl) return;
            var cards = listEl.querySelectorAll('.history-card');
            var preview = '';
            for (var i = 0; i < cards.length; i++) {
                if (parseInt(cards[i].dataset.id) === qid) {
                    preview = (cards[i].querySelector('.hc-preview') || {}).textContent || '';
                    preview = preview.substring(0, 30);
                    break;
                }
            }
            var data = {id: qid, preview: preview, settings: {
                blankHeight: 120, showDifficulty: false,
                showDetailedProcess: false, showKnowledgePoints: true
            }};
            questions.push(data);
            saveExamCart(questions);
            showToast('✅ 已加入组卷', 'success');
        }
        
        function removeFromCart(qid) {
            var questions = getExamCart();
            questions = questions.filter(function(q) { return q.id !== qid; });
            saveExamCart(questions);
            showToast('已从组卷中移除', 'info');
        }
        
        function clearExamCart() {
            saveExamCart([]);
        }
        
        function updateCartBadge() {
            var items = getExamCart();
            var badge = document.getElementById('goExamBadge');
            if (badge) badge.textContent = items.length;
            // Also update main page cart badge via localStorage
            var mainBadge = document.getElementById('cartBadge');
            if (mainBadge) mainBadge.textContent = items.length;
        }
        

        
        function toggleBatch() {
            var btn = document.getElementById('batchToggle');
            var cards = document.querySelectorAll('.history-card');
            var bar = document.getElementById('batchActionBar');
            var isActive = btn.classList.toggle('active');
            btn.textContent = isActive ? '✓ 批量中' : '✓ 批量组卷';
            bar.classList.toggle('show', isActive);
            for (var i = 0; i < cards.length; i++) {
                cards[i].classList.toggle('batch-mode', isActive);
            }
            var cbs = document.querySelectorAll('.hc-checkbox');
            if (isActive) {
                // Auto-check questions already in cart
                var cart = getExamCart();
                var cartIds = cart.map(function(q) { return q.id; });
                for (var i = 0; i < cbs.length; i++) {
                    var qid = parseInt(cbs[i].dataset.id);
                    if (cartIds.indexOf(qid) >= 0) {
                        cbs[i].checked = true;
                    }
                }
            } else {
                // Uncheck all
                for (var i = 0; i < cbs.length; i++) cbs[i].checked = false;
            }
            updateBatchCount();
        }
        
        function updateBatchCount() {
            var cbs = document.querySelectorAll('.hc-checkbox:checked');
            var count = document.getElementById('batchCount');
            if (count) count.textContent = '已选 ' + cbs.length + ' 题';
        }
        
        function selectAllInView() {
            var cbs = document.querySelectorAll('.hc-checkbox');
            // Check if all are already checked
            var allChecked = true;
            for (var i = 0; i < cbs.length; i++) {
                if (!cbs[i].checked) { allChecked = false; break; }
            }
            for (var i = 0; i < cbs.length; i++) {
                cbs[i].checked = !allChecked;
            }
            updateBatchCount();
        }
        
        function addBatchToExam() {
            var cbs = document.querySelectorAll('.hc-checkbox:checked');
            var count = cbs.length;
            if (count === 0) { showToast('请先勾选题目', 'info'); return; }
            for (var i = 0; i < count; i++) {
                var qid = parseInt(cbs[i].dataset.id);
                addToExam(qid);
            }
            // Re-apply cart memory: keep checked for items now in cart
            var cart = getExamCart();
            var cartIds = cart.map(function(q) { return q.id; });
            var allCbs = document.querySelectorAll('.hc-checkbox');
            for (var i = 0; i < allCbs.length; i++) {
                var qid = parseInt(allCbs[i].dataset.id);
                allCbs[i].checked = cartIds.indexOf(qid) >= 0;
            }
            updateBatchCount();
            showToast('✓ 已将 ' + count + ' 道题加入组卷', 'success');
        }

        // ---- Toast Notification ----
        function showToast(msg, type) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast toast-' + (type || 'success');
            toast.textContent = msg;
            document.body.appendChild(toast);
            requestAnimationFrame(function() {
                toast.classList.add('show');
            });
            setTimeout(function() {
                toast.classList.remove('show');
                setTimeout(function() { toast.remove(); }, 300);
            }, 2000);
        }



        // ---- Go to exam ----
        function goToExam() {
            window.location.href = 'exam.html';
        }

        // Init cart + pagination on load
        document.addEventListener('DOMContentLoaded', function() {
            // Restore saved page size
            var savedPageSize = localStorage.getItem('history_page_size');
            if (savedPageSize) {
                var sel = document.getElementById('pageSizeSelect');
                if (sel) sel.value = savedPageSize;
            }
            setTimeout(function() {
                updateCartBadge();
            }, 100);
        });
</script>
