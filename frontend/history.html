<script>
function teachOpen(btn) {
    var q = btn.getAttribute('data-question');
    if (q) { localStorage.setItem('_teach_question', q); window.open('teach.html', '_blank'); }
}
function safeParseKps(kps){
    if(Array.isArray(kps)) return kps;
    try{var p=JSON.parse(kps);return Array.isArray(p)?p:[];}catch(e){return [];}
}
function safeParseMeta(m){
    if(m && typeof m === 'object') return m;
    if(!m) return {};
    try{var p=JSON.parse(m);return (p && typeof p === 'object') ? p : {};}catch(e){return {};}
}
function sourceMetaText(sourceType, sourceMeta){
    var m = safeParseMeta(sourceMeta);
    if(sourceType === '模拟题' || sourceType === '高考题'){
        var no = m.question_no ? '第' + m.question_no + '题' : '';
        if(m.paper && no) return m.paper + '·' + no;
        return m.paper || no;
    }
    if(sourceType === 'ai生成') return m.reference_id ? '参考题 #' + m.reference_id : '';
    if(sourceType === '精选母题'){
        var owner = m.owner || 'sqz';
        var txt = owner;
        if (m.pattern) txt += '·' + m.pattern;
        if (m.category) txt += ' · ' + m.category;
        if (m.mother_id) txt += ' · 母题 #' + m.mother_id;
        return txt;
    }
    return '';
}
function sourceMetaLink(sourceType, sourceMeta){
    var m = safeParseMeta(sourceMeta);
    var text = sourceMetaText(sourceType, m);
    if (!text) return '';
    if (sourceType === 'ai生成' && m.reference_id) {
        var rid = String(m.reference_id).replace(/\D/g, '');
        if (rid) {
            return '<a class="tag tag-source-meta tag-ref-link" href="javascript:void(0)" onclick="event.stopPropagation();openReferenceQuestion(' + rid + ')" title="查看参考题详情">' + escapeHtml(text) + '</a>';
        }
    }
    return '<span class="tag tag-source-meta">' + escapeHtml(text) + '</span>';
}
function openReferenceQuestion(rid){
    localStorage.setItem('_open_question_id', String(rid));
    window.open('history.html', '_blank');
}
function getRememberedSource(){
    try{var raw = localStorage.getItem('remembered_question_source'); return raw ? JSON.parse(raw) : null;}catch(e){return null;}
}
function saveRememberedSource(data){ localStorage.setItem('remembered_question_source', JSON.stringify(data)); }
function clearRememberedSource(){ localStorage.removeItem('remembered_question_source'); }
</script>

        <script>
        var _selectedTeacher = localStorage.getItem('teacher') || 'liangliang';
        var _selectedListId = null;
        var _selectedListType = 'all';  // null=all, '__wrong__'=wrong, number=user_list

        // ---- State ----
        var allQuestions = [];
        var _deleteTargetId = null;
        var _currentPage = 1;
        var _detailQuestionId = null;
        var _detailSourceType = '';
        var _detailSourceMeta = {};
        var _stepErrors = [];
        var _errorDialogState = { questionId: null, stepNumber: null, chunkId: null };
        // var _searchMode = 'content';

        // ---- Init: load categories into filter ----
        function initFilters() {
            fetch('http://127.0.0.1:8000/categories')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var sel = document.getElementById('filterCategory');
                    for (var i = 0; i < data.length; i++) {
                        var opt = document.createElement('option');
                        opt.value = data[i].level1;
                        opt.textContent = data[i].level1;
                        sel.appendChild(opt);
                    }
                })
                .catch(function(err) { console.error('Load categories failed:', err); });
        }

        // ---- Search + Filter ----
        var _selectedSourceFilter = '';
        function selectSourceFilter(el) {
            _selectedSourceFilter = el.value;
            onFilterChange();
        }
        function onFilterChange() {
            // Show big type filter only when 大题 is selected
            var typeVal = document.getElementById('filterType').value;
            var bigTypeEl = document.getElementById('filterBigType');
            if (bigTypeEl) {
                bigTypeEl.style.display = typeVal === '大题' ? 'inline-block' : 'none';
                if (typeVal !== '大题') bigTypeEl.value = '';
            }
            doSearch();
        }

        function loadBigTypes() {
            fetch('/steps').then(function(r){return r.json()}).then(function(data){
                var sel = document.getElementById('filterBigType');
                sel.innerHTML = '<option value="">大题细分</option>';
                data.types.filter(function(t){return t.has_predefined;}).forEach(function(t){
                    var opt = document.createElement('option');
                    opt.value = t.name;
                    opt.textContent = t.name;
                    sel.appendChild(opt);
                });
            });
        }

        // Search mode removed - search always covers all fields

        function onBigTypeChange() { onFilterChange(); }
        function onErrorTypeChange() {
            var val = document.getElementById('filterErrorType').value;
            var mtEl = document.getElementById('filterMistakeType');
            if (val === 'errors') {
                mtEl.style.display = 'inline-block';
            } else {
                mtEl.style.display = 'none';
                mtEl.value = '';
            }
            doSearch();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterSourceType').value = '';
            _selectedSourceFilter = '';
            document.getElementById('filterCategory').value = '';
            document.getElementById('filterType').value = '';
            document.getElementById('filterBigType').value = '';
            document.getElementById('filterBigType').style.display = 'none';
            document.getElementById('filterDifficulty').value = '';
            document.getElementById('filterErrorType').value = '';
            document.getElementById('filterMistakeType').value = '';
            document.getElementById('filterMistakeType').style.display = 'none';
            _currentPage = 1;
            doSearch();
        }

        function doSearch() {
            var q = document.getElementById('searchInput').value.trim();
            var cat = document.getElementById('filterCategory').value;
            // If big type is selected, use its mapped category
            var bigType = document.getElementById('filterBigType').value;
            if (bigType) {
                var bigMap = {'立体几何大题':'立体几何','解析几何大题':'解析几何','解三角形大题':'三角函数',
                              '数列大题':'数列','函数与导数大题':'函数与导数','简单的概率统计大题':'概率统计',
                              '困难的概率大题':'概率统计'};
                cat = bigMap[bigType] || '';
            }
            var type = document.getElementById('filterType').value;
            var diff = document.getElementById('filterDifficulty').value;
            var errorType = document.getElementById('filterErrorType').value;
            var mistakeType = document.getElementById('filterMistakeType').value;
            var pageSizeSelect = document.getElementById('pageSizeSelect');
            var pageSize = pageSizeSelect ? pageSizeSelect.value : '5';

            var params = [];
            var srcFilter = _selectedSourceFilter || '';
            if (srcFilter) params.push('source_type=' + encodeURIComponent(srcFilter));
            if (q) params.push('q=' + encodeURIComponent(q));
            if (cat) params.push('category=' + encodeURIComponent(cat));
            if (type) params.push('question_type=' + encodeURIComponent(type));
            if (diff) params.push('difficulty=' + encodeURIComponent(diff));
            if (errorType) {
                if (errorType === 'errors' && mistakeType) {
                    params.push('error_type=' + encodeURIComponent(mistakeType));
                } else {
                    params.push('error_type=' + encodeURIComponent(errorType));
                }
            }
            // params.push('mode=' + _searchMode);
            params.push('page=' + _currentPage);
            if (pageSize !== 'all') params.push('page_size=' + pageSize);

            var skeletonEl = document.getElementById('skeletonArea');
            var listEl = document.getElementById('historyCards');
            var emptyEl = document.getElementById('emptyState');
            var countEl = document.getElementById('historyCount');

            skeletonEl.style.display = 'block';
            listEl.innerHTML = '';

            var listTarget = null;
            if (_selectedListId === '__wrong__') {
                listTarget = 'wrong';
            } else if (_selectedListId !== null) {
                listTarget = _selectedListId;
            }
            var url;
            if (listTarget !== null) {
                url = 'http://127.0.0.1:8000/question-lists/' + listTarget + '/questions' + (params.length ? '?' + params.join('&') : '');
            } else {
                url = 'http://127.0.0.1:8000/questions/search' + (params.length ? '?' + params.join('&') : '');
            }
            fetch(url)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    skeletonEl.style.display = 'none';
                    // Handle paginated vs flat response
                    var questions, total;
                    if (data && data.data !== undefined) {
                        questions = data.data;
                        total = data.total;
                    } else {
                        questions = data;
                        total = data ? data.length : 0;
                    }
                    localStorage.setItem('questions_cache', JSON.stringify(questions));
                    renderList(questions, total, _currentPage, pageSize);
                })
                .catch(function(err) {
                    console.error('Search failed:', err);
                    skeletonEl.style.display = 'none';
                    if (q || cat || type || diff || errorType) {
                        countEl.textContent = '搜索失败';
                    } else {
                        emptyEl.style.display = 'block';
                        countEl.textContent = '加载失败';
                    }
                });
        }

        function loadQuestions() {
            initFilters(); loadBigTypes();
            loadLists();
            // Restore saved page size
            var savedPageSize = localStorage.getItem('history_page_size');
            if (savedPageSize) {
                var sel = document.getElementById('pageSizeSelect');
                if (sel) sel.value = savedPageSize;
            }
            // Try cache first
            var cached = localStorage.getItem('questions_cache');
            if (cached) {
                try {
                    var cachedData = JSON.parse(cached);
                    if (cachedData.length > 0) {
                        renderList(cachedData);
                    }
                } catch(e) {}
            }
            doSearch();
        }

        // ---- Render ----
        function renderList(data, total, page, pageSize) {
            var listEl = document.getElementById('historyCards');
            var emptyEl = document.getElementById('emptyState');
            var skeletonEl = document.getElementById('skeletonArea');
            var countEl = document.getElementById('historyCount');

            skeletonEl.style.display = 'none';
            allQuestions = data;

            if (!data || data.length === 0) {
                emptyEl.style.display = 'block';
                listEl.innerHTML = '';
                countEl.textContent = '暂无记录';
                return;
            }

            emptyEl.style.display = 'none';
            var displayTotal = total !== undefined ? total : data.length;
            countEl.textContent = '共 ' + displayTotal + ' 道题'; updateListCounts();

            var html = '';
            var cartIds = getExamCart().map(function(q) { return q.id; });
            for (var i = 0; i < data.length; i++) {
                var q = data[i];
                var preview = truncatePreview(q.content || '', 150);

                var diffClass = 'tag-easy';
                if (q.difficulty_level === '\u4e2d\u7b49') diffClass = 'tag-medium';
                else if (q.difficulty_level === '\u56f0\u96be') diffClass = 'tag-hard';
                else if (q.difficulty_level === '\u6781\u96be') diffClass = 'tag-extreme';

                // Source type tag
                var srcTag = '';
                if (q.source_type) {
                    var srcClass = 'tag-source';
                    if (q.source_type === 'ai生成') srcClass += ' tag-source-ai';
                    else if (q.source_type === '高考题') srcClass += ' tag-source-gaokao';
                    else if (q.source_type === '模拟题') srcClass += ' tag-source-monikao';
                    else if (q.source_type === '精选母题') srcClass += ' tag-source-muti';
                    srcTag = '<span class="' + srcClass + '">' + escapeHtml(q.source_type) + '</span>';
                    srcTag += sourceMetaLink(q.source_type, q.source_meta);
                }
                // Question type tag
                var typeTag = '';
                if (q.question_type) {
                    var tc = 'tag-type';
                    if (q.question_type === '\u9009\u62e9\u9898') tc += ' tag-type-choice';
                    else if (q.question_type === '\u586b\u7a7a\u9898') tc += ' tag-type-blank';
                    else if (q.question_type === '\u5927\u9898') tc += ' tag-type-long';
                    else tc += ' tag-type-special';
                    typeTag = '<span class="tag ' + tc + '">' + escapeHtml(q.question_type) + '</span>';
                }

                var catTag = '';
                if (q.category_level1) {
                    catTag = '<span class="tag tag-category">' + escapeHtml(q.category_level1) + '</span>';
                }
                // Check for error status from display (backend step_errors count would need a separate query)
                // We'll skip error tags in list for now since the search may not return step_errors
                // The error count will be visible when user filters by error_type


                var timeHtml = getTimeDisplay(q);
                dateStr = timeHtml;

                var score = q.difficulty_score !== null ? '(' + q.difficulty_score + '\u5206)' : '';

                html += '<div class="history-card" data-id="' + q.id + '">';
                html += '<input type="checkbox" class="hc-checkbox" data-id="' + q.id + '"' + (cartIds.indexOf(q.id) >= 0 ? ' checked' : '') + ' onchange="toggleExamSelection(this)">';
                html += '<div class="hc-preview" onclick="showDetail(' + q.id + ')">' + escapeHtml(preview) + '</div>';
                html += '<div class="hc-meta">';
                html += '<span class="tag tag-id">ID ' + q.id + '</span>';
                html += typeTag;
                html += catTag;
                if (q.difficulty_level) {
                    html += '<span class="tag ' + diffClass + '">' + escapeHtml(q.difficulty_level) + ' ' + score + '</span>';
                }
                html += srcTag;
                html += '<span class="hc-date">' + dateStr + '</span>';
                var _srcArg = q.source_type ? '\'' + String(q.source_type).replace(/'/g,"\\'") + '\'' : '\'\'';
                var _metaArg = JSON.stringify(safeParseMeta(q.source_meta)).replace(/"/g, '&quot;');
                html += '<button class="exam-add-btn" onclick="event.stopPropagation();showSaveDialog(' + q.id + ', \'\', ' + _srcArg + ', \'' + _metaArg + '\')" title="加入其他题单">📂</button>';
                html += '<button class="exam-add-btn" onclick="event.stopPropagation();generateFromQuestion(' + q.id + ')" title="AI仿题">✨</button>';
                html += '<button class="delete-btn" onclick="event.stopPropagation();confirmDelete(' + q.id + ')" title="\u5220\u9664\u6b64\u9898">\ud83d\uddd1</button>';
                html += '<button class="exam-add-btn" onclick="event.stopPropagation();addToExam(' + q.id + ')" title="\u52a0\u5165\u7ec4\u5377">\ud83d\udccb</button>';
                html += '<button class=\"exam-add-btn\" onclick=\"event.stopPropagation();teachOpen(this)\" data-question=\"' + escapeHtml(q.content||'').replace(/\"/g,'&quot;').replace(/\\n/g,' ') + '\" title=\"手把手教学\">📖</button>';
                html += '</div>';
                html += '</div>';
            }
            listEl.innerHTML = html;
            var batchToggle = document.getElementById('batchToggle');
            if (batchToggle && batchToggle.classList.contains('active')) {
                var newCards = listEl.querySelectorAll('.history-card');

        // ---- Utility Functions ----
        // ---- Preview Truncation ----
        function truncatePreview(text, maxLen) {
            if (!text) return '';
            /* Truncate to max length first (happens most of the time) */
            var processed = text;
            var wasTruncated = false;
            if (processed.length > maxLen) {
                processed = processed.substring(0, maxLen - 3) + '...';
                wasTruncated = true;
            }
            /* Protect display math markers */
            processed = processed.replace(/\$\$/g, '<<DL>>');
            /* Check for unclosed single $: remove it and everything after */
            var matches = processed.match(/\$/g);
            var dollarCount = matches ? matches.length : 0;
            if (dollarCount % 2 !== 0) {
                var lastDollar = processed.lastIndexOf('$');
                processed = processed.substring(0, lastDollar);
                if (wasTruncated) processed += '...';
            }
            /* Restore display math */
            processed = processed.replace(/<<DL>>/g, '$$');
            return processed;
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function formatChoiceQuestion(text) {
            if (!text) return '';
            var s = String(text).replace(/\r\n/g, '\n');
            s = s.replace(/(?<![A-Za-z0-9$])([A-H])\s*[.．、)]\s*/g, '\n$1. ');
            var lines = s.split('\n');
            var out = [];
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) continue;
                out.push(line);
            }
            return out.join('\n');
        }

            var isOpen = !content.classList.contains('show');
            content.classList.toggle('show');

            if (isOpen && window.renderMathInElement) {
                try { renderMathInElement(content, { delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ], ignoredTags: [] }); } catch(e) { console.log('KaTeX error:', e); }
            }
        }

        function levelClass(level) {
            var map = { '\u5bb9\u6613': 'tag-easy', '\u4e2d\u7b49': 'tag-medium', '\u56f0\u96be': 'tag-hard', '\u6781\u96be': 'tag-extreme' };
            return map[level] || 'tag-easy';
        }

        // ---- Step Error Functions ----
        function refreshStepErrors() {
            if (!_detailQuestionId) return;
            fetch('http://127.0.0.1:8000/questions/' + _detailQuestionId)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.error) return;
                    _stepErrors = data.step_errors || [];
                    renderStepErrors();
                });
        }

        function renderStepErrors() {
            var steps = document.querySelectorAll('#detailResult .step[data-step-number]');
            steps.forEach(function(stepEl) {
                var stepNum = parseInt(stepEl.dataset.stepNumber);
                var chunkId = parseInt(stepEl.dataset.chunkId);
                var errors = _stepErrors.filter(function(e) {
                    return e.step_number === stepNum && e.chunk_id === chunkId;
                });
                
                stepEl.classList.toggle('has-error', errors.length > 0);
                
                var btn = stepEl.querySelector('.step-error-btn');
                if (btn) {
                    btn.textContent = errors.length > 0 ? '编辑错因' : '添加错因';
                    btn.classList.toggle('has-error', errors.length > 0);
                }
                
                var errorsList = stepEl.querySelector('.step-errors');
                if (errorsList) {
                    if (errors.length > 0) {
                        var html = '';
                        for (var ei = 0; ei < errors.length; ei++) {
                            var err = errors[ei];
                            var timeStr = '';
                            if (err.created_at) {
                                var d = new Date(err.created_at.replace(' ', 'T') + 'Z');
                                var offset = 8 * 60;
                                var local = new Date(d.getTime() + offset * 60000);
                                timeStr = local.getUTCFullYear() + '-' + 
                                    String(local.getUTCMonth()+1).padStart(2,'0') + '-' +
                                    String(local.getUTCDate()).padStart(2,'0') + ' ' +
                                    String(local.getUTCHours()).padStart(2,'0') + ':' +
                                    String(local.getUTCMinutes()).padStart(2,'0');
                            }
                            html += '<div class="step-error-item">';
                            html += '<span class="error-type-badge">' + escapeHtml(err.mistake_type) + '</span>';
                            html += '<span class="error-detail">' + escapeHtml(err.mistake_detail || '') + '</span>';
                            html += '<span class="error-time">' + timeStr + '</span>';
                            html += '<button class="error-delete-btn" onclick="event.stopPropagation();deleteStepError(' + _detailQuestionId + ',' + err.id + ')">✕</button>';
                            html += '</div>';
                        }
                        errorsList.innerHTML = html;
                    } else {
                        errorsList.innerHTML = '';
                    }
                }
            });
        }

        function confirmAddError() {
            var state = _errorDialogState;
            var type = document.getElementById('errorDialogType').value;
            var detail = document.getElementById('errorDialogDetail').value.trim();
            if (!type) { alert('请选择一级错因'); return; }
            
            fetch('http://127.0.0.1:8000/questions/' + state.questionId + '/step-error', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    step_number: state.stepNumber,
                    chunk_id: state.chunkId,
                    mistake_type: type,
                    mistake_detail: detail
                })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                closeErrorDialog();
                refreshStepErrors();
            })
            .catch(function(err) {

        // ---- Time Display ----
        function getTimeDisplay(q) {
            var allTimes = [];
            if (q.created_at) allTimes.push({label: '加入题库', time: q.created_at, priority: 0});
            if (q.last_viewed_at) allTimes.push({label: '最近查看', time: q.last_viewed_at, priority: 1});
            if (q.last_exam_at) allTimes.push({label: '最近组卷', time: q.last_exam_at, priority: 2});
            if (q.last_edited_at) allTimes.push({label: '最近编辑', time: q.last_edited_at, priority: 3});
            
            // Sort by priority desc to find the most recent action
            allTimes.sort(function(a, b) { return b.priority - a.priority; });
            var main = allTimes.length > 0 ? allTimes[0] : {label: '加入题库', time: q.created_at || ''};
            var mainTime = formatUTCDate(main.time);
            
            var html = '<span class="hc-time-wrapper" onclick="event.stopPropagation();toggleTimePopup(this)">';
            html += '<span class="hc-time-main">' + main.label + ' ' + mainTime + '</span>';
            html += '<span class="hc-time-arrow">\u25be</span>';
            html += '<div class="hc-time-popup">';
            for (var ti = 0; ti < allTimes.length; ti++) {
                var t = allTimes[ti];
                if (t.time) {
                    html += '<div class="hc-time-popup-item"><span class="ttp-label">' + t.label + '</span> ' + formatUTCDate(t.time) + '</div>';
                }
            }
            html += '</div></span>';
            return html;
        }
        
        function formatUTCDate(timeStr) {
            if (!timeStr) return '';
            var d = new Date(timeStr.replace(' ', 'T') + 'Z');
            var offset = 8 * 60;
            var local = new Date(d.getTime() + offset * 60000);
            return local.getUTCFullYear() + '-' + 
                String(local.getUTCMonth() + 1).padStart(2, '0') + '-' +
                String(local.getUTCDate()).padStart(2, '0') + ' ' +
                String(local.getUTCHours()).padStart(2, '0') + ':' +
                String(local.getUTCMinutes()).padStart(2, '0');
        }

        function addToExam(qid, silent) {

                if (newName && newName !== currentName) {
                    fetch('http://127.0.0.1:8000/question-lists/' + id, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },

                html += '<input type="text" id="sdMotherId" placeholder="母题ID" maxlength="30" value="' + esc(m.mother_id || '') + '"></div>';
            } else {
                html += '<p class="source-meta-hint">选择来源后填写二级标签</p>';
            }
            html += '</div>';
            return html;
        }

        function updateSourceMetaFields() {
            var box = document.getElementById('sourceMetaFields');
            if (box) box.outerHTML = sourceMetaFieldsHtml(_selectedSourceType, _selectedSourceMeta);
        }

        function collectSourceMetaFromDialog() {
            var type = _selectedSourceType;
            var m = {};
            if (type === '模拟题' || type === '高考题') {
                var paper = document.getElementById('sdPaper');
                var no = document.getElementById('sdQuestionNo');
                if (paper && paper.value.trim()) m.paper = paper.value.trim();
                if (no && no.value.trim()) m.question_no = no.value.trim();
            } else if (type === 'ai生成') {
                var ref = document.getElementById('sdReferenceId');
                if (ref && ref.value.trim()) m.reference_id = ref.value.trim();
            } else if (type === '精选母题') {
                var owner = document.getElementById('sdOwner');
                var mid = document.getElementById('sdMotherId');
                var cat = document.getElementById('sdMotherCategory');
                var pat = document.getElementById('sdMotherPattern');
                m.owner = (owner && owner.value.trim()) ? owner.value.trim() : 'sqz';
                if (mid && mid.value.trim()) m.mother_id = mid.value.trim();
                if (cat && cat.value) m.category = cat.value;
                if (pat && pat.value.trim()) m.pattern = pat.value.trim();
            }
            return m;
        }

        function populateMotherCategoryOptions() {
            fetch('http://127.0.0.1:8000/categories')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var cats = (data || []).map(function(x) { return x.level1; });
                    var sels = document.querySelectorAll('.mother-category-select');
                    for (var i = 0; i < sels.length; i++) {
                        var cur = sels[i].value;
                        var html = '<option value="">请选择板块</option>';
                        for (var j = 0; j < cats.length; j++) {
                            html += '<option value="' + escapeHtml(cats[j]) + '">' + escapeHtml(cats[j]) + '</option>';
                        }
                        sels[i].innerHTML = html;
                        if (cur) sels[i].value = cur;
                    }
                })
                .catch(function() {});
        }

        async function registerMotherQuestion(questionId, srcMeta) {
            if (!srcMeta || !srcMeta.category || !srcMeta.pattern) return;
            try {
                await fetch('http://127.0.0.1:8000/patterns/mother', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({question_id: questionId, category: srcMeta.category, name: srcMeta.pattern})
                });
            } catch (e) {
                console.error('登记母题失败:', e);
                showToast('题目已保存，但套路登记失败', 'error');
            }
        }

        function selectSourceType(el) {
            document.querySelectorAll('.source-type-option').forEach(function(s) { s.classList.remove('active'); });
            el.classList.add('active');
            _selectedSourceType = el.dataset.value;
            _selectedSourceMeta = {};
            updateSourceMetaFields();
            if (_selectedSourceType === '精选母题') populateMotherCategoryOptions();
        }
        
        function closeSaveDialog() {
            var overlay = document.querySelector('.save-dialog-overlay');
            if (overlay) overlay.remove();
        }
        
        function createListFromDialog() {
            var inp = document.getElementById('saveDialogNewList');
            var name = inp.value.trim();
            if (!name) return;
            fetch('http://127.0.0.1:8000/question-lists', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({name: name})
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                inp.value = '';
                // Refresh the dialog
                // Get current dialog state
                var overlay = document.querySelector('.save-dialog-overlay');
                if (overlay) {
                    var qid = overlay.querySelector('.sd-btn-confirm') ? 
                              overlay.querySelector('.sd-btn-confirm').getAttribute('onclick').match(/\d+/)[0] : null;
                    if (qid) {
                        var currentSrc = '';
                        var activeEl = overlay.querySelector('.source-type-option.active');
                        if (activeEl) currentSrc = activeEl.dataset.value;
                        // Re-fetch and re-render
                        fetch('http://127.0.0.1:8000/questions/' + qid + '/lists')
                            .then(function(r) { return r.json(); })
                            .then(function(md) {
                                showSaveDialog(parseInt(qid), '', currentSrc, _selectedSourceMeta);
                            });
                    }
                }
            });
        }
        
        async function confirmSaveDialog(questionId) {
            // Collect checked list IDs
            var cbs = document.querySelectorAll('.sdl-checkbox:checked');
            var listIds = [];
            for (var i = 0; i < cbs.length; i++) {
                listIds.push(parseInt(cbs[i].dataset.listId));
            }
            
            var srcType = _selectedSourceType || '';
            var srcMeta = collectSourceMetaFromDialog();
            if (srcType === '精选母题' && (!srcMeta.category || !srcMeta.pattern)) {
                alert('请选择所属板块并填写套路名');
                return;
            }
            var rememberBox = document.getElementById('rememberSourceBox');
            var remember = rememberBox ? rememberBox.checked : false;
            if (remember && srcType) saveRememberedSource({source_type: srcType, source_meta: srcMeta});
            else if (!remember) clearRememberedSource();
            try {
                if (srcType) {
                    var sr = await fetch('http://127.0.0.1:8000/questions/' + questionId + '/source-type', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({source_type: srcType, source_meta: srcMeta})
                    });
                    var sd = await sr.json();
                    if (sd.error) throw new Error(sd.error);
                }
            } catch (err) {
                closeSaveDialog();
                showToast('来源标签保存失败: ' + err.message, 'error');
                return;
            }
            
            try {
                if (listIds.length > 0) {
                    var r = await fetch('http://127.0.0.1:8000/questions/' + questionId + '/lists', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({list_ids: listIds})
                    });
                    var data = await r.json();
                    closeSaveDialog();
                    showToast('✓ 已保存到 ' + data.added + ' 个题单' + (srcType ? '，来源：' + srcType : ''), 'success');
                    await registerMotherQuestion(questionId, srcMeta);
                } else {
                    closeSaveDialog();
                    showToast('已保存' + (srcType ? '，来源：' + srcType : ''), 'success');
                    await registerMotherQuestion(questionId, srcMeta);
                }
            } catch (err) {
                closeSaveDialog();
                showToast('保存失败: ' + err.message, 'error');
                return;
            }

            updateDetailSourceTag(srcType, srcMeta);
            doSearch();
            setTimeout(loadLists, 400);
        }

        // ========== AI 仿题 ==========
        var _aiGenTimer = null;

        function closeAiGenModal() {
            if (_aiGenTimer) { clearTimeout(_aiGenTimer); _aiGenTimer = null; }
            var ov = document.getElementById('aiGenOverlay');
            if (ov) ov.style.display = 'none';
        }

        function aiGenProgressHtml(pct, stage, detail) {
            var stages = ['AI出题', 'Solver', 'Verifier', 'Formatter'];
            var idx = {generating: 0, solver: 1, verifier: 2, formatter: 3, done: 3}[stage] || 0;
            var html = '<div class="ai-gen-progress">';
            html += '<div class="ai-gen-progress-stages">';
            for (var i = 0; i < stages.length; i++) {
                var cls = i < idx ? 'completed' : (i === idx ? 'active' : '');
                html += '<div class="ai-gen-progress-stage ' + cls + '">' +
                    '<span class="ai-gen-progress-dot"></span><span>' + stages[i] + '</span></div>';
            }
            html += '</div>';
            html += '<div class="ai-gen-progress-bar"><div class="ai-gen-progress-fill" style="width:' + pct + '%"></div></div>';
            html += '<div class="ai-gen-progress-pct">' + pct + '%</div>';
            html += '<div class="ai-gen-progress-text">' + escapeHtml(detail || '') + '</div>';
            html += '</div>';
            return html;
        }

        function aiGenErrorHtml(msg) {
            return '<div class="ai-gen-status" style="color:#b3261e;">' + escapeHtml(msg || '生成失败') + '</div>';
        }

        async function startAiGenJob(qid) {
            var ov = document.getElementById('aiGenOverlay');
            var ct = document.getElementById('aiGenContent');
            if (!ov || !ct) return;
            ov.style.display = 'flex';
            ct.innerHTML = aiGenProgressHtml(0, 'generating', '正在启动 AI 仿题');
            try {
                var r = await fetch('http://127.0.0.1:8000/questions/' + qid + '/generate/async', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ count: 3, teacher: 'liangliang' })
                });
                var sj = await r.json();
                if (sj.error || !sj.job_id) {
                    ct.innerHTML = aiGenErrorHtml(sj.detail || sj.error || '启动生成任务失败');
                    return;
                }
                var jobId = sj.job_id;
                async function poll() {
                    try {
                        var pr = await fetch('http://127.0.0.1:8000/generate-jobs/' + jobId);
                        var pj = await pr.json();
                        if (pj.status === 'done') {
                            _aiGenTimer = null;
                            renderAiGenResult(pj.result);
                        } else if (pj.status === 'error') {
                            _aiGenTimer = null;
                            ct.innerHTML = aiGenErrorHtml(pj.detail || pj.error || '生成失败');
                        } else {
                            ct.innerHTML = aiGenProgressHtml(pj.progress || 0, pj.stage || 'generating', pj.detail || '');
                            _aiGenTimer = setTimeout(poll, 800);
                        }
                    } catch (e) {
                        _aiGenTimer = null;
                        ct.innerHTML = aiGenErrorHtml('请求失败：' + (e.message || '无法连接后端'));
                    }
                }
                _aiGenTimer = setTimeout(poll, 800);
            } catch (e) {
                ct.innerHTML = aiGenErrorHtml('请求失败：' + (e.message || '无法连接后端'));
            }
        }

        async function generateFromQuestion(qid) {
            await startAiGenJob(qid);
        }

        function aiGenDifficultyText(c) {
            if (!c || !c.difficulty) return '';
            var lv = c.difficulty.level || '';
            var sc = c.difficulty.total_score;
            return lv + (sc !== undefined && sc !== null ? ' · ' + sc + '分' : '');
        }

        function escJsStr(s) {
            return escapeHtml(String(s)).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, '\\n');
        }

        function renderAiGenResult(d) {
            var ct = document.getElementById('aiGenContent');
            if (!ct) return;
            if (!d || d.error) {
                ct.innerHTML = '<div class="ai-gen-status" style="color:#b3261e;">' + escapeHtml((d && (d.detail || d.message)) || '生成失败') + '</div>';
                return;
            }
            var list = d.candidates || [];
            var html = '<div class="ai-gen-status">生成 ' + list.length + ' 道，通过 ' + (d.accepted || 0) + ' 道，淘汰 ' + (d.rejected || 0) + ' 道。通过的题目已自动保存并标记为 AI 仿题。</div>';
            if (!list.length) {
                html += '<div class="ai-gen-status">没有通过校验的题目，稍后再试一次。</div>';
                ct.innerHTML = html;
                return;
            }
            for (var i = 0; i < list.length; i++) {
                var c = list[i];
                var ok = c.status === 'accepted';
                var cls = ok ? 'ai-gen-accepted' : 'ai-gen-rejected';
                html += '<div class="ai-gen-card ' + cls + '">';
                html += '<div class="ai-gen-q">' + escapeHtml(c.question || '') + '</div>';
                html += '<div class="ai-gen-tags">';
                if (ok) {
                    html += '<span class="ai-gen-tag ai-gen-tag-ok">通过 · 贴合度 ' + escapeHtml(String(c.fit_score || 0)) + '</span>';
                    var dt = aiGenDifficultyText(c);
                    if (dt) html += '<span class="ai-gen-tag">' + escapeHtml(dt) + '</span>';
                } else {
                    html += '<span class="ai-gen-tag ai-gen-tag-bad">未通过</span>';
                }
                if (c.design_focus) html += '<span class="ai-gen-tag">' + escapeHtml(c.design_focus) + '</span>';
                html += '</div>';
                if (ok) {
                    html += '<div class="ai-gen-actions">' +
                        '<button class="ai-gen-action ai-gen-action-primary" onclick="aiTeachNewQuestion(\'' + escJsStr(c.question) + '\')">📖 手把手教学</button>' +
                        '<button class="ai-gen-action ai-gen-action-plain" onclick="closeAiGenModal();showDetail(' + c.question_id + ')">查看解析</button>' +
                        '</div>';
                } else if (c.rejected_reason) {
                    html += '<div class="ai-gen-note">淘汰原因：' + escapeHtml(c.rejected_reason) + '</div>';
                }
                html += '</div>';
            }
            ct.innerHTML = html;
            if (window.renderMathInElement) {
                try { renderMathInElement(ct, { delimiters: [{left: '$$', right: '$$', display: true},{left: '$', right: '$', display: false}], ignoredTags: ['script', 'style'] }); } catch (e) {}
            }
        }

        function aiTeachNewQuestion(q) {
            localStorage.setItem('_teach_question', q);
            window.open('teach.html', '_blank');
        }

</script>
