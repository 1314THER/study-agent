    .mission-box { width: min(100%, 360px); box-sizing: border-box; padding: 14px 16px; border: 1px solid #e5e5e7; border-radius: 13px; background: #fff; box-shadow: 0 5px 16px rgba(0,0,0,.05); }

    .mission-box.locked { opacity: .58; filter: grayscale(.25); }
    .mission-box.done { border-color: #74c69d; background: #f7fdf9; }
    .mission-box.progress { border-color: #f2c27b; background: #fffaf3; }
    .mission-level:nth-of-type(odd) .mission-box { justify-self: end; }
    .mission-level:nth-of-type(even) .mission-box { justify-self: start; }
    .mission-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .mission-number { color: #0071e3; font-size: 11px; font-weight: 800; letter-spacing: .08em; }
    .mission-name { margin-top: 5px; color: #1d1d1f; font-size: 15px; font-weight: 700; line-height: 1.45; word-break: break-word; }
    .mission-desc { margin-top: 7px; color: #86868b; font-size: 12px; line-height: 1.6; }
    .mission-status { flex: 0 0 auto; padding: 3px 8px; border-radius: 999px; background: #f3f4f6; color: #6b7280; font-size: 11px; white-space: nowrap; }
    .mission-status.done { background: #d1fae5; color: #047857; }
    .mission-status.progress { background: #fef3c7; color: #b45309; }
    .mission-status.locked { background: #f3f4f6; color: #9ca3af; }
    .mission-empty { margin-top: 8px; color: #b45309; font-size: 12px; }
    .mission-task { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 9px; padding-top: 9px; border-top: 1px solid #f0f0f2; color: #1d1d1f; font-size: 13px; line-height: 1.45; }
    .mission-task small { color: #86868b; font-size: 11px; white-space: nowrap; }
    .mission-task.clickable { cursor: pointer; }
    .mission-task.clickable:hover span { color: #0071e3; }
    .empty-run { padding: 80px 20px; color: #86868b; text-align: center; font-size: 14px; }

    @media (max-width: 820px) {
        .run-wrap { padding: 18px 14px 36px; }
        .run-layout { grid-template-columns: 1fr; }
        .run-side { position: static; }

        .side-note { display: none; }
        .run-main { padding: 18px 12px 26px; }
        .mission-map { margin: 0 4px; }
        .mission-map:before { left: 18px; transform: none; }
        .map-start, .map-end { margin-left: 0; }
        .mission-level, .mission-level:nth-of-type(odd), .mission-level:nth-of-type(even) { display: grid; grid-template-columns: 36px 1fr; min-height: 120px; }
        .mission-branch, .mission-level:nth-of-type(odd) .mission-branch, .mission-level:nth-of-type(even) .mission-branch { grid-column: 1; grid-row: 1; height: 3px; }
        .mission-box, .mission-level:nth-of-type(odd) .mission-box, .mission-level:nth-of-type(even) .mission-box { grid-column: 2; grid-row: 1; justify-self: stretch; width: 100%; }
        .mission-branch:before { margin-left: 12px; }
    }

<script src="nav.js?v=20260809e"></script>
<script>
var boards = [];
var currentBoardId = null;

function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function stateLabel(s) { return {never:'未挑战', first_pass:'进行中', second_pass:'进行中', third_pass:'已完成', again_wrong:'需要重试'}[s] || '未挑战'; }
function stateClass(s) { return s === 'third_pass' ? 'done' : (s === 'first_pass' || s === 'second_pass' || s === 'again_wrong' ? 'progress' : ''); }
function api(path) { return fetch('http://127.0.0.1:8000' + path).then(function(r) { if (!r.ok) throw new Error('请求失败'); return r.json(); }); }

function boardLevels(board) {
    var byIndex = {};
    (board.nodes || []).forEach(function(n) {
        var index = Math.max(0, Math.round(n.x || 0));
        (byIndex[index] = byIndex[index] || []).push(n);
    });
    (board.levels || []).forEach(function(l) {
        var index = Number(l.level_index);
        if (!byIndex[index]) byIndex[index] = [];
    });
    return Object.keys(byIndex).map(Number).sort(function(a,b) { return a-b; }).map(function(index) {
        var meta = (board.levels || []).find(function(l) { return Number(l.level_index) === index; }) || {};
        return {index:index, name:meta.name || '', description:meta.description || '', patterns:(byIndex[index] || []).slice().sort(function(a,b) { return (a.y || 0) - (b.y || 0); })};
    });
}

function levelLocked(levels, seq) {
    for (var i = seq - 1; i >= 0; i--) {
        if (!levels[i].patterns.length) continue;
        return levels[i].patterns.some(function(n) { return n.state !== 'third_pass'; });
    }
    return false;
}

function loadBoards() {
    api('/boards').then(function(data) {
        boards = data || [];
        if (!boards.length) { renderCategories(); renderBoard(null); return; }
        if (!boards.some(function(b) { return b.id === currentBoardId; })) currentBoardId = boards[0].id;
        renderCategories();
        renderBoard(boards.find(function(b) { return b.id === currentBoardId; }));
    }).catch(function(e) {
        document.getElementById('categoryList').innerHTML = '<div class="empty-run run-error">加载失败</div>';
        document.getElementById('runBoard').innerHTML = '<div class="empty-run run-error">' + escapeHtml(e.message) + '</div>';
    });
}

function renderCategories() {
    var el = document.getElementById('categoryList');
    el.innerHTML = boards.map(function(b) {
        var count = (b.nodes || []).length;
        return '<button class="category-button' + (b.id === currentBoardId ? ' active' : '') + '" onclick="selectBoard(' + b.id + ')">' + escapeHtml(b.category) + '<span class="category-count">' + count + '</span></button>';
    }).join('') || '<div class="empty-run">暂无板块</div>';
}

function selectBoard(id) { currentBoardId = id; renderCategories(); renderBoard(boards.find(function(b) { return b.id === id; })); }

function renderBoard(board) {
    var el = document.getElementById('runBoard');
    if (!board) { el.innerHTML = '<div class="empty-run">暂无闯关地图</div>'; return; }
    var levels = boardLevels(board);
    var mastered = (board.nodes || []).filter(function(n) { return n.state === 'third_pass'; }).length;
    var total = (board.nodes || []).length;
    var html = '<div class="run-board-head"><div class="run-board-name">' + escapeHtml(board.name || board.category) + '</div><div class="run-board-progress">已完成 <b>' + mastered + '</b> / ' + total + ' 个套路</div></div>';
    if (!levels.length) { el.innerHTML = html + '<div class="empty-run">这个板块还没有关卡</div>'; return; }
    html += '<div class="mission-map"><div class="map-start">开始</div>';
    levels.forEach(function(level, seq) {
        var locked = levelLocked(levels, seq);
        var allDone = level.patterns.length > 0 && level.patterns.every(function(n) { return n.state === 'third_pass'; });
        var status = locked ? '未解锁' : (allDone ? '已完成' : '待挑战');
        var cls = locked ? 'locked' : (allDone ? 'done' : (level.patterns.some(function(n) { return n.state === 'first_pass' || n.state === 'second_pass' || n.state === 'again_wrong'; }) ? 'progress' : ''));
        html += '<div class="mission-level"><div class="mission-branch"></div><div class="mission-box ' + cls + '">';
        html += '<div class="mission-head"><div><div class="mission-number">MISSION ' + String(seq + 1).padStart(2, '0') + '</div><div class="mission-name">' + escapeHtml(level.name || ('第 ' + (seq + 1) + ' 关')) + '</div></div><span class="mission-status ' + cls + '">' + status + '</span></div>';
        if (level.description) html += '<div class="mission-desc">' + escapeHtml(level.description) + '</div>';
        if (!level.patterns.length) html += '<div class="mission-empty">本关还没有配置套路</div>';
        level.patterns.forEach(function(n) {
            html += '<div class="mission-task' + (n.question_id && !locked ? ' clickable' : '') + '"' + (n.question_id && !locked ? ' onclick="openLoop(' + n.pattern_id + ')"' : '') + '><span>' + escapeHtml(n.name || ('套路 #' + n.pattern_id)) + '</span><small>' + (n.question_id ? (n.question_type || '点击开始') : '待添加题目') + '</small></div>';
        });
        html += '</div></div>';
    });
    html += '<div class="map-end">完成路线</div></div>';
    el.innerHTML = html;
}

function openLoop(patternId) { window.open('loop.html?v=20260807&pattern_id=' + patternId, '_blank'); }
document.addEventListener('DOMContentLoaded', loadBoards);
</script>
