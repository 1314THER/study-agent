<script>
var boards = [];
var currentBoard = null;
var patterns = [];
var _validCategories = [];
var selectedLevelSeq = 0;

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function api(path, opts) {
    var r = await fetch('http://127.0.0.1:8000' + path, opts || {});
    return r.json();
}

async function loadCategories() {
    try {
        var r = await fetch('http://127.0.0.1:8000/categories');
        var data = await r.json();
        _validCategories = (data || []).map(function(x) { return x.level1; });
    } catch (e) {
        _validCategories = [];
    }
}

function validateBoards() {
    var statusEl = document.getElementById('boardStatus');
    if (!statusEl) return;
    if (!_validCategories.length) {
        statusEl.innerHTML = '<span style="color:#c62828;">板块栏目加载失败，请重试 <button class="board-btn secondary" onclick="loadBoards()">重试</button></span>';
        return;
    }
    var bad = boards.filter(function(b) { return _validCategories.indexOf(b.category) < 0; }).map(function(b) { return b.category; });
    if (bad.length) {
        statusEl.innerHTML = '<span style="color:#c62828;">板块与栏目不一致：' + escapeHtml(bad.join('、')) + '，请重试 <button class="board-btn secondary" onclick="loadBoards()">重试</button></span>';
        return;
    }
    statusEl.textContent = '';
}

async function loadPatterns() {
    try {
        var r = await fetch('http://127.0.0.1:8000/patterns');
        patterns = await r.json();
    } catch (e) {
        patterns = [];
    }
}

async function loadBoards() {
    try {
        boards = await api('/boards');
    } catch (e) {
        boards = [];
    }
    await loadCategories();
    await loadPatterns();
    validateBoards();
    renderBoardList();
    if (!currentBoard && boards.length) {
        selectBoard(boards[0].id);
    } else if (currentBoard) {
        var fresh = boards.find(function(b) { return b.id === currentBoard.id; });
        if (fresh) selectBoard(fresh.id);
    }
    validateBoards();
}

function renderBoardList() {
    var html = '';
    for (var i = 0; i < boards.length; i++) {
        var b = boards[i];
        var count = (b.nodes || []).filter(function(n) { return n.pattern_id; }).length;
        html += '<button class="board-cat' + (currentBoard && currentBoard.id === b.id ? ' active' : '') + '" onclick="selectBoard(' + b.id + ')">' + escapeHtml(b.category) + ' <span style="color:#86868b;">(' + count + ')</span></button>';
    }
    document.getElementById('boardList').innerHTML = html || '<div class="empty-board">暂无地图</div>';
}

function selectBoard(id) {
    currentBoard = boards.find(function(b) { return b.id === id; }) || null;
    selectedLevelSeq = 0;
    if (currentBoard) {
        currentBoard.nodes = (currentBoard.nodes || []).filter(function(n) { return n.pattern_id; });
        currentBoard.edges = currentBoard.edges || [];
        currentBoard.levels = currentBoard.levels || [];
    }
    renderBoardList();
    renderLevels();
    renderStageList();
}

function stateLabel(s) {
    return {never: '未挑战', first_pass: '第一次会', second_pass: '第二次会', third_pass: '已通关', again_wrong: '再次出错'}[s] || s || '未挑战';
}

function stateClass(s) {
    return 'state-' + (s || 'never');
}

function getLevels() {
    if (!currentBoard) return [];
    var nodes = currentBoard.nodes || [];
    var map = {};
    for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        var level = Math.max(0, Math.round(n.x || 0));
        if (!map[level]) map[level] = [];
        map[level].push(n);
    }
    var keys = Object.keys(map).map(Number).sort(function(a, b) { return a - b; });
    return keys.map(function(k) {
        return {index: k, patterns: map[k].slice().sort(function(a, b) { return (a.y || 0) - (b.y || 0); })};
    });
}

function getLevelData(levelIndex) {
    var lvs = (currentBoard && currentBoard.levels) || [];
    for (var i = 0; i < lvs.length; i++) {
        if (Number(lvs[i].level_index) === Number(levelIndex)) return lvs[i];
    }
    return null;
}

function getLevelName(levelIndex) {
    var lv = getLevelData(levelIndex);
    return (lv && lv.name) || '';
}

function getLevelKps(levelIndex) {
    var lv = getLevelData(levelIndex);
    return (lv && lv.knowledge_points) || [];
}

function getLevelDescription(levelIndex) {
    var lv = getLevelData(levelIndex);
    return (lv && lv.description) || '';
}

function levelLocked(levels, seq) {
    for (var i = seq - 1; i >= 0; i--) {
        var prev = levels[i];
        if (!prev || !prev.patterns.length) continue;
        return prev.patterns.some(function(n) { return n.state !== 'third_pass'; });
    }
    return false;
}

function patternStatus(n, locked) {
    if (locked) return 'locked';
    if (n.state === 'third_pass') return 'done';
    if (n.state === 'first_pass' || n.state === 'second_pass') return 'progress';
    return 'available';
}

function renderLevels() {
    var el = document.getElementById('levelList');
    if (!el) return;
    if (!currentBoard) {
        el.innerHTML = '<div class="empty-board">请先选择左侧板块</div>';
        var detailEl = document.getElementById('levelDetail');
        if (detailEl) detailEl.innerHTML = '<div class="empty-board">请先选择左侧板块</div>';
        return;
    }
    var levels = getLevels();
    if (selectedLevelSeq > levels.length) selectedLevelSeq = levels.length;
    var html = '';
    for (var i = 0; i < levels.length; i++) {
        var locked = levelLocked(levels, i);
        var allDone = !locked && levels[i].patterns.length && levels[i].patterns.every(function(n) { return n.state === 'third_pass'; });
        html += renderLevelNavItem(levels[i], i, locked, allDone, false);
    }
    var nextLevel = {index: levels.length ? levels[levels.length - 1].index + 1 : 0, patterns: []};
    html += renderLevelNavItem(nextLevel, levels.length, false, false, true);
    el.innerHTML = html;
    renderLevelDetail();
}

function renderLevelNavItem(level, seq, locked, allDone, isNext) {
    var lvName = getLevelName(level.index);
    var name = lvName || ('第 ' + (seq + 1) + ' 关');
    var lvLabel = isNext ? '空关卡' : (locked ? '未解锁' : (allDone ? '已通关' : '待挑战'));
    var cls = isNext ? 'open' : (locked ? 'locked' : (allDone ? 'done' : 'open'));
    return '<div class="level-nav-item' + (selectedLevelSeq === seq ? ' active' : '') + '" onclick="selectLevel(' + seq + ')">' +
        '<span class="level-nav-seq">' + (isNext ? '＋' : '第 ' + (seq + 1) + ' 关') + '</span>' +
        '<span class="level-nav-name">' + escapeHtml(name) + '</span>' +
        '<span class="level-status ' + cls + '">' + escapeHtml(lvLabel) + '</span></div>';
}

function selectLevel(seq) {
    selectedLevelSeq = seq;
    renderLevels();
    renderStageList();
}

function renderLevelDetail() {
    var el = document.getElementById('levelDetail');
    if (!el) return;
    if (!currentBoard) {
        el.innerHTML = '<div class="empty-board">请先选择左侧板块</div>';
        return;
    }
    var levels = getLevels();
    var seq = selectedLevelSeq;
    if (seq > levels.length) seq = levels.length;
    var isNext = seq >= levels.length;
    var level = isNext ? {index: levels.length ? levels[levels.length - 1].index + 1 : 0, patterns: []} : levels[seq];
    var locked = levelLocked(levels, seq);
    var allDone = !isNext && level.patterns.length && level.patterns.every(function(n) { return n.state === 'third_pass'; });
    var name = getLevelName(level.index) || ('第 ' + (seq + 1) + ' 关');
    var desc = getLevelDescription(level.index) || '';
    var status = isNext ? '空关卡' : (locked ? '未解锁' : (allDone ? '已通关' : '待挑战'));
    var statusCls = isNext ? 'open' : (locked ? 'locked' : (allDone ? 'done' : 'open'));

    var html = '<div class="level-detail-head"><h2>' + escapeHtml(name) + '</h2>';
    html += '<span class="level-status ' + statusCls + '">' + escapeHtml(status) + '</span>';
    html += '<div class="level-detail-actions">';
    html += '<button class="primary" onclick="openLevelDescription(' + seq + ')">关卡说明</button>';
    if (!isNext) {
        html += '<button onclick="toggleLevelRename(' + level.index + ')">改名</button>';
        html += '<button onclick="moveLevel(' + seq + ',-1)"' + (seq === 0 ? ' disabled' : '') + '>上移</button>';
        html += '<button onclick="moveLevel(' + seq + ',1)"' + (seq === levels.length - 1 ? ' disabled' : '') + '>下移</button>';
        html += '<button class="danger" onclick="removeLevel(' + seq + ')">删除本关</button>';
    }
    html += '</div></div>';

    if (!isNext) {
        html += '<div class="level-rename" id="levelRename_' + level.index + '">';
        html += '<input id="levelNameInput_' + level.index + '" value="' + escapeHtml(name) + '" placeholder="输入关卡名">';
        html += '<button onclick="saveLevelName(' + level.index + ')">保存</button>';
        html += '</div>';
    }

    html += '<div class="level-desc-box">';
    html += '<div class="level-desc-head"><b>关卡说明</b>';
    html += '<button class="board-btn secondary" style="padding:4px 10px;font-size:12px;" onclick="openLevelDescription(' + seq + ')">' + (desc ? '编辑' : '添加') + '</button></div>';
    if (desc) {
        html += '<div class="level-desc-text" id="levelDescText_' + level.index + '">' + escapeHtml(desc) + '</div>';
    } else {
        html += '<div class="level-desc-empty">还没有关卡说明，点击添加后用 LaTeX 书写。</div>';
    }
    html += '</div>';

    html += '<div class="level-patterns">';
    for (var j = 0; j < level.patterns.length; j++) {
        html += renderPatternCard(level.patterns[j], patternStatus(level.patterns[j], locked));
    }
    if (!level.patterns.length) {
        html += '<div class="empty-board">这一关还没有题目，从下方添加套路。</div>';
    }
    html += '</div>';
    html += renderLevelAdd(seq);
    el.innerHTML = html;
    if (window.renderMathInElement) {
        try {
            renderMathInElement(el, {delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
            ], ignoredTags: []});
        } catch (e) {}
    }
}

function openLevelDescription(seq) {
    var levels = getLevels();
    var level = levels[seq];
    if (!level && seq === levels.length) {
        level = {index: levels.length ? levels[levels.length - 1].index + 1 : 0, patterns: []};
    }
    if (!level) return;
    var name = getLevelName(level.index) || ('第 ' + (seq + 1) + ' 关');
    var desc = getLevelDescription(level.index) || '';
    var overlay = document.createElement('div');
    overlay.className = 'level-desc-overlay show';
    overlay.id = 'levelDescOverlay';
    overlay.innerHTML = '<div class="level-desc-modal">' +
        '<h3>关卡说明 · ' + escapeHtml(name) + '</h3>' +
        '<textarea id="levelDescInput" placeholder="用 LaTeX 书写关卡说明，例如 $x^2+y^2=r^2$">' + escapeHtml(desc) + '</textarea>' +
        '<div class="preview-title">预览</div><div class="level-desc-preview" id="levelDescPreview">' + escapeHtml(desc) + '</div>' +
        '<div class="level-desc-modal-actions">' +
        '<button class="board-btn secondary" onclick="closeLevelDescription()">取消</button>' +
        '<button class="board-btn" onclick="saveLevelDescription(' + seq + ')">保存</button>' +
        '</div></div>';
    document.body.appendChild(overlay);
    renderLevelDescriptionPreview();
    overlay.querySelector('textarea').addEventListener('input', renderLevelDescriptionPreview);
}

function renderLevelDescriptionPreview() {
    var input = document.getElementById('levelDescInput');
    var preview = document.getElementById('levelDescPreview');
    if (!input || !preview) return;
    preview.textContent = input.value;
    if (window.renderMathInElement) {
        try {
            renderMathInElement(preview, {delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
            ], ignoredTags: []});
        } catch (e) {}
    }
}

function closeLevelDescription() {
    var el = document.getElementById('levelDescOverlay');
    if (el) el.remove();
}

async function saveLevelDescription(seq) {
    var input = document.getElementById('levelDescInput');
    var desc = input ? input.value : '';
    var levels = getLevels();
    var level = levels[seq];
    if (!level && seq === levels.length) {
        level = {index: levels.length ? levels[levels.length - 1].index + 1 : 0, patterns: []};
    }
    if (!level) return;
    currentBoard.levels = currentBoard.levels || [];
    var lv = getLevelData(level.index);
    if (lv) {
        lv.description = desc;
    } else {
        currentBoard.levels.push({level_index: level.index, name: getLevelName(level.index), knowledge_points: [], description: desc});
    }
    closeLevelDescription();
    await saveBoard();
}

function renderPatternCard(n, status) {
    var name = n.name || ('套路 #' + n.pattern_id);
    var html = '<div class="pattern-card ' + status + '">';
    html += '<div class="pattern-card-head"><div class="pattern-name">' + escapeHtml(name) + '</div>';
    html += '<span class="state-badge ' + stateClass(n.state) + '">' + escapeHtml(stateLabel(n.state)) + '</span></div>';
    html += '<div class="pattern-desc">' + escapeHtml(n.question_type || '') + '</div>';
    html += '<div class="pattern-actions">';
    if (status === 'locked') {
        html += '<button disabled>未解锁</button>';
    } else {
        html += '<button class="primary" onclick="openLoop(' + n.pattern_id + ')">闯关</button>';
    }
    html += '<button onclick="toggleRename(' + n.pattern_id + ')">改名</button>';
    html += '<button class="danger" onclick="removePatternFromLevel(' + n.pattern_id + ')">移除</button></div>';
    html += '<div class="rename-row" id="rename_' + n.pattern_id + '" style="display:none;">';
    html += '<input id="renameInput_' + n.pattern_id + '" value="' + escapeHtml(name) + '">';
    html += '<button onclick="saveRename(' + n.pattern_id + ')">保存</button></div>';
    html += '</div>';
    return html;
}

function renderLevelAdd(seq) {
    if (!currentBoard) return '';
    var inBoard = currentBoard.nodes.map(function(n) { return n.pattern_id; });
    var available = patterns.filter(function(p) {
        return p.category === currentBoard.category && inBoard.indexOf(p.id) < 0;
    });
    var html = '<div class="level-add">';
    html += '<select id="addSelect_' + seq + '"><option value="">选择套路...</option>';
    for (var i = 0; i < available.length; i++) {
        html += '<option value="' + available[i].id + '">' + escapeHtml(available[i].name) + '</option>';
    }
    html += '</select>';
    html += '<button onclick="addPatternToLevel(' + seq + ')">添加到本关</button>';
    html += '<button class="new-pattern-toggle" onclick="toggleNewPattern(' + seq + ')">新建套路</button>';
    html += '<span class="new-pattern-box" id="newPatternBox_' + seq + '" style="display:none;">';
    html += '<input id="newPatternName_' + seq + '" type="text" placeholder="套路名">';
    html += '<span class="question-search-wrap"><input id="newPatternSearch_' + seq + '" type="text" class="question-search-input" data-target-id="newPatternQid_' + seq + '" data-results-id="newPatternResults_' + seq + '" placeholder="搜索母题..." autocomplete="off"><input type="hidden" id="newPatternQid_' + seq + '"><div id="newPatternResults_' + seq + '" class="question-search-results"></div></span>';
    html += '<button class="cancel" onclick="createPatternAndAdd(' + seq + ')">创建并添加</button>';
    html += '</span>';
    html += '</div>';
    return html;
}

function toggleRename(pid) {
    var box = document.getElementById('rename_' + pid);
    if (!box) return;
    box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
}

function toggleNewPattern(seq) {
    var box = document.getElementById('newPatternBox_' + seq);
    if (!box) return;
    box.style.display = box.style.display === 'inline-flex' ? 'none' : 'inline-flex';
}

function toggleLevelRename(levelIndex) {
    var box = document.getElementById('levelRename_' + levelIndex);
    if (!box) return;
    box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
}

async function saveLevelName(levelIndex) {
    var input = document.getElementById('levelNameInput_' + levelIndex);
    var name = input ? input.value.trim() : '';
    currentBoard.levels = currentBoard.levels || [];
    var lv = getLevelData(levelIndex);
    if (lv) {
        lv.name = name;
    } else {
        currentBoard.levels.push({level_index: levelIndex, name: name, knowledge_points: [], description: ''});
    }
    await saveBoard();
}

function renderStageList() {
    var el = document.getElementById('stageList');
    var section = document.getElementById('stageSection');
    if (!el) return;
    if (!currentBoard) {
        if (section) section.style.display = 'none';
        el.innerHTML = '';
        return;
    }
    var levels = getLevels();
    if (!levels.length) {
        if (section) section.style.display = 'none';
        el.innerHTML = '<div class="empty-board">还没有关卡</div>';
        return;
    }
    if (section) section.style.display = 'block';
    var html = '';
    for (var i = 0; i < levels.length; i++) {
        var locked = levelLocked(levels, i);
        var allDone = levels[i].patterns.length && levels[i].patterns.every(function(n) { return n.state === 'third_pass'; });
        var status = locked ? '未解锁' : (allDone ? '已通关' : '待挑战');
        var name = getLevelName(levels[i].index) || ('第 ' + (i + 1) + ' 关');
        var kps = getLevelKps(levels[i].index);
        html += '<div class="stage-item' + (selectedLevelSeq === i ? ' active' : '') + '" onclick="selectLevel(' + i + ')">';
        html += '<div class="stage-head"><span class="stage-name">' + escapeHtml(name) + '</span><span class="stage-status ' + (locked ? 'locked' : (allDone ? 'done' : 'open')) + '">' + escapeHtml(status) + '</span></div>';
        if (kps.length) {
            html += '<div class="stage-kps">' + escapeHtml(kps.join('、')) + '</div>';
        }
        html += '<div class="stage-actions">';
        html += '<button onclick="event.stopPropagation();moveLevel(' + i + ',-1)"' + (i === 0 ? ' disabled' : '') + '>上移</button>';
        html += '<button onclick="event.stopPropagation();moveLevel(' + i + ',1)"' + (i === levels.length - 1 ? ' disabled' : '') + '>下移</button>';
        html += '</div></div>';
    }
    el.innerHTML = html;
}

function scrollToLevel(seq) {
    selectLevel(seq);
}

async function moveLevel(seq, dir) {
    var levels = getLevels();
    var target = seq + dir;
    if (target < 0 || target >= levels.length) return;
    var a = levels[seq], b = levels[target];
    for (var i = 0; i < a.patterns.length; i++) a.patterns[i].x = b.index;
    for (var j = 0; j < b.patterns.length; j++) b.patterns[j].x = a.index;
    currentBoard.levels = currentBoard.levels || [];
    var la = getLevelData(a.index), lb = getLevelData(b.index);
    if (!la) { la = {level_index: a.index, name: '', knowledge_points: [], description: ''}; currentBoard.levels.push(la); }
    if (!lb) { lb = {level_index: b.index, name: '', knowledge_points: [], description: ''}; currentBoard.levels.push(lb); }
    var tmpName = la.name; la.name = lb.name; lb.name = tmpName;
    var tmpKps = la.knowledge_points; la.knowledge_points = lb.knowledge_points; lb.knowledge_points = tmpKps;
    var tmpDesc = la.description; la.description = lb.description; lb.description = tmpDesc;
    selectedLevelSeq = target;
    await saveBoard();
}

async function saveRename(pid) {
    var input = document.getElementById('renameInput_' + pid);
    var name = input ? input.value.trim() : '';
    if (!name) { setBoardStatus('套路名不能为空', true); return; }
    try {
        var r = await fetch('http://127.0.0.1:8000/patterns/' + pid, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name})
        });
        var d = await r.json();
        if (d.error) throw new Error(d.detail || d.error);
        await loadBoards();
    } catch (e) {
        setBoardStatus('改名失败：' + e.message, true);
    }
}

async function addPatternToLevel(seq) {
    var sel = document.getElementById('addSelect_' + seq);
    var pid = sel ? parseInt(sel.value) : 0;
    if (!pid) { setBoardStatus('请先选择一个套路', true); return; }
    await addPatternToLevelByPid(seq, pid);
}

async function addPatternToLevelByPid(seq, pid) {
    var p = patterns.find(function(x) { return x.id === pid; });
    if (!p) { setBoardStatus('套路不存在', true); return; }
    if (!p.mother_id) { setBoardStatus('这个套路还没有母题，无法加入关卡', true); return; }
    if (currentBoard.nodes.some(function(n) { return n.pattern_id === pid; })) {
        setBoardStatus('这个套路已经在关卡里了', true);
        return;
    }
    var levels = getLevels();
    var levelIndex = seq < levels.length ? levels[seq].index : (levels.length ? levels[levels.length - 1].index + 1 : 0);
    var inLevel = currentBoard.nodes.filter(function(n) { return Math.round(n.x || 0) === levelIndex; });
    currentBoard.nodes.push({
        question_id: p.mother_id,
        x: levelIndex,
        y: inLevel.length,
        pattern_id: p.id,
        state: (p.mastery || {}).state || 'never',
        name: p.name,
        question_type: ''
    });
    await saveBoard();
}

async function createPatternAndAdd(seq) {
    var nameInput = document.getElementById('newPatternName_' + seq);
    var qidInput = document.getElementById('newPatternQid_' + seq);
    var name = nameInput ? nameInput.value.trim() : '';
    var qid = qidInput ? parseInt(qidInput.value) : 0;
    if (!name || !qid) { setBoardStatus('请填写套路名并搜索选择母题', true); return; }
    try {
        var r = await fetch('http://127.0.0.1:8000/patterns/mother', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({question_id: qid, category: currentBoard.category, name: name})
        });
        var d = await r.json();
        if (d.error) throw new Error(d.detail || d.error);
        patterns.push({
            id: d.pattern_id, category: currentBoard.category, name: name, mother_id: qid,
            mastery: {state: 'never'}, description: '', max_time_seconds: 120, variant_ids: []
        });
        var box = document.getElementById('newPatternBox_' + seq);
        if (box) box.style.display = 'none';
        await addPatternToLevelByPid(seq, d.pattern_id);
    } catch (e) {
        setBoardStatus('新建套路失败：' + e.message, true);
    }
}

async function removePatternFromLevel(pid) {
    if (!confirm('确定把这个套路从本关移除吗？')) return;
    currentBoard.nodes = currentBoard.nodes.filter(function(n) { return n.pattern_id !== pid; });
    await saveBoard();
}

async function removeLevel(seq) {
    var levels = getLevels();
    if (seq >= levels.length) return;
    if (!confirm('确定删除这一关及其中的套路吗？')) return;
    var lv = levels[seq];
    currentBoard.nodes = currentBoard.nodes.filter(function(n) { return Math.round(n.x || 0) !== lv.index; });
    renumberLevels();
    await saveBoard();
}

function renumberLevels() {
    var levels = getLevels();
    var oldLevels = currentBoard.levels || [];
    var nameByIndex = {};
    for (var k = 0; k < oldLevels.length; k++) {
        nameByIndex[Number(oldLevels[k].level_index)] = oldLevels[k];
    }
    var nextLevels = [];
    for (var i = 0; i < levels.length; i++) {
        for (var j = 0; j < levels[i].patterns.length; j++) {
            levels[i].patterns[j].x = i;
        }
        var old = nameByIndex[levels[i].index] || {};
        nextLevels.push({
            level_index: i,
            name: old.name || '',
            knowledge_points: old.knowledge_points || [],
            description: old.description || ''
        });
    }
    currentBoard.levels = nextLevels;
}

async function saveBoard() {
    if (!currentBoard) return;
    var keepSeq = selectedLevelSeq;
    var payload = {
        nodes: currentBoard.nodes.map(function(n) {
            return {question_id: n.question_id, x: Math.round(n.x || 0), y: Math.round(n.y || 0)};
        }),
        edges: [],
        levels: (currentBoard.levels || []).map(function(l) {
            return {level_index: l.level_index, name: l.name || '', description: l.description || ''};
        })
    };
    try {
        var d = await api('/boards/' + currentBoard.id, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if (d && d.id) {
            await loadBoards();
            selectedLevelSeq = Math.min(keepSeq, getLevels().length);
            renderLevels();
            setBoardStatus('已保存');
        } else {
            setBoardStatus('保存失败：' + ((d && d.detail) || '未知错误'), true);
        }
    } catch (e) {
        setBoardStatus('保存失败：' + e.message, true);
    }
}

function openLoop(patternId) {
    window.open('loop.html?v=20260807&pattern_id=' + patternId, '_blank');
}

function setBoardStatus(msg, isError) {
    var el = document.getElementById('boardStatus');
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? '#c62828' : '#2e7d32';
}

document.addEventListener('DOMContentLoaded', function() {
    loadBoards();
});
</script>
</body>
