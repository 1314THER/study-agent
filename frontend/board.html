<script>
var boards = [];
var currentBoard = null;

function saveDraft() {
    if (!currentBoard) return;
    try {
        localStorage.setItem('board_draft', JSON.stringify({
            boardId: currentBoard.id,
            nodes: currentBoard.nodes,
            edges: currentBoard.edges,
            updatedAt: Date.now()
        }));
    } catch (e) {}
}

function loadDraft() {
    if (!currentBoard) return;
    try {
        var draft = JSON.parse(localStorage.getItem('board_draft') || 'null');
        if (draft && draft.boardId === currentBoard.id) {
            currentBoard.nodes = draft.nodes || [];
            currentBoard.edges = draft.edges || [];
            document.getElementById('boardStatus').textContent = '已恢复未保存的草稿';
        }
    } catch (e) {}
}

function clearDraft() {
    try { localStorage.removeItem('board_draft'); } catch (e) {}
}

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function api(path, opts) {
    var r = await fetch('http://127.0.0.1:8000' + path, opts || {});
    return r.json();
}

async function loadBoards() {
    boards = await api('/boards');
    renderBoardList();
    if (!currentBoard && boards.length) selectBoard(boards[0].id);
    else if (currentBoard) selectBoard(currentBoard.id);
}

function renderBoardList() {
    var html = '';
    for (var i = 0; i < boards.length; i++) {
        var b = boards[i];
        html += '<button class="board-cat' + (currentBoard && currentBoard.id === b.id ? ' active' : '') + '" onclick="selectBoard(' + b.id + ')">' + escapeHtml(b.category) + ' <span style="color:#86868b;">(' + b.nodes.length + ')</span></button>';
    }
    document.getElementById('boardList').innerHTML = html || '<div class="mother-empty">暂无地图</div>';
}

function selectBoard(id) {
    currentBoard = boards.find(function(b) { return b.id === id; });
    loadDraft();
    renderBoardList();
    autoArrange();
}

function nodeStatus(node) {
    if (!currentBoard) return 'available';
    var prereqs = currentBoard.edges.filter(function(e) { return e.to_question_id === node.question_id; });
    for (var i = 0; i < prereqs.length; i++) {
        var from = currentBoard.nodes.find(function(n) { return n.question_id === prereqs[i].from_question_id; });
        if (!from || from.state !== 'third_pass') return 'locked';
    }
    if (node.state === 'third_pass') return 'done';
    if (node.state === 'first_pass' || node.state === 'second_pass') return 'progress';
    return 'available';
}

function autoArrange() {
    if (!currentBoard) return;
    var nodes = currentBoard.nodes || [];
    var edges = currentBoard.edges || [];
    if (!nodes.length) { renderCanvas(); return; }
    var children = {};
    var hasParent = {};
    for (var i = 0; i < edges.length; i++) {
        var e = edges[i];
        if (!children[e.from_question_id]) children[e.from_question_id] = [];
        children[e.from_question_id].push(e.to_question_id);
        hasParent[e.to_question_id] = true;
    }
    var roots = nodes.filter(function(n) { return !hasParent[n.question_id]; });
    var levels = [];
    var seen = {};
    function visit(qid, depth) {
        if (seen[qid] && seen[qid] <= depth) return;
        seen[qid] = depth;
        if (!levels[depth]) levels[depth] = [];
        if (levels[depth].indexOf(qid) < 0) levels[depth].push(qid);
        var kids = children[qid] || [];
        for (var k = 0; k < kids.length; k++) visit(kids[k], depth + 1);
    }
    for (var r = 0; r < roots.length; r++) visit(roots[r].question_id, 0);
    var orphans = nodes.filter(function(n) { return seen[n.question_id] === undefined; });
    for (var o = 0; o < orphans.length; o++) visit(orphans[o].question_id, 0);
    var positions = {};
    for (var d = 0; d < levels.length; d++) {
        for (var li = 0; li < levels[d].length; li++) {
            positions[levels[d][li]] = {x: d * 240 + 30, y: li * 150 + 30};
        }
    }
    for (var j = 0; j < nodes.length; j++) {
        var p = positions[nodes[j].question_id] || {x: 30, y: 30};
        nodes[j].x = p.x;
        nodes[j].y = p.y;
    }
    renderCanvas();
}

function renderCanvas() {
    var canvas = document.getElementById('canvas');
    if (!currentBoard) { canvas.innerHTML = ''; return; }
    var nodes = currentBoard.nodes || [];
    var edges = currentBoard.edges || [];
    var maxX = 800, maxY = 600;
    for (var i = 0; i < nodes.length; i++) {
        maxX = Math.max(maxX, nodes[i].x + 220);
        maxY = Math.max(maxY, nodes[i].y + 130);
    }
    canvas.style.width = maxX + 'px';
    canvas.style.height = maxY + 'px';
    var svg = '<svg class="board-svg" id="boardSvg" width="' + maxX + '" height="' + maxY + '">';
    for (var e = 0; e < edges.length; e++) {
        var from = nodes.find(function(n) { return n.question_id === edges[e].from_question_id; });
        var to = nodes.find(function(n) { return n.question_id === edges[e].to_question_id; });
        if (!from || !to) continue;
        var x1 = from.x + 190, y1 = from.y + 43;
        var x2 = to.x, y2 = to.y + 43;
        var mid = (x1 + x2) / 2;
        svg += '<path d="M' + x1 + ',' + y1 + ' C' + mid + ',' + y1 + ' ' + mid + ',' + y2 + ' ' + x2 + ',' + y2 + '" stroke="#0071e3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>';
    }
    svg += '<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0071e3"/></marker></defs></svg>';
    var html = svg;
    for (var j = 0; j < nodes.length; j++) {
        var n = nodes[j];
        var st = nodeStatus(n);
        html += '<div class="board-node ' + st + '" id="node_' + n.question_id + '" style="left:' + n.x + 'px;top:' + n.y + 'px;">';
        html += '<div class="bn-title">' + escapeHtml(n.content || ('题目 #' + n.question_id)) + '</div>';
        html += '<div class="bn-meta">#' + n.question_id + ' · ' + escapeHtml(n.question_type || '') + ' · ' + st + '</div>';
        html += '<div class="bn-actions">';
        if (n.pattern_id) html += '<button onclick="openLoop(' + n.pattern_id + ')">闯关</button>';
        html += '<button onclick="toggleAddChild(' + n.question_id + ')">加后置</button>';
        html += '<button onclick="removeNode(' + n.question_id + ')">删除</button>';
        html += '</div>';
        html += '<div class="bn-add" id="addBox_' + n.question_id + '"><input id="childQid_' + n.question_id + '" type="number" placeholder="题目ID" min="1"><button onclick="addChild(' + n.question_id + ')">加</button></div>';
        html += '</div>';
    }
    canvas.innerHTML = html;
}

function toggleAddChild(qid) {
    var box = document.getElementById('addBox_' + qid);
    if (box) box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

function addChild(parentQid) {
    var qid = parseInt(document.getElementById('childQid_' + parentQid).value);
    if (!qid || qid === parentQid) return;
    if (!currentBoard.nodes.find(function(n) { return n.question_id === qid; })) {
        currentBoard.nodes.push({question_id: qid, x: 0, y: 0, content: '题目 #' + qid, question_type: '', state: 'never'});
        refreshNode(qid);
    }
    var exists = currentBoard.edges.find(function(e) { return e.from_question_id === parentQid && e.to_question_id === qid; });
    if (!exists) currentBoard.edges.push({from_question_id: parentQid, to_question_id: qid});
    autoArrange();
    saveDraft();
}

async function refreshNode(qid) {
    var q = await api('/questions/' + qid);
    var node = currentBoard.nodes.find(function(n) { return n.question_id === qid; });
    if (node && q && q.content) node.content = q.content;
    renderCanvas();
}

function addRoot() {
    var qid = parseInt(document.getElementById('addRootQid').value);
    if (!qid) return;
    if (currentBoard.nodes.find(function(n) { return n.question_id === qid; })) return;
    currentBoard.nodes.push({question_id: qid, x: 30, y: 30, content: '题目 #' + qid, question_type: '', state: 'never'});
    refreshNode(qid);
    autoArrange();
    saveDraft();
}

function removeNode(qid) {
    currentBoard.nodes = currentBoard.nodes.filter(function(n) { return n.question_id !== qid; });
    currentBoard.edges = currentBoard.edges.filter(function(e) { return e.from_question_id !== qid && e.to_question_id !== qid; });
    autoArrange();
    saveDraft();
}

async function saveBoard() {
    if (!currentBoard) return;
    var payload = {
        nodes: currentBoard.nodes.map(function(n) { return {question_id: n.question_id, x: Math.round(n.x), y: Math.round(n.y)}; }),
        edges: currentBoard.edges.map(function(e) { return {from_question_id: e.from_question_id, to_question_id: e.to_question_id}; })
    };
    var d = await api('/boards/' + currentBoard.id, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });
    document.getElementById('boardStatus').textContent = d && d.id ? '布局已保存' : '保存失败';
    if (d && d.id) clearDraft();
    await loadBoards();
}

function openLoop(patternId) {
    window.open('loop.html?pattern_id=' + patternId, '_blank');
}

document.addEventListener('DOMContentLoaded', function() {
    loadBoards();
});
</script>
