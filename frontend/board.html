<script>
var boards = [];
var currentBoard = null;
var patterns = [];
var _validCategories = [];

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function api(path, opts) {
    var r = await fetch('http://127.0.0.1:8000' + path, opts || {});
    return r.json();
}

async function loadCategories() {
    try {
        var r = await fetch('http://127.0.0.1:8000/categories');
        var data = await r.json();
        _validCategories = (data || []).map(function(x) { return x.level1; });
    } catch (e) {
        _validCategories = [];
    }
}

function validateBoards() {
    var statusEl = document.getElementById('boardStatus');
    if (!statusEl) return;
    if (!_validCategories.length) {
        statusEl.innerHTML = '<span style="color:#c62828;">板块栏目加载失败，请重试 <button class="board-btn secondary" onclick="loadBoards()">重试</button></span>';
        return;
    }
    var bad = boards.filter(function(b) { return _validCategories.indexOf(b.category) < 0; }).map(function(b) { return b.category; });
    if (bad.length) {
        statusEl.innerHTML = '<span style="color:#c62828;">板块与栏目不一致：' + escapeHtml(bad.join('、')) + '，请重试 <button class="board-btn secondary" onclick="loadBoards()">重试</button></span>';
        return;
    }
    statusEl.textContent = '';
}

async function loadPatterns() {
    try {
        var r = await fetch('http://127.0.0.1:8000/patterns');
        patterns = await r.json();
    } catch (e) {
        patterns = [];
    }
}

async function loadBoards() {
    try {
        boards = await api('/boards');
    } catch (e) {
        boards = [];
    }
    await loadCategories();
    await loadPatterns();
    validateBoards();
    renderBoardList();
    if (!currentBoard && boards.length) {
        selectBoard(boards[0].id);
    } else if (currentBoard) {
        var fresh = boards.find(function(b) { return b.id === currentBoard.id; });
        if (fresh) selectBoard(fresh.id);
    }
    validateBoards();
}

function renderBoardList() {
    var html = '';
    for (var i = 0; i < boards.length; i++) {
        var b = boards[i];
        var count = (b.nodes || []).filter(function(n) { return n.pattern_id; }).length;
        html += '<button class="board-cat' + (currentBoard && currentBoard.id === b.id ? ' active' : '') + '" onclick="selectBoard(' + b.id + ')">' + escapeHtml(b.category) + ' <span style="color:#86868b;">(' + count + ')</span></button>';
    }
    document.getElementById('boardList').innerHTML = html || '<div class="empty-board">暂无地图</div>';
}

function selectBoard(id) {
    currentBoard = boards.find(function(b) { return b.id === id; }) || null;
    if (currentBoard) {
        currentBoard.nodes = (currentBoard.nodes || []).filter(function(n) { return n.pattern_id; });
        currentBoard.edges = currentBoard.edges || [];
    }
    renderBoardList();
    renderLevels();
}

function stateLabel(s) {
    return {never: '未挑战', first_pass: '第一次会', second_pass: '第二次会', third_pass: '已通关', again_wrong: '再次出错'}[s] || s || '未挑战';
}

function stateClass(s) {
    return 'state-' + (s || 'never');
}

function getLevels() {
    if (!currentBoard) return [];
    var nodes = currentBoard.nodes || [];
    var map = {};
    for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        var level = Math.max(0, Math.round(n.x || 0));
        if (!map[level]) map[level] = [];
        map[level].push(n);
    }
    var keys = Object.keys(map).map(Number).sort(function(a, b) { return a - b; });
    return keys.map(function(k) {
        return {index: k, patterns: map[k].slice().sort(function(a, b) { return (a.y || 0) - (b.y || 0); })};
    });
}

function levelLocked(levels, seq) {
    for (var i = seq - 1; i >= 0; i--) {
        var prev = levels[i];
        if (!prev || !prev.patterns.length) continue;
        return prev.patterns.some(function(n) { return n.state !== 'third_pass'; });
    }
    return false;
}

function patternStatus(n, locked) {
    if (locked) return 'locked';
    if (n.state === 'third_pass') return 'done';
    if (n.state === 'first_pass' || n.state === 'second_pass') return 'progress';
    return 'available';
}

function renderLevels() {
    var el = document.getElementById('levelList');
    if (!el) return;
    if (!currentBoard) {
        el.innerHTML = '<div class="empty-board">请先选择左侧板块</div>';
        return;
    }
    var levels = getLevels();
    var html = '';
    for (var i = 0; i < levels.length; i++) {
        var locked = levelLocked(levels, i);
        var allDone = !locked && levels[i].patterns.length && levels[i].patterns.every(function(n) { return n.state === 'third_pass'; });
        html += renderLevelBand(levels[i], i, locked, allDone, false);
    }
    var nextLevel = {index: levels.length ? levels[levels.length - 1].index + 1 : 0, patterns: []};
    html += renderLevelBand(nextLevel, levels.length, false, false, true);
    el.innerHTML = html;
}

function renderLevelBand(level, seq, locked, allDone, isNext) {
    var html = '<div class="level-band">';
    html += '<div class="level-head"><span class="level-title">第 ' + (seq + 1) + ' 关</span>';
    if (isNext) {
        html += '<span class="level-status open">空关卡</span>';
    } else {
        var lvLabel = locked ? '未解锁' : (allDone ? '已通关' : '待挑战');
        html += '<span class="level-status ' + (locked ? 'locked' : 'open') + '">' + lvLabel + '</span>';
    }
    if (!isNext && level.patterns.length) {
        html += '<button class="board-btn danger" style="padding:5px 10px;font-size:12px;margin-left:auto;" onclick="removeLevel(' + seq + ')">删除本关</button>';
    }
    html += '</div>';
    html += '<div class="level-patterns">';
    for (var j = 0; j < level.patterns.length; j++) {
        html += renderPatternCard(level.patterns[j], patternStatus(level.patterns[j], locked));
    }
    html += '</div>';
    html += renderLevelAdd(seq);
    html += '</div>';
    return html;
}

function renderPatternCard(n, status) {
    var name = n.name || ('套路 #' + n.pattern_id);
    var html = '<div class="pattern-card ' + status + '">';
    html += '<div class="pattern-card-head"><div class="pattern-name">' + escapeHtml(name) + '</div>';
    html += '<span class="state-badge ' + stateClass(n.state) + '">' + escapeHtml(stateLabel(n.state)) + '</span></div>';
    html += '<div class="pattern-desc">' + escapeHtml(n.question_type || '') + '</div>';
    html += '<div class="pattern-actions">';
    if (status === 'locked') {
        html += '<button disabled>未解锁</button>';
    } else {
        html += '<button class="primary" onclick="openLoop(' + n.pattern_id + ')">闯关</button>';
    }
    html += '<button onclick="toggleRename(' + n.pattern_id + ')">改名</button>';
    html += '<button class="danger" onclick="removePatternFromLevel(' + n.pattern_id + ')">移除</button></div>';
    html += '<div class="rename-row" id="rename_' + n.pattern_id + '" style="display:none;">';
    html += '<input id="renameInput_' + n.pattern_id + '" value="' + escapeHtml(name) + '">';
    html += '<button onclick="saveRename(' + n.pattern_id + ')">保存</button></div>';
    html += '</div>';
    return html;
}

function renderLevelAdd(seq) {
    if (!currentBoard) return '';
    var inBoard = currentBoard.nodes.map(function(n) { return n.pattern_id; });
    var available = patterns.filter(function(p) {
        return p.category === currentBoard.category && inBoard.indexOf(p.id) < 0;
    });
    var html = '<div class="level-add">';
    html += '<select id="addSelect_' + seq + '"><option value="">选择套路...</option>';
    for (var i = 0; i < available.length; i++) {
        html += '<option value="' + available[i].id + '">' + escapeHtml(available[i].name) + '</option>';
    }
    html += '</select>';
    html += '<button onclick="addPatternToLevel(' + seq + ')">添加到本关</button>';
    html += '<button class="new-pattern-toggle" onclick="toggleNewPattern(' + seq + ')">新建套路</button>';
    html += '<span class="new-pattern-box" id="newPatternBox_' + seq + '" style="display:none;">';
    html += '<input id="newPatternName_' + seq + '" type="text" placeholder="套路名">';
    html += '<input id="newPatternQid_' + seq + '" type="number" min="1" placeholder="母题ID">';
    html += '<button class="cancel" onclick="createPatternAndAdd(' + seq + ')">创建并添加</button>';
    html += '</span>';
    html += '</div>';
    return html;
}

function toggleRename(pid) {
    var box = document.getElementById('rename_' + pid);
    if (!box) return;
    box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
}

function toggleNewPattern(seq) {
    var box = document.getElementById('newPatternBox_' + seq);
    if (!box) return;
    box.style.display = box.style.display === 'inline-flex' ? 'none' : 'inline-flex';
}

async function saveRename(pid) {
    var input = document.getElementById('renameInput_' + pid);
    var name = input ? input.value.trim() : '';
    if (!name) { setBoardStatus('套路名不能为空', true); return; }
    try {
        var r = await fetch('http://127.0.0.1:8000/patterns/' + pid, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name})
        });
        var d = await r.json();
        if (d.error) throw new Error(d.detail || d.error);
        await loadBoards();
    } catch (e) {
        setBoardStatus('改名失败：' + e.message, true);
    }
}

async function addPatternToLevel(seq) {
    var sel = document.getElementById('addSelect_' + seq);
    var pid = sel ? parseInt(sel.value) : 0;
    if (!pid) { setBoardStatus('请先选择一个套路', true); return; }
    await addPatternToLevelByPid(seq, pid);
}

async function addPatternToLevelByPid(seq, pid) {
    var p = patterns.find(function(x) { return x.id === pid; });
    if (!p) { setBoardStatus('套路不存在', true); return; }
    if (!p.mother_id) { setBoardStatus('这个套路还没有母题，无法加入关卡', true); return; }
    if (currentBoard.nodes.some(function(n) { return n.pattern_id === pid; })) {
        setBoardStatus('这个套路已经在关卡里了', true);
        return;
    }
    var levels = getLevels();
    var levelIndex = seq < levels.length ? levels[seq].index : (levels.length ? levels[levels.length - 1].index + 1 : 0);
    var inLevel = currentBoard.nodes.filter(function(n) { return Math.round(n.x || 0) === levelIndex; });
    currentBoard.nodes.push({
        question_id: p.mother_id,
        x: levelIndex,
        y: inLevel.length,
        pattern_id: p.id,
        state: (p.mastery || {}).state || 'never',
        name: p.name,
        question_type: ''
    });
    await saveBoard();
}

async function createPatternAndAdd(seq) {
    var nameInput = document.getElementById('newPatternName_' + seq);
    var qidInput = document.getElementById('newPatternQid_' + seq);
    var name = nameInput ? nameInput.value.trim() : '';
    var qid = qidInput ? parseInt(qidInput.value) : 0;
    if (!name || !qid) { setBoardStatus('请填写套路名和母题 ID', true); return; }
    try {
        var r = await fetch('http://127.0.0.1:8000/patterns/mother', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({question_id: qid, category: currentBoard.category, name: name})
        });
        var d = await r.json();
        if (d.error) throw new Error(d.detail || d.error);
        patterns.push({
            id: d.pattern_id, category: currentBoard.category, name: name, mother_id: qid,
            mastery: {state: 'never'}, description: '', max_time_seconds: 120, variant_ids: []
        });
        var box = document.getElementById('newPatternBox_' + seq);
        if (box) box.style.display = 'none';
        await addPatternToLevelByPid(seq, d.pattern_id);
    } catch (e) {
        setBoardStatus('新建套路失败：' + e.message, true);
    }
}

async function removePatternFromLevel(pid) {
    if (!confirm('确定把这个套路从本关移除吗？')) return;
    currentBoard.nodes = currentBoard.nodes.filter(function(n) { return n.pattern_id !== pid; });
    await saveBoard();
}

async function removeLevel(seq) {
    var levels = getLevels();
    if (seq >= levels.length) return;
    if (!confirm('确定删除这一关及其中的套路吗？')) return;
    var lv = levels[seq];
    currentBoard.nodes = currentBoard.nodes.filter(function(n) { return Math.round(n.x || 0) !== lv.index; });
    renumberLevels();
    await saveBoard();
}

function renumberLevels() {
    var levels = getLevels();
    for (var i = 0; i < levels.length; i++) {
        for (var j = 0; j < levels[i].patterns.length; j++) {
            levels[i].patterns[j].x = i;
        }
    }
}

async function saveBoard() {
    if (!currentBoard) return;
    var payload = {
        nodes: currentBoard.nodes.map(function(n) {
            return {question_id: n.question_id, x: Math.round(n.x || 0), y: Math.round(n.y || 0)};
        }),
        edges: []
    };
    try {
        var d = await api('/boards/' + currentBoard.id, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if (d && d.id) {
            await loadBoards();
            setBoardStatus('已保存');
        } else {
            setBoardStatus('保存失败：' + ((d && d.detail) || '未知错误'), true);
        }
    } catch (e) {
        setBoardStatus('保存失败：' + e.message, true);
    }
}

function openLoop(patternId) {
    window.open('loop.html?v=20260807&pattern_id=' + patternId, '_blank');
}

function setBoardStatus(msg, isError) {
    var el = document.getElementById('boardStatus');
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? '#c62828' : '#2e7d32';
}

document.addEventListener('DOMContentLoaded', function() {
    loadBoards();
});
