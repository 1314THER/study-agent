<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手把手教学 - 数学最强大脑</title>
<link rel="stylesheet" href="style.css?v=20260723">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
.teach-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; height: calc(100vh - 48px); }
.teach-header { text-align: center; padding-bottom: 12px; flex-shrink: 0; }
.teach-input-area { flex-shrink: 0; margin-bottom: 12px; }
.teach-input-area textarea { width:100%; padding:14px 18px; border:1px solid #c7c7cc; border-radius:12px; font-size:15px; font-family:inherit; resize:vertical; min-height:60px; outline:none; box-sizing:border-box; line-height:1.6; }
.teach-input-area textarea:focus { border-color:#0071e3; }
.teach-input-actions { display:flex; gap:12px; align-items:center; margin-top:12px; }
.teach-btn { padding:12px 32px; border:none; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer; transition:all 0.15s; color:white; }
.teach-btn:disabled { opacity:0.5; cursor:not-allowed; }
.teach-btn.secondary { background: #515154; }
.teach-sm-btn { padding:6px 16px; border:1px solid #c7c7cc; border-radius:8px; font-size:13px; cursor:pointer; background:white; color:#515154; transition:all 0.15s; }
.teach-sm-btn:hover { border-color:#0071e3; color:#0071e3; }
.teach-loading { display:inline-flex; align-items:center; gap:8px; font-size:14px; color:#86868b; }
.teach-spinner { width:18px; height:18px; border:2px solid #e5e5e7; border-top-color:#0071e3; border-radius:50%; animation:spin 0.8s linear infinite; display:inline-block; }
.teach-error { display:none; padding:12px 16px; background:#fff5f5; border:1px solid #ffcdd2; border-radius:12px; color:#991b1b; font-size:14px; margin-bottom:12px; }
.teach-progress { margin-bottom: 12px; flex-shrink: 0; }
.teach-progress-text { font-size: 13px; color: #86868b; text-align: center; margin-bottom: 4px; }
.teach-progress-bar { height: 4px; background: #e5e5e7; border-radius: 2px; overflow: hidden; }
.teach-progress-fill { height:100%; background:linear-gradient(90deg,#0071e3,#00a2ff); border-radius:2px; transition:width 0.3s ease; }
.teach-two-col { display: flex; flex: 1; gap: 16px; min-height: 0; }
.teach-info-panel { width: 340px; flex-shrink: 0; overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 12px; }
.teach-chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.teach-chat { flex: 1; overflow-y: auto; padding: 8px 4px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.chat-msg { display: flex; gap: 10px; max-width: 85%; animation: fadeIn 0.25s ease; }
.chat-msg.teacher { align-self: flex-start; }
.chat-msg.student { align-self: flex-end; flex-direction: row-reverse; }
.chat-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; background: #e8f0fe; }
.chat-msg.student .chat-avatar { background: #f0f4f8; }
.chat-bubble { padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.7; word-break: break-word; }
.chat-msg.teacher .chat-bubble { background: #f5f5f7; border-bottom-left-radius: 4px; color: #1d1d1f; }
.chat-msg.student .chat-bubble { background: #0071e3; border-bottom-right-radius: 4px; color: white; }
.chat-bubble .error-tag { display: inline-block; padding: 1px 8px; background: #c62828; color: white; border-radius: 4px; font-size: 12px; font-weight: 500; margin-right: 6px; }
.teach-bottom { flex-shrink: 0; border-top: 1px solid #e5e5e7; padding-top: 12px; padding-bottom: 8px; }
.teach-bottom-inner { display: flex; gap: 10px; align-items: flex-end; }
.teach-bottom textarea { flex: 1; padding: 12px 16px; border: 2px solid #c7c7cc; border-radius: 12px; font-size: 15px; font-family: inherit; outline: none; resize: none; min-height: 48px; max-height: 120px; line-height: 1.5; transition: border-color 0.2s; }
.teach-bottom textarea:focus { border-color: #0071e3; }
.teach-bottom textarea:disabled { background: #f5f5f7; }
.send-btn { width: 48px; height: 48px; border: none; border-radius: 12px; background: #0071e3; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.send-btn:hover:not(:disabled) { background: #005bbf; }
.send-btn svg { width: 22px; height: 22px; }
.teach-summary { display:none; text-align: center; padding: 32px; }
.teach-summary.show { display:block; }
.teach-summary-icon { font-size:48px; margin-bottom:12px; }
.teach-summary-title { font-size:22px; font-weight:700; color:#1d1d1f; margin-bottom:8px; }
.teach-summary-sub { font-size:14px; color:#86868b; margin-bottom:24px; }
.teach-summary-stats { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-bottom:24px; }
.teach-stat { padding:16px 24px; background:#f5f5f7; border-radius:12px; min-width:100px; }
.teach-stat-num { font-size:28px; font-weight:700; color:#1d1d1f; }
.teach-stat-label { font-size:12px; color:#86868b; margin-top:2px; }
.teach-summary-actions { display: flex; gap: 12px; justify-content: center; }
.suggestion-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.suggestion-btn { padding: 6px 14px; border: 1px solid #c7c7cc; border-radius: 20px; font-size: 13px; background: white; cursor: pointer; color: #515154; transition: all 0.15s; }
.suggestion-btn:hover { border-color: #0071e3; color: #0071e3; background: #f0f7ff; }
.teach-question-card, .info-step-card { background: white; border: 1px solid #e5e5e7; border-radius: 12px; overflow: hidden; }
.info-card-header { padding: 10px 14px; font-size: 13px; font-weight: 600; color: #1d1d1f; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 6px; }
.info-card-icon { font-size: 14px; }
.info-card-body { padding: 12px 14px; font-size: 14px; line-height: 1.7; color: #1d1d1f; }
.info-step-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer; }
.info-step-header:hover { background: #fafafa; }
.info-step-icon { font-size: 14px; flex-shrink: 0; }
.info-step-title { font-size: 13px; font-weight: 500; color: #1d1d1f; flex: 1; }
.info-step-diff { font-size: 11px; padding: 1px 6px; border-radius: 4px; flex-shrink: 0; }
.diff-easy { background: #e8f5e9; color: #2e7d32; }
.diff-medium { background: #fff8e1; color: #f57f17; }
.diff-hard { background: #fce4ec; color: #c62828; }
.info-step-body { padding: 0 14px 10px; font-size: 13px; line-height: 1.6; color: #515154; }
.info-kp { display: inline-block; padding: 1px 8px; background: #f0f7ff; color: #0071e3; border-radius: 4px; font-size: 11px; margin-top: 6px; }
.info-error { display: inline-block; padding: 1px 8px; background: #fff5f5; color: #c62828; border-radius: 4px; font-size: 11px; margin-top: 6px; border: 1px solid #ffcdd2; }
.detail-toggle { color: #0071e3; font-size: 12px; cursor: pointer; padding: 4px 0; user-select: none; }
.detail-toggle:hover { text-decoration: underline; }
.detail-content { display: none; font-size: 13px; line-height: 1.7; padding: 10px; background: #fafafa; border-radius: 8px; margin-top: 6px; white-space: pre-wrap; }
.step-error-btn { padding: 3px 10px; border: 1px solid #ffcdd2; border-radius: 6px; font-size: 11px; background: #fff5f5; color: #c62828; cursor: pointer; margin-top: 6px; }
.step-error-btn:hover { background: #ffebee; }
.step-pending { opacity: 0.5; }
.step-pending .info-step-header:hover { background: transparent; }
.chat-msg.system { align-self: flex-start; }
.chat-msg.system .chat-avatar { background: #f0f0f0; }
.chat-msg.system .chat-bubble { background: #f0f0f0; border-bottom-left-radius: 4px; color: #86868b; font-size: 13px; font-style: italic; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>

<main class="main-content">
<div class="container teach-container">
<div style="text-align:center;margin-bottom:24px;">
<h1 style="margin-bottom:4px;">手把手教学</h1>
<p class="subtitle" style="margin-bottom:0;">输入题目，AI 老师带你一步步解题</p>
</div>
<div class="teacher-selector" id="teacherSelector" style="margin-bottom:24px;">
<button class="teacher-btn active" data-teacher="liangliang" onclick="selectTeacher(this,'liangliang')"><span class="t-icon">👛</span><span class="t-name">梁梁</span><span class="t-desc">快速，但是可能出错</span></button>
<button class="teacher-btn" data-teacher="taotao" onclick="selectTeacher(this,'taotao')"><span class="t-icon">🎩</span><span class="t-name">韬韬</span><span class="t-desc">更慢但更聪明</span></button>
<button class="teacher-btn" data-teacher="xuefeng" onclick="selectTeacher(this,'xuefeng')"><span class="t-icon">🏃</span><span class="t-name">雪峰</span><span class="t-desc">嘴唇有点紫的老师</span></button>
<button class="teacher-btn" data-teacher="ji" onclick="selectTeacher(this,'ji')"><span class="t-icon">🐔</span><span class="t-name">鸡</span><span class="t-desc">每一步都要考虑半天</span></button>
</div>
<div class="teach-input-area" id="teachInput">
<textarea id="teachQuestionInput" placeholder="输入题目，支持 LaTeX 语法" rows="3"></textarea>
<div class="teach-input-actions">
<button class="teach-btn" id="teachStartBtn" onclick="startTeaching()" style="background:#0071e3;">开始教学</button>
      <div class="teach-loading" id="teachLoading" style="display:none;"><span class="teach-spinner"></span><span>AI 老师正在准备课程...</span></div>
      </div>
    </div>
    <div class="teach-error" id="teachError" style="display:none;padding:12px 16px;background:#fff5f5;border:1px solid #ffcdd2;border-radius:12px;color:#991b1b;font-size:14px;margin-bottom:12px;"></div>

<div class="teach-progress">
        <div class="teach-progress-text" id="teachProgressText">准备中...</div>
        <div class="teach-progress-bar"><div class="teach-progress-fill" id="teachProgressFill" style="width:0%"></div></div>
      </div>

      <div id="teachSession" style="display:none;flex:1;min-height:0;">
        <div class="teach-two-col">
          <div class="teach-info-panel">
            <div class="teach-question-card" id="teachQuestionCard" style="display:none;">
              <div class="info-card-header"><span class="info-card-icon">📝</span>题目</div>
              <div class="info-card-body" id="teachQuestionDisplay"></div>
            </div>
            <div id="teachStepList"></div>
            <div id="errorDialogOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);z-index:1000;" onclick="closeErrorDialog(event)">
              <div id="errorDialogBox" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;border-radius:16px;padding:24px;width:360px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,0.15);">
                <div style="font-size:17px;font-weight:600;margin-bottom:16px;">编辑错因</div>
                <div style="margin-bottom:12px;"><div style="font-size:13px;color:#515154;margin-bottom:4px;">步骤</div><div id="errorStepDisplay" style="font-size:14px;padding:8px 12px;background:#f5f5f7;border-radius:8px;"></div></div>
                <div style="margin-bottom:12px;"><div style="font-size:13px;color:#515154;margin-bottom:4px;">错因类型</div>
                  <select id="errorTypeSelect" style="width:100%;padding:10px 12px;border:1px solid #c7c7cc;border-radius:8px;font-size:14px;">
                    <option value="符号错误">符号错误</option>
                    <option value="计算错误">计算错误</option>
                    <option value="公式记错">公式记错</option>
                    <option value="知识性错误">知识性错误</option>
                    <option value="审题错误">审题错误</option>
                    <option value="思路错误">思路错误</option>
                    <option value="其他">其他</option>
                  </select>
                </div>
                <div style="margin-bottom:20px;"><div style="font-size:13px;color:#515154;margin-bottom:4px;">详细说明</div>
                  <textarea id="errorDetailInput" rows="3" style="width:100%;padding:10px 12px;border:1px solid #c7c7cc;border-radius:8px;font-size:14px;resize:vertical;" placeholder="描述具体的错误..."></textarea>
                </div>
                <div style="display:flex;gap:10px;justify-content:flex-end;">
                  <button onclick="closeErrorDialog()" style="padding:8px 20px;border:1px solid #c7c7cc;border-radius:8px;background:white;cursor:pointer;font-size:14px;color:#515154;">取消</button>
                  <button onclick="saveStepError()" style="padding:8px 20px;border:none;border-radius:8px;background:#0071e3;color:white;cursor:pointer;font-size:14px;font-weight:600;">保存</button>
                </div>
              </div>
            </div>
          </div>
          <div class="teach-chat-panel">
            <div class="teach-chat" id="teachChat"></div>
            <div class="teach-bottom">
              <div style="display:flex;gap:8px;margin-bottom:8px;">
                <button id="skipBtn" onclick="skipStep()" disabled style="padding:6px 14px;border:1px solid #c7c7cc;border-radius:8px;font-size:13px;background:white;cursor:pointer;color:#515154;">跳过此步 →</button>
                <button onclick="cancelTeaching()" style="padding:6px 14px;border:1px solid #c7c7cc;border-radius:8px;font-size:13px;background:white;cursor:pointer;color:#991b1b;">取消</button>
              </div>
              <div class="teach-bottom-inner">
                <textarea id="teachChatInput" rows="1" placeholder="输入你的回答..." disabled></textarea>
                <button class="send-btn" id="teachSendBtn" disabled onclick="sendMessage()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
<div class="teach-summary" id="teachSummary">
<div class="teach-summary-card">
<div class="teach-summary-icon">🎉</div>
<div class="teach-summary-title">完成！</div>
<div class="teach-summary-sub">你已经完成了所有步骤的练习</div>
<div class="teach-summary-stats">
<div class="teach-stat"><div class="teach-stat-num" id="summaryCorrect">0</div><div class="teach-stat-label">答对</div></div>
<div class="teach-stat"><div class="teach-stat-num" id="summaryWrong">0</div><div class="teach-stat-label">答错</div></div>
<div class="teach-stat"><div class="teach-stat-num" id="summarySkipped">0</div><div class="teach-stat-label">跳过</div></div>
</div>
<div id="teachSavedStatus" style="font-size:13px;color:#2e7d32;margin-bottom:12px;display:none;">✅ 已加入个人题库</div>
</div>
<div style="margin-top:24px;">
<h3 style="font-size:16px;color:#1d1d1f;margin-bottom:12px;">完整解析</h3>
<div id="teachFullSolution"></div>
</div>
<div style="margin-top:24px;">
<h3 style="font-size:16px;color:#1d1d1f;margin-bottom:12px;">作答记录</h3>
<div id="teachResultList"></div>
</div>
<div style="text-align:center;margin-top:20px;">
<button class="teach-btn" onclick="resetAll()" style="background:#515154;padding:10px 28px;">再做一道</button>
</div>
</div>
</div>
</main>
</div>
<script>
var _selectedTeacher = localStorage.getItem("teacher") || "liangliang";
var _sessionId = null;
var _stats = { correct: 0, wrong: 0, skipped: 0 };
var _isWaiting = false;
var _currentStepIndex = 0;
var _totalSteps = 0;
var _sessionChunkResults = [];
var _sessionSteps = [];
var _stepErrorData = {};
var SAVE_KEY = "_teach_session_v2";

function selectTeacher(btn, teacher) {
  document.querySelectorAll(".teacher-btn").forEach(function(b){b.classList.remove("active");});
  btn.classList.add("active"); _selectedTeacher = teacher;
  document.body.classList.remove("theme-xuefeng","theme-liangliang","theme-taotao","theme-ji");
  if (teacher==="xuefeng") document.body.classList.add("theme-xuefeng");
  else if (teacher==="liangliang") document.body.classList.add("theme-liangliang");
  else if (teacher==="taotao") document.body.classList.add("theme-taotao");
  else if (teacher==="ji") document.body.classList.add("theme-ji");
  localStorage.setItem("teacher",teacher);
}

function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function renderMath(el){if(window.renderMathInElement){try{renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],ignoredTags:[]})}catch(e){}}}
function scrollChat(){var c=document.getElementById("teachChat");if(c)c.scrollTop=c.scrollHeight;}

function addChatMessage(role,content,meta){
  var chat=document.getElementById("teachChat");
  var div=document.createElement("div");div.className="chat-msg "+role;
  var av=document.createElement("div");av.className="chat-avatar";av.textContent=role==="teacher"?"\uD83D\uDC69":"\uD83D\uDC68";
  var b=document.createElement("div");b.className="chat-bubble";
  if(meta&&meta.error_type&&role==="teacher"){var t=document.createElement("span");t.className="error-tag";t.textContent=meta.error_type;b.appendChild(t);}
  var tx=document.createElement("span");tx.innerHTML=escapeHtml(content).replace(/\n/g,"<br>");b.appendChild(tx);
  div.appendChild(av);div.appendChild(b);chat.appendChild(div);renderMath(b);scrollChat();
}
function addLoadingMessage(){var c=document.getElementById("teachChat");var d=document.createElement("div");d.className="chat-msg teacher";d.id="chatLoading";d.innerHTML='<div class="chat-avatar">\uD83D\uDC69</div><div class="chat-bubble"><span class="teach-spinner"></span> \u8001\u5E08\u6B63\u5728\u601D\u8003...</div>';c.appendChild(d);scrollChat();}
function removeLoadingMessage(){var e=document.getElementById("chatLoading");if(e)e.remove();}
function setInputEnabled(e){var i=document.getElementById("teachChatInput");var b=document.getElementById("teachSendBtn");i.disabled=!e;b.disabled=!e;document.getElementById("skipBtn").disabled=!e;if(e)i.focus();}
function updateProgress(){var p=_totalSteps>0?(_currentStepIndex/_totalSteps)*100:0;document.getElementById("teachProgressFill").style.width=p+"%";document.getElementById("teachProgressText").textContent="\u7B2C "+Math.min(_currentStepIndex+1,_totalSteps)+" / "+_totalSteps+" \u6B65";}

function toggleDetail(el){
  var d=el.nextElementSibling;if(!d)return;
  if(d.style.display==="none"||d.style.display===""){d.style.display="block";el.textContent="\u6536\u8D77\u8BE6\u7EC6\u8FC7\u7A0B \u25BE";if(window.renderMathInElement){try{renderMathInElement(d,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],ignoredTags:[]})}catch(e){}}}
  else{d.style.display="none";el.textContent="\u5C55\u5F00\u8BE6\u7EC6\u8FC7\u7A0B \u25B8";}
}

function updateInfoPanel(){
  try{
  var sl=document.getElementById("teachStepList");if(!sl)return;
  document.getElementById("teachQuestionCard").style.display=_sessionId?"block":"none";
  if(!_sessionSteps||!_sessionSteps.length){sl.innerHTML="";return;}
  var h="";
  for(var i=0;i<_sessionSteps.length;i++){
    var s=_sessionSteps[i];var isF=s.step_number===999;var com=i<_currentStepIndex;var cur=i===_currentStepIndex;var pen=i>_currentStepIndex;
    var ic=isF?"\u2B50":(com?"\u2705":(cur?"\u23F3":"\u2B55"));var cls=pen?"info-step-card step-pending":"info-step-card";
    var dl=(s.step_difficulty&&s.step_difficulty.level)||"";
    var dh=dl?"<span class=\"info-step-diff diff-"+(dl==="\u56F0\u96BE"?"hard":(dl==="\u4E2D\u7B49"?"medium":"easy"))+"\">"+dl+"</span>":"";
    h+="<div class=\u0022"+cls+"\u0022><div class=\u0022info-step-header\u0022><span class=\u0022info-step-icon\u0022>"+ic+"</span><span class=\u0022info-step-title\u0022>"+escapeHtml(isF?"\u6700\u7EC8\u7B54\u6848":(s.title||"\u6B65\u9AA4 "+(i+1)))+"</span>"+dh+"</div>";
    if(!pen){
      h+="<div class=\u0022info-step-body\u0022>";
      h+="<div style=\u0022font-size:13px;color:#515154;margin-bottom:4px;\u0022>"+escapeHtml(s.standard_writing||"")+"</div>";
      if(s.detailed_writing&&s.detailed_writing!==s.standard_writing){
        h+="<div class=\u0022detail-toggle\u0022 onclick=\u0022toggleDetail(this)\u0022>\u5C55\u5F00\u8BE6\u7EC6\u8FC7\u7A0B \u25B8</div>";
        h+="<div class=\u0022detail-content\u0022>"+escapeHtml(s.detailed_writing)+"</div>";
      }
      if(s.knowledge_point){h+="<div class=\u0022info-kp\u0022>"+escapeHtml(s.knowledge_point)+"</div>";}
      var ek=s.chunk_id+"-"+s.step_number;
      if(_stepErrorData[ek]&&_stepErrorData[ek].error_type){h+="<div class=\u0022info-error\u0022>\u9519\u56E0\uFF1A"+escapeHtml(_stepErrorData[ek].error_type)+"</div>";}
      if(!isF){h+="<div><button class=\u0022step-error-btn\u0022 onclick=\u0022showErrorDialog("+s.chunk_id+","+s.step_number+",\u0027"+escapeHtml(s.title||"")+"\u0027)\u0022>\u7F16\u8F91\u9519\u56E0</button></div>";}
      h+="</div>";
    }else{h+="<div class=\u0022info-step-body\u0022 style=\u0022color:#c7c7cc;font-size:13px;\u0022>\u7B49\u5F85\u5B8C\u6210...</div>";}
    h+="</div>";
  }
  sl.innerHTML=h;
  if(window.renderMathInElement){try{renderMathInElement(sl,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],ignoredTags:[]})}catch(e){}}
  }catch(e){console.error("updateInfoPanel error:",e);}
}

function showErrorDialog(c,s,t){document.getElementById("errorStepDisplay").textContent=t||"\u6B65\u9AA4 "+s;document.getElementById("errorTypeSelect").value="\u601D\u8DEF\u9519\u8BEF";document.getElementById("errorDetailInput").value="";document.getElementById("errorDialogOverlay").style.display="block";}
function closeErrorDialog(){document.getElementById("errorDialogOverlay").style.display="none";}
function saveStepError(){var et=document.getElementById("errorTypeSelect").value;var ed=document.getElementById("errorDetailInput").value.trim();_stepErrorData["1-"+(document.getElementById("errorStepDisplay").textContent.match(/\d+/)||[1])[0]]={error_type:et,error_detail:ed};updateInfoPanel();closeErrorDialog();}

function saveSession(){
  try{var d={session_id:_sessionId,question:document.getElementById("teachQuestionInput").value,teacher:_selectedTeacher,messages:[],stats:_stats,current_step:_currentStepIndex,total_steps:_totalSteps,steps:_sessionSteps,chunk_results:_sessionChunkResults,step_errors:_stepErrorData};var c=document.getElementById("teachChat");if(c){c.querySelectorAll(".chat-msg").forEach(function(m){var r=m.classList.contains("teacher")?"teacher":"student";var b=m.querySelector(".chat-bubble");d.messages.push({role:r,content:b?b.textContent:""})})}localStorage.setItem(SAVE_KEY,JSON.stringify(d))}catch(e){}
}
function clearSavedSession(){localStorage.removeItem(SAVE_KEY);}
function restoreSession(){
  try{var s=localStorage.getItem(SAVE_KEY);if(!s)return false;var d=JSON.parse(s);if(!d||!d.session_id)return false;
    _sessionId=d.session_id;_currentStepIndex=d.current_step||0;_totalSteps=d.total_steps||0;_stats=d.stats||{correct:0,wrong:0,skipped:0};
    _sessionSteps=d.steps||[];_sessionChunkResults=d.chunk_results||[];_stepErrorData=d.step_errors||{};
    if(!_sessionSteps||!_sessionSteps.length){clearSavedSession();return false;}
    if(d.question)document.getElementById("teachQuestionInput").value=d.question;
    document.getElementById("teachInput").style.display="none";document.getElementById("teacherSelector").style.display="none";
    document.getElementById("teachSession").style.display="flex";document.getElementById("teachSummary").classList.remove("show");
    document.getElementById("teachChat").innerHTML="";if(d.messages)d.messages.forEach(function(m){addChatMessage(m.role,m.content)});
    updateProgress();updateInfoPanel();setInputEnabled(true);saveSession();
    // Try to get fresh session data from backend
    fetch("http://127.0.0.1:8000/teach/session/"+_sessionId).then(function(r){return r.json()}).then(function(sd){
      if(sd&&sd.steps&&sd.steps.length){_sessionSteps=sd.steps;_sessionChunkResults=sd.chunk_results||[];updateInfoPanel();saveSession();}
    }).catch(function(){});
    return true;
  }catch(e){clearSavedSession();return false;}
}

async function startTeaching(){
  saveSession();var q=document.getElementById("teachQuestionInput").value.trim();
  if(!q){document.getElementById("teachError").textContent="\u8BF7\u8F93\u5165\u9898\u76EE";document.getElementById("teachError").style.display="block";return;}
  document.getElementById("teachStartBtn").disabled=true;document.getElementById("teachLoading").style.display="inline-flex";document.getElementById("teachError").style.display="none";
  try{
    var r=await fetch("http://127.0.0.1:8000/teach/session/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,teacher:_selectedTeacher})});
    var txt=await r.text();var data;try{data=JSON.parse(txt)}catch(e){document.getElementById("teachError").textContent="\u670D\u52A1\u5668\u8FD4\u56DE\u9519\u8BEF";document.getElementById("teachError").style.display="block";resetStartBtn();return;}
    if(data.error){document.getElementById("teachError").textContent=data.detail||data.message||"\u65E0\u6CD5\u89E3\u7B54";document.getElementById("teachError").style.display="block";resetStartBtn();return;}
    _sessionId=data.session_id;_totalSteps=data.total_steps||0;_currentStepIndex=0;_stats={correct:0,wrong:0,skipped:0};
    _sessionChunkResults=data.chunk_results||[];_sessionSteps=data.steps||[];_stepErrorData={};saveSession();
    document.getElementById("teachInput").style.display="none";document.getElementById("teacherSelector").style.display="none";
    document.getElementById("teachSession").style.display="flex";document.getElementById("teachChat").innerHTML="";
    document.getElementById("teachSummary").classList.remove("show");updateProgress();
    var qd=document.getElementById("teachQuestionDisplay");if(qd&&q){qd.innerHTML=escapeHtml(q).replace(/\n/g,"<br>");renderMath(qd);}
    updateInfoPanel();if(data.message)addChatMessage("teacher",data.message);setInputEnabled(true);
  }catch(e){document.getElementById("teachError").textContent="\u7F51\u7EDC\u9519\u8BEF\uFF0C\u8BF7\u786E\u8BA4\u540E\u7AEF\u5DF2\u542F\u52A8";document.getElementById("teachError").style.display="block";resetStartBtn();}
}
function resetStartBtn(){document.getElementById("teachStartBtn").disabled=false;document.getElementById("teachLoading").style.display="none";}

async function sendMessage(){
  if(_isWaiting)return;var i=document.getElementById("teachChatInput");var m=i.value.trim();if(!m||!_sessionId)return;
  i.value="";i.style.height="auto";addChatMessage("student",m);_isWaiting=true;setInputEnabled(false);addLoadingMessage();
  try{
    var r=await fetch("http://127.0.0.1:8000/teach/session/"+_sessionId+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m})});
    var d=await r.json();removeLoadingMessage();
    if(d.error){addChatMessage("teacher","\u62B1\u6B49\uFF0C\u51FA\u4E86\u70B9\u95EE\u9898\uFF0C\u8BF7\u518D\u8BD5\u4E00\u6B21\u3002");_isWaiting=false;setInputEnabled(true);return;}
    saveSession();var a=d.action||"guide";
    if(a==="advance"){
      if(d.message)addChatMessage("teacher",d.message,{});updateInfoPanel();
      if(d.next_step_message){_currentStepIndex=(d.current_step||1)-1;updateProgress();addChatMessage("teacher",d.next_step_message);_currentStepIndex=d.current_step||1;updateProgress();}
      else{_currentStepIndex=d.current_step||(_currentStepIndex+1);updateProgress();}
      _isWaiting=false;setInputEnabled(true);
    }else if(a==="complete"){if(d.message)addChatMessage("teacher",d.message);_isWaiting=false;setInputEnabled(false);showSummary(d);}
    else{
      addChatMessage("teacher",d.message,d);
      if(d.is_correct===false&&d.error_type){var st=_sessionSteps[_currentStepIndex];if(st){_stepErrorData[(st.chunk_id||1)+"-"+(st.step_number||(_currentStepIndex+1))]={error_type:d.error_type,error_detail:d.error_detail||""}}}
      _currentStepIndex=d.current_step||(_currentStepIndex+1);updateProgress();updateInfoPanel();_isWaiting=false;setInputEnabled(true);
      if(m.match(/\u4E0D\u4F1A|\u4E0D\u61C2|\u4E0D\u77E5\u9053|\u770B\u4E0D\u61C2|\u600E\u4E48|help|\u63D0\u793A/)){
        var sugDiv=document.createElement("div");sugDiv.style.cssText="align-self:flex-start;margin-top:-4px;";sugDiv.id="suggestionBar";
        ["\u7ED9\u70B9\u63D0\u793A","\u6211\u770B\u4E00\u4E0B\u7B54\u6848"].forEach(function(l){var b=document.createElement("button");b.className="suggestion-btn";b.textContent=l;b.onclick=function(){var bar=document.getElementById("suggestionBar");if(bar)bar.remove();document.getElementById("teachChatInput").value=l;sendMessage();};sugDiv.appendChild(b);});
        document.getElementById("teachChat").appendChild(sugDiv);scrollChat();
      }
    }
  }catch(e){removeLoadingMessage();addChatMessage("teacher","\u7F51\u7EDC\u9519\u8BEF\uFF0C\u8BF7\u91CD\u8BD5\u3002");_isWaiting=false;setInputEnabled(true);}
}

function skipStep(){
  if(!_sessionId||_isWaiting)return;
  _stats.skipped++;
  var stepIdx = _currentStepIndex;
  _currentStepIndex = Math.min(_currentStepIndex + 1, _totalSteps);
  addChatMessage("system","\u5DF2\u8DF3\u8FC7\u6B65\u9AA4 "+(stepIdx+1));
  updateProgress();updateInfoPanel();setInputEnabled(true);saveSession();
  // Try to advance the backend session too
  fetch("http://127.0.0.1:8000/teach/session/"+_sessionId+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:"\u8BF7\u8DF3\u8FC7\u5F53\u524D\u6B65\u9AA4\uFF0C\u8FDB\u5165\u4E0B\u4E00\u6B65.\u4E0D\u8981\u518D\u5C1D\u8BD5\u6559\u5B66\uFF0C\u76F4\u63A5\u8FDB\u5165\u4E0B\u4E00\u6B65\u7684\u5F15\u5BFC\u3002"})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.next_step_message||(d.message&&d.action==="guide")){
      addChatMessage("teacher",d.next_step_message||d.message);
    }
  }).catch(function(){});
}

function cancelTeaching(){if(!_sessionId)return;clearSavedSession();_sessionId=null;_isWaiting=false;document.getElementById("teachChat").innerHTML="";document.getElementById("teachInput").style.display="block";document.getElementById("teacherSelector").style.display="";document.getElementById("teachSession").style.display="none";document.getElementById("teachSummary").classList.remove("show");document.getElementById("teachError").style.display="none";document.getElementById("teachStartBtn").disabled=false;}

function showSummary(d){document.getElementById("teachSession").style.display="none";document.getElementById("teachSummary").classList.add("show");var st=d.stats||_stats;document.getElementById("summaryCorrect").textContent=st.correct||0;document.getElementById("summaryWrong").textContent=st.wrong||0;document.getElementById("summarySkipped").textContent=(st.skipped||0)+(st.viewed_answer||0);document.getElementById("teachSavedStatus").style.display="block";}

function resetAll(){clearSavedSession();_sessionId=null;_isWaiting=false;document.getElementById("teachChat").innerHTML="";document.getElementById("teachInput").style.display="block";document.getElementById("teacherSelector").style.display="";document.getElementById("teachSession").style.display="none";document.getElementById("teachSummary").classList.remove("show");document.getElementById("teachError").style.display="none";document.getElementById("teachQuestionInput").value="";document.getElementById("teachStartBtn").disabled=false;document.getElementById("teachLoading").style.display="none";}

function showError(m){document.getElementById("teachError").textContent=m;document.getElementById("teachError").style.display="block";}

document.addEventListener("DOMContentLoaded",function(){
  if(!restoreSession()){var st=localStorage.getItem("teacher");if(st){var btn=document.querySelector('[data-teacher="'+st+'"]');if(btn)selectTeacher(btn,st);}
    var q=localStorage.getItem("_teach_question");if(q){localStorage.removeItem("_teach_question");document.getElementById("teachQuestionInput").value=q;setTimeout(function(){startTeaching()},300);}}
  var inp=document.getElementById("teachChatInput");inp.addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,120)+"px"});
});
</script>
</body>
