              <div class="info-card-header"><span class="info-card-icon">📝</span>题目</div>
              <div class="info-card-body" id="teachQuestionDisplay"></div>
            </div>
            <div id="teachStepList"></div>
            <div id="errorDialogOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);z-index:1000;" onclick="closeErrorDialog(event)">
              <div id="errorDialogBox" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;border-radius:16px;padding:24px;width:360px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,0.15);">
                <div style="font-size:17px;font-weight:600;margin-bottom:16px;">编辑错因</div>
                <div style="margin-bottom:12px;"><div style="font-size:13px;color:#515154;margin-bottom:4px;">步骤</div><div id="errorStepDisplay" style="font-size:14px;padding:8px 12px;background:#f5f5f7;border-radius:8px;"></div></div>
                <div style="margin-bottom:12px;"><div style="font-size:13px;color:#515154;margin-bottom:4px;">错因类型</div>
                  <select id="errorTypeSelect" style="width:100%;padding:10px 12px;border:1px solid #c7c7cc;border-radius:8px;font-size:14px;">
                    <option value="符号错误">符号错误</option>
                    <option value="计算错误">计算错误</option>
                    <option value="公式记错">公式记错</option>
                    <option value="知识性错误">知识性错误</option>
                    <option value="审题错误">审题错误</option>
                    <option value="思路错误">思路错误</option>
                    <option value="其他">其他</option>
                  </select>
                </div>
                <div style="margin-bottom:20px;"><div style="font-size:13px;color:#515154;margin-bottom:4px;">详细说明</div>
                  <textarea id="errorDetailInput" rows="3" style="width:100%;padding:10px 12px;border:1px solid #c7c7cc;border-radius:8px;font-size:14px;resize:vertical;" placeholder="描述具体的错误..."></textarea>
                </div>
                <div style="display:flex;gap:10px;justify-content:flex-end;">
                  <button onclick="closeErrorDialog()" style="padding:8px 20px;border:1px solid #c7c7cc;border-radius:8px;background:white;cursor:pointer;font-size:14px;color:#515154;">取消</button>
                  <button onclick="saveStepError()" style="padding:8px 20px;border:none;border-radius:8px;background:#0071e3;color:white;cursor:pointer;font-size:14px;font-weight:600;">保存</button>
                </div>
              </div>
            </div>
          </div>
          <div class="teach-chat-panel">
            <div class="teach-chat" id="teachChat"></div>
            <div class="teach-bottom">
              <div style="display:flex;gap:8px;margin-bottom:8px;">
                <button id="skipBtn" onclick="skipStep()" disabled style="padding:6px 14px;border:1px solid #c7c7cc;border-radius:8px;font-size:13px;background:white;cursor:pointer;color:#515154;">跳过此步 →</button>
                <button id="showAnswerBtn" onclick="showAnswer()" disabled style="padding:6px 14px;border:1px solid #ca8a04;border-radius:8px;font-size:13px;background:white;cursor:pointer;color:#ca8a04;">直接看答案</button>
                <button id="understandBtn" onclick="understoodStep()" style="display:none;padding:6px 14px;border:1px solid #ca8a04;border-radius:8px;font-size:13px;background:#ca8a04;cursor:pointer;color:white;">看懂了 ✓</button>
                <button onclick="cancelTeaching()" style="padding:6px 14px;border:1px solid #c7c7cc;border-radius:8px;font-size:13px;background:white;cursor:pointer;color:#991b1b;">取消</button>
              </div>
              <div class="teach-bottom-inner">
                <textarea id="teachChatInput" rows="1" placeholder="输入你的回答..." disabled></textarea>
                <button class="send-btn" id="teachSendBtn" disabled onclick="sendMessage()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
<div class="teach-summary" id="teachSummary">
<div class="teach-summary-card">
<div class="teach-summary-icon">🎉</div>
<div class="teach-summary-title">完成！</div>
<div class="teach-summary-sub">你已经完成了所有步骤的练习</div>
<div class="teach-summary-stats">
<div class="teach-stat"><div class="teach-stat-num" id="summaryCorrect">0</div><div class="teach-stat-label">答对</div></div>
<div class="teach-stat"><div class="teach-stat-num" id="summaryWrong">0</div><div class="teach-stat-label">答错</div></div>
<div class="teach-stat"><div class="teach-stat-num" id="summarySkipped">0</div><div class="teach-stat-label">跳过</div></div>
</div>
<div id="teachSavedStatus" style="font-size:13px;color:#2e7d32;margin-bottom:12px;display:none;">✅ 已加入个人题库</div>
</div>
<div style="margin-top:24px;">
<h3 style="font-size:16px;color:#1d1d1f;margin-bottom:12px;">完整解析</h3>
<div id="teachFullSolution"></div>
</div>
<div style="margin-top:24px;">
<h3 style="font-size:16px;color:#1d1d1f;margin-bottom:12px;">作答记录</h3>
<div id="teachResultList"></div>
</div>
<div style="text-align:center;margin-top:20px;">
<button class="teach-btn" onclick="resetAll()" style="background:#515154;padding:10px 28px;">再做一道</button>
</div>
</div>
</div>
</main>
</div>
<script>

var _selectedTeacher = localStorage.getItem("teacher") || "liangliang";
var _teachQuotes = [
  "输入一道数学题，AI 老师带你一步步解题",
  "遇到不会的题？试试手把手教学",
  "每一步都有老师引导，学数学更轻松",
  "从不会到会，只需要一个输入框",
  "解析每一步，理解每一个知识点",
  "让 AI 老师陪你攻克数学难题"
];
var _quoteIndex = Math.floor(Math.random() * _teachQuotes.length);
var _sessionId = null;
var _stats = { correct: 0, wrong: 0, skipped: 0 };
var _isWaiting = false;
var _currentStepIndex = 0;
var _totalSteps = 0;
var _sessionChunkResults = [];
var _sessionSteps = [];
var _stepErrorData = {};
var SAVE_KEY = "_teach_session_v2";
var _pendingResolve = null;

function selectModalTeacher(btn, teacher){
  document.querySelectorAll(".teacher-modal-btn").forEach(function(b){b.classList.remove("selected");});
  btn.classList.add("selected");_selectedTeacher=teacher;
}
function confirmTeacher(){
  var modal=document.getElementById("teacherModal");
  if(modal)modal.style.display="none";
  if(_pendingResolve){_pendingResolve();_pendingResolve=null;}
}
function rotateQuote(){
  var el=document.getElementById("quoteText");
  if(!el)return;
  _quoteIndex=(_quoteIndex+1)%_teachQuotes.length;
  el.style.opacity="0";
  setTimeout(function(){
    el.textContent=_teachQuotes[_quoteIndex];
    el.style.opacity="1";
  },300);
}

function autoResize(el){
  el.style.height="auto";
  var newH=Math.max(52, el.scrollHeight);
  el.style.height=newH+"px";
}

function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function renderMath(el){if(window.renderMathInElement){try{renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],ignoredTags:["script","style"]})}catch(e){}}else{setTimeout(function(){renderMath(el)},500);}}
function scrollChat(){var c=document.getElementById("teachChat");if(c)c.scrollTop=c.scrollHeight;}

function addChatMessage(role,content,meta){
  var chat=document.getElementById("teachChat");
  var div=document.createElement("div");div.className="chat-msg "+role;
  var av=document.createElement("div");av.className="chat-avatar";av.textContent=role==="teacher"?"\uD83D\uDC69":"\uD83D\uDC68";
  var b=document.createElement("div");b.className="chat-bubble";
  if(meta&&meta.error_type&&role==="teacher"){var t=document.createElement("span");t.className="error-tag";t.textContent=meta.error_type;b.appendChild(t);}
  var tx=document.createElement("span");tx.innerHTML=escapeHtml(content).replace(/\n/g,"<br>");b.appendChild(tx);
  div.appendChild(av);div.appendChild(b);chat.appendChild(div);renderMath(b);scrollChat();
}
function addLoadingMessage(){var c=document.getElementById("teachChat");var d=document.createElement("div");d.className="chat-msg teacher";d.id="chatLoading";d.innerHTML='<div class="chat-avatar">\uD83D\uDC69</div><div class="chat-bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div>';c.appendChild(d);scrollChat();}
function removeLoadingMessage(){var e=document.getElementById("chatLoading");if(e)e.remove();}
function setInputEnabled(e){var i=document.getElementById("teachChatInput");var b=document.getElementById("teachSendBtn");i.disabled=!e;b.disabled=!e;document.getElementById("skipBtn").disabled=!e;var sab=document.getElementById("showAnswerBtn");if(sab)sab.disabled=!e;if(e)i.focus();}
function updateProgress(){var p=_totalSteps>0?Math.round((_currentStepIndex/_totalSteps)*100):0;var pctEl=document.getElementById("teachProgressPct");if(pctEl)pctEl.textContent=p+"%";var tEl=document.getElementById("teachProgressText");if(tEl)tEl.textContent="第 "+Math.min(_currentStepIndex+1,_totalSteps)+" / "+_totalSteps+" 步";}

function toggleDetail(el){
  var d=el.nextElementSibling;if(!d)return;
  if(d.style.display==="none"||d.style.display===""){d.style.display="block";el.textContent="\u6536\u8D77\u8BE6\u7EC6\u8FC7\u7A0B \u25BE";if(window.renderMathInElement){try{renderMathInElement(d,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],ignoredTags:[]})}catch(e){}}}
  else{d.style.display="none";el.textContent="\u5C55\u5F00\u8BE6\u7EC6\u8FC7\u7A0B \u25B8";}
}

function updateInfoPanel(){
  try{
  var sl=document.getElementById("teachStepList");if(!sl)return;
  document.getElementById("teachQuestionCard").style.display=_sessionId?"block":"none";
  if(!_sessionSteps||!_sessionSteps.length){sl.innerHTML="";return;}
  var h="";
  for(var i=0;i<_sessionSteps.length;i++){
    var s=_sessionSteps[i];var isF=s.step_number===999;var com=i<_currentStepIndex;var cur=i===_currentStepIndex;var pen=i>_currentStepIndex;if(pen)continue;
    var ic=isF?"\u2B50":(com?"\u2705":(cur?"\u23F3":"\u2B55"));var cls=pen?"info-step-card step-pending":"info-step-card";
    var dl=(s.step_difficulty&&s.step_difficulty.level)||"";
    var dh=dl?"<span class=\"info-step-diff diff-"+(dl==="\u56F0\u96BE"?"hard":(dl==="\u4E2D\u7B49"?"medium":"easy"))+"\">"+dl+"</span>":"";
    h+="<div class=\u0022"+cls+"\u0022><div class=\u0022info-step-header\u0022><span class=\u0022info-step-icon\u0022>"+ic+"</span><span class=\u0022info-step-title\u0022>"+escapeHtml(isF?"\u6700\u7EC8\u7B54\u6848":(s.title||"\u6B65\u9AA4 "+(i+1)))+"</span>"+dh+"</div>";
    if(com){
      h+="<div class=\u0022info-step-body\u0022>";
      h+="<div style=\u0022font-size:13px;color:#515154;margin-bottom:4px;\u0022>"+escapeHtml(s.standard_writing||"")+"</div>";
      if(s.detailed_writing&&s.detailed_writing!==s.standard_writing){
        h+="<div class=\u0022detail-toggle\u0022 onclick=\u0022toggleDetail(this)\u0022>\u5C55\u5F00\u8BE6\u7EC6\u8FC7\u7A0B \u25B8</div>";
        h+="<div class=\u0022detail-content\u0022>"+escapeHtml(s.detailed_writing)+"</div>";
      }
      if(s.knowledge_point){h+="<div class=\u0022info-kp\u0022>"+escapeHtml(s.knowledge_point)+"</div>";}
      var ek=s.chunk_id+"-"+s.step_number;
      if(_stepErrorData[ek]&&_stepErrorData[ek].error_type){h+="<div class=\u0022info-error\u0022>\u9519\u56E0\uFF1A"+escapeHtml(_stepErrorData[ek].error_type)+"</div>";}
      if(!isF){h+="<div><button class=\u0022step-error-btn\u0022 onclick=\u0022showErrorDialog("+s.chunk_id+","+s.step_number+",\u0027"+escapeHtml(s.title||"")+"\u0027)\u0022>\u7F16\u8F91\u9519\u56E0</button></div>";}
      h+="</div>";
    }else if(cur){
      h+="<div class=\u0022info-step-body\u0022>";
      h+="<div style=\u0022font-size:13px;color:#0071e3;\u0022>\u6B63\u5728\u8FDB\u884C\u8FD9\u4E00\u6B65...</div>";
      if(s.knowledge_point){h+="<div class=\u0022info-kp\u0022>"+escapeHtml(s.knowledge_point)+"</div>";}
      var ek=s.chunk_id+"-"+s.step_number;
      if(_stepErrorData[ek]&&_stepErrorData[ek].error_type){h+="<div class=\u0022info-error\u0022>\u9519\u56E0\uFF1A"+escapeHtml(_stepErrorData[ek].error_type)+"</div>";}
      if(!isF){h+="<div><button class=\u0022step-error-btn\u0022 onclick=\u0022showErrorDialog("+s.chunk_id+","+s.step_number+",\u0027"+escapeHtml(s.title||"")+"\u0027)\u0022>\u7F16\u8F91\u9519\u56E0</button></div>";}
      h+="</div>";
    }
    h+="</div>";
  }
  sl.innerHTML=h;
  if(window.renderMathInElement){try{renderMathInElement(sl,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],ignoredTags:[]})}catch(e){}}
  }catch(e){console.error("updateInfoPanel error:",e);}
}

var _currentErrorChunkId=1;
var _currentErrorStepNumber=1;
function showErrorDialog(c,s,t){_currentErrorChunkId=c;_currentErrorStepNumber=s;document.getElementById("errorStepDisplay").textContent=t||"\u6B65\u9AA4 "+s;document.getElementById("errorTypeSelect").value="\u601D\u8DEF\u9519\u8BEF";document.getElementById("errorDetailInput").value="";document.getElementById("errorDialogOverlay").style.display="block";document.body.style.overflow="hidden";}
function closeErrorDialog(){document.getElementById("errorDialogOverlay").style.display="none";document.body.style.overflow="";}
function saveStepError(){var et=document.getElementById("errorTypeSelect").value;var ed=document.getElementById("errorDetailInput").value.trim();_stepErrorData[_currentErrorChunkId+"-"+_currentErrorStepNumber]={error_type:et,error_detail:ed};updateInfoPanel();closeErrorDialog();}

function saveSession(){
  try{var d={session_id:_sessionId,question:document.getElementById("teachQuestionInput").value,teacher:_selectedTeacher,messages:[],stats:_stats,current_step:_currentStepIndex,total_steps:_totalSteps,steps:_sessionSteps,chunk_results:_sessionChunkResults,step_errors:_stepErrorData};var c=document.getElementById("teachChat");if(c){c.querySelectorAll(".chat-msg").forEach(function(m){var r=m.classList.contains("teacher")?"teacher":"student";var b=m.querySelector(".chat-bubble");d.messages.push({role:r,content:b?b.textContent:""})})}localStorage.setItem(SAVE_KEY,JSON.stringify(d))}catch(e){}
}
function clearSavedSession(){localStorage.removeItem(SAVE_KEY);}
function restoreSession(){
  try{var s=localStorage.getItem(SAVE_KEY);if(!s)return false;var d=JSON.parse(s);if(!d||!d.session_id)return false;
    _sessionId=d.session_id;_currentStepIndex=d.current_step||0;_totalSteps=d.total_steps||0;_stats=d.stats||{correct:0,wrong:0,skipped:0};
    _sessionSteps=d.steps||[];_sessionChunkResults=d.chunk_results||[];_stepErrorData=d.step_errors||{};
    if(d.teacher){_selectedTeacher=d.teacher;document.body.className=document.body.className.replace(/theme-\w+/g,"").trim()||"theme-liangliang";document.body.classList.add("theme-"+_selectedTeacher);}
    if(!_sessionSteps||!_sessionSteps.length){clearSavedSession();return false;}
    if(d.question){document.getElementById("teachQuestionInput").value=d.question;var qd=document.getElementById("teachQuestionDisplay");if(qd){qd.innerHTML=escapeHtml(d.question).replace(/\n/g,"<br>");renderMath(qd);}}
    document.getElementById("teachInput").style.display="none";document.getElementById("quoteArea").style.display="none";
    document.getElementById("teachSession").style.display="flex";document.getElementById("teachSummary").classList.remove("show");
    document.getElementById("teachChat").innerHTML="";if(d.messages)d.messages.forEach(function(m){addChatMessage(m.role,m.content)});
    // Delayed KaTeX re-render for restored messages
    setTimeout(function(){var cc=document.getElementById("teachChat");if(cc&&window.renderMathInElement){try{renderMathInElement(cc,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],ignoredTags:["script","style"]})}catch(e){}}},300);
    updateProgress();updateInfoPanel();setInputEnabled(true);saveSession();
    // Try to get fresh session data from backend
    fetch("http://127.0.0.1:8000/teach/session/"+_sessionId).then(function(r){return r.json()}).then(function(sd){
      if(sd&&sd.steps&&sd.steps.length){_sessionSteps=sd.steps;_sessionChunkResults=sd.chunk_results||[];updateInfoPanel();saveSession();}
    }).catch(function(){});
    return true;
  }catch(e){clearSavedSession();return false;}
}


var _stepTimer=null;
function startStepTimer(){
  var startTime=Date.now();
  var timerEl=document.getElementById("teachProgressTimer");
  if(!timerEl)return;
  timerEl.style.display="block";
  var timeoutAdded=false;
  if(_stepTimer)clearInterval(_stepTimer);
  _stepTimer=setInterval(function(){
    var elapsed=Math.floor((Date.now()-startTime)/1000);
    if(elapsed>180){
      timerEl.textContent="\u5DF2\u601D\u8003 "+elapsed+"s";
      if(!timeoutAdded){
        timeoutAdded=true;
        var tEl=document.getElementById("teachProgressText");
        if(tEl)tEl.innerHTML+="<br>\u4F60\u505A\u4E0D\u8FC7\u6211\u4F60\u4FE1\u5417";
      }
    }else{
      timerEl.textContent="\u5DF2\u601D\u8003 "+elapsed+"s/180s";
    }
  },1000);
}
function stopStepTimer(){
  if(_stepTimer){clearInterval(_stepTimer);_stepTimer=null;}
}
function setProgressStage(stage, text){
  var pct=stage===1?13:stage===2?78:91;
  var pctEl=document.getElementById("teachProgressPct");
  if(pctEl)pctEl.textContent=pct+"%";
  var teacherNames={liangliang:"\u6881\u6881",taotao:"\u97EC\u97EC",xuefeng:"\u96EA\u5CF0",ji:"\u9E21"};
  var tn=teacherNames[_selectedTeacher]||"AI";
  var msg=text?tn+" "+text:tn+" \u6B63\u5728\u89E3\u9898";
  var tEl=document.getElementById("teachProgressText");
  if(tEl)tEl.textContent=msg;
  for(var i=1;i<=3;i++){
    var el=document.getElementById("stage"+i);
    if(!el)continue;
    el.classList.remove("active","completed");
    if(i<stage)el.classList.add("completed");
    if(i===stage)el.classList.add("active");
  }
}

async function startTeaching(){
  var q=document.getElementById("teachQuestionInput").value.trim();
  if(!q){showError("请输入题目");return;}
  saveSession();document.getElementById("teachError").style.display="none";
  document.getElementById("teachStartBtn").disabled=true;
  document.getElementById("teachProgressArea").style.display="block";
  try{
    var r=await fetch("http://127.0.0.1:8000/teach/find",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,teacher:_selectedTeacher})});
    var findRes=await r.json();
    if(findRes.found&&findRes.chunk_results&&findRes.chunk_results.length){
      // Question already in DB - go directly to stage 2
      startStepTimer();
      setProgressStage(2,"\u6B63\u5728\u4F18\u5316\u6559\u5B66\u5F15\u5BFC");
      await startTeachSession(q);
    }else{
      // New question - show teacher modal
      document.getElementById("teacherModal").style.display="flex";
      await new Promise(function(resolve){_pendingResolve=resolve;});
      startStepTimer();
      setProgressStage(1,"\u6B63\u5728\u89E3\u9898");
      var s1=await fetch("http://127.0.0.1:8000/solve/step1",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,teacher:_selectedTeacher})});
      var d1=await s1.json();
      if(d1.error){showError(d1.detail||"无法解答");resetStartBtn();return;}
      setProgressStage(2,"正在检查步骤…");
      var s2=await fetch("http://127.0.0.1:8000/solve/step2",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,content:d1.content,category:d1.category||null,teacher:_selectedTeacher})});
      var d2=await s2.json();
      if(d2.error){showError(d2.detail||"步骤检查失败");resetStartBtn();return;}
      var s3=await fetch("http://127.0.0.1:8000/solve/step3",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,chunk_results:JSON.stringify(d2.chunk_results),teacher:_selectedTeacher,save:true})});
      await s3.json();
      stopStepTimer();
      setProgressStage(3,"\u6B63\u5728\u4F18\u5316\u6559\u5B66\u5F15\u5BFC");
      await startTeachSession(q);
    }
  }catch(e){console.error(e);showError("网络错误，请确认后端已启动");resetStartBtn();}
}
function resetStartBtn(){document.getElementById("teachStartBtn").disabled=false;document.getElementById("teachLoading").style.display="none";} // progress area kept visible during teaching
function showError(m){var e=document.getElementById("teachError");e.textContent=m;e.style.display="block";}

async function startTeachSession(q){
  try{
    var r=await fetch("http://127.0.0.1:8000/teach/session/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,teacher:_selectedTeacher})});
    var data=await r.json();
    if(data.error){showError(data.detail||"无法创建教学会话");resetStartBtn();return;}
    _sessionId=data.session_id;_totalSteps=data.total_steps||0;_currentStepIndex=0;
    _stats={correct:0,wrong:0,skipped:0};
    _sessionChunkResults=data.chunk_results||[];_sessionSteps=data.steps||[];_stepErrorData={};
    document.getElementById("teachInput").style.display="none";
    document.getElementById("quoteArea").style.display="none";
    // progress area kept visible during teaching
    document.getElementById("teachSession").style.display="flex";
    document.getElementById("teachChat").innerHTML="";
    document.getElementById("teachSummary").classList.remove("show");
    updateProgress();
    var qd=document.getElementById("teachQuestionDisplay");if(qd&&q){qd.innerHTML=escapeHtml(q).replace(/\n/g,"<br>");renderMath(qd);}
    updateInfoPanel();if(data.message)addChatMessage("teacher",data.message);
    setInputEnabled(true);saveSession();
  }catch(e){console.error(e);showError("网络错误");resetStartBtn();}
}
async function sendMessage(){
  if(_isWaiting)return;var i=document.getElementById("teachChatInput");var m=i.value.trim();if(!m||!_sessionId)return;
  i.value="";i.style.height="auto";addChatMessage("student",m);_isWaiting=true;setInputEnabled(false);addLoadingMessage();
  try{
    var r=await fetch("http://127.0.0.1:8000/teach/session/"+_sessionId+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m})});
    var d=await r.json();removeLoadingMessage();
    if(d.error){addChatMessage("teacher","\u62B1\u6B49\uFF0C\u51FA\u4E86\u70B9\u95EE\u9898\uFF0C\u8BF7\u518D\u8BD5\u4E00\u6B21\u3002");_isWaiting=false;setInputEnabled(true);saveSession();return;}
    var a=d.action||"guide";
    if(a==="advance"){
      if(d.message)addChatMessage("teacher",d.message,{});updateInfoPanel();
      if(d.next_step_message){_currentStepIndex=(d.current_step||1)-1;updateProgress();addChatMessage("teacher",d.next_step_message);updateProgress();}
      else{_currentStepIndex=(d.current_step||1)-1;updateProgress();}
      updateInfoPanel();_isWaiting=false;setInputEnabled(true);
    }else if(a==="complete"){if(d.message)addChatMessage("teacher",d.message);_isWaiting=false;setInputEnabled(false);showSummary(d);}
    else{
      addChatMessage("teacher",d.message,d);
      if(d.is_correct===false&&d.error_type){var st=_sessionSteps[_currentStepIndex];if(st){_stepErrorData[(st.chunk_id||1)+"-"+(st.step_number||(_currentStepIndex+1))]={error_type:d.error_type,error_detail:d.error_detail||""}}}
      _currentStepIndex=d.current_step?d.current_step-1:_currentStepIndex;updateProgress();updateInfoPanel();_isWaiting=false;setInputEnabled(true);
      if(m.match(/\u4E0D\u4F1A|\u4E0D\u61C2|\u4E0D\u77E5\u9053|\u770B\u4E0D\u61C2|\u600E\u4E48|help|\u63D0\u793A/)){
        var sugDiv=document.createElement("div");sugDiv.style.cssText="align-self:flex-start;margin-top:-4px;";sugDiv.id="suggestionBar";
        ["\u7ED9\u70B9\u63D0\u793A","\u6211\u770B\u4E00\u4E0B\u7B54\u6848"].forEach(function(l){var b=document.createElement("button");b.className="suggestion-btn";b.textContent=l;b.onclick=function(){var bar=document.getElementById("suggestionBar");if(bar)bar.remove();document.getElementById("teachChatInput").value=l;sendMessage();};sugDiv.appendChild(b);});
        document.getElementById("teachChat").appendChild(sugDiv);scrollChat();
      }
    }
    saveSession();
  }catch(e){removeLoadingMessage();addChatMessage("teacher","\u7F51\u7EDC\u9519\u8BEF\uFF0C\u8BF7\u91CD\u8BD5\u3002");_isWaiting=false;setInputEnabled(true);}
}

function skipStep(){
  if(!_sessionId||_isWaiting)return;
  _stats.skipped=(_stats.skipped||0)+1;
  if(_currentStepIndex>=_totalSteps-1){
    addChatMessage("system","已完成所有步骤");
    saveSession();showSummary({stats:_stats});
    fetch("http://127.0.0.1:8000/teach/session/"+_sessionId+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:"跳过"})}).catch(function(){});
    return;
  }
  var stepIdx=_currentStepIndex;
  _currentStepIndex=Math.min(_currentStepIndex+1,_totalSteps-1);
  addChatMessage("system","已跳过步骤 "+(stepIdx+1));
  updateProgress();updateInfoPanel();setInputEnabled(true);saveSession();
  var nextStep=_sessionSteps[_currentStepIndex];
  if(nextStep){
    var nextMsg=nextStep.step_prompt||("请完成第 "+(_currentStepIndex+1)+" 步："+(nextStep.title||""));
    addChatMessage("teacher",nextMsg);saveSession();
  }
  fetch("http://127.0.0.1:8000/teach/session/"+_sessionId+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:"跳过"})}).catch(function(){});
}

function showAnswer(){
  if(!_sessionId)return;
  var step=_sessionSteps[_currentStepIndex];
  if(!step)return;
  var answer=step.step_answer||step.standard_writing||"\u6682\u65E0\u7B54\u6848";
  var title=step.title||"\u5F53\u524D\u6B65\u9AA4";
  if(step.step_number===999){
    addChatMessage("teacher","\u8FD9\u9053\u9898\u7684\u6700\u7EC8\u7B54\u6848\u662F\uFF1A\n\n"+answer+"\n\n\u4F60\u770B\u61C2\u4E86\u5417\uFF1F");
  }else{
    addChatMessage("teacher","\u7B2C "+(_currentStepIndex+1)+" \u6B65\uFF08"+title+"\uFF09\u7684\u7B54\u6848\u662F\uFF1A\n\n"+answer+"\n\n\u4F60\u770B\u61C2\u4E86\u5417\uFF1F");
  }
  document.getElementById("skipBtn").style.display="none";
  document.getElementById("showAnswerBtn").style.display="none";
  document.getElementById("understandBtn").style.display="inline-block";
  setInputEnabled(false);
}

function understoodStep(){
  if(!_sessionId)return;
  _stats.skipped=(_stats.skipped||0)+1;
  var stepIdx=_currentStepIndex;
  // Record error for this step
  var curStep=_sessionSteps[stepIdx];
  if(curStep){
    _stepErrorData[curStep.chunk_id+"-"+curStep.step_number]={error_type:"其他",error_detail:"完全不会"};
  }
  // Last step → show summary
  if(stepIdx>=_totalSteps-1){
    saveSession();showSummary({stats:_stats});
    fetch("http://127.0.0.1:8000/teach/session/"+_sessionId+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:"跳过"})}).catch(function(){});
    document.getElementById("skipBtn").style.display="";
    document.getElementById("showAnswerBtn").style.display="";
    document.getElementById("understandBtn").style.display="none";
    return;
  }
  _currentStepIndex=Math.min(stepIdx+1,_totalSteps-1);
  var nextStep=_sessionSteps[_currentStepIndex];
  if(nextStep){
    var nextMsg=nextStep.step_prompt||("请完成第 "+(_currentStepIndex+1)+" 步："+(nextStep.title||""));
    addChatMessage("teacher",nextMsg);
  }
  updateProgress();updateInfoPanel();setInputEnabled(true);saveSession();
  document.getElementById("skipBtn").style.display="";
  document.getElementById("showAnswerBtn").style.display="";
  document.getElementById("understandBtn").style.display="none";
  fetch("http://127.0.0.1:8000/teach/session/"+_sessionId+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:"跳过"})}).catch(function(){});
}

function cancelTeaching(){if(!_sessionId)return;clearSavedSession();_sessionId=null;_isWaiting=false;document.getElementById("teachChat").innerHTML="";document.getElementById("teachInput").style.display="block";document.getElementById("quoteArea").style.display="";document.getElementById("teachSession").style.display="none";document.getElementById("teachSummary").classList.remove("show");document.getElementById("teachError").style.display="none";document.getElementById("teachStartBtn").disabled=false;}

async function saveTeachingResults(){
  try{
    var q=document.getElementById("teachQuestionInput").value.trim();
    if(!q||!_sessionChunkResults||!_sessionChunkResults.length)return null;
    var aj={chunk_results:_sessionChunkResults};
    if(_sessionChunkResults.length>0){
      var first_cr=_sessionChunkResults[0];
      if(first_cr.difficulty)aj.overall_difficulty=first_cr.difficulty;
    }
    var r=await fetch("http://127.0.0.1:8000/questions/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,answer_json:aj})});
    var data=await r.json();
    if(data.saved&&data.id){
      var qid=data.id;
      // Save step errors
      var errKeys=Object.keys(_stepErrorData);
      for(var i=0;i<errKeys.length;i++){
        var parts=errKeys[i].split("-");
        var chunkId=parseInt(parts[0]),stepNum=parseInt(parts[1]);
        var err=_stepErrorData[errKeys[i]];
        if(err&&err.error_type){
          try{
            await fetch("http://127.0.0.1:8000/questions/"+qid+"/step-error",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({step_number:stepNum,chunk_id:chunkId,mistake_type:err.error_type,mistake_detail:err.error_detail||""})});
          }catch(e){console.error("Save step error failed:",e);}
        }
      }
      document.getElementById("teachSavedStatus").textContent="✅ 已加入个人题库";
    }else{
      document.getElementById("teachSavedStatus").textContent="ℹ️ 保存失败";
    }
  }catch(e){
    console.error("Save failed:",e);
    document.getElementById("teachSavedStatus").textContent="ℹ️ 保存失败";
  }
  document.getElementById("teachSavedStatus").style.display="block";
}
function showSummary(d){document.getElementById("teachSession").style.display="none";document.getElementById("teachSummary").classList.add("show");var st=d.stats||_stats;document.getElementById("summaryCorrect").textContent=st.correct||0;document.getElementById("summaryWrong").textContent=st.wrong||0;document.getElementById("summarySkipped").textContent=(st.skipped||0)+(st.viewed_answer||0);saveTeachingResults();}

function resetAll(){clearSavedSession();_sessionId=null;_isWaiting=false;document.getElementById("teachChat").innerHTML="";document.getElementById("teachInput").style.display="block";document.getElementById("quoteArea").style.display="";document.getElementById("teachSession").style.display="none";document.getElementById("teachSummary").classList.remove("show");document.getElementById("teachError").style.display="none";document.getElementById("teachQuestionInput").value="";document.getElementById("teachStartBtn").disabled=false;document.getElementById("teachLoading").style.display="none";}


document.addEventListener("DOMContentLoaded",function(){
  // Initial random quote after DOM is ready
  setTimeout(function(){
    var qe=document.getElementById("quoteText");
    if(qe){var ri=Math.floor(Math.random()*_teachQuotes.length);_quoteIndex=ri;qe.textContent=_teachQuotes[ri];}
  },100);
  setInterval(rotateQuote, 8000);
  // Re-render KaTeX when tab becomes visible
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden){
      setTimeout(function(){
        var cc=document.getElementById("teachChat");
        if(cc&&window.renderMathInElement){
          try{renderMathInElement(cc,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],ignoredTags:["script","style"]})}catch(e){}
        }
        var si=document.getElementById("teachStepList");
        if(si&&window.renderMathInElement){
          try{renderMathInElement(si,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],ignoredTags:["script","style"]})}catch(e){}
        }
        var qd=document.getElementById("teachQuestionDisplay");
        if(qd&&window.renderMathInElement){
          try{renderMathInElement(qd,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],ignoredTags:["script","style"]})}catch(e){}
        }
      },200);
    }
  });
  if(!restoreSession()){var q=localStorage.getItem("_teach_question");if(q){localStorage.removeItem("_teach_question");document.getElementById("teachQuestionInput").value=q;if(document.getElementById("teachQuestionInput")){autoResize(document.getElementById("teachQuestionInput"));}}}
  var inp=document.getElementById("teachChatInput");inp.addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,120)+"px"});
  // Auto resize for question input
  var qi=document.getElementById("teachQuestionInput");if(qi)qi.addEventListener("input",function(){autoResize(this)});
});

</script>
