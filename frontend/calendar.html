<script>
var _data = null;
var _year = 0;
var _month = 0;
var _selectedDate = null;
var _weekdays = ['一', '二', '三', '四', '五', '六', '日'];

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function api(path, opts) {
    var r = await fetch('http://127.0.0.1:8000' + path, opts || {});
    return r.json();
}

function stateLabel(s) {
    return {never: '未挑战', first_pass: '第一次会', second_pass: '第二次会', third_pass: '已通关', again_wrong: '再次出错'}[s] || s || '未挑战';
}

function stateClass(s) {
    return 'state-' + (s || 'never');
}

function openLoop(patternId) {
    window.open('loop.html?v=20260807&pattern_id=' + patternId, '_blank');
}

function pad2(n) {
    return String(n).padStart(2, '0');
}

async function loadData() {
    try {
        _data = await api('/patterns/calendar');
        var p = String(_data.today).split('-').map(Number);
        _year = p[0];
        _month = p[1];
        renderAll();
    } catch (e) {
        document.getElementById('calGrid').innerHTML = '<div class="cal-empty">日历加载失败</div>';
    }
}

function renderAll() {
    renderCalendar();
    renderTodayList();
    renderDaySection();
}

function renderCalendar() {
    var titleEl = document.getElementById('calMonth');
    if (titleEl) titleEl.textContent = _year + ' 年 ' + _month + ' 月';
    var grid = document.getElementById('calGrid');
    if (!grid || !_data) return;
    var first = new Date(_year, _month - 1, 1);
    var startWeekday = (first.getDay() + 6) % 7;
    var daysInMonth = new Date(_year, _month, 0).getDate();
    var html = '';
    for (var w = 0; w < 7; w++) {
        html += '<div class="cal-weekday">周' + _weekdays[w] + '</div>';
    }
    for (var i = 0; i < startWeekday; i++) {
        html += '<div class="cal-day empty"></div>';
    }
    for (var d = 1; d <= daysInMonth; d++) {
        var iso = _year + '-' + pad2(_month) + '-' + pad2(d);
        var items = (_data.items || []).filter(function(x) { return x.due_date === iso; });
        var cls = 'cal-day';
        if (iso === _data.today) cls += ' today';
        if (items.length) cls += ' has';
        if (iso === _selectedDate) cls += ' selected';
        cls += ' clickable';
        html += '<div class="' + cls + '" onclick="selectDay(\'' + iso + '\')"><div class="cal-date">' + d + '</div>';
        if (items.length) {
            html += '<div class="cal-count">' + items.length + ' 个套路巩固</div>';
        }
        html += '</div>';
    }
    grid.innerHTML = html;
}

function renderTodayList() {
    var el = document.getElementById('todayList');
    if (!el) return;
    var items = (_data && _data.today_items) || [];
    if (!items.length) {
        el.innerHTML = '<div class="cal-empty">今天没有需要巩固的套路</div>';
        return;
    }
    var html = '';
    for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var overdue = it.days_left < 0;
        html += '<div class="today-card">';
        html += '<div><div class="today-name">' + escapeHtml(it.name) + '<span class="state-badge ' + stateClass(it.state) + '">' + escapeHtml(stateLabel(it.state)) + '</span></div>';
        html += '<div class="today-meta">' + escapeHtml(it.category) + ' · 巩固日 ' + escapeHtml(it.due_date) + '</div></div>';
        html += '<div class="today-side">';
        html += '<span class="today-days' + (overdue ? ' over' : '') + '">' + (overdue ? '逾期 ' + Math.abs(it.days_left) + ' 天' : '今天') + '</span>';
        html += '<button class="cal-btn small secondary" onclick="openScheduleModal(' + it.pattern_id + ',\'' + it.due_date + '\')">调整日期</button>';
        html += '<button class="cal-btn small green" onclick="moveEarlier(' + it.pattern_id + ',\'' + it.due_date + '\')">提前 1 天</button>';
        html += '<button class="cal-btn small danger" onclick="removeItem(' + it.pattern_id + ')">删除</button>';
        html += '<button class="cal-btn" onclick="openLoop(' + it.pattern_id + ')">去巩固</button>';
        html += '</div></div>';
    }
    el.innerHTML = html;
}

function selectDay(iso) {
    _selectedDate = iso;
    renderCalendar();
    renderDaySection();
}

function renderDaySection() {
    var section = document.getElementById('daySection');
    var el = document.getElementById('dayList');
    if (!section || !el || !_selectedDate) {
        if (section) section.style.display = 'none';
        return;
    }
    section.style.display = 'block';
    document.getElementById('daySectionTitle').textContent = _selectedDate + ' 巩固';
    var items = (_data.items || []).filter(function(x) { return x.due_date === _selectedDate; });
    if (!items.length) {
        el.innerHTML = '<div class="cal-empty">这一天没有安排巩固 <button class="cal-btn secondary small" onclick="openAddModal(\'' + _selectedDate + '\')">添加</button></div>';
        return;
    }
    var html = '';
    for (var i = 0; i < items.length; i++) {
        var it = items[i];
        html += '<div class="cal-day-item">';
        html += '<div><div class="today-name">' + escapeHtml(it.name) + '<span class="state-badge ' + stateClass(it.state) + '">' + escapeHtml(stateLabel(it.state)) + '</span></div>';
        html += '<div class="today-meta">' + escapeHtml(it.category) + ' · 巩固日 ' + escapeHtml(it.due_date) + '</div></div>';
        html += '<div class="cal-day-actions">';
        html += '<button class="cal-btn small secondary" onclick="openScheduleModal(' + it.pattern_id + ',\'' + it.due_date + '\')">调整日期</button>';
        html += '<button class="cal-btn small green" onclick="moveEarlier(' + it.pattern_id + ',\'' + it.due_date + '\')">提前 1 天</button>';
        html += '<button class="cal-btn small danger" onclick="removeItem(' + it.pattern_id + ')">删除</button>';
        html += '<button class="cal-btn small" onclick="openLoop(' + it.pattern_id + ')">去巩固</button>';
        html += '</div></div>';
    }
    el.innerHTML = html;
}

function shiftDate(iso, delta) {
    var p = iso.split('-').map(Number);
    var dt = new Date(p[0], p[1] - 1, p[2] + delta);
    return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate());
}

function openAddModal(prefillDate) {
    var today = (_data && _data.today) || '';
    var date = prefillDate || today;
    var overlay = document.createElement('div');
    overlay.className = 'cal-modal-overlay show';
    overlay.id = 'calModalOverlay';
    overlay.innerHTML = '<div class="cal-modal">' +
        '<h3>添加巩固</h3>' +
        '<label for="calAddPattern">套路</label><select id="calAddPattern"><option value="">加载中...</option></select>' +
        '<label for="calAddDate">巩固日期</label><input type="date" id="calAddDate" value="' + date + '">' +
        '<div class="cal-modal-actions"><button class="cal-btn secondary" onclick="closeCalModal()">取消</button>' +
        '<button class="cal-btn" onclick="saveAddModal()">保存</button></div></div>';
    document.body.appendChild(overlay);
    loadPatternOptions();
}

async function loadPatternOptions() {
    var sel = document.getElementById('calAddPattern');
    if (!sel) return;
    try {
        var r = await fetch('http://127.0.0.1:8000/patterns');
        var patterns = await r.json();
        var scheduled = new Set((_data.items || []).map(function(x) { return x.pattern_id; }));
        var html = '<option value="">选择套路...</option>';
        for (var i = 0; i < patterns.length; i++) {
            if (scheduled.has(patterns[i].id)) continue;
            html += '<option value="' + patterns[i].id + '">' + escapeHtml(patterns[i].category + ' · ' + patterns[i].name) + '</option>';
        }
        sel.innerHTML = html || '<option value="">没有可添加的套路</option>';
    } catch (e) {
        sel.innerHTML = '<option value="">加载失败</option>';
    }
}

async function saveAddModal() {
    var pid = parseInt(document.getElementById('calAddPattern').value, 10);
    var date = document.getElementById('calAddDate').value;
    if (!pid || !date) return;
    await schedulePattern(pid, date);
}

function openScheduleModal(patternId, dueDate) {
    var overlay = document.createElement('div');
    overlay.className = 'cal-modal-overlay show';
    overlay.id = 'calModalOverlay';
    overlay.innerHTML = '<div class="cal-modal">' +
        '<h3>调整巩固日期</h3>' +
        '<input type="hidden" id="calSchedulePattern" value="' + patternId + '">' +
        '<label for="calScheduleDate">巩固日期</label><input type="date" id="calScheduleDate" value="' + dueDate + '">' +
        '<div class="cal-modal-actions"><button class="cal-btn secondary" onclick="closeCalModal()">取消</button>' +
        '<button class="cal-btn" onclick="saveScheduleModal()">保存</button></div></div>';
    document.body.appendChild(overlay);
}

async function saveScheduleModal() {
    var pid = parseInt(document.getElementById('calSchedulePattern').value, 10);
    var date = document.getElementById('calScheduleDate').value;
    if (!pid || !date) return;
    await schedulePattern(pid, date);
}

async function schedulePattern(patternId, dueDate) {
    try {
        var r = await api('/patterns/calendar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({pattern_id: patternId, due_date: dueDate})
        });
        if (r && r.error) throw new Error(r.detail || r.error);
        closeCalModal();
        await loadData();
    } catch (e) {
        alert('保存失败：' + e.message);
    }
}

async function moveEarlier(patternId, dueDate) {
    var earlier = shiftDate(dueDate, -1);
    await schedulePattern(patternId, earlier);
}

async function removeItem(patternId) {
    if (!confirm('确定从巩固日历中删除这个套路吗？')) return;
    try {
        var r = await api('/patterns/calendar/' + patternId, {method: 'DELETE'});
        if (r && r.error) throw new Error(r.detail || r.error);
        await loadData();
    } catch (e) {
        alert('删除失败：' + e.message);
    }
}

function closeCalModal() {
    var el = document.getElementById('calModalOverlay');
    if (el) el.remove();
}

function prevMonth() {
    _month--;
    if (_month < 1) { _month = 12; _year--; }
    renderCalendar();
}

function nextMonth() {
    _month++;
    if (_month > 12) { _month = 1; _year++; }
    renderCalendar();
}

function goToday() {
    if (!_data) return;
    var p = String(_data.today).split('-').map(Number);
    _year = p[0];
    _month = p[1];
    renderCalendar();
}

document.addEventListener('DOMContentLoaded', function() {
    loadData();
});
</script>
