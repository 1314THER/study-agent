<script>
var _data = null;
var _year = 0;
var _month = 0;
var _weekdays = ['一', '二', '三', '四', '五', '六', '日'];

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function api(path, opts) {
    var r = await fetch('http://127.0.0.1:8000' + path, opts || {});
    return r.json();
}

function stateLabel(s) {
    return {never: '未挑战', first_pass: '第一次会', second_pass: '第二次会', third_pass: '已通关', again_wrong: '再次出错'}[s] || s || '未挑战';
}

function stateClass(s) {
    return 'state-' + (s || 'never');
}

function openLoop(patternId) {
    window.open('loop.html?v=20260807&pattern_id=' + patternId, '_blank');
}

function pad2(n) {
    return String(n).padStart(2, '0');
}

async function loadData() {
    try {
        _data = await api('/patterns/calendar');
        var p = String(_data.today).split('-').map(Number);
        _year = p[0];
        _month = p[1];
        renderAll();
    } catch (e) {
        document.getElementById('calGrid').innerHTML = '<div class="cal-empty">日历加载失败</div>';
    }
}

function renderAll() {
    renderCalendar();
    renderTodayList();
}

function renderCalendar() {
    var titleEl = document.getElementById('calMonth');
    if (titleEl) titleEl.textContent = _year + ' 年 ' + _month + ' 月';
    var grid = document.getElementById('calGrid');
    if (!grid || !_data) return;
    var first = new Date(_year, _month - 1, 1);
    var startWeekday = (first.getDay() + 6) % 7;
    var daysInMonth = new Date(_year, _month, 0).getDate();
    var html = '';
    for (var w = 0; w < 7; w++) {
        html += '<div class="cal-weekday">周' + _weekdays[w] + '</div>';
    }
    for (var i = 0; i < startWeekday; i++) {
        html += '<div class="cal-day empty"></div>';
    }
    for (var d = 1; d <= daysInMonth; d++) {
        var iso = _year + '-' + pad2(_month) + '-' + pad2(d);
        var items = (_data.items || []).filter(function(x) { return x.due_date === iso; });
        var cls = 'cal-day';
        if (iso === _data.today) cls += ' today';
        if (items.length) cls += ' has';
        html += '<div class="' + cls + '"><div class="cal-date">' + d + '</div>';
        if (items.length) {
            html += '<div class="cal-count">' + items.length + ' 个套路巩固</div>';
        }
        html += '</div>';
    }
    grid.innerHTML = html;
}

function renderTodayList() {
    var el = document.getElementById('todayList');
    if (!el) return;
    var items = (_data && _data.today_items) || [];
    if (!items.length) {
        el.innerHTML = '<div class="cal-empty">今天没有需要巩固的套路</div>';
        return;
    }
    var html = '';
    for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var overdue = it.days_left < 0;
        html += '<div class="today-card">';
        html += '<div><div class="today-name">' + escapeHtml(it.name) + '<span class="state-badge ' + stateClass(it.state) + '">' + escapeHtml(stateLabel(it.state)) + '</span></div>';
        html += '<div class="today-meta">' + escapeHtml(it.category) + ' · 巩固日 ' + escapeHtml(it.due_date) + '</div></div>';
        html += '<div class="today-side">';
        html += '<span class="today-days' + (overdue ? ' over' : '') + '">' + (overdue ? '逾期 ' + Math.abs(it.days_left) + ' 天' : '今天') + '</span>';
        html += '<button class="cal-btn" onclick="openLoop(' + it.pattern_id + ')">去巩固</button>';
        html += '</div></div>';
    }
    el.innerHTML = html;
}

function prevMonth() {
    _month--;
    if (_month < 1) { _month = 12; _year--; }
    renderCalendar();
}

function nextMonth() {
    _month++;
    if (_month > 12) { _month = 1; _year++; }
    renderCalendar();
}

function goToday() {
    if (!_data) return;
    var p = String(_data.today).split('-').map(Number);
    _year = p[0];
    _month = p[1];
    renderCalendar();
}

document.addEventListener('DOMContentLoaded', function() {
    loadData();
});
</script>
