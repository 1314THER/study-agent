<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学最强大脑</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body class="theme-liangliang">
    <div class="app-layout">
        <aside class="sidebar">
            <a href="/" class="sidebar-logo">成为<br>数学高手</a>
            <nav>
                <a href="index.html" class="nav-item active" data-page="solve">
                    <span class="nav-icon">🔍</span>
                    <span class="nav-label">和老师对答案</span>
                </a>
                <a href="teach.html" class="nav-item" data-page="teach">
                    <span class="nav-icon">📖</span>
                    <span class="nav-label">老师手把手<br>教你做题</span>
                    <span class="nav-badge">预留</span>
                </a>
                <a href="history.html" class="nav-item" data-page="history">
                    <span class="nav-icon">📋</span>
                    <span class="nav-label">错题本</span>
                </a>
            </nav>
        </aside>
        <main class="main-content">
            <div class="container">
<h1>AI做题系统</h1>
        <p class="subtitle">发送文本，Deepseek-V4为你解答</p>
        <div class="type-selector" style="display:none">
            <span class="type-label">题型：</span>
            <button class="type-btn active" data-type="" onclick="selectType(this, '')">自动识别</button>
            <button class="type-btn" data-type="选择题" onclick="selectType(this, '选择题')">选择题</button>
            <button class="type-btn" data-type="填空题" onclick="selectType(this, '填空题')">填空题</button>
            <button class="type-btn" data-type="大题" onclick="selectType(this, '大题')">大题</button>
        </div>
        <div class="teacher-selector">
            <button class="teacher-btn active" data-teacher="liangliang" onclick="selectTeacher(this,'liangliang')">
                <span class="t-icon">🫅</span>
                <span class="t-name">梁梁</span>
                <span class="t-desc">快速，但是可能出错</span>
            </button>
            <button class="teacher-btn" data-teacher="taotao" onclick="selectTeacher(this,'taotao')">
                <span class="t-icon">🎩</span>
                <span class="t-name">韬韬</span>
                <span class="t-desc">更慢但更聪明</span>
            </button>
            <button class="teacher-btn" data-teacher="xuefeng" onclick="selectTeacher(this,'xuefeng')">
                <span class="t-icon">🏃</span>
                <span class="t-name">雪峰</span>
                <span class="t-desc">嘴唇有点紫<br>的老师</span>
            </button>
            <button class="teacher-btn" data-teacher="ji" onclick="selectTeacher(this,'ji')">
                <span class="t-icon">🐔</span>
                <span class="t-name">鸡</span>
                <span class="t-desc">每一步都要<br>考虑半天</span>
            </button>
        </div>
        <div class="search-box">
            <textarea id="questionInput" placeholder="输入题目..." rows="1" onkeydown="if(event.key==='Enter' && !event.shiftKey) { event.preventDefault(); solveQuestion(); }" oninput="autoResize(this)"></textarea>
            <button id="searchBtn" onclick="solveQuestion()">搜索</button>
        </div>
                        <div class="save-toggle">
                    <label class="toggle-label">
                        <input type="checkbox" id="saveToggle" checked>
                        <span class="toggle-text">加入到错题本</span>
                    </label>
                </div>
                <div class="progress-area" id="progressArea">
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-pct" id="progressPct">0%</div>
            <div class="progress-text" id="progressText"></div>
            <div class="progress-token" id="progressToken" style="display:none;"></div>
            <div class="progress-timer" id="progressTimer" style="display:none;"></div>
        </div>
        <div class="result" id="result"></div>
        <div id="saveAfterArea" class="save-after-area" style="display:none">
            <button id="saveAfterBtn" class="save-after-btn" onclick="saveAfterSolve()">加入到错题本</button>
        </div>
            </div>
        </main>
    </div>
    <script>
var _selectedTeacher = "liangliang";
        var _lastQuestion = '';
        var _lastResult = null;
        var teacherNames = { liangliang: '梁梁', taotao: '韬韬', xuefeng: '雪峰', ji: '鸡' };
        function selectTeacher(btn, teacher) {
            document.querySelectorAll(".teacher-btn").forEach(function(b) { b.classList.remove("active"); });
            btn.classList.add("active");
            _selectedTeacher = teacher;
            document.body.classList.remove('theme-xuefeng', 'theme-liangliang', 'theme-taotao', 'theme-ji');
            if (teacher === 'xuefeng') {
                document.body.classList.add('theme-xuefeng');
            } else if (teacher === 'liangliang') {
                document.body.classList.add('theme-liangliang');
            } else if (teacher === 'taotao') {
                document.body.classList.add('theme-taotao');
            } else if (teacher === 'ji') {
                document.body.classList.add('theme-ji');
            }
        }
        var _selectedType = "";
        function selectType(btn, type) {
            document.querySelectorAll(".type-btn").forEach(function(b) { b.classList.remove("active"); });
            btn.classList.add("active");
            _selectedType = type;
        }



        function setProgress(pct, msg, tokens) {
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressPct').textContent = Math.round(pct) + '%';
            document.getElementById('progressText').textContent = msg;
            var tokEl = document.getElementById('progressToken');
            if (tokens !== undefined) {
                tokEl.style.display = 'block';
                tokEl.textContent = '消耗 ' + tokens + ' tokens';
            }
        }

        function renderSteps(html, steps) {
            for (var i = 0; i < steps.length; i++) {
                var step = steps[i];
                html += '<div class="step">';
                html += '<div class="step-header">';
                html += '<span class="step-number">步骤' + step.step_number + '：' + escapeHtml(step.title || '') + '</span>';
                if (step.step_difficulty) {
                    html += '<span class="step-diff-tag">' + step.step_difficulty.level + ' (' + step.step_difficulty.score + '分)</span>';
                }
                html += '</div>';
                html += '<div class="step-content">' + escapeHtml(step.standard_writing || '') + '</div>';
                if (step.detailed_writing) {
                    html += '<div class="detail-toggle" onclick="toggleDetail(this)">展开详细过程 ▸</div>';
                    html += '<div class="detail-content">' + escapeHtml(step.detailed_writing) + '</div>';
                }
                if (step.knowledge_point) {
                    html += '<div class="step-kp">' + escapeHtml(step.knowledge_point) + '</div>';
                }
                html += '</div>';
            }
            return html;
        }

        function displayResult(data, totalTokens) {
            var result = document.getElementById('result');
            var html = '<div class="meta-bar">';
            // 知识点标签（仅大题有）
            if (data.knowledge_points && data.knowledge_points.length > 0) {
                html += '<span class="tag tag-category">' + data.knowledge_points.slice(0,3).join(' / ') + '</span>';
            }
            // 整体难度（从各块难度取每维最大值计算）
            var od = data.overall_difficulty;
            if (od && od.total_score !== undefined) {
                html += '<span class="tag" style="background:#e8f0fe;color:#1565c0;">雪峰难度系数：' + od.total_score + '/15</span>';
            }
            // 武亮难度系数
            if (data.step_difficulty_sum !== undefined) {
                html += '<span class="tag" style="background:#fce4ec;color:#c62828;">武亮难度系数：' + data.step_difficulty_sum + '</span>';
            }
            html += '</div>';

            // 雷达图容器
            html += '<div id="radarChart" style="display:flex;justify-content:center;margin-bottom:16px;"></div>';

            // 块结果
            if (data.chunk_results && data.chunk_results.length > 0) {
                for (var ci = 0; ci < data.chunk_results.length; ci++) {
                    var cr = data.chunk_results[ci];
                    var chunkId = cr.chunk_id || (ci + 1);
                    var cat = cr.category || {};
                    var diff = cr.difficulty || {};
                    html += '<div class="chunk-card">';
                    html += '<div class="chunk-header">';
                    html += '<span class="chunk-label">块' + chunkId + '</span>';
                    if (cr.chunk_type) {
                        var tc = 'tag-type';
                        if (cr.chunk_type === '选择题' || cr.chunk_type === '填空题') tc += ' tag-type-simple';
                        else if (cr.chunk_type === '非常规压轴题') tc += ' tag-type-special';
                        html += '<span class="tag ' + tc + '">' + cr.chunk_type + '</span>';
                    }
                    if (cat.level1) html += '<span class="chunk-cat">' + cat.level1 + '</span>';
                    if (diff.level) html += '<span class="chunk-diff ' + (diff.level === '容易' ? 'tag-easy' : diff.level === '中等' ? 'tag-medium' : diff.level === '困难' ? 'tag-hard' : 'tag-extreme') + '">' + diff.level + '</span>';
                    html += '</div>';

                    if (cr.steps && cr.steps.length > 0) {
                        html += '<div class="chunk-steps">';
                        for (var si = 0; si < cr.steps.length; si++) {
                            var step = cr.steps[si];
                            html += '<div class="step">';
                            html += '<div class="step-header">';
                            html += '<span class="step-number">步骤' + step.step_number + '：' + escapeHtml(step.title || '') + '</span>';
                            if (step.step_difficulty) {
                                html += '<span class="step-diff-tag">' + step.step_difficulty.level + ' (' + step.step_difficulty.score + '分)</span>';
                            }
                            html += '</div>';
                            html += '<div class="step-content">' + escapeHtml(step.standard_writing || '') + '</div>';
                            if (step.detailed_writing) {
                                html += '<div class="detail-toggle" onclick="toggleDetail(this)">展开详细过程 ▸</div>';
                                html += '<div class="detail-content">' + escapeHtml(step.detailed_writing) + '</div>';
                            }
                            if (step.knowledge_point) {
                                html += '<div class="step-kp">' + escapeHtml(step.knowledge_point) + '</div>';
                            }
                            html += '</div>';
                        }
                        html += '</div>';
                    }
                    if (cr.final_answer) {
                        html += '<div class="final-answer">答案：' + cr.final_answer + '</div>';
                    }
                    html += '</div>';
                }
            }

            // Token
            if (totalTokens) {
                html += '<div style="text-align:center;margin-top:20px;font-size:13px;color:#86868b;">消耗 ' + totalTokens + ' tokens</div>';
            }

            result.innerHTML = html;
            result.style.display = 'block';

            // KaTeX 渲染
            try {
                renderMathInElement(result, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '$', right: '$', display: false},
                        {left: '\[', right: '\]', display: true}
                    ],
                    ignoredTags: []
                });
            } catch(e) { console.log('KaTeX error:', e); }

            // 渲染标准过程中的 LaTeX
            result.querySelectorAll('.step-content').forEach(function(el) {
                try { renderMathInElement(el, { delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\\\(', right: '\\\\)', display: false},
                    {left: '\\\\[', right: '\\\\]', display: true}
                ], ignoredTags: [] }); } catch(e) { console.log('KaTeX error:', e); }
            });

            // 画雷达图（用整体难度维度）
            var dims = od && od.dimensions;
            if (dims && Object.keys(dims).length === 5) {
                var dpr = window.devicePixelRatio || 1;
                var canvas = document.createElement('canvas');
                var cssW = 400, cssH = 360;
                canvas.width = cssW * dpr;
                canvas.height = cssH * dpr;
                canvas.style.width = cssW + 'px';
                canvas.style.height = cssH + 'px';
                canvas.style.maxWidth = '100%';
                document.getElementById('radarChart').appendChild(canvas);
                var ctx = canvas.getContext('2d');
                ctx.scale(dpr, dpr);
                var cx = 200, cy = 185, radius = 100;
                var labels = Object.keys(dims);
                var values = labels.map(function(k) { return dims[k]; });
                var n = labels.length;
                // 3 层同心网格
                var gridColors = ['#f0f0f0', '#e5e5e7', '#d8d8dc'];
                for (var ri = 1; ri <= 3; ri++) {
                    var r = radius * ri / 3;
                    ctx.beginPath();
                    for (var i = 0; i <= n; i++) {
                        var angle = (i % n) * 2 * Math.PI / n - Math.PI / 2;
                        var x = cx + r * Math.cos(angle);
                        var y = cy + r * Math.sin(angle);
                        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.strokeStyle = gridColors[ri - 1];
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
                // 轴线 + 标签
                for (var i = 0; i < n; i++) {
                    var angle = i * 2 * Math.PI / n - Math.PI / 2;
                    ctx.beginPath(); ctx.moveTo(cx, cy);
                    ctx.lineTo(cx + radius * Math.cos(angle), cy + radius * Math.sin(angle));
                    ctx.strokeStyle = '#ececee';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    var label = labels[i] + ' ' + values[i];
                    ctx.font = '13px -apple-system, sans-serif';
                    ctx.fillStyle = '#1d1d1f';
                    var lr = radius + 16;
                    var nx = cx + lr * Math.cos(angle);
                    var ny = cy + lr * Math.sin(angle);
                    // 自适应对齐
                    var deg = ((i / n) * 360) % 360;
                    if (deg < 18 || deg >= 342) {
                        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                    } else if (deg >= 18 && deg < 72) {
                        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    } else if (deg >= 72 && deg < 108) {
                        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    } else if (deg >= 108 && deg < 162) {
                        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                    } else if (deg >= 162 && deg < 198) {
                        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                    } else if (deg >= 198 && deg < 252) {
                        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                    } else if (deg >= 252 && deg < 288) {
                        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                    } else {
                        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                    }
                    ctx.fillText(label, nx, ny);
                }
                // 数据多边形
                ctx.beginPath();
                for (var i = 0; i <= n; i++) {
                    var angle = (i % n) * 2 * Math.PI / n - Math.PI / 2;
                    var val = Math.min(values[i % n] / 3, 1);
                    var x = cx + radius * val * Math.cos(angle);
                    var y = cy + radius * val * Math.sin(angle);
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.closePath();
                var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                grad.addColorStop(0, 'rgba(0, 113, 227, 0.25)');
                grad.addColorStop(1, 'rgba(0, 113, 227, 0.06)');
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = '#0071e3';
                ctx.lineWidth = 2;
                ctx.stroke();
                // 数据点
                for (var i = 0; i < n; i++) {
                    var angle = i * 2 * Math.PI / n - Math.PI / 2;
                    var val = Math.min(values[i] / 3, 1);
                    var x = cx + radius * val * Math.cos(angle);
                    var y = cy + radius * val * Math.sin(angle);
                    ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 2 * Math.PI);
                    ctx.fillStyle = '#0071e3';
                    ctx.fill();
                    ctx.beginPath(); ctx.arc(x, y, 2, 0, 2 * Math.PI);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                }
                // 标题
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.font = '13px -apple-system, sans-serif';
                ctx.fillStyle = '#86868b';
                ctx.fillText('五维难度分布', cx, cssH - 10);
            }
        }

        function displayXuebile(data) {
            var result = document.getElementById('result');
            var reason = data.detail || data.status || '未知错误';
            var formatted = reason;
            if (reason.indexOf('不是数学题') >= 0) {
                formatted = '这个题不是数学题';
            } else if (reason.indexOf('不会做') >= 0 || reason.indexOf('不可解') >= 0) {
                formatted = '因为张老师不会做这个题';
            } else if (reason.indexOf('错题') >= 0) {
                formatted = '这个题是错题';
            }
            formatted += '<br>张雪峰老师，我还记得你～';
            var html = '<div class="xuebile"><div class="xuebile-icon">💀</div><div class="xuebile-title">雪碧了</div><div class="xuebile-reason">' + formatted + '</div></div>';
            result.innerHTML = html;
            result.classList.add('show'); result.style.display = 'block';
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }
        function toggleDetail(el) {
            var content = el.nextElementSibling;
            var isOpen = !content.classList.contains('show');
            content.classList.toggle('show');
            el.textContent = isOpen ? '收起详细过程 ▾' : '展开详细过程 ▸';
            if (isOpen && window.renderMathInElement) {
                try { renderMathInElement(content, { delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ], ignoredTags: [] }); } catch(e) { console.log('KaTeX error:', e); }
            }
        }
        function levelClass(level) {
            var map = { '容易': 'tag-easy', '中等': 'tag-medium', '困难': 'tag-hard', '极难': 'tag-extreme' };
            return map[level] || 'tag-easy';
        }

        var _stepTimer = null;
        function startStepTimer() {
            var startTime = Date.now();
            var timerEl = document.getElementById('progressTimer');
            timerEl.style.display = 'block';
            var _timeoutAdded = false;
            if (_stepTimer) clearInterval(_stepTimer);
            _stepTimer = setInterval(function() {
                var elapsed = Math.floor((Date.now() - startTime) / 1000);
                if (elapsed > 180) {
                    timerEl.textContent = '已思考 ' + elapsed + 's';
                    if (!_timeoutAdded) {
                        _timeoutAdded = true;
                        document.getElementById('progressText').innerHTML += '<br>你做不过我你信吗';
                    }
                } else {
                    timerEl.textContent = '已思考 ' + elapsed + 's/180s';
                }
            }, 1000);
        }
        function stopStepTimer() {
            if (_stepTimer) {
                clearInterval(_stepTimer);
                _stepTimer = null;
            }
        }
        function isValidQuestion(text) {
            if (!text || text.length < 5) return false;
            // 必须有中文
            if (!/[\u4e00-\u9fff]/.test(text)) return false;
            // 必须有数学相关字符或较长中文字段
            if (!/[0-9+\-\u00d7\u00f7=\u221a\u03c0\u03b8]/.test(text) && !/[\u4e00-\u9fff]{6,}/.test(text)) return false;
            return true;
        }

        async function solveQuestion() {
            const input = document.getElementById('questionInput');
            const result = document.getElementById('result');
            const btn = document.getElementById('searchBtn');
            const question = input.value.trim();
            _lastQuestion = question;
            localStorage.setItem('solve_input', question);
            if (!question) { alert('请输入题目'); return; }
            if (!isValidQuestion(question)) {
                result.classList.remove('show');
                result.innerHTML = '<div class="xuebile"><div class="xuebile-icon">💀</div><div class="xuebile-title">雪碧了</div><div class="xuebile-reason">这个题不是数学题<br>张雪峰老师，我还记得你～</div></div>';
                result.style.display = 'block';
                return;
            }
            result.classList.remove('show');
            btn.disabled = true;

            const area = document.getElementById('progressArea');
            const tokenEl = document.getElementById('progressToken');
            tokenEl.style.display = 'none';
            area.classList.add('show');

            var totalTokens = 0;

            try {
                // Step 1: Solver
                var tn = teacherNames[_selectedTeacher] || 'AI';
                setProgress(13, tn + ' 正在思考', 0);
                startStepTimer();
                const r1 = await fetch('http://127.0.0.1:8000/solve/step1', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, question_type: _selectedType || null, teacher: _selectedTeacher })
                });
                const d1 = await r1.json();
                if (d1.error) { stopStepTimer(); setProgress(100, '雪碧了'); displayXuebile(d1); return; }
                totalTokens += (d1.token_usage?.total_tokens || 0);

                // Step 2: Verifier
                setProgress(78, tn + ' 正在分类知识点', totalTokens);
                const r2 = await fetch('http://127.0.0.1:8000/solve/step2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, content: d1.content, category: d1.category || null, question_type: _selectedType || null, teacher: _selectedTeacher })
                });
                const d2 = await r2.json();
                if (d2.error) { stopStepTimer(); setProgress(100, '雪碧了'); displayXuebile(d2); return; }
                totalTokens += (d2.token_usage?.total_tokens || 0);

                // Step 3: Formatter
                setProgress(91, tn + ' 正在检查', totalTokens);
                const r3 = await fetch('http://127.0.0.1:8000/solve/step3', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, chunk_results: JSON.stringify(d2.chunk_results), teacher: _selectedTeacher, save: document.getElementById('saveToggle').checked })
                });
                const d3 = await r3.json();
                totalTokens += (d3.token_usage?.total_tokens || 0);

                stopStepTimer();
                setProgress(100, '完成', totalTokens);
                if (d3.error) { displayXuebile(d3); return; }
                _lastResult = d3;
                document.getElementById('saveAfterArea').style.display = 'block';
                document.getElementById('saveAfterBtn').textContent = '加入到错题本';
                document.getElementById('saveAfterBtn').disabled = false;
                document.getElementById('saveAfterBtn').className = 'save-after-btn';
                displayResult(d3, totalTokens);
                localStorage.setItem('solve_result', JSON.stringify({data: d3, totalTokens: totalTokens}));
            } catch (err) {
                stopStepTimer();
                console.error('请求失败:', err);
                document.getElementById('saveAfterArea').style.display = 'none';
                setProgress(100, '请求失败');
                result.innerHTML = '<p style="color:red">请求失败: ' + err.message + '</p>';
                result.classList.add('show'); result.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        }

// ---- localStorage Persistence ----
async function saveAfterSolve() {
            if (!_lastQuestion || !_lastResult) return;
            try {
                const resp = await fetch('http://127.0.0.1:8000/questions/save', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: _lastQuestion, answer_json: _lastResult})
                });
                const result = await resp.json();
                const btn = document.getElementById('saveAfterBtn');
                btn.textContent = result.message || (result.saved ? '\u2713 已加入错题本' : '已在错题本中');
                btn.disabled = true;
                btn.className = 'save-after-btn saved';
            } catch(e) {
                console.error('\u4fdd\u5b58\u5931\u8d25:', e);
            }
        }
        
        document.addEventListener('DOMContentLoaded' , function() {
    var savedTeacher = localStorage.getItem('teacher');
    if (savedTeacher) {
        var btn = document.querySelector('[data-teacher="'+savedTeacher+'"]');
        if (btn) selectTeacher(btn, savedTeacher);
    }
    var savedInput = localStorage.getItem('solve_input');
    if (savedInput) {
        document.getElementById('questionInput').value = savedInput;
        autoResize(document.getElementById('questionInput'));
    }
    var savedSave = localStorage.getItem('solve_save');
    if (savedSave !== null) {
        document.getElementById('saveToggle').checked = savedSave === 'true';
    }
    document.getElementById('saveToggle').addEventListener('change', function() {
        localStorage.setItem('solve_save', this.checked);
    });
    var savedResult = localStorage.getItem('solve_result');
    if (savedResult) {
        try {
            var parsed = JSON.parse(savedResult);
            displayResult(parsed.data, parsed.totalTokens);
        } catch(e) {
            localStorage.removeItem('solve_result');
        }
    }
});

document.getElementById('searchBtn').addEventListener('click', function() {
    localStorage.removeItem('solve_result');
});
    </script>
