<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI学习伴侣</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            color: #1d1d1f;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #86868b;
            margin-bottom: 30px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .search-box input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: #0071e3;
        }
        .search-box button {
            padding: 14px 28px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-box button:hover {
            background: #0077ed;
        }
        .result {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: none;
        }
        .result.show { display: block; }
        .result h2 {
            font-size: 18px;
            color: #1d1d1f;
            margin-bottom: 20px;
        }
        .step {
            margin-bottom: 20px;
            padding-left: 12px;
            border-left: 3px solid #0071e3;
        }
        .step .title {
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 6px;
        }
        .step .content {
            color: #515154;
            line-height: 1.6;
        }
        .final-answer {
            margin-top: 20px;
            padding: 16px;
            background: #f0f7ff;
            border-radius: 12px;
            font-weight: 600;
            color: #0071e3;
        }
        .loading {
            text-align: center;
            color: #86868b;
            padding: 40px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI学习伴侣</h1>
        <p class="subtitle">输入题目，AI 帮你做</p>

        <div class="search-box">
            <input type="text" id="questionInput" placeholder="输入题目...">
            <button onclick="solveQuestion()">搜索</button>
        </div>

        <div class="loading" id="loading">AI 正在解题中...</div>

        <div class="result" id="result"></div>
    </div>

    <script>
        async function solveQuestion() {
            const input = document.getElementById('questionInput');
            const result = document.getElementById('result');
            const loading = document.getElementById('loading');
            const question = input.value.trim();

            if (!question) {
                alert('请输入题目');
                return;
            }

            result.classList.remove('show');
            loading.style.display = 'block';

            try {
                const response = await fetch('http://127.0.0.1:8000/solve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();
                loading.style.display = 'none';
                displayResult(data);
            } catch (err) {
                loading.style.display = 'none';
                result.innerHTML = '<p style="color:red">请求失败，请检查后端是否启动</p>';
                result.classList.add('show');
            }
        }

        function displayResult(data) {
            const result = document.getElementById('result');
            let html = '<h2>解题过程</h2>';

            if (data.steps) {
                data.steps.forEach(step => {
                    html += `
                        <div class="step">
                            <div class="title">第${step.step_number}步：${step.title}</div>
                            <div class="content">${step.content}</div>
                        </div>
                    `;
                });
            }

            if (data.final_answer) {
                html += `<div class="final-answer">答案：${data.final_answer}</div>`;
            }

            result.innerHTML = html;
            result.classList.add('show');
        }
    </script>
</body>
</html>
