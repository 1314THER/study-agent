function safeParseKps(kps){

    try{var p=JSON.parse(kps);return Array.isArray(p)?p:[];}catch(e){return [];}

    <script>
var _selectedTeacher = "liangliang";
        var _lastQuestion = '';
        var _lastQuestionId = null;
        var _stepErrors = [];
        var _errorDialogState = { questionId: null, stepNumber: null, chunkId: null };
        var _lastResult = null;
        var teacherNames = { liangliang: '梁梁', taotao: '韬韬', xuefeng: '雪峰', ji: '鸡' };
        function selectTeacher(btn, teacher) {
            document.querySelectorAll(".teacher-btn").forEach(function(b) { b.classList.remove("active"); });
            btn.classList.add("active");
            _selectedTeacher = teacher;
            document.body.classList.remove('theme-xuefeng', 'theme-liangliang', 'theme-taotao', 'theme-ji');
            if (teacher === 'xuefeng') {
                document.body.classList.add('theme-xuefeng');
            } else if (teacher === 'liangliang') {
                document.body.classList.add('theme-liangliang');
            } else if (teacher === 'taotao') {
                document.body.classList.add('theme-taotao');
            } else if (teacher === 'ji') {
                document.body.classList.add('theme-ji');
            }
        }
        var _selectedType = "";
        function selectType(btn, type) {
            document.querySelectorAll(".type-btn").forEach(function(b) { b.classList.remove("active"); });
            btn.classList.add("active");
            _selectedType = type;
        }



        function setProgress(pct, msg, tokens) {
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressPct').textContent = Math.round(pct) + '%';
            document.getElementById('progressText').textContent = msg;
            var tokEl = document.getElementById('progressToken');
            if (tokens !== undefined) {
                tokEl.style.display = 'block';
                tokEl.textContent = '消耗 ' + tokens + ' tokens';
            }
        }

        function renderSteps(html, steps, chunkId) {
            chunkId = chunkId || 1;
            for (var i = 0; i < steps.length; i++) {
                var step = steps[i];
                html += '<div class="step" data-step-number="' + step.step_number + '" data-chunk-id="' + chunkId + '">';
                html += '<div class="step-header">';
                html += '<span class="step-number">步骤' + step.step_number + '：' + escapeHtml(step.title || '') + '</span>';
                if (step.step_difficulty) {
                    html += '<span class="step-diff-tag">' + step.step_difficulty.level + ' (' + step.step_difficulty.score + '分)</span>';
                }
                html += '</div>';
                if (window.renderDimBarsHtml && step.step_difficulty) {
                    html += window.renderDimBarsHtml(step.step_difficulty.dimensions);
                }
                html += '<div class="step-content">' + escapeHtml(step.standard_writing || '') + '</div>';
                if (step.detailed_writing) {
                    html += '<div class="detail-toggle" onclick="toggleDetail(this)">展开详细过程 ▸</div>';
                    html += '<div class="detail-content">' + escapeHtml(step.detailed_writing) + '</div>';
                }
                if (step.knowledge_point) {
                    html += '<div class="step-kp">' + escapeHtml(step.knowledge_point) + '</div>';
                }
                html += '<div class="step-errors"></div>';
                html += '<button class="step-error-btn" onclick="showErrorDialog(_lastQuestionId,' + step.step_number + ',' + chunkId + ')">添加错因</button>';
                html += '</div>';
            }
            return html;
        }

        function displayResult(data, totalTokens) {
            var result = document.getElementById('result');
            var html = '';
            if (data.formatter_fallback) {
                html += '<div style="margin-bottom:12px;padding:10px 14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;color:#9a3412;font-size:13px;line-height:1.6;">可能有错误：该题 Formatter 未通过校验，已保留 Verifier 结果，难度未知。</div>';
            }
            html += '<div class="meta-bar">';
            // 知识点标签（仅大题有）
            if (data.knowledge_points && data.knowledge_points.length > 0) {
                html += '<span class="tag tag-category">' + safeParseKps(data.knowledge_points).slice(0,3).join(' / ') + '</span>';
            }
            // 整体难度（从各块难度取每维最大值计算）
            var od = data.overall_difficulty;
            if (od && od.level) {
                var lCls = levelClass(od.level);
                html += '<span class="tag ' + lCls + '">' + escapeHtml(od.level) + '</span>';
            }
            if (data.source_type) {
                var srcClass = 'tag-source';
                if (data.source_type === 'ai生成') srcClass += ' tag-source-ai';
                else if (data.source_type === '高考题') srcClass += ' tag-source-gaokao';
                else if (data.source_type === '模拟题') srcClass += ' tag-source-monikao';
                else if (data.source_type === '精选母题') srcClass += ' tag-source-muti';
                html += '<span class="' + srcClass + '">' + escapeHtml(data.source_type) + '</span>';
                html += sourceMetaLink(data.source_type, data.source_meta);
            }
            if (od && od.total_score !== undefined) {
                var diffLabel = od.level === '未知' ? '难度：待重评' : ('难度系数：' + od.total_score + '/15');
                html += '<span class="tag" style="background:#ede7f6;color:#5e35b1;">' + diffLabel + '</span>';
            }
            html += '</div>';

            // Teach button
            html += '<div style="text-align:center;margin-bottom:16px;">';
            html += '<button onclick="localStorage.setItem(\'_teach_question\',document.getElementById(\'questionInput\').value||\'\');window.open(\'teach.html?standalone=1\',\'_blank\');" style="padding:8px 20px;background:#ca8a04;color:white;border:none;border-radius:10px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;">📖 手把手教学</button></div>';

            // 雷达图容器
            html += '<div id="radarChart" style="display:flex;justify-content:center;margin-bottom:16px;"></div>';

            // 块结果
            if (data.chunk_results && data.chunk_results.length > 0) {
                for (var ci = 0; ci < data.chunk_results.length; ci++) {
                    var cr = data.chunk_results[ci];
                    var chunkId = cr.chunk_id || (ci + 1);
                    var cat = cr.category || {};
                    var diff = cr.difficulty || {};
                    html += '<div class="chunk-card">';
                    html += '<div class="chunk-header">';
                    html += '<span class="chunk-label">块' + chunkId + '</span>';
                    if (cr.chunk_type) {
                        var tc = 'tag-type';
                        if (cr.chunk_type === '选择题' || cr.chunk_type === '填空题' || cr.chunk_type === '多选题') tc += ' tag-type-simple';
                        html += '<span class="tag ' + tc + '">' + cr.chunk_type + '</span>';
                    }
                    if (cat.level1) html += '<span class="chunk-cat">' + cat.level1 + '</span>';
                    if (diff.level) html += '<span class="chunk-diff ' + levelClass(diff.level) + '">' + diff.level + '</span>';
                    html += '</div>';

                    if (cr.steps && cr.steps.length > 0) {
                        html += '<div class="chunk-steps">';
                        for (var si = 0; si < cr.steps.length; si++) {
                            var step = cr.steps[si];
                            html += '<div class="step" data-step-number="' + step.step_number + '" data-chunk-id="' + chunkId + '">';
                            html += '<div class="step-header">';
                            html += '<span class="step-number">步骤' + step.step_number + '：' + escapeHtml(step.title || '') + '</span>';
                            if (step.step_level1) {
                                html += '<span class="step-level1-tag">' + escapeHtml(step.step_level1) + '</span>';
                            }
                            if (step.step_difficulty) {
                                html += '<span class="step-diff-tag">' + step.step_difficulty.level + ' (' + step.step_difficulty.score + '分)</span>';
                            }
                            html += '</div>';
                            if (window.renderDimBarsHtml && step.step_difficulty) {
                                html += window.renderDimBarsHtml(step.step_difficulty.dimensions);
                            }
                            html += '<div class="step-content">' + escapeHtml(step.standard_writing || '') + '</div>';
                            if (step.detailed_writing) {
                                html += '<div class="detail-toggle" onclick="toggleDetail(this)">展开详细过程 ▸</div>';
                                html += '<div class="detail-content">' + escapeHtml(step.detailed_writing) + '</div>';
                            }
                            if (step.knowledge_point) {
                                html += '<div class="step-kp">' + escapeHtml(step.knowledge_point) + '</div>';
                            }
                            html += '<div class="step-errors"></div>';
                            html += '<button class="step-error-btn" onclick="showErrorDialog(_lastQuestionId,' + step.step_number + ',' + chunkId + ')">添加错因</button>';
                            html += '</div>';
                        }
                        html += '</div>';
                    }
                    if (cr.final_answer) {
                        html += '<div class="final-answer">答案：' + cr.final_answer + '</div>';
                    }
                    html += '</div>';
                }
            }

            // Token
            if (totalTokens) {
                html += '<div style="text-align:center;margin-top:20px;font-size:13px;color:#86868b;">消耗 ' + totalTokens + ' tokens</div>';
            }

            result.innerHTML = html;
            result.style.display = 'block';

            // KaTeX 渲染
            try {
                renderMathInElement(result, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '$', right: '$', display: false},
                        {left: '\[', right: '\]', display: true}
                    ],
                    ignoredTags: []
                });
            } catch(e) { console.log('KaTeX error:', e); }

            // 渲染标准过程和最终答案中的 LaTeX
            result.querySelectorAll('.step-content, .final-answer').forEach(function(el) {
                try { renderMathInElement(el, { delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\\\(', right: '\\\\)', display: false},
                    {left: '\\\\[', right: '\\\\]', display: true}
                ], ignoredTags: [] }); } catch(e) { console.log('KaTeX error:', e); }
            });

            // 画雷达图（用整体难度维度）
            renderDifficultyRadar(document.getElementById('radarChart'), getDifficultyDims(data));
        }

        function displayXuebile(data) {
            var result = document.getElementById('result');
            var reason = data.detail || data.status || '未知错误';
            var formatted = reason;
            if (reason.indexOf('不是数学题') >= 0) {
                formatted = '这个题不是数学题';
            } else if (reason.indexOf('不会做') >= 0 || reason.indexOf('不可解') >= 0) {
                formatted = '因为张老师不会做这个题';
            } else if (reason.indexOf('错题') >= 0) {
                formatted = '这个题是错题';
            }
            formatted += '<br>张雪峰老师，我还记得你～';
            var html = '<div class="xuebile"><div class="xuebile-icon">💀</div><div class="xuebile-title">雪碧了</div><div class="xuebile-reason">' + formatted + '</div></div>';
            result.innerHTML = html;
            result.classList.add('show'); result.style.display = 'block';
        }

        function escapeHtml(str) {
            // 不移除 ' 和 " 以避免破坏 LaTeX（如 f'(x) 中的引号）
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }
        function toggleDetail(el) {
            var content = el.nextElementSibling;
            var isOpen = !content.classList.contains('show');
            content.classList.toggle('show');
            el.textContent = isOpen ? '收起详细过程 ▾' : '展开详细过程 ▸';
            if (isOpen && window.renderMathInElement) {
                try { renderMathInElement(content, { delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ], ignoredTags: [] }); } catch(e) { console.log('KaTeX error:', e); }
            }
        }
        function levelClass(level) {
            var map = { '容易': 'tag-easy', '中等': 'tag-medium', '困难': 'tag-hard', '极难': 'tag-extreme', '未知': 'tag-unknown' };
            return map[level] || 'tag-unknown';
        }

        var _stepTimer = null;
        function startStepTimer() {
            var startTime = Date.now();
            var timerEl = document.getElementById('progressTimer');
            timerEl.style.display = 'block';
            var _timeoutAdded = false;
            if (_stepTimer) clearInterval(_stepTimer);
            _stepTimer = setInterval(function() {
                var elapsed = Math.floor((Date.now() - startTime) / 1000);
                if (elapsed > 180) {
                    timerEl.textContent = '已思考 ' + elapsed + 's';
                    if (!_timeoutAdded) {
                        _timeoutAdded = true;
                        document.getElementById('progressText').innerHTML += '<br>你做不过我你信吗';
                    }
                } else {
                    timerEl.textContent = '已思考 ' + elapsed + 's/180s';
                }
            }, 1000);
        }
        function stopStepTimer() {
            if (_stepTimer) {
                clearInterval(_stepTimer);
                _stepTimer = null;
            }
        }
        function isValidQuestion(text) {
            if (!text || text.length < 5) return false;
            // 必须有中文
            if (!/[\u4e00-\u9fff]/.test(text)) return false;
            // 必须有数学相关字符或较长中文字段
            if (!/[0-9+\-\u00d7\u00f7=\u221a\u03c0\u03b8]/.test(text) && !/[\u4e00-\u9fff]{6,}/.test(text)) return false;
            return true;
        }

        async function solveQuestion() {
            const input = document.getElementById('questionInput');
            const result = document.getElementById('result');
            const btn = document.getElementById('searchBtn');
            const question = input.value.trim();
            _lastQuestion = question;
            localStorage.setItem('solve_input', question);
            if (!question) { alert('请输入题目'); return; }
            if (!isValidQuestion(question)) {
                result.classList.remove('show');
                result.innerHTML = '<div class="xuebile"><div class="xuebile-icon">💀</div><div class="xuebile-title">雪碧了</div><div class="xuebile-reason">这个题不是数学题<br>张雪峰老师，我还记得你～</div></div>';
                result.style.display = 'block';
                return;
            }
            result.classList.remove('show');
            btn.disabled = true;

            const area = document.getElementById('progressArea');
            const tokenEl = document.getElementById('progressToken');
            tokenEl.style.display = 'none';
            area.classList.add('show');

            var totalTokens = 0;

            try {
                // Step 1: Solver
                var tn = teacherNames[_selectedTeacher] || 'AI';
                setProgress(13, tn + ' 正在思考', 0);
                startStepTimer();
                const r1 = await fetch('http://127.0.0.1:8000/solve/step1', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, question_type: _selectedType || null, teacher: _selectedTeacher })
                });
                const d1 = await r1.json();
                if (d1.error) { stopStepTimer(); setProgress(100, '雪碧了'); displayXuebile(d1); return; }
                totalTokens += (d1.token_usage?.total_tokens || 0);

                // Step 2: Verifier
                setProgress(78, tn + ' 正在分类知识点', totalTokens);
                const r2 = await fetch('http://127.0.0.1:8000/solve/step2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, content: d1.content, category: d1.category || null, question_type: _selectedType || null, teacher: _selectedTeacher })
                });
                const d2 = await r2.json();
                if (d2.error) { stopStepTimer(); setProgress(100, '雪碧了'); displayXuebile(d2); return; }
                totalTokens += (d2.token_usage?.total_tokens || 0);

                // Step 3: Formatter
                setProgress(91, tn + ' 正在检查', totalTokens);
                const r3 = await fetch('http://127.0.0.1:8000/solve/step3', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, chunk_results: JSON.stringify(d2.chunk_results), teacher: _selectedTeacher, save: document.getElementById('saveToggle').checked, content: d1.content, category: d1.category || null, question_type: _selectedType || null })
                });
                const d3 = await r3.json();
                totalTokens += (d3.token_usage?.total_tokens || 0);

                stopStepTimer();
                setProgress(100, '完成', totalTokens);
                if (d3.error && !d3.chunk_results) { displayXuebile(d3); return; }
                _lastResult = d3;
                document.getElementById('saveAfterArea').style.display = 'block';
                document.getElementById('saveAfterBtn').textContent = '加入个人题库';
                document.getElementById('saveAfterBtn').innerHTML = '<span class="btn-icon">📋</span><span>加入个人题库</span>';
                document.getElementById('saveAfterBtn').disabled = false;
                document.getElementById('saveAfterBtn').className = 'save-after-btn';
                displayResult(d3, totalTokens);
                if (d3.saved_question_id) {
                    _lastQuestionId = d3.saved_question_id;
                }
                localStorage.setItem('solve_result', JSON.stringify({data: d3, totalTokens: totalTokens}));
                setTimeout(function() {
                    if (_lastQuestionId) refreshStepErrors();
                    else initErrorStepButtons();
                }, 100);
            } catch (err) {
                stopStepTimer();
                console.error('请求失败:', err);
                document.getElementById('saveAfterArea').style.display = 'none';
                setProgress(100, '请求失败');
                result.innerHTML = '<p style="color:red">请求失败: ' + err.message + '</p>';
                result.classList.add('show'); result.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        }

        function initErrorStepButtons() {
            // Show error buttons even without question ID (disabled state)

        function refreshStepErrors() {
            if (!_lastQuestionId) return;
            fetch('http://127.0.0.1:8000/questions/' + _lastQuestionId)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.error) return;
                    _stepErrors = data.step_errors || [];
                    renderStepErrors();
                });
        }

        function renderStepErrors() {
            var steps = document.querySelectorAll('#result .step[data-step-number]');
            steps.forEach(function(stepEl) {
                var stepNum = parseInt(stepEl.dataset.stepNumber);
                var chunkId = parseInt(stepEl.dataset.chunkId);
                var errors = _stepErrors.filter(function(e) {
                    return e.step_number === stepNum && e.chunk_id === chunkId;
                });
                
                stepEl.classList.toggle('has-error', errors.length > 0);
                
                var btn = stepEl.querySelector('.step-error-btn');
                if (btn) {
                    btn.textContent = errors.length > 0 ? '编辑错因' : '添加错因';
                    btn.classList.toggle('has-error', errors.length > 0);
                    btn.style.display = 'inline-flex';
                }
                
                var errorsList = stepEl.querySelector('.step-errors');
                if (errorsList) {
                    if (errors.length > 0) {
                        var html = '';
                        for (var ei = 0; ei < errors.length; ei++) {
                            var err = errors[ei];
                            var timeStr = '';
                            if (err.created_at) {
                                var d = new Date(err.created_at.replace(' ', 'T') + 'Z');
                                var offset = 8 * 60;
                                var local = new Date(d.getTime() + offset * 60000);
                                timeStr = local.getUTCFullYear() + '-' + 
                                    String(local.getUTCMonth()+1).padStart(2,'0') + '-' +
                                    String(local.getUTCDate()).padStart(2,'0') + ' ' +
                                    String(local.getUTCHours()).padStart(2,'0') + ':' +
                                    String(local.getUTCMinutes()).padStart(2,'0');
                            }
                            html += '<div class="step-error-item">';
                            html += '<span class="error-type-badge">' + escapeHtml(err.mistake_type) + '</span>';
                            html += '<span class="error-detail">' + escapeHtml(err.mistake_detail || '') + '</span>';
                            html += '<span class="error-time">' + timeStr + '</span>';
                            html += '<button class="error-delete-btn" onclick="event.stopPropagation();deleteStepError(' + _lastQuestionId + ',' + err.id + ')">✕</button>';
                            html += '</div>';
                        }
                        errorsList.innerHTML = html;
                    } else {
                        errorsList.innerHTML = '';
                    }
                }
            });
        }

        function safeParseMeta(m){
            if(m && typeof m === 'object') return m;
            if(!m) return {};
            try{var p=JSON.parse(m);return (p && typeof p === 'object') ? p : {};}catch(e){return {};}
        }
        function sourceMetaText(sourceType, sourceMeta){
            var m = safeParseMeta(sourceMeta);
            if(sourceType === '模拟题' || sourceType === '高考题'){
                var no = m.question_no ? '第' + m.question_no + '题' : '';
                if(m.paper && no) return m.paper + '·' + no;
                return m.paper || no;
            }
            if(sourceType === 'ai生成') return m.reference_id ? '参考题 #' + m.reference_id : '';
    if(sourceType === '精选母题'){
        var owner = m.owner || 'sqz';
        var txt = owner;
        if (m.pattern) txt += '·' + m.pattern;
        if (m.category) txt += ' · ' + m.category;
        if (m.mother_id) txt += ' · 母题 #' + m.mother_id;
        return txt;
    }
            return '';
        }
        function sourceMetaLink(sourceType, sourceMeta){
            var m = safeParseMeta(sourceMeta);
            var text = sourceMetaText(sourceType, m);
            if (!text) return '';
            if (sourceType === 'ai生成' && m.reference_id) {
                var rid = String(m.reference_id).replace(/\D/g, '');
                if (rid) {
                    return '<a class="tag tag-source-meta tag-ref-link" href="javascript:void(0)" onclick="openReferenceQuestion(' + rid + ')" title="查看参考题详情">' + escapeHtml(text) + '</a>';
                }
            }
            return '<span class="tag tag-source-meta">' + escapeHtml(text) + '</span>';
        }

        function collectSourceMetaFromDialog(){
            var type = _selectedSourceType;

                var paper = document.getElementById('sdPaper');

                if (cat && cat.value) m.category = cat.value;
                if (pat && pat.value.trim()) m.pattern = pat.value.trim();

        async function confirmSaveDialog(questionId) {
            var cbs = document.querySelectorAll('.sdl-checkbox:checked:not([disabled])');
            var listIds = [];
            // Also add "全部" if it's among the disabled ones
            var allCbs = document.querySelectorAll('.sdl-checkbox');
            for (var i = 0; i < allCbs.length; i++) {
                if (allCbs[i].checked) {
                    listIds.push(parseInt(allCbs[i].dataset.listId));

                return;
            }
            var rememberBox = document.getElementById('rememberSourceBox');
            var remember = rememberBox ? rememberBox.checked : false;
            if (remember && srcType) saveRememberedSource({source_type: srcType, source_meta: srcMeta});
            else if (!remember) clearRememberedSource();
            try {
                if (srcType) {
                    var sr = await fetch('http://127.0.0.1:8000/questions/' + questionId + '/source-type', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },

        function updateResultSourceTag(sourceType, sourceMeta) {
            var meta = document.querySelector('#result .meta-bar');
            if (!meta) return;
            var old = meta.querySelector('.tag-source');
            if (old) old.remove();
            var oldMeta = meta.querySelector('.tag-source-meta');
            if (oldMeta) oldMeta.remove();
            if (!sourceType) return;
            var srcClass = 'tag-source';
            if (sourceType === 'ai生成') srcClass += ' tag-source-ai';
            else if (sourceType === '高考题') srcClass += ' tag-source-gaokao';
            else if (sourceType === '模拟题') srcClass += ' tag-source-monikao';
            else if (sourceType === '精选母题') srcClass += ' tag-source-muti';
            var span = document.createElement('span');
            span.className = srcClass;
            span.textContent = sourceType;
            var coeff = meta.querySelector('.tag[style]');
            if (coeff) meta.insertBefore(span, coeff);
            else meta.appendChild(span);
            var srcMetaHtml = sourceMetaLink(sourceType, sourceMeta);
            if (srcMetaHtml) {
                var wrapper = document.createElement('span');
                wrapper.innerHTML = srcMetaHtml;
                var spanMeta = wrapper.firstChild;
                if (span.nextSibling) meta.insertBefore(spanMeta, span.nextSibling);
                else meta.appendChild(spanMeta);
            }
            if (_lastResult) { _lastResult.source_type = sourceType; _lastResult.source_meta = sourceMeta || {}; }
        }
        
        // Make saveAfterSolve available globally for inline onclick
        window.saveAfterSolve = saveAfterSolve;
</script>
