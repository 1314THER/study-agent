<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你好，我是张雪峰老师</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container { max-width: 800px; width: 100%; }
        h1 { text-align: center; font-size: 28px; color: #1d1d1f; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #86868b; margin-bottom: 30px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        .search-box input {
            flex: 1; padding: 14px 18px; border: 1px solid #d2d2d7; border-radius: 12px;
            font-size: 16px; outline: none; transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: #0071e3; }
        .search-box button {
            padding: 14px 28px; background: #0071e3; color: white; border: none;
            border-radius: 12px; font-size: 16px; cursor: pointer; transition: background 0.2s;
        }
        .search-box button:hover { background: #0077ed; }
        .search-box button:disabled { background: #a0c4ff; cursor: not-allowed; }

        .type-selector {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 16px; justify-content: center;
        }
        .type-label { font-size: 14px; color: #86868b; }
        .type-btn {
            padding: 6px 16px; border: 1px solid #d2d2d7; border-radius: 8px;
            background: white; font-size: 14px; cursor: pointer;
            transition: all 0.2s; color: #1d1d1f;
        }
        .type-btn:hover { border-color: #0071e3; color: #0071e3; }
        .type-btn.active {
            background: #0071e3; color: white; border-color: #0071e3;
        }

        .chunk-card {
            background: white; border: 1px solid #e0e0e0; border-radius: 12px;
            margin-bottom: 16px; overflow: hidden;
        }
        .chunk-header {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            padding: 10px 16px; background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0; font-size: 13px;
        }
        .chunk-label {
            font-weight: 600; color: #0071e3;
            background: #e8f0fe; padding: 2px 8px; border-radius: 4px;
        }
        .chunk-type { color: #515154; }
        .chunk-cat { color: #2e7d32; background: #e8f5e9; padding: 2px 8px; border-radius: 4px; }
        .chunk-diff { padding: 2px 8px; border-radius: 4px; }
        .chunk-steps { padding: 12px 16px; }
        .chunk-steps .step { margin-bottom: 12px; }
        .chunk-steps .step:last-child { margin-bottom: 0; }
        .progress-pct {
            text-align: center; font-size: 24px; font-weight: 700;
            color: #0071e3; margin-top: 6px;
        }
        .progress-token {
            text-align: center; font-size: 12px; color: #86868b; margin-top: 4px;
        }

        .progress-area { margin-bottom: 30px; display: none; }
        .progress-area.show { display: block; }
        .progress-bar-track {
            width: 100%; height: 6px;
            background: #e5e5e7; border-radius: 3px; overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #0071e3, #00a2ff);
            border-radius: 3px; transition: width 0.3s ease;
        }
        .progress-text { text-align: center; font-size: 14px; color: #86868b; }

        .result {
            background: white; border-radius: 16px; padding: 30px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08); display: none;
        }
        .result.show { display: block; }

        .meta-bar {
            display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
            padding-bottom: 16px; border-bottom: 1px solid #e5e5e7;
        }
        .tag {
            padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 500;
        }
        .tag-category { background: #e8f5e9; color: #2e7d32; }
        .tag-easy { background: #e3f2fd; color: #1565c0; }
        .tag-medium { background: #fff3e0; color: #e65100; }
        .tag-hard { background: #fce4ec; color: #c62828; }
        .tag-extreme { background: #f3e5f5; color: #6a1b9a; }
        .tag-token { background: #f5f5f7; color: #515154; }

        .result h2 { font-size: 18px; color: #1d1d1f; margin-bottom: 20px; }

        .step { margin-bottom: 20px; }
        .step-header {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 8px; padding-left: 12px;
            border-left: 3px solid #0071e3;
        }
        .step-number { font-weight: 600; font-size: 15px; color: #1d1d1f; }
        .step-title { font-weight: 600; font-size: 15px; color: #1d1d1f; }
        .expand-btn {
            font-size: 12px; cursor: pointer; color: #86868b;
            user-select: none; padding: 2px; line-height: 1;
        }
        .expand-btn:hover { color: #515154; }

        .step-scoring {
            margin-left: 23px; padding: 10px 0 10px 12px;
            font-size: 15px; color: #1d1d1f; line-height: 1.7;
            border-left: 1px solid #e5e5e7;
        }
        .step-detail {
            margin-left: 23px; padding: 0 0 10px 12px;
            font-size: 14px; color: #6e6e73; line-height: 1.7;
            white-space: pre-wrap; display: none;
            border-left: 1px solid #e5e5e7;
        }
        .step-detail.show { display: block; }

        .final-answer {
            margin-top: 24px; padding: 16px; background: #f0f7ff; border-radius: 12px;
            font-weight: 600; font-size: 16px; color: #0071e3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>你好，我是张雪峰老师</h1>
        <p class="subtitle">输入题目，AI 帮你做</p>
        <div class="type-selector">
            <span class="type-label">题型：</span>
            <button class="type-btn active" data-type="" onclick="selectType(this, x27x27)">自动识别</button>
            <button class="type-btn" data-type="选择题" onclick="selectType(this, x27选择题x27)">选择题</button>
            <button class="type-btn" data-type="填空题" onclick="selectType(this, x27填空题x27)">填空题</button>
            <button class="type-btn" data-type="大题" onclick="selectType(this, x27大题x27)">大题</button>
        </div>
        <div class="search-box">
            <input type="text" id="questionInput" placeholder="输入题目..." onkeydown="if(event.key==='Enter') solveQuestion()">
            <button id="searchBtn" onclick="solveQuestion()">搜索</button>
        </div>
        <div class="progress-area" id="progressArea">
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-pct" id="progressPct">0%</div>
            <div class="progress-text" id="progressText"></div>
            <div class="progress-token" id="progressToken" style="display:none;"></div>
        </div>
        <div class="result" id="result"></div>
    </div>

    <script>
        var _selectedType = "";
        function selectType(btn, type) {
            document.querySelectorAll(".type-btn").forEach(function(b) { b.classList.remove("active"); });
            btn.classList.add("active");
            _selectedType = type;
        }

        function setProgress(pct, msg, tokens) {
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressPct').textContent = Math.round(pct) + '%';
            document.getElementById('progressText').textContent = msg;
            var tokEl = document.getElementById('progressToken');
            if (tokens !== undefined) {
                tokEl.style.display = 'block';
                tokEl.textContent = '消耗 ' + tokens + ' tokens';
            }
        }

        function renderSteps(html, steps) {
            for (var i = 0; i < steps.length; i++) {
                var step = steps[i];
                html += '<div class="step">';
                html += '<div class="step-header">';
                html += '<span class="step-number">第' + step.step_number + '步</span>';
                html += '<span class="step-title">' + (step.title || '') + '</span>';
                if (step.detail) {
                    html += '<span class="expand-btn" onclick="toggleDetail(this)">&#9654;</span>';
                }
                html += '</div>';
                html += '<div class="step-scoring">' + (step.standard_writing || '') + '</div>';
                if (step.detail) {
                    html += '<div class="step-detail">' + step.detail + '</div>';
                }
                html += '</div>';
            }
            return html;
        }

        function levelClass(level) {
            var map = { '容易': 'tag-easy', '中等': 'tag-medium', '困难': 'tag-hard', '极难': 'tag-extreme' };
            return map[level] || 'tag-easy';
        }

        function toggleDetail(btn) {
            var detail = btn.closest('.step').querySelector('.step-detail');
            if (!detail) return;
            var isOpen = detail.classList.toggle('show');
            btn.textContent = isOpen ? '▼' : '▶';
        }

        function displayStatus(data) {
            var result = document.getElementById('result');
            var status = data.status || '未知';
            var reason = data.reason || '';
            var isError = (status === '错题');
            var bgColor = isError ? '#fff5f5' : '#fff8e1';
            var borderColor = isError ? '#ffcdd2' : '#ffe082';
            var icon = isError ? '&#9888;' : '&#128532;';
            var label = isError ? '此题是错题' : '此题无法解答';
            var html = '<div style="background:' + bgColor + ';border:2px solid ' + borderColor + ';border-radius:16px;padding:28px;text-align:center;margin-bottom:20px;">';
            html += '<div style="font-size:48px;margin-bottom:12px;">' + icon + '</div>';
            html += '<h2 style="font-size:20px;color:' + (isError ? '#c62828' : '#e65100') + ';margin-bottom:8px;">' + label + '</h2>';
            if (reason) {
                html += '<p style="font-size:15px;color:#555;line-height:1.6;margin-top:8px;white-space:pre-wrap;">' + reason + '</p>';
            }
            html += '</div>';
            result.innerHTML = html;
            result.classList.add('show');
        }

        function displayResult(data) {
            var result = document.getElementById('result');
            var html = '<div class="meta-bar">';
            if (data.knowledge_points && data.knowledge_points.length > 0) {
                html += '<span class="tag tag-category">' + data.knowledge_points.slice(0,3).join(' / ') + '</span>';
            }
            html += '</div>';

            if (data.chunk_results && data.chunk_results.length > 0) {
                for (var ci = 0; ci < data.chunk_results.length; ci++) {
                    var cr = data.chunk_results[ci];
                    var chunkId = cr.chunk_id || (ci + 1);
                    var cat = cr.category || {};
                    var diff = cr.difficulty || {};
                    html += '<div class="chunk-card">';
                    html += '<div class="chunk-header">';
                    html += '<span class="chunk-label">块' + chunkId + '</span>';
                    if (cr.question_type) {
                        html += '<span class="chunk-type">' + cr.question_type + '</span>';
                    }
                    if (cat.level1) {
                        html += '<span class="chunk-cat">' + cat.level1 + '</span>';
                    }
                    if (diff.level) {
                        html += '<span class="chunk-diff ' + levelClass(diff.level) + '">' + diff.level + '</span>';
                    }
                    html += '</div>';

                    if (cr.status && cr.status !== '可解') {
                        html += '<div style="padding:12px;color:#c62828;">' + (cr.reason || '') + '</div>';
                    } else {
                        if (cr.steps && cr.steps.length > 0) {
                            html += '<div class="chunk-steps">';
                            html = renderSteps(html, cr.steps);
                            html += '</div>';
                        }
                        if (cr.final_answer) {
                            html += '<div class="final-answer">答案：' + cr.final_answer + '</div>';
                        }
                    }
                    html += '</div>';
                }
            }

            // Token
            var tok = data.token_usage || {};
            if (tok.total_tokens) {
                html += '<div style="text-align:center;margin-top:20px;font-size:13px;color:#86868b;">消耗 ' + tok.total_tokens + ' tokens</div>';
            }

            result.innerHTML = html;
            result.classList.add('show');

            try {
                renderMathInElement(result, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '$', right: '$', display: false},
                        {left: '\[', right: '\]', display: true}
                    ],
                    ignoredTags: []
                });
            } catch(e) {
                console.log('KaTeX error:', e);
            }
        }

        async function solveQuestion() {
            const input = document.getElementById('questionInput');
            const result = document.getElementById('result');
            const btn = document.getElementById('searchBtn');
            const question = input.value.trim();
            if (!question) { alert('请输入题目'); return; }
            result.classList.remove('show');
            btn.disabled = true;

            const area = document.getElementById('progressArea');
            const tokenEl = document.getElementById('progressToken');
            tokenEl.style.display = 'none';
            area.classList.add('show');

            var totalTokens = 0;

            try {
                // Step 1: 切块+解答
                setProgress(13, '正在切块并解答...', 0);
                const r1 = await fetch('http://127.0.0.1:8000/solve/step1', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, question_type: _selectedType || null })
                });
                const d1 = await r1.json();
                totalTokens += (d1.token_usage?.total_tokens || 0);
                var chunks = d1.chunks || [];
                setProgress(78, '解答完成，共' + chunks.length + '个块', totalTokens);

                // Step 2: 逐块校验（保持在78%，全部完成才跳91%）
                var chunkResults = [];
                var solved = [];
                for (var ci = 0; ci < chunks.length; ci++) {
                    var ch = chunks[ci];
                    setProgress(78, '校验块' + (ci + 1) + '/' + chunks.length + '...', totalTokens);

                    var r2 = await fetch('http://127.0.0.1:8000/solve/step2', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chunk_content: ch.content,
                            chunk_id: ch.id,
                            chunk_type: ch.type,
                            chunk_category: ch.category,
                            question: question,
                            solved_json: JSON.stringify(solved)
                        })
                    });
                    var d2 = await r2.json();
                    totalTokens += (d2.token_usage?.total_tokens || 0);
                    chunkResults.push(d2.result);
                    solved.push(d2.result);
                }
                setProgress(91, '全部校验完成', totalTokens);

                // 展示 --> 100%
                setProgress(100, '处理完成', totalTokens);
                var resultData = {
                    chunk_results: chunkResults,
                    chunks: chunks,
                    token_usage: { total_tokens: totalTokens }
                };
                displayResult(resultData);

            } catch (err) {
                setProgress(100, '请求失败', totalTokens);
                result.innerHTML = '<p style="color:red">请求失败，请检查后端是否启动</p>';
                result.classList.add('show');
            } finally {
                btn.disabled = false;
            }
        }
    </script></body>
</html>
