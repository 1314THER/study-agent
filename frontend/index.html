<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你好，我是张雪峰老师</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container { max-width: 800px; width: 100%; }
        h1 { text-align: center; font-size: 28px; color: #1d1d1f; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #86868b; margin-bottom: 30px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        .search-box input {
            flex: 1; padding: 14px 18px; border: 1px solid #d2d2d7; border-radius: 12px;
            font-size: 16px; outline: none; transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: #0071e3; }
        .search-box button {
            padding: 14px 28px; background: #0071e3; color: white; border: none;
            border-radius: 12px; font-size: 16px; cursor: pointer; transition: background 0.2s;
        }
        .search-box button:hover { background: #0077ed; }
        .search-box button:disabled { background: #a0c4ff; cursor: not-allowed; }

        .type-selector {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 16px; justify-content: center;
        }
        .type-label { font-size: 14px; color: #86868b; }
        .type-btn {
            padding: 6px 16px; border: 1px solid #d2d2d7; border-radius: 8px;
            background: white; font-size: 14px; cursor: pointer;
            transition: all 0.2s; color: #1d1d1f;
        }
        .type-btn:hover { border-color: #0071e3; color: #0071e3; }
        .type-btn.active {
            background: #0071e3; color: white; border-color: #0071e3;
        }

        .chunk-card {
            background: white; border: 1px solid #e0e0e0; border-radius: 12px;
            margin-bottom: 16px; overflow: hidden;
        }
        .chunk-header {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            padding: 10px 16px; background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0; font-size: 13px;
        }
        .chunk-label {
            font-weight: 600; color: #0071e3;
            background: #e8f0fe; padding: 2px 8px; border-radius: 4px;
        }
        .chunk-type { color: #515154; }
        .chunk-cat { color: #2e7d32; background: #e8f5e9; padding: 2px 8px; border-radius: 4px; }
        .chunk-diff { padding: 2px 8px; border-radius: 4px; }
        .tag-type { background: #e3f2fd; color: #1565c0; }
        .tag-type-simple { background: #f3e5f5; color: #6a1b9a; }
        .tag-type-special { background: #fce4ec; color: #c62828; }
        .chunk-steps { padding: 12px 16px; }
        .chunk-steps .step { margin-bottom: 12px; }
        .chunk-steps .step:last-child { margin-bottom: 0; }
        .progress-pct { text-align: center; font-size: 24px; font-weight: 700; color: #0071e3; margin-top: 6px; }
        .progress-token { text-align: center; font-size: 12px; color: #86868b; margin-top: 4px; }


        .progress-area { margin-bottom: 30px; display: none; }
        .progress-area.show { display: block; }
        .progress-bar-track {
            width: 100%; height: 6px;
            background: #e5e5e7; border-radius: 3px; overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #0071e3, #00a2ff);
            border-radius: 3px; transition: width 0.3s ease;
        }
        .progress-text { text-align: center; font-size: 14px; color: #86868b; }

        .result {
            background: white; border-radius: 16px; padding: 30px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08); display: none;
        }
        .result.show { display: block; }

        .meta-bar {
            display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
            padding-bottom: 16px; border-bottom: 1px solid #e5e5e7;
        }
        .tag {
            padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 500;
        }
        .tag-category { background: #e8f5e9; color: #2e7d32; }
        .tag-easy { background: #e3f2fd; color: #1565c0; }
        .tag-medium { background: #fff3e0; color: #e65100; }
        .tag-hard { background: #fce4ec; color: #c62828; }
        .tag-extreme { background: #f3e5f5; color: #6a1b9a; }
        .tag-token { background: #f5f5f7; color: #515154; }

        .result h2 { font-size: 18px; color: #1d1d1f; margin-bottom: 20px; }

        .xuebile { background: #fff5f5; border: 2px solid #ffcdd2; border-radius: 16px; padding: 40px 28px; text-align: center; margin-bottom: 20px; }
        .xuebile-icon { font-size: 64px; margin-bottom: 12px; }
        .xuebile-title { font-size: 28px; color: #c62828; font-weight: 700; margin-bottom: 12px; }
        .xuebile-reason { font-size: 15px; color: #555; line-height: 1.6; }

        .step { margin-bottom: 20px; }
        .step-header {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 8px; padding-left: 12px;
            border-left: 3px solid #0071e3;
        }
        .step-number { font-weight: 600; font-size: 15px; color: #1d1d1f; }
        .step-diff-tag { font-size: 12px; color: #86868b; margin-left: auto; background: #f5f5f7; padding: 2px 8px; border-radius: 4px; }

        .step-content { margin-left: 23px; padding: 8px 0 8px 12px; font-size: 15px; color: #1d1d1f; line-height: 1.7; border-left: 1px solid #e5e5e7; }
        .step-kp { margin-left: 23px; padding: 2px 0 6px 12px; font-size: 13px; color: #2e7d32; border-left: 1px solid #e5e5e7; }
        

        .final-answer { margin: 0 16px 16px; padding: 16px; background: #f0f7ff; border-radius: 12px; font-weight: 600; font-size: 16px; color: #0071e3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>你好，我是张雪峰老师</h1>
        <p class="subtitle">输入题目，AI 帮你做</p>
        <div class="type-selector">
            <span class="type-label">题型：</span>
            <button class="type-btn active" data-type="" onclick="selectType(this, '')">自动识别</button>
            <button class="type-btn" data-type="选择题" onclick="selectType(this, '选择题')">选择题</button>
            <button class="type-btn" data-type="填空题" onclick="selectType(this, '填空题')">填空题</button>
            <button class="type-btn" data-type="大题" onclick="selectType(this, '大题')">大题</button>
        </div>
        <div class="search-box">
            <input type="text" id="questionInput" placeholder="输入题目..." onkeydown="if(event.key==='Enter') solveQuestion()">
            <button id="searchBtn" onclick="solveQuestion()">搜索</button>
        </div>
        <div class="progress-area" id="progressArea">
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-pct" id="progressPct">0%</div>
            <div class="progress-text" id="progressText"></div>
            <div class="progress-token" id="progressToken" style="display:none;"></div>
        </div>
        <div class="result" id="result"></div>
    </div>

    <script>
        var _selectedType = "";
        function selectType(btn, type) {
            document.querySelectorAll(".type-btn").forEach(function(b) { b.classList.remove("active"); });
            btn.classList.add("active");
            _selectedType = type;
        }



        function setProgress(pct, msg, tokens) {
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressPct').textContent = Math.round(pct) + '%';
            document.getElementById('progressText').textContent = msg;
            var tokEl = document.getElementById('progressToken');
            if (tokens !== undefined) {
                tokEl.style.display = 'block';
                tokEl.textContent = '消耗 ' + tokens + ' tokens';
            }
        }

        function renderSteps(html, steps) {
            for (var i = 0; i < steps.length; i++) {
                var step = steps[i];
                html += '<div class="step">';
                html += '<div class="step-header">';
                html += '<span class="step-number">' + step.step_number + '</span>';
                if (step.step_difficulty) {
                    html += '<span class="step-diff-tag">' + step.step_difficulty.level + ' (' + step.step_difficulty.score + '分)</span>';
                }
                html += '</div>';
                html += '<div class="step-content">' + (step.standard_writing || '') + '</div>';
                if (step.knowledge_point) {
                    html += '<div class="step-kp">' + step.knowledge_point + '</div>';
                }
                html += '</div>';
            }
            return html;
        }

        function displayResult(data, totalTokens) {
            var result = document.getElementById('result');
            var html = '<div class="meta-bar">';
            // 知识点标签（仅大题有）
            if (data.knowledge_points && data.knowledge_points.length > 0) {
                html += '<span class="tag tag-category">' + data.knowledge_points.slice(0,3).join(' / ') + '</span>';
            }
            // 整体难度（从各块难度取每维最大值计算）
            var od = data.overall_difficulty;
            if (od && od.total_score !== undefined) {
                html += '<span class="tag" style="background:#e8f0fe;color:#1565c0;">难度系数：' + od.total_score + '/12</span>';
            }
            // 武亮难度系数
            if (data.step_difficulty_sum !== undefined) {
                html += '<span class="tag" style="background:#fce4ec;color:#c62828;">武亮难度系数：' + data.step_difficulty_sum + '</span>';
            }
            html += '</div>';

            // 雷达图容器
            html += '<div id="radarChart" style="display:flex;justify-content:center;margin-bottom:16px;"></div>';

            // 块结果
            if (data.chunk_results && data.chunk_results.length > 0) {
                for (var ci = 0; ci < data.chunk_results.length; ci++) {
                    var cr = data.chunk_results[ci];
                    var chunkId = cr.chunk_id || (ci + 1);
                    var cat = cr.category || {};
                    var diff = cr.difficulty || {};
                    html += '<div class="chunk-card">';
                    html += '<div class="chunk-header">';
                    html += '<span class="chunk-label">块' + chunkId + '</span>';
                    if (cr.chunk_type) {
                        var tc = 'tag-type';
                        if (cr.chunk_type === '选择题' || cr.chunk_type === '填空题') tc += ' tag-type-simple';
                        else if (cr.chunk_type === '非常规压轴题') tc += ' tag-type-special';
                        html += '<span class="tag ' + tc + '">' + cr.chunk_type + '</span>';
                    }
                    if (cat.level1) html += '<span class="chunk-cat">' + cat.level1 + '</span>';
                    if (diff.level) html += '<span class="chunk-diff ' + (diff.level === '容易' ? 'tag-easy' : diff.level === '中等' ? 'tag-medium' : diff.level === '困难' ? 'tag-hard' : 'tag-extreme') + '">' + diff.level + '</span>';
                    html += '</div>';

                    if (cr.steps && cr.steps.length > 0) {
                        html += '<div class="chunk-steps">';
                        for (var si = 0; si < cr.steps.length; si++) {
                            var step = cr.steps[si];
                            html += '<div class="step">';
                            html += '<div class="step-header">';
                            html += '<span class="step-number">' + step.step_number + '</span>';
                            if (step.step_difficulty) {
                                html += '<span class="step-diff-tag">' + step.step_difficulty.level + ' (' + step.step_difficulty.score + '分)</span>';
                            }
                            html += '</div>';
                            html += '<div class="step-content">' + (step.standard_writing || '') + '</div>';
                            if (step.knowledge_point) {
                                html += '<div class="step-kp">' + step.knowledge_point + '</div>';
                            }
                            html += '</div>';
                        }
                        html += '</div>';
                    }
                    if (cr.final_answer) {
                        html += '<div class="final-answer">答案：' + cr.final_answer + '</div>';
                    }
                    html += '</div>';
                }
            }

            // Token
            if (totalTokens) {
                html += '<div style="text-align:center;margin-top:20px;font-size:13px;color:#86868b;">消耗 ' + totalTokens + ' tokens</div>';
            }

            result.innerHTML = html;
            result.style.display = 'block';

            // KaTeX 渲染
            try {
                renderMathInElement(result, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '$', right: '$', display: false},
                        {left: '\[', right: '\]', display: true}
                    ],
                    ignoredTags: []
                });
            } catch(e) { console.log('KaTeX error:', e); }

            // 画雷达图（用整体难度维度）
            var dims = od && od.dimensions;
            if (dims && Object.keys(dims).length === 6) {
                var canvas = document.createElement('canvas');
                canvas.width = 240;
                canvas.height = 320;
                canvas.style.maxWidth = '100%';
                document.getElementById('radarChart').appendChild(canvas);
                var ctx = canvas.getContext('2d');
                var cx = 120, cy = 130, radius = 95;
                var labels = Object.keys(dims);
                var values = labels.map(function(k) { return dims[k]; });
                var n = 6;
                for (var li = 1; li <= 2; li++) {
                    var r = radius * li / 2;
                    ctx.beginPath();
                    for (var i = 0; i <= n; i++) {
                        var angle = (i % n) * 2 * Math.PI / n - Math.PI / 2;
                        var x = cx + r * Math.cos(angle);
                        var y = cy + r * Math.sin(angle);
                        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    ctx.closePath(); ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1; ctx.stroke();
                }
                for (var i = 0; i < n; i++) {
                    var angle = i * 2 * Math.PI / n - Math.PI / 2;
                    ctx.beginPath(); ctx.moveTo(cx, cy);
                    ctx.lineTo(cx + radius * Math.cos(angle), cy + radius * Math.sin(angle));
                    ctx.strokeStyle = '#eee'; ctx.stroke();
                    var lx = cx + (radius + 16) * Math.cos(angle);
                    var ly = cy + (radius + 16) * Math.sin(angle);
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.font = '11px -apple-system, sans-serif';
                    ctx.fillStyle = '#515154';
                    ctx.fillText(labels[i] + ' ' + values[i], lx, ly);
                }
                ctx.beginPath();
                for (var i = 0; i <= n; i++) {
                    var angle = (i % n) * 2 * Math.PI / n - Math.PI / 2;
                    var val = Math.min(values[i % n] / 2, 1);
                    var x = cx + radius * val * Math.cos(angle);
                    var y = cy + radius * val * Math.sin(angle);
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fillStyle = 'rgba(0, 113, 227, 0.12)'; ctx.fill();
                ctx.strokeStyle = '#0071e3'; ctx.lineWidth = 2; ctx.stroke();
                for (var i = 0; i < n; i++) {
                    var angle = i * 2 * Math.PI / n - Math.PI / 2;
                    var val = Math.min(values[i] / 2, 1);
                    var x = cx + radius * val * Math.cos(angle);
                    var y = cy + radius * val * Math.sin(angle);
                    ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 2 * Math.PI);
                    ctx.fillStyle = '#0071e3'; ctx.fill();
                }
                ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                ctx.font = '12px -apple-system, sans-serif';
                ctx.fillStyle = '#86868b';
                ctx.fillText('六维难度分布', cx, canvas.height - 6);
            }
        }

        function displayXuebile(data) {
            var result = document.getElementById('result');
            var reason = data.detail || data.status || '未知错误';
            var html = '<div class="xuebile"><div class="xuebile-icon">🧊</div><div class="xuebile-title">雪碧了</div><div class="xuebile-reason">' + reason + '</div></div>';
            result.innerHTML = html;
            result.classList.add('show'); result.style.display = 'block';
        }

        function levelClass(level) {
            var map = { '容易': 'tag-easy', '中等': 'tag-medium', '困难': 'tag-hard', '极难': 'tag-extreme' };
            return map[level] || 'tag-easy';
        }

        function isValidQuestion(text) {
            if (!text || text.length < 5) return false;
            // 必须有中文
            if (!/[\u4e00-\u9fff]/.test(text)) return false;
            // 必须有数学相关字符或较长中文字段
            if (!/[0-9+\-\u00d7\u00f7=\u221a\u03c0\u03b8]/.test(text) && !/[\u4e00-\u9fff]{6,}/.test(text)) return false;
            return true;
        }

        async function solveQuestion() {
            const input = document.getElementById('questionInput');
            const result = document.getElementById('result');
            const btn = document.getElementById('searchBtn');
            const question = input.value.trim();
            if (!question) { alert('请输入题目'); return; }
            if (!isValidQuestion(question)) {
                result.classList.remove('show');
                result.innerHTML = '<div class="xuebile"><div class="xuebile-icon">🧊</div><div class="xuebile-title">雪碧了</div><div class="xuebile-reason">输入无效，请检查是否为数学题</div></div>';
                result.style.display = 'block';
                return;
            }
            result.classList.remove('show');
            btn.disabled = true;

            const area = document.getElementById('progressArea');
            const tokenEl = document.getElementById('progressToken');
            tokenEl.style.display = 'none';
            area.classList.add('show');

            var totalTokens = 0;

            try {
                // Step 1: Solver
                setProgress(13, 'AI 正在思考（复杂题最多等 2 分钟）...', 0);
                const r1 = await fetch('http://127.0.0.1:8000/solve/step1', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, question_type: _selectedType || null })
                });
                const d1 = await r1.json();
                if (d1.error) { setProgress(100, '雪碧了'); displayXuebile(d1); return; }
                totalTokens += (d1.token_usage?.total_tokens || 0);

                // Step 2: Verifier
                setProgress(78, 'AI 正在归类知识点并评分...', totalTokens);
                const r2 = await fetch('http://127.0.0.1:8000/solve/step2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, content: d1.content, category: d1.category || null })
                });
                const d2 = await r2.json();
                if (d2.error) { setProgress(100, '雪碧了'); displayXuebile(d2); return; }
                totalTokens += (d2.token_usage?.total_tokens || 0);

                // Step 3: Formatter
                setProgress(91, '全局校验中...', totalTokens);
                const r3 = await fetch('http://127.0.0.1:8000/solve/step3', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, chunk_results: JSON.stringify(d2.chunk_results) })
                });
                const d3 = await r3.json();
                totalTokens += (d3.token_usage?.total_tokens || 0);

                setProgress(100, '完成', totalTokens);
                if (d3.error) { displayXuebile(d3); return; }
                displayResult(d3, totalTokens);
            } catch (err) {
                setProgress(100, '请求失败');
                result.innerHTML = '<p style="color:red">请求失败，请检查后端是否启动</p>';
                result.classList.add('show'); result.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        }
    </script></body>
</html>
